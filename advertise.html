<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Create PETS & DOGUE member offers and premium advertising campaigns.">
<title>PETS & DOGUE — Partners & Advertising</title>

<style>
:root{
--black:#070707;
--black-soft:#111;
--cream:#f5f0e6;
--cream-2:#eee6d8;
--white:#fff;
--gold:#bd8b29;
--gold-dark:#8a6118;
--gold-light:#efd47a;
--green:#65e51f;
--green-dark:#1d6b3c;
--red:#b92a2a;
--grey:#716b63;
--line:#d2cabd;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.locked{
overflow:hidden;
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

a{
color:inherit;
text-decoration:none;
}

img{
display:block;
max-width:100%;
}

.hidden{
display:none!important;
}

/* HEADER */

.site-header{
position:sticky;
top:0;
z-index:3000;
background:#070707;
color:#fff;
border-bottom:1px solid #292929;
}

.header-main{
max-width:1500px;
margin:auto;
height:82px;
padding:0 14px;
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
gap:12px;
}

.menu-button{
width:43px;
height:43px;
border:0;
background:transparent;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:5px;
}

.menu-button span{
width:27px;
height:2px;
background:#fff;
border-radius:99px;
}

.brand{
justify-self:center;
text-align:center;
font-family:var(--serif);
color:var(--gold);
line-height:.88;
}

.brand small{
display:block;
font-size:9px;
letter-spacing:2.5px;
margin-bottom:5px;
}

.brand strong{
display:block;
font-size:32px;
font-weight:400;
letter-spacing:1.6px;
}

.header-actions{
display:flex;
align-items:center;
gap:8px;
}

.header-link{
height:37px;
padding:0 12px;
border:1px solid #444;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.header-link.gold{
background:var(--gold);
border-color:var(--gold);
color:#111;
}

.lang-select{
height:37px;
padding:0 7px;
background:#111;
color:#fff;
border:1px solid #444;
font-size:9px;
font-weight:800;
}

/* HERO */

.hero{
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 86% 20%,rgba(239,212,122,.24),transparent 26%),
linear-gradient(110deg,#f9f4e9 0%,#efe2cb 54%,#d9b978 100%);
border-bottom:1px solid #ccb98d;
}

.hero-inner{
max-width:1180px;
margin:auto;
min-height:390px;
display:grid;
grid-template-columns:1.08fr .92fr;
align-items:center;
gap:30px;
padding:47px 28px;
}

.hero-copy{
position:relative;
z-index:2;
}

.eyebrow{
font-size:9px;
font-weight:900;
letter-spacing:2.5px;
color:var(--gold-dark);
text-transform:uppercase;
}

.hero h1{
font-family:var(--serif);
font-weight:400;
font-size:54px;
line-height:.97;
max-width:700px;
margin-top:12px;
}

.hero p{
max-width:620px;
margin-top:17px;
font-family:var(--serif);
font-size:18px;
line-height:1.5;
color:#5b554d;
}

.hero-actions{
display:flex;
flex-wrap:wrap;
gap:9px;
margin-top:24px;
}

.hero-action{
min-height:48px;
padding:0 20px;
border:1px solid #111;
background:#111;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.3px;
text-transform:uppercase;
}

.hero-action.light{
background:transparent;
color:#111;
}

.hero-art{
position:relative;
height:300px;
display:flex;
align-items:center;
justify-content:center;
}

.hero-card{
position:absolute;
background:#0b0b0b;
color:#fff;
border:1px solid #2d2d2d;
box-shadow:0 22px 55px rgba(0,0,0,.2);
}

.hero-card.main{
width:260px;
height:285px;
right:46px;
top:6px;
padding:22px;
transform:rotate(2deg);
}

.hero-card.secondary{
width:185px;
height:205px;
left:14px;
bottom:5px;
padding:18px;
transform:rotate(-5deg);
background:#f7ecd1;
color:#111;
border-color:#cda64f;
}

.hero-card .mini-brand{
font-family:var(--serif);
font-size:13px;
letter-spacing:2px;
color:var(--gold);
}

.hero-card.secondary .mini-brand{
color:var(--gold-dark);
}

.hero-card h3{
font-family:var(--serif);
font-weight:400;
font-size:34px;
line-height:.97;
margin-top:30px;
}

.hero-card.secondary h3{
font-size:29px;
margin-top:22px;
}

.hero-card .price{
font-family:var(--serif);
font-size:61px;
color:var(--gold-light);
margin-top:22px;
line-height:1;
}

.hero-card.secondary .price{
color:#111;
font-size:43px;
}

.hero-card .barcode{
margin-top:18px;
height:41px;
background:
repeating-linear-gradient(
90deg,
#fff 0 2px,
transparent 2px 5px,
#fff 5px 6px,
transparent 6px 9px,
#fff 9px 13px,
transparent 13px 15px
);
}

.hero-card.secondary .barcode{
background:
repeating-linear-gradient(
90deg,
#111 0 2px,
transparent 2px 5px,
#111 5px 6px,
transparent 6px 9px,
#111 9px 13px,
transparent 13px 15px
);
}

/* PAGE */

.page-shell{
max-width:1180px;
margin:auto;
padding:32px 22px 60px;
}

.intro-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-bottom:22px;
}

.entry-card{
background:#fff;
border:1px solid var(--line);
padding:24px;
min-height:210px;
position:relative;
overflow:hidden;
}

.entry-card:after{
content:"";
position:absolute;
width:140px;
height:140px;
border-radius:50%;
background:rgba(189,139,41,.12);
right:-45px;
bottom:-55px;
}

.entry-number{
font-family:var(--serif);
font-size:15px;
color:var(--gold);
}

.entry-card h2{
font-family:var(--serif);
font-weight:400;
font-size:30px;
margin-top:15px;
}

.entry-card p{
font-size:11px;
line-height:1.6;
color:#676159;
margin-top:9px;
max-width:430px;
}

.entry-button{
position:relative;
z-index:2;
margin-top:17px;
min-height:42px;
padding:0 15px;
border:0;
background:#111;
color:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.entry-card.advertising{
background:#0a0a0a;
color:#fff;
border-color:#0a0a0a;
}

.entry-card.advertising p{
color:#aaa;
}

.entry-card.advertising .entry-button{
background:var(--gold-light);
color:#111;
}

/* APP */

.partner-app{
display:none;
}

.partner-app.show{
display:block;
}

.app-bar{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:18px;
}

.app-title{
font-family:var(--serif);
font-size:31px;
font-weight:400;
}

.app-sub{
font-size:9px;
line-height:1.5;
color:#777;
margin-top:5px;
}

.logout-button{
border:1px solid #111;
background:transparent;
min-height:38px;
padding:0 14px;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.tabs{
display:flex;
gap:7px;
overflow-x:auto;
scrollbar-width:none;
margin-bottom:17px;
}

.tabs::-webkit-scrollbar{
display:none;
}

.tab-button{
white-space:nowrap;
min-height:42px;
padding:0 16px;
border:1px solid #aaa49a;
background:#fff;
font-size:8px;
font-weight:900;
letter-spacing:.9px;
text-transform:uppercase;
}

.tab-button.active{
background:#111;
color:#fff;
border-color:#111;
}

.tab-panel{
display:none;
}

.tab-panel.active{
display:block;
}

/* DASHBOARD */

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
margin-bottom:18px;
}

.stat{
background:#fff;
border:1px solid var(--line);
padding:16px;
}

.stat span{
font-size:7px;
font-weight:900;
letter-spacing:1.4px;
color:#777;
text-transform:uppercase;
}

.stat strong{
display:block;
font-family:var(--serif);
font-weight:400;
font-size:27px;
margin-top:7px;
}

.panel-card{
background:#fff;
border:1px solid var(--line);
margin-bottom:13px;
}

.panel-head{
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border-bottom:1px solid #ddd6ca;
}

.panel-head h3{
font-family:var(--serif);
font-weight:400;
font-size:22px;
}

.panel-head span{
font-size:8px;
font-weight:900;
letter-spacing:1px;
color:var(--gold-dark);
}

.empty-state{
padding:28px 18px;
text-align:center;
}

.empty-state strong{
font-family:var(--serif);
font-size:20px;
font-weight:400;
}

.empty-state p{
font-size:9px;
line-height:1.5;
color:#777;
margin-top:6px;
}

.records{
display:grid;
gap:0;
}

.record{
display:grid;
grid-template-columns:70px 1fr auto;
gap:12px;
align-items:center;
padding:11px 14px;
border-bottom:1px solid #e6e0d6;
}

.record:last-child{
border-bottom:0;
}

.record-thumb{
width:70px;
height:58px;
background:#e9e2d7;
object-fit:cover;
}

.record-title{
font-weight:900;
font-size:10px;
}

.record-meta{
font-size:8px;
color:#777;
margin-top:4px;
line-height:1.4;
}

.record-status{
font-size:7px;
font-weight:900;
letter-spacing:1px;
padding:6px 8px;
border-radius:99px;
background:#ecf7e8;
color:#216738;
white-space:nowrap;
}

.record-status.pending{
background:#fff4d4;
color:#8a6118;
}

.record-status.draft{
background:#eee;
color:#666;
}

/* FORMS */

.form-shell{
display:grid;
grid-template-columns:minmax(0,1fr) 360px;
gap:15px;
align-items:start;
}

.form-card{
background:#fff;
border:1px solid var(--line);
}

.form-section{
padding:18px;
border-bottom:1px solid #e0d9ce;
}

.form-section:last-child{
border-bottom:0;
}

.form-section h3{
font-family:var(--serif);
font-size:21px;
font-weight:400;
margin-bottom:13px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
}

.field{
margin-bottom:11px;
}

.field.full{
grid-column:1/3;
}

.field label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:.5px;
margin-bottom:5px;
}

.field .hint{
font-size:7px;
color:#8a847a;
margin-top:4px;
line-height:1.4;
}

.field input,
.field select,
.field textarea{
width:100%;
border:1px solid #bbb3a8;
background:#fff;
outline:none;
color:#111;
}

.field input,
.field select{
height:42px;
padding:0 10px;
}

.field textarea{
height:86px;
padding:10px;
resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#111;
}

.field.error input,
.field.error select,
.field.error textarea{
border:2px solid var(--red);
background:#fff8f8;
}

.check-row{
display:flex;
gap:8px;
align-items:flex-start;
margin-top:9px;
}

.check-row input{
margin-top:2px;
}

.check-row label{
font-size:8px;
line-height:1.45;
color:#58534d;
}

.choice-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.choice{
position:relative;
}

.choice input{
position:absolute;
opacity:0;
pointer-events:none;
}

.choice label{
display:block;
padding:12px;
border:1px solid #bfb7aa;
background:#fff;
min-height:78px;
cursor:pointer;
}

.choice input:checked+label{
border:2px solid #111;
background:#f8f3e8;
}

.choice label strong{
display:block;
font-family:var(--serif);
font-size:17px;
font-weight:400;
}

.choice label span{
display:block;
font-size:7px;
color:#777;
margin-top:5px;
line-height:1.4;
}

.upload-box{
border:1px dashed #9f978c;
padding:14px;
text-align:center;
background:#faf8f3;
}

.upload-box input{
display:none;
}

.upload-label{
display:block;
cursor:pointer;
font-size:8px;
font-weight:900;
letter-spacing:1px;
}

.upload-help{
font-size:7px;
color:#777;
margin-top:5px;
}

.primary{
width:100%;
min-height:48px;
border:0;
background:#111;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.3px;
text-transform:uppercase;
}

.primary.gold{
background:var(--gold);
color:#111;
}

.secondary{
width:100%;
min-height:43px;
border:1px solid #111;
background:#fff;
color:#111;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
margin-top:7px;
}

/* PREVIEW */

.preview-sticky{
position:sticky;
top:105px;
}

.preview-label{
font-size:7px;
font-weight:900;
letter-spacing:1.4px;
color:#777;
margin-bottom:7px;
text-transform:uppercase;
}

.offer-preview{
background:#fff;
border:1px solid #cfc7bb;
overflow:hidden;
}

.offer-preview-image{
height:190px;
background:
linear-gradient(135deg,#d8c29b,#f5ead5);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative;
}

.offer-preview-image img{
width:100%;
height:100%;
object-fit:cover;
}

.preview-category{
position:absolute;
left:10px;
top:10px;
padding:5px 7px;
background:rgba(255,255,255,.88);
font-size:6px;
font-weight:900;
letter-spacing:.7px;
text-transform:uppercase;
}

.preview-plan{
position:absolute;
right:10px;
top:10px;
padding:6px 8px;
background:#111;
color:var(--gold-light);
font-size:6px;
font-weight:900;
letter-spacing:.8px;
text-transform:uppercase;
}

.preview-copy{
padding:14px;
}

.preview-company{
font-family:var(--serif);
font-size:18px;
}

.preview-offer{
font-size:10px;
line-height:1.4;
margin-top:5px;
}

.preview-discount{
font-family:var(--serif);
font-size:35px;
color:var(--gold-dark);
margin-top:9px;
}

.preview-meta{
display:flex;
justify-content:space-between;
gap:9px;
margin-top:10px;
font-size:7px;
color:#777;
}

.preview-code{
display:grid;
grid-template-columns:1fr 1.3fr;
gap:7px;
margin-top:12px;
}

.code-box,
.barcode-box{
min-height:49px;
border:1px solid #d0c9be;
display:flex;
align-items:center;
justify-content:center;
}

.code-box{
font-size:10px;
font-weight:900;
letter-spacing:1px;
}

.barcode-box{
background:
repeating-linear-gradient(
90deg,
#111 0 2px,
transparent 2px 5px,
#111 5px 6px,
transparent 6px 8px,
#111 8px 11px,
transparent 11px 14px
);
margin:0 10px;
}

.offer-preview.annual{
border:2px solid var(--gold);
}

.offer-preview.annual .preview-plan{
background:var(--gold);
color:#111;
}

/* AD PLANS */

.ad-plans{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:14px;
}

.ad-plan{
position:relative;
}

.ad-plan input{
position:absolute;
opacity:0;
}

.ad-plan label{
display:block;
height:100%;
min-height:164px;
background:#fff;
border:1px solid var(--line);
padding:17px;
cursor:pointer;
}

.ad-plan input:checked+label{
border:2px solid #111;
background:#faf4e7;
}

.ad-plan.best label:before{
content:"PREMIUM";
position:absolute;
right:9px;
top:9px;
font-size:6px;
font-weight:900;
letter-spacing:1px;
background:var(--gold-light);
padding:4px 6px;
}

.ad-plan strong{
display:block;
font-family:var(--serif);
font-size:24px;
font-weight:400;
}

.ad-plan .ad-price{
display:block;
font-family:var(--serif);
font-size:31px;
color:var(--gold-dark);
margin-top:10px;
}

.ad-plan p{
font-size:8px;
line-height:1.45;
color:#777;
margin-top:7px;
}

/* MAGAZINE AD PREVIEW */

.magazine-preview{
background:#111;
min-height:545px;
position:relative;
overflow:hidden;
color:#fff;
display:flex;
align-items:flex-end;
}

.magazine-preview-bg{
position:absolute;
inset:0;
background:
linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.08) 65%),
linear-gradient(135deg,#8f744f,#d6bf92);
}

.magazine-preview-bg img{
width:100%;
height:100%;
object-fit:cover;
}

.magazine-preview-content{
position:relative;
z-index:2;
padding:27px;
width:100%;
}

.advertisement-label{
font-size:6px;
font-weight:900;
letter-spacing:2px;
color:#ddd;
text-transform:uppercase;
margin-bottom:14px;
}

.magazine-preview h2{
font-family:var(--serif);
font-size:37px;
font-weight:400;
line-height:.98;
}

.magazine-preview p{
font-size:10px;
line-height:1.5;
margin-top:10px;
max-width:320px;
color:#eee;
}

.magazine-preview-cta{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:39px;
padding:0 15px;
background:#fff;
color:#111;
font-size:7px;
font-weight:900;
letter-spacing:1.2px;
margin-top:16px;
}

/* REGISTRATION */

.register-overlay{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.76);
padding:15px;
}

.register-overlay.open{
display:flex;
}

.register-card{
width:min(560px,100%);
max-height:94vh;
overflow:auto;
background:#fff;
}

.register-head{
padding:20px;
background:#0a0a0a;
color:#fff;
}

.register-head h2{
font-family:var(--serif);
font-size:28px;
font-weight:400;
}

.register-head p{
font-size:9px;
line-height:1.5;
color:#aaa;
margin-top:6px;
}

.register-body{
padding:18px;
}

.register-close{
float:right;
border:0;
background:transparent;
color:#fff;
font-size:24px;
margin-top:-4px;
}

/* TOAST */

.toast{
position:fixed;
left:50%;
bottom:18px;
transform:translate(-50%,30px);
z-index:10000;
background:#111;
color:#fff;
padding:11px 15px;
font-size:8px;
font-weight:900;
letter-spacing:.8px;
opacity:0;
pointer-events:none;
transition:.22s;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

/* RTL */

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .preview-category{
left:auto;
right:10px;
}

html[dir="rtl"] .preview-plan{
right:auto;
left:10px;
}

/* MOBILE */

@media(max-width:860px){

.hero-inner{
grid-template-columns:1fr;
min-height:auto;
padding:35px 20px 29px;
}

.hero h1{
font-size:41px;
}

.hero-art{
height:265px;
margin-top:4px;
}

.intro-grid{
grid-template-columns:1fr;
}

.form-shell{
grid-template-columns:1fr;
}

.preview-sticky{
position:static;
}

.stats-grid{
grid-template-columns:1fr 1fr;
}

.ad-plans{
grid-template-columns:1fr;
}

}

@media(max-width:560px){

.header-main{
height:72px;
padding:0 7px;
gap:4px;
}

.brand strong{
font-size:25px;
}

function getJSON(key,fallback){
try{
return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback));
}catch{
return fallback;
}
}

function setJSON(key,value){
localStorage.setItem(key,JSON.stringify(value));
}

function partnerAccount(){
return getJSON(PARTNER_KEY,null);
}

function showToast(message){
text("toast",message);
$("toast").classList.add("show");

clearTimeout(showToast.timer);

showToast.timer=setTimeout(()=>{
$("toast").classList.remove("show");
},2200);
}

function openRegister(mode){
requestedMode=mode;
$("registerOverlay").classList.add("open");
document.body.classList.add("locked");
}

function closeRegister(){
$("registerOverlay").classList.remove("open");
document.body.classList.remove("locked");
}

function openApp(tab){

$("landingView").classList.add("hidden");
$("partnerApp").classList.add("show");

if(tab){
openTab(tab);
}

renderDashboard();
}

function openTab(panelId){

document.querySelectorAll(".tab-button").forEach(button=>{
button.classList.toggle(
"active",
button.dataset.tab===panelId
);
});

document.querySelectorAll(".tab-panel").forEach(panel=>{
panel.classList.toggle(
"active",
panel.id===panelId
);
});

window.scrollTo({
top:$("partnerApp").offsetTop-80,
behavior:"smooth"
});
}

function requirePartner(mode){

if(partnerAccount()){
openApp(mode==="offer"?"offerPanel":"adPanel");
}else{
openRegister(mode);
}
}

$("heroOfferButton").onclick=()=>requirePartner("offer");
$("startOfferButton").onclick=()=>requirePartner("offer");
$("heroAdButton").onclick=()=>requirePartner("ad");

/* OFFER PREVIEW */

function selectedAccess(){
return document.querySelector('input[name="access"]:checked')?.value||"all";
}

function selectedRedeem(){
return document.querySelector('input[name="redeem"]:checked')?.value||"online";
}

function updateOfferPreview(){

const x=lang();

const category=
x.categories[
Number($("offerCategory").value||0)
]||x.categories[0];

text(
"offerPreviewCategory",
category
);

const annual=
selectedAccess()==="annual";

$("offerPreview").classList.toggle("annual",annual);

text(
"offerPreviewPlan",
annual
?"ANNUAL ONLY"
:"CLUB"
);

text(
"offerPreviewCompany",
$("offerCompany").value.trim()||
(x.company||"Business")
);

text(
"offerPreviewText",
$("offerTitle").value.trim()||
(x.offerTitle||"Offer")
);

text(
"offerPreviewDiscount",
$("offerDiscount").value.trim()||"-20%"
);

const end=
$("offerEnd").value;

text(
"offerPreviewDate",
end
?`${x.validUntil} ${formatShortDate(end)}`
:x.validUntil
);

text(
"offerPreviewOnce",
x.oneUseShort
);

text(
"offerPreviewCode",
$("offerCode").value.trim()||"DOGUE20"
);

if(offerImageData){
$("offerPreviewImage").src=offerImageData;
$("offerPreviewImage").classList.remove("hidden");
}else{
$("offerPreviewImage").classList.add("hidden");
}
}

[
"offerCompany",
"offerCategory",
"offerTitle",
"offerDiscount",
"offerEnd",
"offerCode"
].forEach(id=>{
$(id).addEventListener("input",updateOfferPreview);
$(id).addEventListener("change",updateOfferPreview);
});

document.querySelectorAll('input[name="access"]').forEach(input=>{
input.onchange=updateOfferPreview;
});

document.querySelectorAll('input[name="redeem"]').forEach(input=>{

input.onchange=()=>{

const offline=
selectedRedeem()==="offline";

$("promoCodeField").classList.toggle("hidden",offline);
$("partnerUrlField").classList.toggle("hidden",offline);
$("offlineInstructionsField").classList.toggle("hidden",!offline);

updateOfferPreview();
};
});

$("offerImage").onchange=event=>{

const file=event.target.files?.[0];

if(!file){
return;
}

const reader=new FileReader();

reader.onload=()=>{
offerImageData=String(reader.result||"");
updateOfferPreview();
};

reader.readAsDataURL(file);
};

const account=partnerAccount();

const offer={
id:`offer_${Date.now()}`,
company:$("offerCompany").value.trim(),
category:$("offerCategory").value,
title:$("offerTitle").value.trim(),
description:$("offerDescription").value.trim(),
discount:$("offerDiscount").value.trim(),
saving:$("offerSaving").value.trim(),
start:$("offerStart").value,
end:$("offerEnd").value,
limit:Number($("offerTotalLimit").value||0),
commission:Number($("offerCommission").value||0),

redeem:selectedRedeem(),

offlineInstructions:$("offlineInstructions").value.trim(),

createdAt:new Date().toISOString(),

};

/* DASHBOARD */

function statusLabel(status){

const x=lang();

if(status==="active"){
return x.active;
}

if(status==="pending"){
return x.pending;
}

if(status==="paid"){
return x.paid;
}

return x.draft;
}

function formatShortDate(value){

if(!value){
return "—";
}

return new Date(
`${value}T12:00:00`
).toLocaleDateString(
currentLanguage==="uk"
?"uk-UA"
:currentLanguage==="ru"
?"ru-RU"
:undefined,
{
day:"2-digit",
month:"short",
year:"numeric"
}
);
}

function recordImage(image){

if(image){
return `<img class="record-thumb" src="${escapeHtml(image)}" alt="">`;
}

return `<div class="record-thumb"></div>`;
}

function escapeHtml(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function renderDashboard(){

const offers=getJSON(OFFERS_KEY,[]);
const ads=getJSON(ADS_KEY,[]);
const billing=getJSON(BILLING_KEY,[]);

const activeOffers=
offers.filter(item=>item.status==="active"||item.status==="pending").length;

const activeAds=
ads.filter(item=>item.status==="active"||item.status==="pending").length;

const views=
offers.reduce((sum,item)=>sum+Number(item.views||0),0)+
ads.reduce((sum,item)=>sum+Number(item.views||0),0);

const sales=
offers.reduce((sum,item)=>sum+Number(item.sales||0),0);

text("statOffers",String(activeOffers));
text("statAds",String(activeAds));
text("statViews",views.toLocaleString());
text("statSales",`£${sales.toFixed(0)}`);

renderOfferRecords(offers);
renderAdRecords(ads);
renderBillingRecords(billing);
}

function renderOfferRecords(offers){

const target=$("offersRecords");

if(!offers.length){

target.innerHTML=`
<div class="empty-state">
<strong>${escapeHtml(lang().emptyOffers)}</strong>
<p>${escapeHtml(lang().emptyOffersText)}</p>
</div>
`;

return;
}

target.innerHTML=`
<div class="records">
${offers.map(offer=>`

<div class="record">

${recordImage(offer.image)}

<div>
<div class="record-title">
${escapeHtml(offer.title||offer.company)}
</div>

<div class="record-meta">
${escapeHtml(offer.discount)}
 · ${escapeHtml(formatShortDate(offer.end))}
 · ${offer.access==="annual"?"ANNUAL":"CLUB"}
</div>
</div>

<span class="record-status ${escapeHtml(offer.status)}">
${escapeHtml(statusLabel(offer.status))}
</span>

</div>

`).join("")}
</div>
`;
}

function renderAdRecords(ads){

const target=$("adsRecords");

if(!ads.length){

target.innerHTML=`
<div class="empty-state">
<strong>${escapeHtml(lang().emptyAds)}</strong>
<p>${escapeHtml(lang().emptyAdsText)}</p>
</div>
`;

return;
}

target.innerHTML=`
<div class="records">
${ads.map(ad=>`

<div class="record">

${recordImage(ad.image)}

<div>
<div class="record-title">
${escapeHtml(ad.headline||ad.company)}
</div>

<div class="record-meta">
£${escapeHtml(ad.plan)}
 · ${escapeHtml(formatShortDate(ad.start))}
 — ${escapeHtml(formatShortDate(ad.end))}
</div>
</div>

<span class="record-status ${escapeHtml(ad.status)}">
${escapeHtml(statusLabel(ad.status))}
</span>

</div>

`).join("")}
</div>
`;
}

function renderBillingRecords(items){

const target=$("billingRecords");

if(!items.length){

target.innerHTML=`
<div class="empty-state">
<strong>${escapeHtml(lang().billingEmpty)}</strong>
<p>${escapeHtml(lang().billingEmptyText)}</p>
</div>
`;

return;
}

target.innerHTML=`
<div class="records">
${items.map(item=>`

<div class="record">

<div class="record-thumb"></div>

<div>
<div class="record-title">
${escapeHtml(item.description||"PETS & DOGUE Advertising")}
</div>

<div class="record-meta">
${escapeHtml(formatShortDate(item.date))}
</div>
</div>

<span class="record-status paid">
£${escapeHtml(item.amount)}
</span>

</div>

`).join("")}
</div>
`;
}

/* DEFAULT DATES */

function dateInputValue(date){

const year=date.getFullYear();
const month=String(date.getMonth()+1).padStart(2,"0");
const day=String(date.getDate()).padStart(2,"0");

return `${year}-${month}-${day}`;
}

function setDefaultDates(){

const today=new Date();

const plus30=new Date(today);
plus30.setDate(plus30.getDate()+30);

$("offerStart").value=dateInputValue(today);
$("offerEnd").value=dateInputValue(plus30);

$("adStart").value=dateInputValue(today);
$("adEnd").value=dateInputValue(plus30);
}
