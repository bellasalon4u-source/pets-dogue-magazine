<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta id="pageDescription" name="description" content="Create PETS & DOGUE member offers and premium advertising campaigns.">
<title>PETS & DOGUE — Partners & Advertising</title>

<style>
:root{
--black:#070707;
--black-soft:#111;
--cream:#f5f0e6;
--cream-2:#eee6d8;
--white:#fff;
--gold:#bd8b29;
--gold-dark:#8a6118;
--gold-light:#efd47a;
--green:#65e51f;
--green-dark:#1d6b3c;
--red:#b92a2a;
--grey:#716b63;
--line:#d2cabd;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--cream);color:#111;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.hidden{display:none!important}

.site-header{
position:sticky;
top:0;
z-index:3000;
background:#070707;
color:#fff;
border-bottom:1px solid #292929;
}

.header-main{
max-width:1500px;
margin:auto;
height:82px;
padding:0 14px;
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
gap:12px;
}

.menu-button{
width:43px;
height:43px;
border:0;
background:transparent;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:5px;
}

.menu-button span{
width:27px;
height:2px;
background:#fff;
border-radius:99px;
}

.brand{
justify-self:center;
text-align:center;
font-family:var(--serif);
color:var(--gold);
line-height:.88;
}

.brand small{
display:block;
font-size:9px;
letter-spacing:2.5px;
margin-bottom:5px;
}

.brand strong{
display:block;
font-size:32px;
font-weight:400;
letter-spacing:1.6px;
}

.header-actions{
display:flex;
align-items:center;
gap:8px;
}

.header-link{
height:37px;
padding:0 12px;
border:1px solid #444;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.header-link.gold{
background:var(--gold);
border-color:var(--gold);
color:#111;
}

.lang-select{
height:37px;
padding:0 7px;
background:#111;
color:#fff;
border:1px solid #444;
font-size:9px;
font-weight:800;
}

.hero{
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 86% 20%,rgba(239,212,122,.24),transparent 26%),
linear-gradient(110deg,#f9f4e9 0%,#efe2cb 54%,#d9b978 100%);
border-bottom:1px solid #ccb98d;
}

.hero-inner{
max-width:1180px;
margin:auto;
min-height:390px;
display:grid;
grid-template-columns:1.08fr .92fr;
align-items:center;
gap:30px;
padding:47px 28px;
}

.hero-copy{position:relative;z-index:2}

.eyebrow{
font-size:9px;
font-weight:900;
letter-spacing:2.5px;
color:var(--gold-dark);
text-transform:uppercase;
}

.hero h1{
font-family:var(--serif);
font-weight:400;
font-size:54px;
line-height:.97;
max-width:700px;
margin-top:12px;
}

.hero p{
max-width:620px;
margin-top:17px;
font-family:var(--serif);
font-size:18px;
line-height:1.5;
color:#5b554d;
}

.hero-actions{
display:flex;
flex-wrap:wrap;
gap:9px;
margin-top:24px;
}

.hero-action{
min-height:48px;
padding:0 20px;
border:1px solid #111;
background:#111;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.3px;
text-transform:uppercase;
}

.hero-action.light{background:transparent;color:#111}

.hero-art{
position:relative;
height:300px;
display:flex;
align-items:center;
justify-content:center;
}

.hero-card{
position:absolute;
background:#0b0b0b;
color:#fff;
border:1px solid #2d2d2d;
box-shadow:0 22px 55px rgba(0,0,0,.2);
}

.hero-card.main{
width:260px;
height:285px;
right:46px;
top:6px;
padding:22px;
transform:rotate(2deg);
}

.hero-card.secondary{
width:185px;
height:205px;
left:14px;
bottom:5px;
padding:18px;
transform:rotate(-5deg);
background:#f7ecd1;
color:#111;
border-color:#cda64f;
}

.hero-card .mini-brand{
font-family:var(--serif);
font-size:13px;
letter-spacing:2px;
color:var(--gold);
}

.hero-card.secondary .mini-brand{color:var(--gold-dark)}

.hero-card h3{
font-family:var(--serif);
font-weight:400;
font-size:34px;
line-height:.97;
margin-top:30px;
}

.hero-card.secondary h3{font-size:29px;margin-top:22px}

.hero-card .price{
font-family:var(--serif);
font-size:61px;
color:var(--gold-light);
margin-top:22px;
line-height:1;
}

.hero-card.secondary .price{color:#111;font-size:43px}

.hero-barcode{
margin-top:18px;
height:41px;
background:repeating-linear-gradient(
90deg,
#fff 0 2px,
transparent 2px 5px,
#fff 5px 6px,
transparent 6px 9px,
#fff 9px 13px,
transparent 13px 15px
);
}

.hero-card.secondary .hero-barcode{
background:repeating-linear-gradient(
90deg,
#111 0 2px,
transparent 2px 5px,
#111 5px 6px,
transparent 6px 9px,
#111 9px 13px,
transparent 13px 15px
);
}

.page-shell{
max-width:1180px;
margin:auto;
padding:32px 22px 60px;
}

.intro-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-bottom:22px;
}

.entry-card{
background:#fff;
border:1px solid var(--line);
padding:24px;
min-height:210px;
position:relative;
overflow:hidden;
}

.entry-card:after{
content:"";
position:absolute;
width:140px;
height:140px;
border-radius:50%;
background:rgba(189,139,41,.12);
right:-45px;
bottom:-55px;
}

.entry-number{
font-family:var(--serif);
font-size:15px;
color:var(--gold);
}

.entry-card h2{
font-family:var(--serif);
font-weight:400;
font-size:30px;
margin-top:15px;
}

.entry-card p{
font-size:11px;
line-height:1.6;
color:#676159;
margin-top:9px;
max-width:430px;
}

.entry-button{
position:relative;
z-index:2;
margin-top:17px;
min-height:42px;
padding:0 15px;
border:0;
background:#111;
color:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.entry-card.advertising{
background:#0a0a0a;
color:#fff;
border-color:#0a0a0a;
}

.entry-card.advertising p{color:#aaa}

.entry-card.advertising .entry-button{
background:var(--gold-light);
color:#111;
}

.partner-app{display:none}
.partner-app.show{display:block}

.app-bar{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:18px;
}

.app-title{
font-family:var(--serif);
font-size:31px;
font-weight:400;
}

.app-sub{
font-size:9px;
line-height:1.5;
color:#777;
margin-top:5px;
}

.logout-button{
border:1px solid #111;
background:transparent;
min-height:38px;
padding:0 14px;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.tabs{
display:flex;
gap:7px;
overflow-x:auto;
scrollbar-width:none;
margin-bottom:17px;
}

.tabs::-webkit-scrollbar{display:none}

.tab-button{
white-space:nowrap;
min-height:42px;
padding:0 16px;
border:1px solid #aaa49a;
background:#fff;
font-size:8px;
font-weight:900;
letter-spacing:.9px;
text-transform:uppercase;
}

.tab-button.active{
background:#111;
color:#fff;
border-color:#111;
}

.tab-panel{display:none}
.tab-panel.active{display:block}

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
margin-bottom:18px;
}

.stat{
background:#fff;
border:1px solid var(--line);
padding:16px;
}

.stat span{
font-size:7px;
font-weight:900;
letter-spacing:1.4px;
color:#777;
text-transform:uppercase;
}

.stat strong{
display:block;
font-family:var(--serif);
font-weight:400;
font-size:27px;
margin-top:7px;
}

.panel-card{
background:#fff;
border:1px solid var(--line);
margin-bottom:13px;
}

.panel-head{
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border-bottom:1px solid #ddd6ca;
}

.panel-head h3{
font-family:var(--serif);
font-weight:400;
font-size:22px;
}

.panel-head span{
font-size:8px;
font-weight:900;
letter-spacing:1px;
color:var(--gold-dark);
}

.empty-state{
padding:28px 18px;
text-align:center;
}

.empty-state strong{
font-family:var(--serif);
font-size:20px;
font-weight:400;
}

.empty-state p{
font-size:9px;
line-height:1.5;
color:#777;
margin-top:6px;
}

.records{display:grid}

.record{
display:grid;
grid-template-columns:70px 1fr auto;
gap:12px;
align-items:center;
padding:11px 14px;
border-bottom:1px solid #e6e0d6;
}

.record:last-child{border-bottom:0}

.record-thumb{
width:70px;
height:58px;
background:#e9e2d7;
object-fit:cover;
}

.record-title{
font-weight:900;
font-size:10px;
}

.record-meta{
font-size:8px;
color:#777;
margin-top:4px;
line-height:1.45;
}

.record-status{
font-size:7px;
font-weight:900;
letter-spacing:1px;
padding:6px 8px;
border-radius:99px;
background:#ecf7e8;
color:#216738;
white-space:nowrap;
}

.record-status.pending,
.record-status.awaiting_payment{
background:#fff4d4;
color:#8a6118;
}

.record-status.draft{
background:#eee;
color:#666;
}

.record-status.paid{
background:#111;
color:var(--gold-light);
}

.record-status.active{
background:#ddf5d7;
color:#1f6636;
}

.record-actions{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-top:7px;
}

.tiny-action{
min-height:28px;
padding:0 8px;
border:1px solid #111;
background:#111;
color:#fff;
font-size:7px;
font-weight:900;
letter-spacing:.5px;
}

.form-shell{
display:grid;
grid-template-columns:minmax(0,1fr) 360px;
gap:15px;
align-items:start;
}

.form-card{
background:#fff;
border:1px solid var(--line);
}

.form-section{
padding:18px;
border-bottom:1px solid #e0d9ce;
}

.form-section:last-child{border-bottom:0}

.form-section h3{
font-family:var(--serif);
font-size:21px;
font-weight:400;
margin-bottom:13px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
}

.field{margin-bottom:11px}
.field.full{grid-column:1/3}

.field label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:.5px;
margin-bottom:5px;
}

.field .hint{
font-size:7px;
color:#8a847a;
margin-top:4px;
line-height:1.4;
}

.field input,
.field select,
.field textarea{
width:100%;
border:1px solid #bbb3a8;
background:#fff;
outline:none;
color:#111;
}

.field input,
.field select{
height:42px;
padding:0 10px;
}

.field textarea{
height:86px;
padding:10px;
resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#111;
}

.range-box{
border:1px solid #c9c0b3;
background:#faf7f0;
padding:14px;
}

.range-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.range-value{
font-family:var(--serif);
font-size:28px;
font-weight:400;
color:var(--gold-dark);
white-space:nowrap;
}

.range-manual{
width:110px!important;
height:43px!important;
font-size:16px;
text-align:center;
font-weight:800;
}

.range-control{
width:100%;
height:30px!important;
padding:0!important;
margin-top:10px;
border:0!important;
background:transparent!important;
accent-color:#111;
}

.range-limits{
display:flex;
justify-content:space-between;
gap:10px;
font-size:6px;
font-weight:900;
letter-spacing:.6px;
color:#8a847a;
margin-top:3px;
}

.commission-box{
border:2px solid #111;
background:#f5efe3;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.commission-copy strong{
display:block;
font-family:var(--serif);
font-size:19px;
font-weight:400;
}

.commission-copy span{
display:block;
font-size:7px;
line-height:1.45;
color:#777;
margin-top:4px;
}

.commission-value{
font-family:var(--serif);
font-size:34px;
color:var(--gold-dark);
white-space:nowrap;
}

.voucher-summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin-top:10px;
}

.voucher-stat{
border:1px solid #d8d0c3;
background:#fff;
padding:9px 7px;
text-align:center;
}

.voucher-stat span{
display:block;
font-size:5px;
font-weight:900;
letter-spacing:.7px;
color:#777;
text-transform:uppercase;
}

.voucher-stat strong{
display:block;
font-family:var(--serif);
font-size:17px;
font-weight:400;
margin-top:3px;
}

.check-row{
display:flex;
gap:8px;
align-items:flex-start;
margin-top:9px;
}

.check-row input{margin-top:2px}

.check-row label{
font-size:8px;
line-height:1.45;
color:#58534d;
}

.choice-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.choice{position:relative}

.choice input{
position:absolute;
opacity:0;
pointer-events:none;
}

.choice label{
display:block;
padding:12px;
border:1px solid #bfb7aa;
background:#fff;
min-height:78px;
cursor:pointer;
}

.choice input:checked+label{
border:2px solid #111;
background:#f8f3e8;
}

.choice label strong{
display:block;
font-family:var(--serif);
font-size:17px;
font-weight:400;
}

.choice label span{
display:block;
font-size:7px;
color:#777;
margin-top:5px;
line-height:1.4;
}

.location-box{
border:1px solid #cfc5b6;
background:#faf6ed;
padding:14px;
margin-top:12px;
}

.location-box-title{
font-family:var(--serif);
font-size:19px;
font-weight:400;
margin-bottom:10px;
}

.location-summary{
margin-top:9px;
padding:9px 10px;
background:#111;
color:#fff;
font-size:7px;
font-weight:900;
letter-spacing:.5px;
line-height:1.45;
}

.member-access{
border:2px solid #111;
background:#f8f3e8;
padding:17px;
}

.member-access-top{
display:flex;
align-items:center;
gap:11px;
}

.member-access-icon{
width:38px;
height:38px;
border-radius:50%;
background:#111;
color:var(--gold-light);
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
flex:0 0 auto;
}

.member-access strong{
font-family:var(--serif);
font-size:20px;
font-weight:400;
}

.member-access p{
font-size:8px;
line-height:1.5;
color:#777;
margin-top:5px;
}

.generated-code{
background:#f7f3e9;
border:1px solid #cfc6b8;
padding:15px;
}

.generated-code-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.generated-code span{
font-size:7px;
font-weight:900;
letter-spacing:1px;
color:#777;
text-transform:uppercase;
}

.generated-code strong{
font-size:18px;
letter-spacing:1.8px;
}

.generated-code p{
font-size:7px;
color:#777;
line-height:1.45;
margin-top:7px;
}

.server-code-note{
margin-top:8px;
font-size:7px;
line-height:1.5;
color:var(--gold-dark);
font-weight:700;
}

.regenerate-button{
border:1px solid #111;
background:#fff;
padding:7px 9px;
font-size:7px;
font-weight:900;
letter-spacing:.6px;
}

.upload-box{
border:1px dashed #9f978c;
padding:14px;
text-align:center;
background:#faf8f3;
}

.upload-box input{display:none}

.upload-label{
display:block;
cursor:pointer;
font-size:8px;
font-weight:900;
letter-spacing:1px;
}

.upload-help{
font-size:7px;
color:#777;
margin-top:5px;
}

.upload-success{
font-size:7px;
font-weight:900;
color:var(--green-dark);
margin-top:7px;
}

.primary{
width:100%;
min-height:48px;
border:0;
background:#111;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.3px;
text-transform:uppercase;
}

.primary.gold{
background:var(--gold);
color:#111;
}

.secondary{
width:100%;
min-height:43px;
border:1px solid #111;
background:#fff;
color:#111;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
margin-top:7px;
}

.preview-sticky{
position:sticky;
top:105px;
}

.preview-label{
font-size:7px;
font-weight:900;
letter-spacing:1.4px;
color:#777;
margin-bottom:7px;
text-transform:uppercase;
}

.offer-preview{
background:#fff;
border:1px solid #cfc7bb;
overflow:hidden;
}

.offer-preview-image{
height:190px;
background:linear-gradient(135deg,#d8c29b,#f5ead5);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative;
}

.offer-preview-image img{
width:100%;
height:100%;
object-fit:cover;
}

.preview-category{
position:absolute;
left:10px;
top:10px;
padding:5px 7px;
background:rgba(255,255,255,.9);
font-size:6px;
font-weight:900;
letter-spacing:.7px;
text-transform:uppercase;
}

.preview-plan{
position:absolute;
right:10px;
top:10px;
padding:6px 8px;
background:#111;
color:var(--gold-light);
font-size:6px;
font-weight:900;
letter-spacing:.8px;
text-transform:uppercase;
}

.preview-copy{padding:14px}

.preview-company{
font-family:var(--serif);
font-size:18px;
}

.preview-offer{
font-size:10px;
line-height:1.4;
margin-top:5px;
}

.preview-discount{
font-family:var(--serif);
font-size:35px;
color:var(--gold-dark);
margin-top:9px;
}

.preview-location{
margin-top:8px;
font-size:7px;
font-weight:900;
letter-spacing:.5px;
color:#5f584f;
}

.preview-meta{
display:flex;
justify-content:space-between;
gap:9px;
margin-top:10px;
font-size:7px;
color:#777;
}

.preview-code{
display:grid;
grid-template-columns:1fr 1.3fr;
gap:7px;
margin-top:12px;
}

.code-box,
.barcode-box{
min-height:49px;
border:1px solid #d0c9be;
display:flex;
align-items:center;
justify-content:center;
}

.code-box{
font-size:9px;
font-weight:900;
letter-spacing:1px;
padding:6px;
word-break:break-all;
}

.barcode-box{
position:relative;
overflow:hidden;
padding:4px 9px;
}

.barcode-lines{
width:100%;
height:34px;
background:repeating-linear-gradient(
90deg,
#111 0 2px,
transparent 2px 4px,
#111 4px 5px,
transparent 5px 8px,
#111 8px 11px,
transparent 11px 13px,
#111 13px 14px,
transparent 14px 17px
);
}

.preview-use-button{
width:100%;
min-height:42px;
margin-top:10px;
border:0;
background:#111;
color:#fff;
font-size:7px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.ad-plans{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:14px;
}

.ad-plan{position:relative}
.ad-plan input{position:absolute;opacity:0}

.ad-plan label{
display:block;
height:100%;

}

.toast{
position:fixed;
left:50%;
bottom:18px;
transform:translate(-50%,30px);
z-index:10000;
background:#111;
color:#fff;
padding:11px 15px;
font-size:8px;
font-weight:900;
letter-spacing:.8px;
opacity:0;
pointer-events:none;
transition:.22s;
max-width:calc(100vw - 28px);

}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

html[dir="rtl"] body{direction:rtl}
html[dir="rtl"] .preview-category{left:auto;right:10px}
html[dir="rtl"] .preview-plan{right:auto;left:10px}

function escapeHtml(value){
return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function localizedCountryName(code){
return(
COUNTRY_NAMES[currentLanguage]?.[code]||

code
);
}

function fillSelect(id,items){
const el=$(id);

if(!el){
return;
}

const previous=el.value;

el.innerHTML="";

items.forEach((item,index)=>{

const option=
document.createElement("option");

option.value=String(index);
option.textContent=item;

el.appendChild(option);

});

if(
[...el.options]
.some(option=>option.value===previous)
){
el.value=previous;
}
}

function fillCountrySelect(){
const select=$("offerCountry");

if(!select){
return;
}

const previous=
select.value||
"GB";

select.innerHTML="";

COUNTRIES.forEach(([code])=>{

const option=
document.createElement("option");

option.value=code;
option.textContent=
localizedCountryName(code);

select.appendChild(option);

});

if(
[...select.options]
.some(option=>option.value===previous)
){
select.value=previous;
}else{
select.value="GB";
}
}

function clamp(value,min,max,fallback){
const number=
Math.round(Number(value));

if(!Number.isFinite(number)){
return fallback;
}

return Math.min(
max,
Math.max(min,number)
);
}

function generatePromoCode(){
const alphabet=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let random="";

if(
window.crypto &&
window.crypto.getRandomValues
){

const values=
new Uint32Array(6);

window.crypto.getRandomValues(values);

values.forEach(value=>{
random+=
alphabet[
value%
alphabet.length
];
});

}else{

for(let i=0;i<6;i++){

random+=
alphabet[
Math.floor(
Math.random()*
alphabet.length
)
];

}

}

return `DOGUE-${random}`;
}

function compressImage(
file,
maxWidth=1400,
quality=.82
){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onerror=
()=>reject(
new Error(
"Unable to read image."
)
);

reader.onload=()=>{

const image=
new Image();

image.onerror=
()=>reject(
new Error(
"Unable to process image."
)
);

image.onload=()=>{

let width=
image.naturalWidth||
image.width;

let height=
image.naturalHeight||
image.height;

if(width>maxWidth){

height=
Math.round(
height*
(maxWidth/width)
);

width=maxWidth;

}

const canvas=
document.createElement(
"canvas"
);

canvas.width=width;
canvas.height=height;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
width,
height
);

try{

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

}catch(error){

reject(error);

}

};

image.src=
String(
reader.result||
""
);

};

reader.readAsDataURL(file);

}
);

}

function saveLocalOffer(offer){
const list=
getJSON(
OFFERS_KEY,
[]
);

const existingIndex=
list.findIndex(item=>

String(item.id)===
String(offer.id)

||

(
offer.serverId&&
String(item.serverId)===
String(offer.serverId)
)

);

if(existingIndex>=0){

list[existingIndex]=
offer;

}else{

list.unshift(offer);

}

setJSON(
OFFERS_KEY,
list
);

renderDashboard();

return offer;
}

async function submitPartnerOffer(){
if(offerPublishing){
return;
}

const account=
partnerAccount();

if(!account){

openRegister("offer");
return;

}

if(
!validateLocation()
){
return;
}

const externalId=
createExternalOfferId();

const country=
selectedCountry();

setOfferPublishing(true);

try{

const response=
await fetch(
"/api/create-partner-offer",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

externalId,

businessName:
$("offerCompany")
.value
.trim(),

businessType:
account.businessType||
"",

contactName:
account.contactName||
"",

partnerEmail:
account.email||
"",

country:
account.country||
"",

website:
account.website||
"",

address:
account.address||
"",

category:
$("offerCategory")
.value,

title:
$("offerTitle")
.value
.trim(),

description:
$("offerDescription")
.value
.trim(),

discount:
`-${discountPercent()}%`,

saving:
$("offerSaving")
.value
.trim(),

redemptionType:
selectedRedeem(),

partnerUrl:
$("offerUrl")
.value
.trim(),

offlineInstructions:
$("offlineInstructions")
.value
.trim(),

start:
$("offerStart")
.value,

end:
$("offerEnd")
.value,

maxRedemptions:
voucherCount(),

commissionPercent:
FIXED_COMMISSION_PERCENT,

image:
offerImageData,

locationScope:
selectedLocationScope(),

countryCode:
selectedLocationScope()==="country"
?country.code
:null,

countryName:
selectedLocationScope()==="country"
?country.name
:null,

city:
selectedLocationScope()==="country"
?$("offerCity").value.trim()
:null

})

}
);

let result={};

try{
result=
await response.json();
}catch{
result={};
}

if(
!response.ok||
!result.ok||
!result.offer
){

throw new Error(
result.error||
lang().offerPublishError
);

}

const serverOffer=
result.offer;

const localOffer=
buildLocalOffer(
serverOffer.status||
"pending",
{

id:
`local_${serverOffer.id}`,

serverId:
serverOffer.id,

externalId:
serverOffer.externalId||
externalId,

code:
serverOffer.promoCode,

createdAt:
serverOffer.createdAt||
new Date()
.toISOString()

}
);

localOffer.status=
"pending";

saveLocalOffer(
localOffer
);

currentPromoCode=
serverOffer.promoCode;

ensurePromoCode();

closeReview();

showToast(
lang().offerPublished
);

resetOfferForm();

openTab(
"dashboardPanel"
);

}catch(error){

console.error(
"PETS & DOGUE offer publish error:",
error
);

showToast(
error?.message||
lang().offerPublishError
);

}finally{

setOfferPublishing(false);

}

}

function updateAdvertisingCampaign(
campaignId,
changes
){

const list=
getJSON(
ADS_KEY,
[]
);

const index=
list.findIndex(
item=>
item.id===campaignId
);

if(index===-1){
return null;
}

list[index]={
...list[index],
...changes
};

setJSON(
ADS_KEY,
list
);

renderDashboard();

return list[index];
}

async function startAdvertisingCheckout(
campaign
){

if(paymentBusy){
return;
}

const account=
partnerAccount();

if(!account){

openRegister("ad");
return;

}

paymentBusy=true;
updateAdPreview();

try{

sessionStorage.setItem(
PENDING_AD_KEY,
campaign.id
);

const response=
await fetch(
"/api/create-advertising-checkout",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

plan:
campaign.plan,

language:
currentLanguage,

partnerEmail:
account.email,

businessName:
campaign.company,

contactName:
account.contactName||
"",

category:
campaign.category,

headline:
campaign.headline,

copy:
campaign.copy,

cta:
campaign.cta,

url:
campaign.url,

start:
campaign.start,

end:
campaign.end,

placement:
campaign.placement,

campaignId:
campaign.id

})

}
);

const result=
await response.json();

if(
!response.ok||
!result.checkoutUrl
){

throw new Error(
result.error||
lang().checkoutError
);

}

updateAdvertisingCampaign(
campaign.id,
{

status:
"awaiting_payment",

stripe:{
...(campaign.stripe||{}),

sessionId:
result.sessionId||
null,

customerId:
result.customerId||
null

}

}
);

window.location.href=
result.checkoutUrl;

}catch(error){

paymentBusy=false;

updateAdPreview();

showToast(
error.message||
lang().checkoutError
);

}

}

function addBillingRecord(

){

const campaign=
verification.campaign||
{};

const stripe=
verification.stripe||
{};

const receipt=
verification.receipt||
{};

const list=
getJSON(
BILLING_KEY,
[]
);

if(
list.some(
item=>
item.sessionId===
stripe.sessionId
)
){
return;
}

list.unshift({

id:
`billing_${Date.now()}`,

campaignId:
campaign.id||
"",

description:
campaign.headline||
"PETS & DOGUE Advertising",

businessName:
campaign.businessName||
"",

plan:
campaign.plan||
0,

amount:
Number(
receipt.amountPaid||
campaign.amount||
0
)/100,

currency:
receipt.currency||
"GBP",

date:
campaign.paidAt||
new Date()
.toISOString(),

sessionId:
stripe.sessionId||
null,

paymentIntentId:
stripe.paymentIntentId||
null,

invoiceId:
stripe.invoiceId||
null,

invoiceNumber:
receipt.invoiceNumber||
null,

hostedInvoiceUrl:
receipt.hostedInvoiceUrl||
null,

invoicePdf:
receipt.invoicePdf||
null

});

setJSON(
BILLING_KEY,
list
);

}

async function verifyAdvertisingReturn(){

const params=
new URLSearchParams(
window.location.search
);

const paymentState=
params.get(
"ad_payment"
);

if(!paymentState){
return;
}

if(partnerAccount()){

$("landingView")
.classList
.add("hidden");

$("partnerApp")
.classList
.add("show");

}

openPaymentOverlay();

if(
paymentState==="cancelled"
){

$("paymentSpinner")
.classList
.add("hidden");

setPaymentOverlayState(
"error",
lang().paymentCancelled,
lang().paymentCancelledText
);

cleanPaymentUrl();

return;
}

const sessionId=
params.get(
"session_id"
);

if(
paymentState!=="success"||
!sessionId
){

setPaymentOverlayState(
"error",
lang().paymentFailed,
lang().paymentFailedText
);

cleanPaymentUrl();

return;
}

text(
"paymentStatusTitle",
lang().paymentChecking
);

text(
"paymentStatusText",
lang().paymentCheckingText
);

try{

const response=
await fetch(
"/api/verify-advertising-payment",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
sessionId
})

}
);

const result=
await response.json();

if(
!response.ok||
!result.ok||
!result.verified||
!result.paid
){

throw new Error(
result.error||
result.message||
lang().paymentFailedText
);

}

const campaign=
result.campaign||
{};

const localCampaign=
getAdvertisingCampaign(
campaign.id
);

const campaignId=
localCampaign?.id||
sessionStorage.getItem(
PENDING_AD_KEY
);

if(campaignId){

updateAdvertisingCampaign(
campaignId,
{

status:"paid",

paidAt:
campaign.paidAt||
new Date()
.toISOString(),

verifiedAt:
new Date()
.toISOString(),

stripe:{
...(localCampaign?.stripe||{}),

sessionId:
result.stripe?.sessionId||
sessionId,

customerId:
result.stripe?.customerId||
null,

paymentIntentId:
result.stripe?.paymentIntentId||
null,

invoiceId:
result.stripe?.invoiceId||
null,

livemode:
Boolean(
result.stripe?.livemode
)

}

}
);

}

addBillingRecord(
result
);

sessionStorage.removeItem(
PENDING_AD_KEY
);

renderDashboard();

setPaymentOverlayState(
"success",
lang().paymentSuccess,
lang().paymentSuccessText
);

cleanPaymentUrl();

}catch(error){

console.error(error);

setPaymentOverlayState(
"error",
lang().paymentFailed,
error.message||
lang().paymentFailedText
);

cleanPaymentUrl();

}

}

function statusLabel(status){
const x=lang();

if(status==="active"){
return x.active;
}

if(status==="paid"){
return x.paid;
}

if(
status===
"awaiting_payment"
){
return x.awaitingPayment;
}

if(status==="pending"){
return x.pending;
}

return x.draft;
}

function formatShortDate(value){
if(!value){
return "—";
}

const date=
String(value)
.includes("T")
?new Date(value)
:new Date(
`${value}T12:00:00`
);

const localeMap={
uk:"uk-UA",
ru:"ru-RU",
fr:"fr-FR",
de:"de-DE",
es:"es-ES",
it:"it-IT",
pt:"pt-PT",
nl:"nl-NL",
pl:"pl-PL",
cs:"cs-CZ",
sk:"sk-SK",
hu:"hu-HU",
ro:"ro-RO",
bg:"bg-BG",
el:"el-GR",
sv:"sv-SE",
da:"da-DK",
no:"nb-NO",
fi:"fi-FI",
tr:"tr-TR",
ar:"ar",
hi:"hi-IN"
};

return date.toLocaleDateString(
localeMap[currentLanguage]||
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}

function recordImage(image){
if(image){

return(
`<img class="record-thumb" src="${escapeHtml(image)}" alt="">`
);

return(
`<div class="record-thumb"></div>`
);
}

function renderDashboard(){

const offers=
getJSON(
OFFERS_KEY,
[]

const ads=
getJSON(
ADS_KEY,
[]
);

getJSON(
BILLING_KEY,
[]
);

).length;

const paidAds=
ads.filter(
item=>
item.status==="paid"||
item.status==="active"
).length;

offers.reduce(
(sum,item)=>
sum+
Number(
item.views||
0
),
0
)
+
ads.reduce(
(sum,item)=>
sum+
Number(
item.views||
0
),
0
);

offers.reduce(
(sum,item)=>
sum+
Number(
item.sales||
0
),
0
);

text(
"statOffers",
String(activeOffers)
);

text(
"statAds",
String(paidAds)
);

text(
"statViews",
views.toLocaleString()
);

"statSales",
`£${sales.toFixed(0)}`
);

offers
);

ads
);

billing
);

}

function dateInputValue(date){

const year=
date.getFullYear();

const month=
String(
date.getMonth()+1
)
.padStart(
2,
"0"
);

const day=
String(
date.getDate()
)
.padStart(
2,
"0"
);

return(
`${year}-${month}-${day}`
);

}
