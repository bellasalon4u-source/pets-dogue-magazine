<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Photo moderation · PETS &amp; DOGUE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f0e5;color:#151515;font:16px/1.45 Arial,sans-serif}
header{background:#111;color:#ebd48a;padding:20px}
header a{color:inherit}
main{max-width:1100px;margin:auto;padding:18px}
h1{font:34px Georgia,serif}
button,input,select{font:inherit;min-height:46px;border-radius:10px;padding:10px 14px;border:1px solid #c9bea6}
button{background:#111;color:white;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0088ed;outline-offset:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
input{max-width:100%;width:400px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{padding:14px;border:1px solid #c9bea6;border-radius:14px;background:white}
.card img,.card video{display:block;width:100%;height:240px;object-fit:contain;background:#eee;border-radius:8px}
.card .tools>*{flex:1}
.approve{background:#176f42}
.reject{background:#b30d25}
.card select{width:100%}
#message{min-height:25px}
small{display:block;color:#555}
label{display:block;margin:12px 0 6px}
[hidden]{display:none!important}
@media(max-width:400px){
main{padding:12px}
h1{font-size:28px}
}
</style>
</head>
<body>

<header>
<b>PETS &amp; DOGUE · ADMIN</b>
<a href="/admin-invitations.html">← Admin</a>
</header>

<main>
<div class="tools">
<select id="language" aria-label="Language"></select>
<button id="listen" type="button">🔊</button>
</div>

<h1 data-text="33"></h1>

<form id="login">
<label for="key" data-text="37"></label>
<input id="key" type="password" autocomplete="off" required maxlength="1000">
<button type="submit" data-text="38"></button>
</form>

<section id="panel" hidden>
<div class="tools">
<select id="filter" aria-label="Status">
<option value="pending" data-text="14"></option>
<option value="approved" data-text="13"></option>
<option value="blocked" data-text="16"></option>
</select>
<button id="refresh" data-text="27"></button>
<button id="logout" data-text="39"></button>
</div>

<div id="cards" class="cards"></div>
<button id="more" data-text="6" hidden></button>
</section>

<p id="message" role="status" aria-live="polite"></p>
</main>

<script src="/photos-community-layout.js?v=20261016-review-2"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const language = $('language');
const cards = $('cards');

const names = {
en:'English',
uk:'Українська',
ru:'Русский',
fr:'Français',
de:'Deutsch',
es:'Español',
it:'Italiano',
pt:'Português',
nl:'Nederlands',
pl:'Polski',
cs:'Čeština',
sk:'Slovenčina',
hu:'Magyar',
ro:'Română',
bg:'Български',
el:'Ελληνικά',
sv:'Svenska',
da:'Dansk',
no:'Norsk',
fi:'Suomi',
tr:'Türkçe',
ar:'العربية',
hi:'हिन्दी'
};

let locale = 'en';
let admin = '';
let busy = false;
let offset = 0;
let items = [];
let messageKey = null;

try {
const saved = localStorage.getItem('pets_dogue_language');
locale = ({
ua:'uk',
cz:'cs',
gr:'el',
se:'sv',
dk:'da'
})[saved] || saved || 'en';
} catch {}

if (!names[locale]) locale = 'en';

for (const [code, name] of Object.entries(names)) {
const option = document.createElement('option');
option.value = code;
option.textContent = name;
language.append(option);
}

language.value = locale;

const t = index =>
(window.PDPhotoTexts?.[locale] ||
window.PDPhotoTexts?.en ||
[])[index] || '…';

const node = (tag, text) => {
const element = document.createElement(tag);
if (text !== undefined) element.textContent = text;
return element;
};

function labels() {
document.documentElement.lang = locale;
document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';

document.querySelectorAll('[data-text]').forEach(element => {
element.textContent = t(Number(element.dataset.text));
});

$('listen').setAttribute('aria-label', t(18));
$('message').textContent = messageKey === null ? '' : t(messageKey);
render();
}

function setMessage(index) {
messageKey = index;
$('message').textContent = index === null ? '' : t(index);
}

async function api(body) {
const response = await fetch('/api/photos-review', {
method:'POST',
headers:{
'Content-Type':'application/json',
'x-pets-dogue-admin-key':admin
},
body:JSON.stringify(body),
signal:AbortSignal.timeout(60000)
});

if (!response.ok) {
if (response.status === 401) {
admin = '';
$('panel').hidden = true;
$('login').hidden = false;
cards.replaceChildren();
items = [];
}
throw Error();
}

return response.json();
}

function safeURL(value) {
try {
const url = new URL(value);
return url.protocol === 'https:' ? url.href : '';
} catch {
return '';
}
}

function render() {
cards.replaceChildren();

for (const row of items) {
const card = node('article');
card.className = 'card';

if (row.url && safeURL(row.url)) {
const media = node(row.type === 'video' ? 'video' : 'img');
media.src = safeURL(row.url);

if (row.type === 'video') {
media.controls = true;
media.playsInline = true;
media.preload = 'metadata';
} else {
media.alt = t(3);
media.loading = 'lazy';
}

card.append(media);
}

card.append(
node('small', new Date(row.created_at).toLocaleString(locale))
);

const reason = node('select');
reason.setAttribute('aria-label', t(35));

for (const [value, index] of [
['no_animal',29],
['unsafe',30],
['rights',31],
['other',32]
]) {
const option = node('option', t(index));
option.value = value;
reason.append(option);
}

if (row.reason) reason.value = row.reason;

const tools = node('div');
tools.className = 'tools';

function action(name, index, className) {
const control = node('button', t(index));
control.type = 'button';
control.className = className;
control.disabled = busy;

control.onclick = async () => {
if (
busy ||
(name === 'delete' && !confirm(t(36) + '?'))
) return;

busy = true;

document.querySelectorAll('button').forEach(button => {
button.disabled = true;
});

setMessage(null);

try {
const result = await api({
action:name,
id:row.id,
reason:reason.value
});

if (result.cleanupPending) setMessage(15);

await load(false);
} catch {
setMessage(15);
} finally {
busy = false;

document.querySelectorAll('button').forEach(button => {
button.disabled = false;
});

render();
}
};

tools.append(control);
}

if (row.status === 'pending') {
card.append(reason);
action('approve',34,'approve');
action('reject',35,'reject');
}

if (row.status === 'blocked') {
const reasonIndex = ({
no_animal:29,
unsafe:30,
rights:31,
other:32
})[row.reason] || 32;

card.append(
node('p', t(28)),
node('p', t(reasonIndex))
);
}

action('delete',36,'');
card.append(tools);
cards.append(card);
}

if (!items.length) {
cards.append(node('p', t(40)));
}
}

async function load(append = false) {
try {
if (!append) offset = 0;

const data = await api({
action:'list',
status:$('filter').value,
offset
});

items = append ? items.concat(data.items) : data.items;
offset += data.items.length;

$('more').hidden = !data.hasMore;

render();
return true;
} catch {
setMessage(15);
return false;
}
}

$('login').onsubmit = async event => {
event.preventDefault();
if (busy) return;

admin = $('key').value.trim();
$('key').value = '';
busy = true;
setMessage(null);

if (await load()) {
$('panel').hidden = false;
$('login').hidden = true;
}

busy = false;
render();
};

$('refresh').onclick = () => {
if (!busy) load();
};

$('filter').onchange = () => {
if (!busy) load();
};

$('more').onclick = () => {
if (!busy) load(true);
};

$('logout').onclick = () => {
admin = '';
items = [];
cards.replaceChildren();
$('panel').hidden = true;
$('login').hidden = false;
setMessage(null);
};

language.onchange = () => {
locale = language.value;

try {
localStorage.setItem('pets_dogue_language', locale);
} catch {}

labels();
};

$('listen').onclick = () => {
if (!window.speechSynthesis) return;

speechSynthesis.cancel();

const utterance = new SpeechSynthesisUtterance(
[t(33),t(14),t(34),t(35),t(36)].join('. ')
);

utterance.lang = locale;
speechSynthesis.speak(utterance);
};

labels();
})();
</script>

</body>
</html>
