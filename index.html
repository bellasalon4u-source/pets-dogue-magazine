<style>

:root{
--black:#070707;
--black-2:#101010;
--white:#ffffff;
--cream:#f4f0e8;
--cream-2:#ece6da;
--text:#141414;
--muted:#706a61;
--line:#d6cec0;
--gold:#c89b3c;
--gold-dark:#8b6419;
--gold-light:#efd38c;
--green:#65e51f;

--gold-metal:
linear-gradient(
100deg,
#75500d 0%,
#b67d17 18%,
#f0cb62 39%,
#fff0a6 50%,
#d59a24 66%,
#80580f 100%
);

--content:1100px;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
background:var(--cream);
}

body{
margin:0;
background:var(--cream);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

body.drawer-open{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
width:100%;
}

[hidden]{
display:none!important;
}


/* =========================================================
HEADER
========================================================= */

.pd-topbar{
position:sticky;
top:0;
z-index:1600;
width:100%;
background:#070707;
color:#fff;
border-bottom:1px solid #292929;
transform:translateY(0);
transition:
transform .24s ease,
box-shadow .24s ease;
will-change:transform;
}

.pd-topbar.hidden-by-scroll{
transform:translateY(-105%);
}

.pd-brand-row{
height:76px;
max-width:var(--content);
margin:auto;
padding:0 17px;
display:grid;
grid-template-columns:50px minmax(0,1fr) 50px;
align-items:center;
gap:10px;
}

.pd-header-button{
width:46px;
height:46px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
}

.pd-menu-lines{
width:30px;
display:grid;
gap:6px;
}

.pd-menu-lines span{
height:2px;
display:block;
background:#fff;
border-radius:999px;
}

.pd-brand{
min-width:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
line-height:.86;
}

.pd-brand-small{
font:12px Georgia,"Times New Roman",serif;
letter-spacing:3px;
color:var(--gold-light);
}

.pd-brand-main{
font:normal 42px Georgia,"Times New Roman",serif;
letter-spacing:3px;
color:var(--gold);
}

.pd-home-icon{
width:29px;
height:29px;
fill:none;
stroke:#fff;
stroke-width:2.1;
}


/* =========================================================
PRIMARY NAV
========================================================= */

.pd-primary-nav{
border-top:1px solid #282828;
border-bottom:1px solid #292929;
}

.pd-primary-inner{
max-width:var(--content);
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
}

.pd-primary-item{
min-width:0;
height:74px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:6px;
color:#fff;
position:relative;
border-right:1px solid #292929;
padding:5px 4px;
text-align:center;
}

.pd-primary-item:last-child{
border-right:0;
}

.pd-primary-item svg{
width:27px;
height:27px;
fill:none;
stroke:var(--gold-light);
stroke-width:1.9;
stroke-linecap:round;
stroke-linejoin:round;
flex:none;
}

.pd-primary-label{
font-size:12px;
font-weight:800;
line-height:1.05;
max-width:100%;
}

.pd-primary-item:hover,
.pd-primary-item:focus-visible{
background:#111;
}


/* =========================================================
SECONDARY NAV
========================================================= */

.pd-secondary-nav{
max-width:var(--content);
margin:auto;
display:flex;
overflow-x:auto;
overflow-y:hidden;
scrollbar-width:none;
-webkit-overflow-scrolling:touch;
}

.pd-secondary-nav::-webkit-scrollbar{
display:none;
}

.pd-secondary-item{
flex:0 0 100px;
height:64px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
position:relative;
color:#fff;
border-right:1px solid #252525;
text-align:center;
padding:4px;
}

.pd-secondary-item svg{
width:21px;
height:21px;
fill:none;
stroke:#fff;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.pd-secondary-label{
font-size:10px;
font-weight:800;
line-height:1.05;
white-space:normal;
}

.pd-secondary-item.active{
color:var(--gold-light);
}

.pd-secondary-item.active svg{
stroke:var(--gold-light);
}

.pd-secondary-item.active:after{
content:"";
position:absolute;
left:8px;
right:8px;
bottom:0;
height:3px;
background:var(--gold-metal);
}

.pd-secondary-item.emphasis svg{
stroke:var(--gold-light);
}

.pd-secondary-item.emphasis{
border-left:1px solid rgba(200,155,60,.38);
border-right:1px solid rgba(200,155,60,.38);
}


/* =========================================================
MAIN
========================================================= */

main{
max-width:var(--content);
margin:auto;
padding:16px 15px 55px;
}


/* =========================================================
COVER
========================================================= */

.pd-cover-shell{
max-width:780px;
margin:0 auto;
}

.pd-cover{
display:block;
position:relative;
width:100%;
overflow:hidden;
border-radius:24px;
background:#111;
box-shadow:0 12px 34px rgba(0,0,0,.14);
}

.pd-cover img{
width:100%;
height:auto;
object-fit:cover;
}

.pd-cover-bottom{
background:#0a0a0a;
display:flex;
align-items:center;
justify-content:center;
padding:17px;
}

.pd-season-button{
display:inline-flex;
align-items:center;
justify-content:center;
gap:13px;
min-width:205px;
height:52px;
padding:0 26px;
border-radius:999px;
background:var(--gold-metal);
color:#111;
font-weight:900;
font-size:15px;
box-shadow:
inset 0 0 0 1px rgba(255,255,255,.32),
0 5px 18px rgba(0,0,0,.2);
}

.pd-season-button svg{
width:17px;
height:17px;
fill:none;
stroke:#111;
stroke-width:2.4;
}


/* =========================================================
PHOTO BOARD
========================================================= */

.pd-board{
margin-top:15px;
columns:4 220px;
column-gap:8px;
}

.pd-photo-card{
position:relative;
display:block;
width:100%;
margin:0 0 8px;
break-inside:avoid;
overflow:hidden;
border-radius:18px;
background:#111;
box-shadow:0 7px 20px rgba(0,0,0,.1);
}

.pd-photo-card img{
width:100%;
height:auto;
min-height:190px;
object-fit:cover;
}

.pd-photo-card.tall img{
aspect-ratio:.76;
}

.pd-photo-card.medium img{
aspect-ratio:1;
}

.pd-photo-card.wide img{
aspect-ratio:1.28;
}

.pd-photo-shade{
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.91) 0%,
rgba(0,0,0,.32) 42%,
rgba(0,0,0,.02) 72%
);
pointer-events:none;
}

.pd-photo-copy{
position:absolute;
z-index:2;
left:14px;
right:14px;
bottom:13px;
color:#fff;
}

.pd-photo-kicker{
display:block;
color:var(--gold-light);
font-size:9px;
font-weight:900;
letter-spacing:1.7px;
text-transform:uppercase;
margin-bottom:4px;
}

.pd-photo-title{
font:normal 25px/1 Georgia,"Times New Roman",serif;
}

.pd-photo-arrow{
position:absolute;
z-index:3;
top:11px;
right:11px;
width:37px;
height:37px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(7,7,7,.75);
border:1px solid rgba(255,255,255,.8);
color:#fff;
font-size:19px;
backdrop-filter:blur(5px);
}


/* =========================================================
CLUB
========================================================= */

.pd-club-card{
position:relative;
margin-top:8px;
min-height:240px;
overflow:hidden;
border-radius:22px;
background:#111;
color:#fff;
box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.pd-club-card:before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
90deg,
rgba(0,0,0,.92) 0%,
rgba(0,0,0,.67) 48%,
rgba(0,0,0,.18) 100%
),
url("https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=1500&q=85")
center/cover no-repeat;
}

.pd-club-content{
position:relative;
z-index:2;
min-height:240px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:flex-start;
padding:27px;
max-width:570px;
}

.pd-club-kicker{
font-size:10px;
font-weight:900;
letter-spacing:2.2px;
color:var(--gold-light);
margin-bottom:8px;
}

.pd-club-title{
font:normal 40px/1 Georgia,"Times New Roman",serif;
margin-bottom:14px;
}

.pd-club-button{
display:inline-flex;
align-items:center;
justify-content:center;
height:48px;
padding:0 23px;
border-radius:999px;
background:var(--green);
color:#111;
font-size:13px;
font-weight:900;
}


/* =========================================================
FOOTER
========================================================= */

footer{
background:#050505;
color:#fff;
text-align:center;
padding:44px 20px 50px;
}

.pd-footer-logo{
font:normal 46px Georgia,"Times New Roman",serif;
letter-spacing:3px;
color:var(--gold);
}

.pd-footer-platform{
font-size:14px;
font-weight:800;
margin-top:8px;
}

.pd-footer-slogan{
margin-top:7px;
font:italic 19px Georgia,"Times New Roman",serif;
color:var(--gold-light);
}

.pd-footer-links{
max-width:900px;
margin:24px auto 0;
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:12px 19px;
}

.pd-footer-links a{
font-size:13px;
color:#ccc;
}


/* =========================================================
DRAWER
========================================================= */

.pd-overlay{
position:fixed;
inset:0;
z-index:3000;
background:rgba(0,0,0,.68);
backdrop-filter:blur(3px);
opacity:0;
visibility:hidden;
transition:.22s;
}

.pd-overlay.open{
opacity:1;
visibility:visible;
}

.pd-drawer{
position:fixed;
left:0;
top:0;
z-index:3100;
width:min(78vw,390px);
min-width:286px;
height:100dvh;
background:#f7f4ed;
color:#111;
transform:translateX(-102%);
transition:transform .24s ease;
box-shadow:20px 0 55px rgba(0,0,0,.28);
overflow:hidden;
display:flex;
flex-direction:column;
}

.pd-drawer.open{
transform:translateX(0);
}

html[dir="rtl"] .pd-drawer{
left:auto;
right:0;
transform:translateX(102%);
}

html[dir="rtl"] .pd-drawer.open{
transform:translateX(0);
}

.pd-drawer-head{
height:86px;
flex:none;
background:#070707;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 17px;
}

.pd-drawer-title{
font:normal 31px Georgia,"Times New Roman",serif;
}

.pd-drawer-close{
width:43px;
height:43px;
border:1px solid #555;
border-radius:50%;
background:transparent;
color:#fff;
font-size:27px;
line-height:1;
}

.pd-drawer-scroll{
overflow-y:auto;
padding:12px 11px 24px;
}

.pd-account-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:12px;
}

.pd-account-button{
height:48px;
border-radius:999px;
border:2px solid #171717;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:900;
background:#fff;
}

.pd-account-button.club{
background:var(--green);
border-color:var(--green);
}

.pd-language-label{
display:block;
font-size:9px;
font-weight:900;
letter-spacing:1.6px;
color:#777;
text-transform:uppercase;
margin:0 3px 6px;
}

.pd-language-select{
width:100%;
height:51px;
border:2px solid #1b1b1b;
border-radius:999px;
background:#fff;
padding:0 15px;
font-weight:800;
margin-bottom:12px;
}

.pd-drawer-list{
display:grid;
gap:7px;
}

.pd-drawer-card{
display:grid;
grid-template-columns:82px minmax(0,1fr);
min-height:82px;
border:2px solid #191919;
border-radius:18px;
background:#fff;
overflow:hidden;
}

.pd-drawer-card.active{
background:#0b0b0b;
color:#fff;
}

.pd-drawer-card img{
width:82px;
height:100%;
min-height:82px;
object-fit:cover;
}

.pd-drawer-copy{
padding:10px 11px;
display:flex;
flex-direction:column;
justify-content:center;
min-width:0;
}

.pd-drawer-name{
font:700 19px/1 Georgia,"Times New Roman",serif;
}

.pd-drawer-card.active .pd-drawer-name{
color:var(--gold-light);
}

.pd-drawer-desc{
margin-top:4px;
font-size:11px;
line-height:1.25;
color:#706c66;
}

.pd-drawer-card.active .pd-drawer-desc{
color:#ddd;
}


/* =========================================================
RTL
========================================================= */

html[dir="rtl"] .pd-photo-arrow{
right:auto;
left:11px;
}


/* =========================================================
MOBILE
========================================================= */

@media(max-width:720px){

.pd-brand-row{
height:68px;
padding:0 13px;
grid-template-columns:46px minmax(0,1fr) 46px;
}

.pd-header-button{
width:44px;
height:44px;
}

.pd-brand-small{
font-size:10px;
letter-spacing:2.5px;
}

.pd-brand-main{
font-size:34px;
letter-spacing:2px;
}

.pd-primary-item{
height:60px;
gap:3px;
padding:3px 2px;
}

.pd-primary-item svg{
width:22px;
height:22px;
}

.pd-primary-label{
font-size:10px;
line-height:1.05;
}

.pd-secondary-item{
flex-basis:82px;
height:53px;
gap:2px;
}

.pd-secondary-item svg{
width:18px;
height:18px;
}

.pd-secondary-label{
font-size:8.5px;
line-height:1;
}

main{
padding:12px 10px 42px;
}

.pd-cover{
border-radius:19px;
}

.pd-cover-bottom{
padding:13px;
}

.pd-season-button{
height:46px;
min-width:180px;
font-size:14px;
}

.pd-board{
margin-top:9px;
columns:2;
column-gap:6px;
}

.pd-photo-card{
margin-bottom:6px;
border-radius:14px;
}

.pd-photo-copy{
left:10px;
right:10px;
bottom:10px;
}

.pd-photo-kicker{
font-size:7px;
letter-spacing:1.3px;
}

.pd-photo-title{
font-size:20px;
}

.pd-photo-arrow{
width:32px;
height:32px;
top:8px;
right:8px;
font-size:16px;
}

html[dir="rtl"] .pd-photo-arrow{
right:auto;
left:8px;
}

.pd-club-card,
.pd-club-content{
min-height:205px;
}

.pd-club-content{
padding:22px 18px;
}

.pd-club-title{
font-size:33px;
max-width:8ch;
}

.pd-footer-logo{
font-size:38px;
}

}

@media(max-width:390px){

.pd-primary-label{
font-size:9px;
}

.pd-secondary-item{
flex-basis:78px;
}

.pd-secondary-label{
font-size:8px;
}

.pd-photo-title{
font-size:18px;
}

}


/* =========================================================
ACCESSIBILITY
========================================================= */

button:focus-visible,
a:focus-visible,
select:focus-visible{
outline:3px solid var(--green);
outline-offset:2px;
}

@media(prefers-reduced-motion:reduce){

html{
scroll-behavior:auto;
}

.pd-topbar,
.pd-drawer,
.pd-overlay{
transition:none;
}

}

</style>
</head>

function normalizeLanguage(value){

let code =
String(
value ||
"en"
)
.trim()
.toLowerCase();

if(
code.includes("-")
){
code =
code.split("-")[0];
}

if(
code.includes("_")
){
code =
code.split("_")[0];
}

code =
LANGUAGE_ALIASES[code] ||
code;

return SUPPORTED_LANGUAGES.includes(
code
)
?code
:"en";

}


function getCurrentLanguage(){

try{

if(
window.PetsDogueLanguage &&
typeof window.PetsDogueLanguage.getCurrentLanguage ===
"function"
){

const value =
window.PetsDogueLanguage
.getCurrentLanguage();

if(
typeof value === "string"
){
return normalizeLanguage(value);
}

if(
value &&
value.code
){
return normalizeLanguage(value.code);
}

}

}catch(error){
}


try{

const saved =
localStorage.getItem(
LANGUAGE_KEY
);

if(saved){
return normalizeLanguage(saved);
}

}catch(error){
}


return normalizeLanguage(
document.documentElement.lang ||
"en"
);

}


function ui(){

const language =
getCurrentLanguage();

return SIMPLE_UI[language] ||
SIMPLE_UI.en;

}


function commonT(
path,
fallback
){

const language =
getCurrentLanguage();

let root =
window.PetsDogueTranslations &&
window.PetsDogueTranslations.common;

if(!root){
return fallback;
}

let value =
root[language] ||
root.en ||
null;

if(!value){
return fallback;
}

const cleanPath =
String(path || "")
.replace(/^common\./,"");

cleanPath
.split(".")
.forEach(
function(key){

if(
value &&
Object.prototype.hasOwnProperty.call(
value,
key
)
){

value =
value[key];

}else{

value =
undefined;

}

}
);

return typeof value === "string"
?value
:fallback;

}


function itemByKey(key){

return ITEMS.find(
function(item){

return item.key ===
key;

}
);

}


function getLabel(item){

if(
item.key ===
"edition"
){

return ui().edition;

}

if(
item.key ===
"help"
){

return ui().help;

}

const fallback = {

coverStars:"Cover Stars",
discounts:"Discounts",
places:"Pet-Friendly",
marketplace:"Marketplace",
fashion:"Fashion",
health:"Health",
articles:"Articles",
photos:"Photos",
community:"Community",
contests:"Contests",
partners:"Partners"

};

return commonT(
item.labelPath,
fallback[item.key] ||
item.key
);

}


function getDescription(item){

const fallback = {

edition:"Open the latest PETS & DOGUE digital edition.",
coverStars:"Meet the stars and enter your pet.",
discounts:"Member offers and benefits.",
places:"Pet-friendly places and destinations.",
marketplace:"Listings, rehoming, products and services.",
fashion:"Style and fashion for pets.",
health:"Health, care and practical guidance.",

photos:"Photography and visual stories.",
community:"Local pet people, stories and updates.",
contests:"Competitions, voting and prizes.",
help:"Animals needing care, adoption and visibility.",
partners:"Selected partners and collaborations."

};

return commonT(
item.descriptionPath,
fallback[item.key] ||
""
);

}


function escapeHTML(value){

return String(
value ||
""
)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

/* =========================================================
LANGUAGE
========================================================= */

function applyLanguage(){

const language =
getCurrentLanguage();

const words =
ui();

document.documentElement.lang =
language;

document.documentElement.dir =
language === "ar"
?"rtl"
:"ltr";


const select =
document.getElementById(
"languageSelect"
);

if(
select &&
select.value !==
language
){

select.value =
language;

}


document.getElementById(
"drawerTitle"
).textContent =
words.contents;


document.getElementById(
"loginButton"
).textContent =
words.signIn;


document.getElementById(
"joinButton"
).textContent =
words.joinClub;


document.getElementById(
"languageLabel"
).textContent =
words.language;


document.getElementById(
"seasonText"
).textContent =
words.season;


document.getElementById(
"clubButton"
).textContent =
words.club;


renderPrimary();

renderSecondary();

renderPhotoBoard();

renderDrawer();

renderFooter();

}


/* =========================================================
DRAWER EVENTS
========================================================= */

const drawer =
document.getElementById(
"drawer"
);

const overlay =
document.getElementById(
"drawerOverlay"
);

const topbar =
document.getElementById(
"pdTopbar"
);


function openDrawer(){

topbar.classList.remove(
"hidden-by-scroll"
);

drawer.classList.add(
"open"
);

overlay.classList.add(
"open"
);

drawer.setAttribute(
"aria-hidden",
"false"
);

document.body.classList.add(
"drawer-open"
);

}


function closeDrawer(){

drawer.classList.remove(
"open"
);

overlay.classList.remove(
"open"
);

drawer.setAttribute(
"aria-hidden",
"true"
);

document.body.classList.remove(
"drawer-open"
);

}


document.getElementById(
"openDrawer"
)
.addEventListener(
"click",
openDrawer
);


document.getElementById(
"closeDrawer"
)
.addEventListener(
"click",
closeDrawer
);


overlay.addEventListener(
"click",
closeDrawer
);


/* =========================================================
FACEBOOK-STYLE HEADER HIDE / SHOW
========================================================= */

let lastScrollY =
window.scrollY;

let scrollLock =
false;


function handleScroll(){

if(scrollLock){
return;
}

scrollLock =
true;


requestAnimationFrame(
function(){

const current =
Math.max(
0,
window.scrollY
);


if(
drawer.classList.contains(
"open"
)
){

topbar.classList.remove(
"hidden-by-scroll"
);

lastScrollY =
current;

scrollLock =
false;

return;

}


if(
current <=
35
){

topbar.classList.remove(
"hidden-by-scroll"
);

}else if(
current >
lastScrollY +
6 &&
current >
120
){

topbar.classList.add(
"hidden-by-scroll"
);

}else if(
current <
lastScrollY -
5
){

topbar.classList.remove(
"hidden-by-scroll"
);

}


lastScrollY =
current;

scrollLock =
false;

}
);

}


window.addEventListener(
"scroll",
handleScroll,
{
passive:true
}
);


/* =========================================================
LANGUAGE SELECT
========================================================= */

document.getElementById(
"languageSelect"
)
.addEventListener(
"change",
function(event){

const language =
normalizeLanguage(
event.target.value
);


try{

localStorage.setItem(
LANGUAGE_KEY,
language
);

}catch(error){
}


if(
window.PetsDogueLanguage &&
typeof window.PetsDogueLanguage.setLanguage ===
"function"
){

try{

window.PetsDogueLanguage
.setLanguage(
language
);

}catch(error){
}

}


document.documentElement.lang =
language;

document.documentElement.dir =
language === "ar"
?"rtl"
:"ltr";


window.dispatchEvent(
new CustomEvent(
"petsdogue:languagechange",
{
detail:{
language
}
}
)
);


setTimeout(
applyLanguage,
20
);

}
);


/* =========================================================
OTHER LANGUAGE CHANGES
========================================================= */

window.addEventListener(
"petsdogue:languagechange",
function(){

setTimeout(
applyLanguage,
40
);

}
);


window.addEventListener(
"storage",
function(event){

if(
event.key ===
LANGUAGE_KEY
){

setTimeout(
applyLanguage,
20
);

}

}
);


/* =========================================================
KEYBOARD
========================================================= */

document.addEventListener(
"keydown",
function(event){

if(
event.key ===
"Escape"
){

closeDrawer();

}

}
);


/* =========================================================
INIT
========================================================= */

function init(){

applyLanguage();

}


if(
document.readyState ===
"loading"
){

document.addEventListener(
"DOMContentLoaded",
init,
{
once:true
}
);

}else{

init();

}

})();
</script>
