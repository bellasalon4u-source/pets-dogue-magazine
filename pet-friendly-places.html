<style>

:root{
--black:#070707;
--cream:#f4efe4;
--white:#fff;

}

*{
box-sizing:border-box;
}

html,
body{
margin:0;
background:var(--cream);
color:#111;
font-family:Arial,Helvetica,sans-serif;
}

html{
scroll-behavior:smooth;
}

body.lock{

}

button,
input,
select{

}

button{
cursor:pointer;
}

a{
color:inherit;
text-decoration:none;
}

.page{
max-width:1180px;
margin:auto;
padding:28px 26px 70px;
}

.discovery{
display:grid;
grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);
gap:28px;
}

.hero-title-row{
display:flex;
align-items:flex-start;
gap:12px;
}

.copy h1{
max-width:680px;
margin:0 0 12px;
font:400 clamp(37px,5vw,65px)/.94 Georgia,serif;
letter-spacing:-2px;
}

.copy p{
max-width:630px;
margin:0;
color:#555047;
font-size:17px;
line-height:1.48;
}

.speak-btn{
flex:0 0 44px;
width:44px;
height:44px;
border:1px solid #111;
border-radius:50%;
background:#fff;
font-size:21px;
}

.search{
position:relative;
}

.search-row{
display:grid;
grid-template-columns:1fr 62px 62px;
gap:10px;
margin-top:20px;
}

.search-box{
height:60px;
display:flex;
align-items:center;
gap:12px;
padding:0 17px;
border:1px solid var(--line);
border-radius:17px;
background:#fbf8f1;
}

.search-box input{
width:100%;
border:0;
outline:0;
background:transparent;
font-size:17px;
}

.icon-btn{
height:60px;
border:0;
border-radius:17px;
background:var(--green);
font-size:29px;
font-weight:900;
}

.icon-btn.add{
background:#111;
color:#fff;
}

.suggestions{
position:absolute;
z-index:1500;
top:67px;
left:0;
right:134px;
max-height:340px;
overflow:auto;
border:1px solid var(--line);
border-radius:16px;
background:#fff;
box-shadow:0 18px 40px rgba(0,0,0,.16);
}

.suggestion{
width:100%;
padding:13px 15px;
border:0;
border-bottom:1px solid #eee;
background:#fff;
text-align:left;
}

.suggestion strong,
.suggestion small{
display:block;
}

.suggestion small{
margin-top:3px;
color:#777;
}

.location-ok{
margin-top:9px;
color:var(--green-dark);
font-size:12px;
font-weight:900;
}

.radius{
margin-top:15px;
padding:15px 6px 9px;
border-top:1px solid var(--line);
}

.radius-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.radius-top span{
color:var(--grey);
font-size:12px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.radius-top strong{
font-size:18px;
}

.radius input{
width:100%;
margin-top:11px;

}

.map-shell{
position:relative;
margin-top:14px;
overflow:hidden;
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
}

#map{
height:250px;
}

.map-add,
.map-full{
position:absolute;
z-index:600;
border:0;
box-shadow:0 7px 20px rgba(0,0,0,.2);
}

.map-add{
top:14px;
right:14px;
min-height:38px;
padding:0 14px;
border-radius:99px;
background:#111;
color:#fff;
font-weight:900;
}

.map-full{
left:14px;
bottom:14px;
width:42px;
height:42px;
border-radius:50%;
background:#fff;
font-size:20px;
}

.categories{
display:grid;
gap:8px;
}

.cat{
min-height:51px;
width:100%;
display:flex;
align-items:center;
gap:13px;
padding:0 20px;
border:1px solid var(--line);
border-radius:999px;
background:transparent;
text-align:left;
font-weight:900;
}

.cat.active{
background:#090909;
color:#fff;
border-color:#090909;
}

.cat.saved{
background:var(--soft);
color:#173b13;
}

.cat.saved.active{
background:var(--green);
color:#071007;
}

.cat i{
width:25px;
font-style:normal;
text-align:center;
font-size:20px;
}

.cat[data-cat="veterinary"] i{
color:#e53935;
}

.results-head{
margin-top:26px;
padding-top:22px;
border-top:1px solid var(--line);
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.count{
font-size:18px;
font-weight:900;
}

.sort{
min-height:48px;
padding:0 17px;
border:1px solid var(--line);
border-radius:999px;
background:#fbf8f1;
}

.status{
min-height:28px;
margin:10px 0;
color:var(--green-dark);
font-weight:800;
}

.cards{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:16px;
}

.card{
position:relative;
min-height:410px;
overflow:hidden;
border-radius:18px;
background:#111;
box-shadow:var(--shadow);
isolation:isolate;
}

.card-bg,
.card-photo{
position:absolute;
inset:0;
width:100%;
height:100%;
}

.card-photo{
z-index:-3;
object-fit:cover;
}

.card-bg{
z-index:-4;
display:grid;
place-items:center;
overflow:hidden;
background:
radial-gradient(circle at 20% 20%,rgba(84,239,11,.34),transparent 40%),
linear-gradient(145deg,#283424,#070707 68%);
}

.card[data-category="cafe"] .card-bg{
background:
radial-gradient(circle at 20% 15%,#d79c62,transparent 43%),
linear-gradient(145deg,#552e1a,#100b09);
}

.card[data-category="restaurant"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#ca6f62,transparent 42%),
linear-gradient(145deg,#4b1919,#080505);
}

.card[data-category="pub"] .card-bg{
background:
radial-gradient(circle at 20% 15%,#d0a53d,transparent 40%),
linear-gradient(145deg,#453716,#080705);
}

.card[data-category="hotel"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#927cff,transparent 42%),
linear-gradient(145deg,#21184b,#07060a);
}

.card[data-category="park"] .card-bg,
.card[data-category="beach"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#62d8c4,transparent 42%),
linear-gradient(145deg,#153f36,#050a08);
}

.card[data-category="veterinary"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#ff6262,transparent 42%),
linear-gradient(145deg,#491414,#080505);
}

.fallback-icon{
font-size:78px;
opacity:.42;
filter:grayscale(.2);
}

.card:after{
content:"";
position:absolute;
inset:0;
z-index:-2;
background:
linear-gradient(
to bottom,
rgba(0,0,0,.03) 10%,
rgba(0,0,0,.18) 40%,
rgba(0,0,0,.96) 100%
);
}

.heart{
position:absolute;
z-index:3;
top:14px;
right:14px;
width:48px;
height:48px;
border:0;
border-radius:50%;
background:rgba(0,0,0,.62);
color:#fff;
font-size:30px;
}

.heart.on{
color:#ff5b7f;
}

.card-body{
position:absolute;
left:0;
right:0;
bottom:0;
padding:18px;
color:#fff;
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.badge{
display:inline-flex;
min-height:29px;
align-items:center;
padding:0 11px;
border-radius:99px;
background:var(--gold);
color:#111;
font-size:12px;
font-weight:900;
}

.card h2{
margin:10px 0 7px;
font:400 29px/1 Georgia,serif;
}

.address{
margin:0;
color:rgba(255,255,255,.82);
font-size:13px;
line-height:1.35;
}

.pet-row{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:7px;
margin-top:11px;
}

.pet{
display:inline-flex;
min-height:30px;
align-items:center;
padding:0 10px;
border-radius:99px;
background:var(--green);
color:#0b1e06;
font-size:11px;
font-weight:900;
}

.pet.unknown{
background:#eee;
color:#222;
}

.pet.outside{
background:var(--yellow);
color:#17120a;
}

.policy-plus{
width:30px;
height:30px;
padding:0;
border:1px solid #fff;
border-radius:50%;
background:#fff;
color:#111;
font-size:22px;
font-weight:900;
line-height:1;
}

.meta{
margin-top:9px;
font-size:11px;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px;
}

.actions button{
min-height:34px;
padding:0 12px;
border:1px solid rgba(255,255,255,.65);
border-radius:99px;
background:rgba(0,0,0,.5);
color:#fff;
font-size:10px;
font-weight:900;
}

.actions button.booking{
background:var(--gold);
border-color:var(--gold);
color:#111;
}

.empty{
grid-column:1/-1;
padding:55px 20px;
border:1px solid var(--line);
border-radius:20px;
background:#fbf8f1;
text-align:center;
}

.more{
display:block;
margin:22px auto 0;
min-height:48px;
padding:0 24px;
border:0;
border-radius:99px;
background:#111;
color:#fff;
font-weight:900;
}

.overlay{
position:fixed;
inset:0;
z-index:16000;
display:none;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(0,0,0,.72);
}

.overlay.open{
display:flex;
}

.modal{
width:min(560px,100%);
max-height:90vh;
overflow:auto;
padding:22px;
border-radius:22px;
background:var(--cream);
box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.modal-head{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start;
}

.modal h2{
margin:0;
font:400 34px/1 Georgia,serif;
}

.close{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:#111;
color:#fff;
font-size:25px;
}

.policy-grid{
display:grid;
gap:10px;
margin-top:15px;
}

.policy-choice{
display:flex;
gap:10px;
align-items:center;
padding:14px;
border:1px solid var(--line);
border-radius:14px;
background:#fff;
font-weight:800;
}

.policy-choice input{
width:22px;
height:22px;
accent-color:var(--green);
}

.policy-note{
margin:11px 0 0;
color:#68635a;
font-size:13px;
line-height:1.45;
}

.submit{
width:100%;
min-height:50px;
margin-top:16px;
border:0;
border-radius:13px;
background:var(--green);
font-weight:900;
}

.field{
margin-top:15px;
}

.field label{
display:block;
margin-bottom:7px;
font-size:12px;
font-weight:900;
text-transform:uppercase;
}

.field input,
.field select{
width:100%;
height:50px;
padding:0 13px;
border:1px solid var(--line);
border-radius:13px;
background:#fff;
}

 background:#fff!important;

 background:#fff;

 #eventDatePicker .event-time-digit{height:60px;font-size:25px}
}

.detail-photo{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
background:#111;
}

.detail-meta{
margin-top:10px;
color:#666;
}

.detail-actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:16px;
}

.detail-actions button{
min-height:42px;
padding:0 14px;
border:1px solid #111;
border-radius:99px;
background:#fff;
font-weight:900;
}

.detail-actions .dark{
background:#111;
color:#fff;
}

.route-app{
width:100%;
min-height:60px;
display:flex;
align-items:center;
gap:14px;
padding:0 20px;
border:0;
border-radius:16px;
font-size:17px;
font-weight:900;
}

.route-app+.route-app{
margin-top:12px;
}

.route-google{
background:#4285f4;
color:#fff;
}

.route-waze{
background:#33ccff;
color:#07324a;
}

.route-apple{
background:#111;
color:#fff;
}

.fullmap{
position:fixed;
inset:0;
z-index:15500;
display:none;
background:#fff;
}

.fullmap.open{
display:block;
}

#fullMap{
position:absolute;
inset:0;
}

.fullbar{
position:absolute;
z-index:800;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:calc(env(safe-area-inset-top) + 12px) 14px 20px;
background:linear-gradient(#000,transparent);
color:#fff;
font-weight:900;
}

.fullbar button{
width:44px;
height:44px;
border:0;
border-radius:50%;
background:#fff;
font-size:25px;
}

.full-locate{
position:absolute;
z-index:850;
right:18px;
bottom:calc(env(safe-area-inset-bottom) + 24px);
width:56px;
height:56px;
display:grid;
place-items:center;
border:0;
border-radius:50%;
background:#fff;
color:#111;
box-shadow:0 7px 22px rgba(0,0,0,.28);
font-size:30px;
font-weight:900;
}

.marker{
width:34px;
height:34px;
display:grid;
place-items:center;
border:3px solid #fff;
border-radius:50%;
background:var(--green);
box-shadow:0 3px 12px rgba(0,0,0,.28);
}

.userdot{
width:23px;
height:23px;
border:4px solid #fff;
border-radius:50%;
background:#2f82ef;
box-shadow:
0 0 0 8px rgba(47,130,239,.16),
0 2px 10px rgba(0,0,0,.3);
}

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .cat,
html[dir="rtl"] .suggestion{
text-align:right;
}

html[dir="rtl"] .heart{
right:auto;
left:14px;
}

@media(max-width:850px){

.page{
padding:22px 18px 55px;
}

.discovery{
grid-template-columns:minmax(0,1.45fr) minmax(190px,.8fr);
gap:15px;
}

.cards{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

}

@media(max-width:610px){.page{
padding:20px 14px 55px;
}

.discovery{
grid-template-columns:minmax(0,1.45fr) minmax(135px,.72fr);
gap:10px;
}

.copy h1{
font-size:31px;
}

.copy p{
font-size:13px;
}

.search-row{
grid-template-columns:1fr 50px;
}

.icon-btn{
height:50px;
}

.icon-btn.add{
display:none;
}

.search-box{
height:50px;
}

.cat{
min-height:40px;
padding:0 10px;
gap:7px;
font-size:11px;
}

.cat i{
width:17px;
font-size:14px;
}

#map{
height:185px;
}

.cards{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:9px;
}

.card{
min-height:355px;
}

.card-body{
padding:13px;
}

.card h2{
font-size:20px;
}

.address{
font-size:10px;
}

.badge,
.pet{
font-size:9px;
}

.actions{
gap:6px;
}

.actions button{
min-height:30px;
padding:0 9px;
font-size:9px;
}

.heart{
width:40px;
height:40px;
font-size:24px;
}

.sort{
max-width:160px;
font-size:12px;
}

.suggestions{
right:60px;
}

}

button:focus-visible,
select:focus-visible,
input:focus-visible{
outline:3px solid var(--green);
outline-offset:3px;
}


/* Event cards and preview use the same magazine card layout as places. */

.event-card .event-route{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.65);border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:900}
.event-preview-card{min-height:440px;margin:0 0 14px;border:1px solid rgba(201,151,41,.68);border-radius:20px}
.event-preview-card .card-photo{z-index:-3}
.event-preview-card .card-body{padding:20px}
.event-preview-card .event-description{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.event-preview-card .event-route{display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border:1px solid rgba(255,255,255,.75);border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-weight:900}
@media(max-width:520px){.event-preview-card{min-height:390px}.event-preview-card .card-body{padding:16px}.event-preview-card h2{font-size:27px}}
