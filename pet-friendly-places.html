<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Discover pet-friendly cafes, restaurants, hotels, parks, beaches, veterinary clinics, pet shops and animal events with PETS & DOGUE.">
<title>Pet-Friendly | PETS & DOGUE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--black:#070707;--cream:#f4efe4;--white:#fff;--gold:#c99729;--green:#54ef0b;--green-dark:#24641c;--soft:#d9f8ca;--line:#cfc7b8;--grey:#777269;--yellow:#ffd75b;--shadow:0 18px 45px rgba(0,0,0,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:#111;font-family:Arial,Helvetica,sans-serif}
body.lock{overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.page{max-width:1180px;margin:auto;padding:28px 26px 70px}
.discovery{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:28px}
.copy h1{max-width:680px;margin:0 0 12px;font:400 clamp(37px,5vw,65px)/.94 Georgia,serif;letter-spacing:-2px}
.copy p{max-width:630px;margin:0;color:#555047;font-size:17px;line-height:1.48}
.search{position:relative}
.search-row{display:grid;grid-template-columns:1fr 62px 62px;gap:10px;margin-top:20px}
.search-box{height:60px;display:flex;align-items:center;gap:12px;padding:0 17px;border:1px solid var(--line);border-radius:17px;background:#fbf8f1}
.search-box input{width:100%;border:0;outline:0;background:transparent;font-size:17px}
.icon-btn{height:60px;border:0;border-radius:17px;background:var(--green);font-size:29px;font-weight:900}
.icon-btn.add{background:#111;color:#fff}
.suggestions{position:absolute;z-index:1500;top:67px;left:0;right:134px;max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.16)}
.suggestion{width:100%;padding:13px 15px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left}
.suggestion strong,.suggestion small{display:block}
.suggestion small{margin-top:3px;color:#777}
.location-ok{margin-top:9px;color:var(--green-dark);font-size:12px;font-weight:900}
.radius{margin-top:15px;padding:15px 6px 9px;border-top:1px solid var(--line)}
.radius-top{display:flex;justify-content:space-between;align-items:center}
.radius-top span{color:var(--grey);font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.radius-top strong{font-size:18px}
.radius input{width:100%;margin-top:11px;accent-color:var(--green)}
.map-shell{position:relative;margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
#map{height:250px}
.map-add,.map-full{position:absolute;z-index:600;border:0;box-shadow:0 7px 20px rgba(0,0,0,.2)}
.map-add{top:14px;right:14px;min-height:38px;padding:0 14px;border-radius:99px;background:#111;color:#fff;font-weight:900}
.map-full{left:14px;bottom:14px;width:42px;height:42px;border-radius:50%;background:#fff;font-size:20px}
.categories{display:grid;gap:8px}
.cat{min-height:51px;width:100%;display:flex;align-items:center;gap:13px;padding:0 20px;border:1px solid var(--line);border-radius:999px;background:transparent;text-align:left;font-weight:900}
.cat.active{background:#090909;color:#fff;border-color:#090909}
.cat.saved{background:var(--soft);color:#173b13}
.cat.saved.active{background:var(--green);color:#071007}
.cat i{width:25px;font-style:normal;text-align:center;font-size:20px}
.results-head{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.count{font-size:18px;font-weight:900}
.sort{min-height:48px;padding:0 17px;border:1px solid var(--line);border-radius:999px;background:#fbf8f1}
.status{min-height:28px;margin:10px 0;color:var(--green-dark);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{position:relative;min-height:390px;overflow:hidden;border-radius:18px;background:#111;box-shadow:var(--shadow);isolation:isolate}
.card-bg,.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-bg{z-index:-4;background:linear-gradient(145deg,#1a2317,#070707)}
.card img{z-index:-3}
.card:after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(to bottom,rgba(0,0,0,.05) 15%,rgba(0,0,0,.18) 40%,rgba(0,0,0,.94) 100%)}
.heart{position:absolute;z-index:3;top:14px;right:14px;width:48px;height:48px;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:30px}
.heart.on{color:#ff5b7f}
.card-body{position:absolute;left:0;right:0;bottom:0;padding:18px;color:#fff}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{display:inline-flex;min-height:29px;align-items:center;padding:0 11px;border-radius:99px;background:var(--gold);color:#111;font-size:12px;font-weight:900}
.rating{font-size:13px;font-weight:900}
.card h2{margin:10px 0 7px;font:400 29px/1 Georgia,serif}
.address{margin:0;color:rgba(255,255,255,.82);font-size:13px;line-height:1.35}
.pet-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:11px}
.pet{display:inline-flex;min-height:29px;align-items:center;padding:0 10px;border-radius:99px;background:var(--green);color:#0b1e06;font-size:11px;font-weight:900}
.pet.unknown{background:#eee;color:#222}
.pet.terrace{background:var(--yellow)}
.pet.restrict{background:#eee;color:#222}
.meta{margin-top:9px;font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions button{min-height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.65);border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:900}
.empty{grid-column:1/-1;padding:55px 20px;border:1px solid var(--line);border-radius:20px;background:#fbf8f1;text-align:center}
.more{display:block;margin:22px auto 0;min-height:48px;padding:0 24px;border:0;border-radius:99px;background:#111;color:#fff;font-weight:900}
.overlay{position:fixed;inset:0;z-index:12000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
.overlay.open{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:22px;background:var(--cream);box-shadow:0 25px 70px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal h2{margin:0;font:400 34px/1 Georgia,serif}
.close{width:42px;height:42px;border:0;border-radius:50%;background:#111;color:#fff;font-size:25px}
.field{margin-top:15px}
.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:900;text-transform:uppercase}
.field input,.field select{width:100%;height:50px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:#fff}
.submit{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:13px;background:var(--green);font-weight:900}
.policy-grid{display:grid;gap:8px;margin-top:15px}
.policy-choice{display:flex;gap:9px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:800}
.policy-choice input{width:20px;height:20px;accent-color:var(--green)}
.detail-photo{width:100%;height:220px;object-fit:cover;border-radius:15px;background:#111}
.detail-meta{margin-top:10px;color:#666}
.detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.detail-actions button{min-height:42px;padding:0 14px;border:1px solid #111;border-radius:99px;background:#fff;font-weight:900}
.detail-actions .dark{background:#111;color:#fff}
.fullmap{position:fixed;inset:0;z-index:11000;display:none;background:#fff}
.fullmap.open{display:block}
#fullMap{position:absolute;inset:0}
.fullbar{position:absolute;z-index:800;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 14px 20px;background:linear-gradient(#000,transparent);color:#fff;font-weight:900}
.fullbar button{width:44px;height:44px;border:0;border-radius:50%;background:#fff;font-size:25px}
.marker{width:34px;height:34px;display:grid;place-items:center;border:3px solid #fff;border-radius:50%;background:var(--green);box-shadow:0 3px 12px rgba(0,0,0,.28)}
.userdot{width:23px;height:23px;border:4px solid #fff;border-radius:50%;background:#2f82ef;box-shadow:0 2px 10px rgba(0,0,0,.3)}
html[dir="rtl"] .cat,html[dir="rtl"] .suggestion{text-align:right}
html[dir="rtl"] .heart{right:auto;left:14px}
@media(max-width:850px){
.page{padding:22px 18px 55px}
.discovery{grid-template-columns:minmax(0,1.45fr) minmax(190px,.8fr);gap:15px}
.copy h1{font-size:37px}
.copy p{font-size:14px}
.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-height:360px}
}
@media(max-width:610px){
.page{padding:20px 14px 55px}
.discovery{grid-template-columns:minmax(0,1.45fr) minmax(135px,.72fr);gap:10px}
.copy h1{font-size:31px}
.copy p{font-size:13px}
.search-row{grid-template-columns:1fr 50px}
.icon-btn{height:50px}
.icon-btn.add{display:none}
.search-box{height:50px}
.categories{gap:6px}
.cat{min-height:40px;padding:0 10px;gap:7px;font-size:11px}
.cat i{width:17px;font-size:14px}
#map{height:185px}
.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.card{min-height:330px;border-radius:15px}
.card-body{padding:13px}
.card h2{font-size:20px}
.address{font-size:10px}
.badge,.pet{font-size:9px}
.meta{font-size:9px}
.actions{gap:6px}
.actions button{min-height:30px;padding:0 9px;font-size:9px}
.heart{width:40px;height:40px;font-size:24px}
.sort{max-width:160px;font-size:12px}
.count{font-size:14px}
.suggestions{right:60px}
}
</style>

function detectLang(){

let value=
"";

for(
const key of
[
"pets_dogue_language",
"petsDogueLanguage",
"pd_language",
"pd_lang",
"selectedLanguage",
"language",
"lang",
"i18nextLng"
]
){

try{

value=
localStorage.getItem(
key
) ||
"";

if(
value
){

break;

}

}catch{}

}

value=
value
.toLowerCase()
.replace(
"_",
"-"
)
.split(
"-"
)[0];

value=
aliases[
value
] ||
value;

return supported.includes(
value
)
? value
: "en";

}

)

);

)

null;

function dist(
lat1,
lng1,
lat2,
lng2
){

const radiusEarth=
6371;

const rad=
value=>
value *
Math.PI /
180;

const dLat=
rad(
lat2 -
lat1
);

const dLng=
rad(
lng2 -
lng1
);

const a=
Math.sin(
dLat /
2
) ** 2 +
Math.cos(
rad(
lat1
)
) *
Math.cos(
rad(
lat2
)
) *
Math.sin(
dLng /
2
) ** 2;

return (
radiusEarth *
2 *
Math.atan2(
Math.sqrt(
a
),
Math.sqrt(
1 -
a
)
)
);

}


function withDist(
place
){

return {

...place,

distance:
dist(
center.lat,
center.lng,
place.location.lat,
place.location.lng
)

};

}


function key(
place
){

return place.providerId
? (
"g:" +
place.providerId
)
: (
place.name
.toLowerCase()
.replace(
/\W+/g,
""
) +
"|" +
place.location.lat.toFixed(
4
) +
"|" +
place.location.lng.toFixed(
4
)
);

}


function merge(
groups
){

const map=
new Map();

groups
.flat()
.filter(
Boolean
)
.forEach(
item=>{

const place=
withDist(
item
);

const identity=
key(
place
);

if(
!map.has(
identity
)
){

map.set(
identity,
place
);

return;

}

const current=
map.get(
identity
);

const best=
photoUrl(
current
)
? current
: place;

const other=
best ===
current
? place
: current;

map.set(
identity,
{

...other,
...best,

photo:
best.photo ||
other.photo,

photos:
best.photos?.length
? best.photos
: other.photos,

rating:
best.rating ??
other.rating,

ratingCount:
Math.max(
best.ratingCount ||
0,
other.ratingCount ||
0
),

allowsDogs:
best.allowsDogs ===
true ||
other.allowsDogs ===
true
? true
: best.allowsDogs ===
false &&
other.allowsDogs ===
false
? false
: null

}
);

}
);

return [
...map.values()
]
.filter(
place=>
place.distance <=
radius +
1
)
.filter(
place=>
place.category ===
"veterinary" ||
place.category ===
"pet-shop" ||
place.allowsDogs !==
false
);

}

function osmQuery(){

const around=
`(around:${Math.round(radius * 1000)},${center.lat},${center.lng})`;

const dog=
'["dog"~"^(yes|leashed|designated)$",i]';

const queries={

cafe:[
`nwr["amenity"="cafe"]${dog}${around};`
],

restaurant:[
`nwr["amenity"="restaurant"]${dog}${around};`
],

hotel:[
`nwr["tourism"~"^(hotel|guest_house|hostel|motel)$"]${dog}${around};`
],

park:[
`nwr["leisure"="dog_park"]${around};`,
`nwr["leisure"="park"]${dog}${around};`
],

beach:[
`nwr["natural"="beach"]${dog}${around};`
],

veterinary:[
`nwr["amenity"="veterinary"]${around};`
],

"pet-shop":[
`nwr["shop"="pet"]${around};`
],

events:[
`nwr["amenity"="events_venue"]${dog}${around};`
]

};

const lines=
cat ===
"all"
? [
...queries.park,
...queries.beach,
...queries.veterinary,
...queries["pet-shop"]
]
: (
queries[
cat
] ||
[]
);

return lines.length
? `[out:json][timeout:15];(${lines.join("")});out center tags;`
: "";

}


function normOsm(
element
){

const tags=
element.tags ||
{};

const lat=
num(
element.lat ??
element.center?.lat
);

const lng=
num(
element.lon ??
element.center?.lon
);

if(
lat ===
null ||
lng ===
null
){

return null;

}

const category=
normCat(
tags.amenity ||
tags.tourism ||
tags.leisure ||
tags.natural ||
tags.shop
);

const dogValue=
String(
tags.dog ||
tags.dogs ||
""
)
.toLowerCase();

let dogs=
[
"yes",
"leashed",
"designated"
].includes(
dogValue
) ||
tags.leisure ===
"dog_park" ||
category ===
"veterinary" ||
category ===
"pet-shop"
? true
: dogValue ===
"no"
? false
: null;

return norm(
{

id:
`osm-${element.type}-${element.id}`,

name:
tags.name ||
tags.brand ||
"Pet-friendly place",

address:
[
tags["addr:housenumber"],
tags["addr:street"],
tags["addr:city"]
]
.filter(
Boolean
)
.join(
" "
),

category,

lat,
lng,

website:
tags.website ||
tags["contact:website"],

phone:
tags.phone ||
tags["contact:phone"],

allowsDogs:
dogs

},
"osm",
category
);

}


async function osm(){

const query=
osmQuery();

if(
!query
){

return [];

}

const response=
await fetch(
OVP,
{

method:
"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded;charset=UTF-8"

},

body:
new URLSearchParams({
data:query
})

}
);

if(
!response.ok
){

throw Error(
"OSM"
);

}

const data=
await response.json();

return (
data.elements ||
[]
)
.map(
normOsm
)
.filter(
Boolean
);

}


/*
=========================================================
IMPORTANT

Google cards render FIRST.

OpenStreetMap is then checked in the background.

A slow Overpass request can therefore no longer keep
the page empty while the result counter already says
that Google places have been found.
=========================================================
*/

async function search(){

limit=
12;

if(
cat ===
"saved"
){

render();

setStatus(
""
);

return;

}

setStatus(
t(
"googleSearching"
)
);

const local=
added()
.filter(
place=>
cat ===
"all" ||
place.category ===
cat
);

let googlePlaces=
[];

try{

googlePlaces=
await google();

}catch(
error
){

console.warn(
error
);

}


/*
Render immediately after Google.
*/

places=
merge(
[
googlePlaces,
local
]
);

render();


/*
Only after cards already exist do we ask OSM.
*/

setStatus(
t(
"osmSearching"
)
);

let osmPlaces=
[];

try{

osmPlaces=
await Promise.race(
[

osm(),

new Promise(
resolve=>
setTimeout(
()=>
resolve(
[]
),
7000
)
)

]
);

}catch(
error
){

console.warn(
error
);

}


/*
Merge the later OSM result without removing the
already-rendered Google cards.
*/

places=
merge(
[
googlePlaces,
osmPlaces,
local
]
);

render();

setStatus(
""
);

}

"◆ " +
(
center.label ||
t(
"locationFound"
)
);

}


function locate(){

setStatus(
t(
"locationSearching"
)
);

if(
!navigator.geolocation
){

setStatus(
t(
"locationFail"
)
);

return;

}

navigator.geolocation.getCurrentPosition(

async position=>{

center={

lat:
position.coords.latitude,

lng:
position.coords.longitude,

label:
t(
"locationFound"
)

};

locationUI();

map.setView(
[
center.lat,
center.lng
],
13
);

updateUser();

await search();

},

()=>{
setStatus(
t(
"locationFail"
)
);
},

{

enableHighAccuracy:true,

timeout:12000,

maximumAge:300000

}

);

}

async function autocomplete(
query
){

const response=
await fetch(
API,
{

method:
"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify({

action:
"autocomplete",

query,

language:
lang,

latitude:
center.lat,

longitude:
center.lng,

radius:
Math.round(
radius *
1000
),

regionCode:
"uk",

sessionToken:
"pd-" +
Date.now()

})

}
);

const data=
await response.json();

return data.suggestions ||
[];

}


async function details(
id
){

const response=
await fetch(
API,
{

method:
"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify({

action:
"details",

placeId:
id,

language:
lang,

regionCode:
"uk"

})

}
);

const data=
await response.json();

return norm(
data.place ||
{},
"google"
);

}


function addSuggest(
items
){

const box=
document.getElementById(
"addSuggestions"
);

if(
!items.length
){

box.hidden=
true;

return;

}

box.innerHTML=
items
.map(
(
item,
index
)=>
`
<button
type="button"
class="suggestion"
data-add="${index}"
>

<strong>
${esc(item.name || item.text || "")}
</strong>

<small>
${esc(item.address || item.text || "")}
</small>

</button>
`
)
.join(
""
);

box.hidden=
false;

box
.querySelectorAll(
"[data-add]"
)
.forEach(
button=>
button.onclick=
async()=>{

const place=
await details(
items[
+button.dataset.add
].placeId
);

if(
!place
){

return;

}

addGooglePlace=
place;

document.getElementById(
"addName"
).value=
place.name;

document.getElementById(
"addAddress"
).value=
place.address;

document.getElementById(
"addCategory"
).value=
[
"cafe",
"restaurant",
"hotel",
"park",
"beach",
"veterinary",
"pet-shop",
"events"
].includes(
place.category
)
? place.category
: "cafe";

box.hidden=
true;

}
);

}

document.getElementById(

).onsubmit=
event=>{

).value.trim();

const category=
document.getElementById(

).value;

const petPolicy=
document.querySelector(
'input[name="addPolicy"]:checked'
)?.value ||
"inside_outside";

if(
!name ||
!address
){

return;

}

const base=
addGooglePlace ||
{

location:{
...center
}

};

const raw={

...base,

id:
base.id ||
(
"local-" +
Date.now()
),

providerId:
base.providerId ||
"",

source:
"local",

name,
address,
category,

location:
base.location,

allowsDogs:
petPolicy ===
"restrictions"
? null
: true

};

const list=
read(
ADDED,
[]
) ||
[];

list.unshift(
raw
);

write(
ADDED,
list.slice(
0,
250
)
);

const place=
norm(
raw,
"local",
category
);

const policies=
read(
POLICY,
{}
) ||
{};

policies[
key(
place
)
] =
petPolicy;

write(
POLICY,
policies
);

closeOverlay(
"addOverlay"
);

event.target.reset();

addGooglePlace=
null;

search();

};

async function init(){

lang=
detectLang();

applyLang();

locationUI();

initMap();

bind();

/*
First search is allowed to show Google cards
without waiting for OpenStreetMap.
*/

await search();

/*
Then request the real device position.
The second search keeps the first cards visible
until the new Google result arrives.
*/

locate();

}


if(
document.readyState ===
"loading"
){

document.addEventListener(
"DOMContentLoaded",
init
);

}else{

init();

}
