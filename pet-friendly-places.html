<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Friendly Places | PETS & DOGUE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f8f7f3;color:#111}
header{background:white;border-bottom:1px solid #ddd;padding:20px;text-align:center}
.logo-small{font-size:18px;color:#b78a2e}
.logo-big{font-size:52px;font-family:Georgia,serif;font-weight:bold;color:#c89b3c;letter-spacing:4px}

.hero{height:560px;position:relative;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.18))}
.hero-content{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);text-align:center;color:white;width:90%}
.hero-content h1{font-size:70px;font-family:Georgia,serif;margin-bottom:15px}
.hero-content p{font-size:22px;line-height:1.8;max-width:900px;margin:auto}

.section{max-width:1400px;margin:auto;padding:70px 20px}
.section-title{font-size:52px;font-family:Georgia,serif;text-align:center;margin-bottom:45px}

.search-box{background:white;border:2px solid #111;border-radius:38px;padding:32px;margin-bottom:50px}
.search-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
input,select{padding:16px;border:1px solid #ccc;border-radius:999px;font-size:16px;width:100%}
button{background:#111;color:white;border:none;padding:16px 24px;border-radius:999px;font-weight:bold;cursor:pointer}

.filters{display:flex;gap:10px;overflow-x:auto;margin-bottom:35px}
.filter{white-space:nowrap;background:white;border:2px solid #111;border-radius:999px;padding:11px 18px;font-weight:bold;cursor:pointer}
.filter.active{background:#111;color:white}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:30px}
.place-card{background:white;border:2px solid #111;border-radius:35px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.08)}
.place-card img{width:100%;height:300px;object-fit:cover}
.place-content{padding:25px}
.badge{display:inline-block;background:#c89b3c;color:white;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:bold;margin-bottom:12px}
.place-content h3{font-family:Georgia,serif;font-size:32px;margin-bottom:10px}
.meta{color:#777;font-size:14px;margin-bottom:12px}
.place-content p{color:#555;line-height:1.8;margin-bottom:18px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;background:#111;color:white;text-decoration:none;padding:14px 20px;border-radius:999px;font-weight:bold;font-size:14px}
.btn.gold{background:#c89b3c}

.club{background:#111;color:white;border-radius:40px;padding:55px 30px;text-align:center;margin-top:70px}
.club h2{font-family:Georgia,serif;font-size:46px;color:#d6aa45;margin-bottom:18px}
.club p{font-size:20px;line-height:1.8;max-width:850px;margin:auto}
.benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:35px}
.benefit{background:white;color:#111;border-radius:25px;padding:24px;font-weight:bold}

footer{margin-top:70px;padding:45px 20px;background:white;text-align:center;border-top:1px solid #ddd}
.footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin-top:20px}
.footer-links a{text-decoration:none;color:#666;font-size:14px}
.admin-small{display:block;margin-top:22px;font-size:11px;color:#999;text-decoration:none;letter-spacing:2px;text-transform:uppercase}

@media(max-width:768px){
.hero{height:430px}
.hero-content h1{font-size:44px}
.hero-content p{font-size:18px}
.section-title{font-size:38px}
}
</style>
</head>

<body>

<header>
<div class="logo-small">pets &</div>
<div class="logo-big">DOGUE</div>
</header>

<section class="hero">
