<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
id="pageDescription"
name="description"
content="Find pet-friendly cafes, restaurants, pubs, hotels, parks, beaches, vets, pet shops, grooming and events near you."
>

<meta
name="robots"
content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
>

<title>
Pet-Friendly Places Near You | PETS &amp; DOGUE
</title>

<link
rel="canonical"
href="https://www.petsanddogue.com/pet-friendly-places.html"
>

<meta property="og:type" content="website">
<meta property="og:site_name" content="PETS & DOGUE">

<meta
id="ogTitle"
property="og:title"
content="Pet-Friendly Places Near You | PETS & DOGUE"
>

<meta
id="ogDescription"
property="og:description"
content="Find pet-friendly places near you."
>

<meta
property="og:url"
content="https://www.petsanddogue.com/pet-friendly-places.html"
>

<meta
property="og:image"
content="https://www.petsanddogue.com/file_00000000a9d471fda9b4629589be22a9.png"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
crossorigin=""
>

<style>

:root{
--black:#070707;
--cream:#f4efe4;
--white:#fff;
--gold:#c99729;
--green:#54ef0b;
--green-dark:#24641c;
--soft:#d9f8ca;
--line:#cfc7b8;
--grey:#777269;
--yellow:#ffd75b;
--shadow:0 18px 45px rgba(0,0,0,.10);
}

*{
box-sizing:border-box;
}

html,
body{
margin:0;
background:var(--cream);
color:#111;
font-family:Arial,Helvetica,sans-serif;
}

html{
scroll-behavior:smooth;
}

body.lock{
overflow:hidden;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

a{
color:inherit;
text-decoration:none;
}

.page{
max-width:1180px;
margin:auto;
padding:28px 26px 70px;
}

.discovery{
display:grid;
grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);
gap:28px;
}

.hero-title-row{
display:flex;
align-items:flex-start;
gap:12px;
}

.copy h1{
max-width:680px;
margin:0 0 12px;
font:400 clamp(37px,5vw,65px)/.94 Georgia,serif;
letter-spacing:-2px;
}

.copy p{
max-width:630px;
margin:0;
color:#555047;
font-size:17px;
line-height:1.48;
}

.speak-btn{
flex:0 0 44px;
width:44px;
height:44px;
border:1px solid #111;
border-radius:50%;
background:#fff;
font-size:21px;
}

.search{
position:relative;
}

.search-row{
display:grid;
grid-template-columns:1fr 62px 62px;
gap:10px;
margin-top:20px;
}

.search-box{
height:60px;
display:flex;
align-items:center;
gap:12px;
padding:0 17px;
border:1px solid var(--line);
border-radius:17px;
background:#fbf8f1;
}

.search-box input{
width:100%;
border:0;
outline:0;
background:transparent;
font-size:17px;
}

.icon-btn{
height:60px;
border:0;
border-radius:17px;
background:var(--green);
font-size:29px;
font-weight:900;
}

.icon-btn.add{
background:#111;
color:#fff;
}

.suggestions{
position:absolute;
z-index:1500;
top:67px;
left:0;
right:134px;
max-height:340px;
overflow:auto;
border:1px solid var(--line);
border-radius:16px;
background:#fff;
box-shadow:0 18px 40px rgba(0,0,0,.16);
}

.suggestion{
width:100%;
padding:13px 15px;
border:0;
border-bottom:1px solid #eee;
background:#fff;
text-align:left;
}

.suggestion strong,
.suggestion small{
display:block;
}

.suggestion small{
margin-top:3px;
color:#777;
}

.location-ok{
margin-top:9px;
color:var(--green-dark);
font-size:12px;
font-weight:900;
}

.radius{
margin-top:15px;
padding:15px 6px 9px;
border-top:1px solid var(--line);
}

.radius-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.radius-top span{
color:var(--grey);
font-size:12px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.radius-top strong{
font-size:18px;
}

.radius input{
width:100%;
margin-top:11px;
accent-color:var(--green);
}

.map-shell{
position:relative;
margin-top:14px;
overflow:hidden;
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
}

#map{
height:250px;
}

.map-add,
.map-full{
position:absolute;
z-index:600;
border:0;
box-shadow:0 7px 20px rgba(0,0,0,.2);
}

.map-add{
top:14px;
right:14px;
min-height:38px;
padding:0 14px;
border-radius:99px;
background:#111;
color:#fff;
font-weight:900;
}

.map-full{
left:14px;
bottom:14px;
width:42px;
height:42px;
border-radius:50%;
background:#fff;
font-size:20px;
}

.categories{
display:grid;
gap:8px;
}

.cat{
min-height:51px;
width:100%;
display:flex;
align-items:center;
gap:13px;
padding:0 20px;
border:1px solid var(--line);
border-radius:999px;
background:transparent;
text-align:left;
font-weight:900;
}

.cat.active{
background:#090909;
color:#fff;
border-color:#090909;
}

.cat.saved{
background:var(--soft);
color:#173b13;
}

.cat.saved.active{
background:var(--green);
color:#071007;
}

.cat i{
width:25px;
font-style:normal;
text-align:center;
font-size:20px;
}

.cat[data-cat="veterinary"] i{
color:#e53935;
}

.results-head{
margin-top:26px;
padding-top:22px;
border-top:1px solid var(--line);
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.count{
font-size:18px;
font-weight:900;
}

.sort{
min-height:48px;
padding:0 17px;
border:1px solid var(--line);
border-radius:999px;
background:#fbf8f1;
}

.status{
min-height:28px;
margin:10px 0;
color:var(--green-dark);
font-weight:800;
}

.cards{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:16px;
}

.card{
position:relative;
min-height:410px;
overflow:hidden;
border-radius:18px;
background:#111;
box-shadow:var(--shadow);
isolation:isolate;
}

.card-bg,
.card-photo{
position:absolute;
inset:0;
width:100%;
height:100%;
}

.card-photo{
z-index:-3;
object-fit:cover;
}

.card-bg{
z-index:-4;
display:grid;
place-items:center;
overflow:hidden;
background:
radial-gradient(circle at 20% 20%,rgba(84,239,11,.34),transparent 40%),
linear-gradient(145deg,#283424,#070707 68%);
}

.card[data-category="cafe"] .card-bg{
background:
radial-gradient(circle at 20% 15%,#d79c62,transparent 43%),
linear-gradient(145deg,#552e1a,#100b09);
}

.card[data-category="restaurant"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#ca6f62,transparent 42%),
linear-gradient(145deg,#4b1919,#080505);
}

.card[data-category="pub"] .card-bg{
background:
radial-gradient(circle at 20% 15%,#d0a53d,transparent 40%),
linear-gradient(145deg,#453716,#080705);
}

.card[data-category="hotel"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#927cff,transparent 42%),
linear-gradient(145deg,#21184b,#07060a);
}

.card[data-category="park"] .card-bg,
.card[data-category="beach"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#62d8c4,transparent 42%),
linear-gradient(145deg,#153f36,#050a08);
}

.card[data-category="veterinary"] .card-bg{
background:
radial-gradient(circle at 15% 15%,#ff6262,transparent 42%),
linear-gradient(145deg,#491414,#080505);
}

.fallback-icon{
font-size:78px;
opacity:.42;
filter:grayscale(.2);
}

.card:after{
content:"";
position:absolute;
inset:0;
z-index:-2;
background:
linear-gradient(
to bottom,
rgba(0,0,0,.03) 10%,
rgba(0,0,0,.18) 40%,
rgba(0,0,0,.96) 100%
);
}

.heart{
position:absolute;
z-index:3;
top:14px;
right:14px;
width:48px;
height:48px;
border:0;
border-radius:50%;
background:rgba(0,0,0,.62);
color:#fff;
font-size:30px;
}

.heart.on{
color:#ff5b7f;
}

.card-body{
position:absolute;
left:0;
right:0;
bottom:0;
padding:18px;
color:#fff;
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.badge{
display:inline-flex;
min-height:29px;
align-items:center;
padding:0 11px;
border-radius:99px;
background:var(--gold);
color:#111;
font-size:12px;
font-weight:900;
}

.card h2{
margin:10px 0 7px;
font:400 29px/1 Georgia,serif;
}

.address{
margin:0;
color:rgba(255,255,255,.82);
font-size:13px;
line-height:1.35;
}

.pet-row{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:7px;
margin-top:11px;
}

.pet{
display:inline-flex;
min-height:30px;
align-items:center;
padding:0 10px;
border-radius:99px;
background:var(--green);
color:#0b1e06;
font-size:11px;
font-weight:900;
}

.pet.unknown{
background:#eee;
color:#222;
}

.pet.outside{
background:var(--yellow);
color:#17120a;
}

.policy-plus{
width:30px;
height:30px;
padding:0;
border:1px solid #fff;
border-radius:50%;
background:#fff;
color:#111;
font-size:22px;
font-weight:900;
line-height:1;
}

.meta{
margin-top:9px;
font-size:11px;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px;
}

.actions button{
min-height:34px;
padding:0 12px;
border:1px solid rgba(255,255,255,.65);
border-radius:99px;
background:rgba(0,0,0,.5);
color:#fff;
font-size:10px;
font-weight:900;
}

.actions button.booking{
background:var(--gold);
border-color:var(--gold);
color:#111;
}

.empty{
grid-column:1/-1;
padding:55px 20px;
border:1px solid var(--line);
border-radius:20px;
background:#fbf8f1;
text-align:center;
}

.more{
display:block;
margin:22px auto 0;
min-height:48px;
padding:0 24px;
border:0;
border-radius:99px;
background:#111;
color:#fff;
font-weight:900;
}

.overlay{
position:fixed;
inset:0;
z-index:16000;
display:none;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(0,0,0,.72);
}

.overlay.open{
display:flex;
}

.modal{
width:min(560px,100%);
max-height:90vh;
overflow:auto;
padding:22px;
border-radius:22px;
background:var(--cream);
box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.modal-head{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start;
}

.modal h2{
margin:0;
font:400 34px/1 Georgia,serif;
}

.close{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:#111;
color:#fff;
font-size:25px;
}

.policy-grid{
display:grid;
gap:10px;
margin-top:15px;
}

.policy-choice{
display:flex;
gap:10px;
align-items:center;
padding:14px;
border:1px solid var(--line);
border-radius:14px;
background:#fff;
font-weight:800;
}

.policy-choice input{
width:22px;
height:22px;
accent-color:var(--green);
}

.policy-note{
margin:11px 0 0;
color:#68635a;
font-size:13px;
line-height:1.45;
}

.submit{
width:100%;
min-height:50px;
margin-top:16px;
border:0;
border-radius:13px;
background:var(--green);
font-weight:900;
}

.field{
margin-top:15px;
}

.field label{
display:block;
margin-bottom:7px;
font-size:12px;
font-weight:900;
text-transform:uppercase;
}

.field input,
.field select{
width:100%;
height:50px;
padding:0 13px;
border:1px solid var(--line);
border-radius:13px;
background:#fff;
}

.detail-photo{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
background:#111;
}

.detail-meta{
margin-top:10px;
color:#666;
}

.detail-actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:16px;
}

.detail-actions button{
min-height:42px;
padding:0 14px;
border:1px solid #111;
border-radius:99px;
background:#fff;
font-weight:900;
}

.detail-actions .dark{
background:#111;
color:#fff;
}

.route-app{
width:100%;
min-height:60px;
display:flex;
align-items:center;
gap:14px;
padding:0 20px;
border:0;
border-radius:16px;
font-size:17px;
font-weight:900;
}

.route-app+.route-app{
margin-top:12px;
}

.route-google{
background:#4285f4;
color:#fff;
}

.route-waze{
background:#33ccff;
color:#07324a;
}

.route-apple{
background:#111;
color:#fff;
}

.fullmap{
position:fixed;
inset:0;
z-index:15500;
display:none;
background:#fff;
}

.fullmap.open{
display:block;
}

#fullMap{
position:absolute;
inset:0;
}

.fullbar{
position:absolute;
z-index:800;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:calc(env(safe-area-inset-top) + 12px) 14px 20px;
background:linear-gradient(#000,transparent);
color:#fff;
font-weight:900;
}

.fullbar button{
width:44px;
height:44px;
border:0;
border-radius:50%;
background:#fff;
font-size:25px;
}

.full-locate{
position:absolute;
z-index:850;
right:18px;
bottom:calc(env(safe-area-inset-bottom) + 24px);
width:56px;
height:56px;
display:grid;
place-items:center;
border:0;
border-radius:50%;
background:#fff;
color:#111;
box-shadow:0 7px 22px rgba(0,0,0,.28);
font-size:30px;
font-weight:900;
}

.marker{
width:34px;
height:34px;
display:grid;
place-items:center;
border:3px solid #fff;
border-radius:50%;
background:var(--green);
box-shadow:0 3px 12px rgba(0,0,0,.28);
}

.userdot{
width:23px;
height:23px;
border:4px solid #fff;
border-radius:50%;
background:#2f82ef;
box-shadow:
0 0 0 8px rgba(47,130,239,.16),
0 2px 10px rgba(0,0,0,.3);
}

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .cat,
html[dir="rtl"] .suggestion{
text-align:right;
}

html[dir="rtl"] .heart{
right:auto;
left:14px;
}

@media(max-width:850px){

.page{
padding:22px 18px 55px;
}

.discovery{
grid-template-columns:minmax(0,1.45fr) minmax(190px,.8fr);
gap:15px;
}

.cards{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

}

@media(max-width:610px){

.page{
padding:20px 14px 55px;
}

.discovery{
grid-template-columns:minmax(0,1.45fr) minmax(135px,.72fr);
gap:10px;
}

.copy h1{
font-size:31px;
}

.copy p{
font-size:13px;
}

.search-row{
grid-template-columns:1fr 50px;
}

.icon-btn{
height:50px;
}

.icon-btn.add{
display:none;
}

.search-box{
height:50px;
}

.cat{
min-height:40px;
padding:0 10px;
gap:7px;
font-size:11px;
}

.cat i{
width:17px;
font-size:14px;
}

#map{
height:185px;
}

.cards{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:9px;
}

.card{
min-height:355px;
}

.card-body{
padding:13px;
}

.card h2{
font-size:20px;
}

.address{
font-size:10px;
}

.badge,
.pet{
font-size:9px;
}

.actions{
gap:6px;
}

.actions button{
min-height:30px;
padding:0 9px;
font-size:9px;
}

.heart{
width:40px;
height:40px;
font-size:24px;
}

.sort{
max-width:160px;
font-size:12px;
}

.suggestions{
right:60px;
}

}

button:focus-visible,
select:focus-visible,
input:focus-visible{
outline:3px solid var(--green);
outline-offset:3px;
}

</style>
</head>

<body>

<main class="page">

<section class="discovery">

<div>

<div class="copy">

<div class="hero-title-row">

<h1 data-t="heroTitle">
Find places that welcome your pet
</h1>

<button
id="speakPage"
class="speak-btn"
type="button"
aria-label="Read page aloud"
>
🔊
</button>

</div>

<p data-t="heroText">
Cafes, restaurants, hotels, beaches, parks, vets, pet shops and events near you.
</p>

</div>

<div class="search">

<div class="search-row">

<label class="search-box">
⌕
<input
id="locationInput"
type="search"
autocomplete="off"
data-ph="searchPlaceholder"
>
</label>

<button
class="icon-btn"
id="locBtn"
type="button"
aria-label="Use my location"
>
⊙
</button>

<button
class="icon-btn add"
id="addTop"
type="button"
>
+
</button>

</div>

<div
id="suggestions"
class="suggestions"
hidden
></div>

</div>

<div
class="location-ok"
id="locationOk"
></div>

<div class="radius">

<div class="radius-top">

<span data-t="radius">
Search radius
</span>

<strong id="radiusValue">
15 km
</strong>

</div>

<input
id="radius"
type="range"
min="1"
max="50"
value="15"
>

</div>

<div class="map-shell">

<div id="map"></div>

<button
class="map-add"
id="addMap"
data-t="addPlace"
type="button"
>
Add place
</button>

<button
class="map-full"
id="mapFull"
type="button"
aria-label="Open full map"
>
⛶
</button>

</div>

</div>

<aside class="categories">

<button class="cat active" data-cat="all"><i>✦</i><span data-t="catAll">All categories</span></button>
<button class="cat" data-cat="cafe"><i>☕</i><span data-t="catCafe">Cafes</span></button>
<button class="cat" data-cat="restaurant"><i>⌑</i><span data-t="catRestaurant">Restaurants</span></button>
<button class="cat" data-cat="pub"><i>♨</i><span data-t="catPub">Pubs</span></button>
<button class="cat" data-cat="pizzeria"><i>◉</i><span data-t="catPizzeria">Pizzerias</span></button>
<button class="cat" data-cat="hotel"><i>⌂</i><span data-t="catHotel">Hotels</span></button>
<button class="cat" data-cat="park"><i>♧</i><span data-t="catPark">Parks</span></button>
<button class="cat" data-cat="beach"><i>≈</i><span data-t="catBeach">Beaches</span></button>
<button class="cat" data-cat="veterinary"><i>✚</i><span data-t="catVet">Veterinary</span></button>
<button class="cat" data-cat="pet-shop"><i>▢</i><span data-t="catShop">Pet shops</span></button>
<button class="cat" data-cat="grooming"><i>✂</i><span data-t="catGrooming">Grooming</span></button>
<button class="cat" data-cat="events"><i>★</i><span data-t="catEvents">Events & shows</span></button>
<button class="cat saved" data-cat="saved"><i>♡</i><span data-t="catSaved">Saved</span></button>

</aside>

</section>

<section>

<div class="results-head">

<div id="count" class="count"></div>

<select id="sort" class="sort">

<option value="distance" data-t="sortNearest">
Nearest first
</option>

<option value="rating" data-t="sortRating">
Highest rated
</option>

</select>

</div>

<div id="status" class="status"></div>

<div id="cards" class="cards"></div>

<button
id="more"
class="more"
data-t="loadMore"
hidden
>
Show more places
</button>

</section>

</main><div id="policyOverlay" class="overlay">

<div class="modal">

<div class="modal-head">

<div>

<h2 data-t="petPolicy">
Pet policy
</h2>

<h3 id="policyName"></h3>

</div>

<button
class="close"
data-close="policyOverlay"
type="button"
>
×
</button>

</div>

<p class="policy-note" data-t="policyHelp">
Confirm what you know about this exact place. Your confirmation will help other PETS & DOGUE users.
</p>

<div class="policy-grid">

<label class="policy-choice">

}

}

function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function num(value){

const n=
Number(value);

return Number.isFinite(n)
?n
:null;

}

function cleanUrl(value){

try{

const url=
new URL(value);

return /^https?:$/.test(url.protocol)
?url.href
:"";

}catch{

return "";

}

}

function normCat(value){

const text=
String(value||"")
.toLowerCase();

if(text.includes("cafe"))return"cafe";
if(text.includes("restaurant"))return"restaurant";
if(text.includes("pub")||text.includes("bar"))return"pub";
if(text.includes("pizza"))return"pizzeria";
if(text.includes("hotel")||text.includes("hostel")||text.includes("guest"))return"hotel";
if(text.includes("dog_park")||text.includes("park"))return"park";
if(text.includes("beach"))return"beach";
if(text.includes("veter"))return"veterinary";
if(text.includes("pet-shop")||text==="pet"||text.includes("shop"))return"pet-shop";
if(text.includes("groom")||text.includes("service"))return"grooming";
if(text.includes("event"))return"events";

return"other";

}

function norm(raw,source="geoapify",hint=""){

if(!raw)return null;

const lat=
num(
raw.location?.lat ??
raw.lat ??
raw.latitude
);

const lng=
num(
raw.location?.lng ??
raw.lng ??
raw.longitude
);

if(lat===null||lng===null){
return null;
}

const photos=[];

[
...(Array.isArray(raw.photos)?raw.photos:[]),
raw.photo
]
.filter(Boolean)
.forEach(item=>{

const url=
typeof item==="string"
?item
:item.url;

if(
url &&
!photos.includes(url)
){

photos.push(url);

}

});

return{

id:String(
raw.id||
raw.providerId||
`${source}-${lat}-${lng}`
),

providerId:String(
raw.providerId||
raw.placeId||
raw.id||
""
),

source:
raw.source||
source,

name:String(
raw.name||
raw.displayName?.text||
raw.displayName||
"Place"
),

category:
normCat(
hint||
raw.category||
raw.primaryType||
""
),

address:String(
raw.address||
raw.formattedAddress||
""
),

location:{
lat,
lng
},

rating:
num(raw.rating),

ratingCount:
num(
raw.ratingCount??
raw.userRatingCount
)||0,

website:
cleanUrl(
raw.website||
raw.websiteUri
),

phone:String(
raw.phone||
raw.nationalPhoneNumber||
raw.internationalPhoneNumber||
""
),

googleMapsUrl:
cleanUrl(
raw.googleMapsUrl||
raw.googleMapsUri
),

photos,

photo:
photos[0]||"",

allowsDogs:
typeof raw.allowsDogs==="boolean"
?raw.allowsDogs
:null,

openNow:
typeof raw.openNow==="boolean"
?raw.openNow
:null

};

}

function dist(
lat1,
lng1,
lat2,
lng2
){

const R=6371;
const rad=x=>x*Math.PI/180;

const dLat=
rad(lat2-lat1);

const dLng=
rad(lng2-lng1);

const a=
Math.sin(dLat/2)**2+
Math.cos(rad(lat1))*
Math.cos(rad(lat2))*
Math.sin(dLng/2)**2;

return R*
2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}

function withDist(place){

return{
...place,
distance:
dist(
center.lat,
center.lng,
place.location.lat,
place.location.lng
)
};

}

function localKey(place){

return place.providerId
?"p:"+place.providerId
:`${place.name.toLowerCase().replace(/\W+/g,"")}|${place.location.lat.toFixed(4)}|${place.location.lng.toFixed(4)}`;

}

function slug(value){

return String(value||"")
.toLowerCase()
.normalize("NFKD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^\p{L}\p{N}]+/gu," ")
.trim()
.replace(/\s+/g,"-")
.slice(0,190);

}

function communityKey(place){

const name=
slug(place.name);

const address=
slug(place.address);

if(name&&address){

return(
"v1|"+
name+
"|"+
address
).slice(0,500);

}

return(
"v1|"+
name+
"|"+
Number(place.location.lat).toFixed(5)+
"|"+
Number(place.location.lng).toFixed(5)
).slice(0,500);

}

function merge(groups){

const result=
new Map();

groups
.flat()
.filter(Boolean)
.forEach(raw=>{

const place=
withDist(raw);

if(
place.allowsDogs===false
){
return;
}

const identity=
localKey(place);

const existing=
result.get(identity);

if(!existing){

result.set(
identity,
place
);

return;

}

const photoFirst=
photoFor(existing)
?existing
:place;

const other=
photoFirst===existing
?place
:existing;

result.set(
identity,
{
...other,
...photoFirst,
photo:
photoFirst.photo||
other.photo,
photos:
photoFirst.photos?.length
?photoFirst.photos
:other.photos,
website:
photoFirst.website||
other.website,
phone:
photoFirst.phone||
other.phone,
allowsDogs:
photoFirst.allowsDogs===true||
other.allowsDogs===true
?true
:null
}
);

});

return[
...result.values()
]
.filter(
place=>
place.distance<=
radius+1
);

}

function savedSet(){

return new Set(
read(SAVED,[])
);

}

function snapshots(){

return Object.values(
read(SNAPS,{})||{}
)
.map(item=>
norm(
item,
item.source||"saved",
item.category
)
)
.filter(Boolean)
.map(withDist);

}

function toggleSave(place){

const saved=
savedSet();

const snaps=
read(SNAPS,{})||{};

const identity=
localKey(place);

if(saved.has(identity)){

saved.delete(identity);
delete snaps[identity];

}else{

saved.add(identity);
snaps[identity]=place;

}

write(
SAVED,
[...saved]
);

write(
SNAPS,
snaps
);

render();

}

function communityPolicy(place){

return sharedPolicies.get(
communityKey(place)
)||null;

}

function policyInfo(place){

const shared=
communityPolicy(place);

if(shared){

if(
shared.inside &&
shared.outside
){

return{
confirmed:true,
value:"inside_outside",
text:t("insideOutside")
};

}

if(shared.inside){

return{
confirmed:true,
value:"inside",
text:t("inside")
};

}

if(shared.outside){

return{
confirmed:true,
value:"outside",
text:t("outside")
};

}

}

if(
place.allowsDogs===true
){

return{
confirmed:true,
value:"confirmed",
text:t("policyConfirmed")
};

}

return{
confirmed:false,
value:"unknown",
text:t("policyUnknown")
};

}

function current(){

let list;

if(cat==="saved"){

const all=[
...places,
...snapshots()
];

const saved=
savedSet();

list=
all
.filter(
(place,index,array)=>
array.findIndex(
candidate=>
localKey(candidate)===
localKey(place)
)===index
)
.filter(
place=>
saved.has(
localKey(place)
)
);

}else{

list=
places.filter(
place=>
cat==="all"||
place.category===cat
);

}

const mode=
document
.getElementById("sort")
?.value||
"distance";

list.sort((a,b)=>{

const ap=
policyInfo(a);

const bp=
policyInfo(b);

if(
ap.confirmed!==
bp.confirmed
){

return ap.confirmed
?-1
:1;

}

if(mode==="rating"){

const difference=
(b.rating||0)-
(a.rating||0);

if(difference){
return difference;
}

}

return(
(a.distance??999999)-
(b.distance??999999)
);

});

return list;

}

function photoCache(){

return read(
PHOTO_CACHE,
{}
)||{};

}

function photoFor(place){

const identity=
communityKey(place);

return(
place.photo||
place.photos?.[0]||
photoMemory.get(identity)||
photoCache()[identity]||
""
);

}

async function loadPhoto(place){

const identity=
communityKey(place);

if(
photoFor(place)||
photoTried.has(identity)
){
return;
}

photoTried.add(identity);

try{

const response=
await fetch(
API,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:
JSON.stringify({
action:"photo",
name:place.name,
address:place.address
})
}
);

const data=
await response.json();

if(
response.ok &&
data.photo
){

photoMemory.set(
identity,
data.photo
);

const cache=
photoCache();

cache[identity]=
data.photo;

const entries=
Object.entries(cache)
.slice(-250);

write(
PHOTO_CACHE,
Object.fromEntries(entries)
);

render();

}

}catch(error){

console.warn(
"Photo fallback:",
error
);

}

}

function hydratePhotos(list){

list
.filter(place=>!photoFor(place))
.slice(0,8)
.forEach((place,index)=>{

setTimeout(
()=>loadPhoto(place),
index*250
);

});

async function providerSearch(){

if(cat==="saved"){
return[];
}

const response=
await fetch(
API,
{
method:"POST",
headers:{
"Content-Type":"application/json",
Accept:"application/json"
},
body:
JSON.stringify({
latitude:center.lat,
longitude:center.lng,
radius:
Math.round(
radius*1000
),
category:cat,
maxResults:60,
language:lang
})
}
);

const data=
await response.json()
.catch(()=>({}));

if(
!response.ok||
data.ok!==true
){

throw Error(
data.error||
"Search error"
);

}

return(
data.places||
[]
)
.map(place=>
norm(
place,
place.source||
"geoapify",
cat==="all"
?""
:cat
)
)
.filter(Boolean);

}

function osmQuery(){

const around=
`(around:${Math.round(radius*1000)},${center.lat},${center.lng})`;

const dog=
'["dog"~"^(yes|leashed|designated|permissive|outside|limited|conditional)$",i]';

const q={

cafe:[
`nwr["amenity"="cafe"]${dog}${around};`
],

restaurant:[
`nwr["amenity"="restaurant"]${dog}${around};`
],

pub:[
`nwr["amenity"="pub"]${dog}${around};`,
`nwr["amenity"="bar"]${dog}${around};`
],

pizzeria:[
`nwr["amenity"="restaurant"]["cuisine"~"pizza",i]${dog}${around};`
],

hotel:[
`nwr["tourism"~"^(hotel|guest_house|hostel|motel|apartment|camp_site|caravan_site)$"]${dog}${around};`
],

park:[
`nwr["leisure"="dog_park"]${around};`,
`nwr["leisure"="park"]${dog}${around};`
],

beach:[
`nwr["natural"="beach"]${dog}${around};`
],

veterinary:[
`nwr["amenity"="veterinary"]${around};`
],

"pet-shop":[
`nwr["shop"="pet"]${around};`
],

grooming:[
`nwr["shop"="pet_grooming"]${around};`
],

events:[
`nwr["amenity"="events_venue"]${dog}${around};`
]

};

const lines=
cat==="all"
?Object.values(q).flat()
:(q[cat]||[]);

return lines.length
?`[out:json][timeout:16];(${lines.join("")});out center tags;`
:"";

}

function normOsm(element){

const tags=
element.tags||
{};

const lat=
num(
element.lat??
element.center?.lat
);

const lng=
num(
element.lon??
element.center?.lon
);

if(
lat===null||
lng===null
){
return null;
}

let category=
normCat(
tags.amenity||
tags.tourism||
tags.leisure||
tags.natural||
tags.shop
);

if(
String(tags.cuisine||"")
.toLowerCase()
.includes("pizza")
){
category="pizzeria";
}

if(
tags.amenity==="pub"||
tags.amenity==="bar"
){
category="pub";
}

if(
tags.shop==="pet_grooming"
){
category="grooming";
}

const dog=
String(
tags.dog||
tags.dogs||
""
)
.toLowerCase();

const allowsDogs=
[
"yes",
"leashed",
"designated",
"permissive",
"outside",
"limited",
"conditional"
]
.includes(dog)
||
tags.leisure==="dog_park"
||
["veterinary","pet-shop","grooming"]
.includes(category)
?true
:dog==="no"
?false
:null;

return norm(
{
providerId:
`osm-${element.type}-${element.id}`,
name:
tags.name||
tags.brand||
"Pet-friendly place",
address:[
tags["addr:housenumber"],
tags["addr:street"],
tags["addr:city"],
tags["addr:postcode"]
]
.filter(Boolean)
.join(" "),
category,
lat,
lng,
website:
tags.website||
tags["contact:website"],
phone:
tags.phone||
tags["contact:phone"],
photo:
tags.image||
tags.wikimedia_commons||
"",
allowsDogs
},
"osm",
category
);

}

async function osm(){

const query=
osmQuery();

if(!query){
return[];
}

const response=
await fetch(
OVP,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded;charset=UTF-8"
},
body:
new URLSearchParams({
data:query
})
}
);

if(!response.ok){
throw Error(
"OpenStreetMap error"
);
}

const data=
await response.json();

return(
data.elements||
[]
)
.map(normOsm)
.filter(Boolean);

}

function locate(
recenter=true
){

setStatus(
t("locationSearching")
);

if(
!navigator.geolocation
){

setStatus(
t("locationFail")
);

return Promise.resolve(false);

}

return new Promise(resolve=>{

navigator.geolocation
.getCurrentPosition(

async position=>{

userPosition={
lat:
position.coords.latitude,
lng:
position.coords.longitude
};

drawUser();

if(recenter){

center={
...userPosition,
label:
t("locationFound")
};

map.setView(
[
center.lat,
center.lng
],
14
);

locationUI();

await search();

}

setStatus("");
resolve(true);

},

()=>{

setStatus(
t("locationFail")
);

resolve(false);

},

{
enableHighAccuracy:true,
timeout:12000,
maximumAge:10000
}

);

});

}
