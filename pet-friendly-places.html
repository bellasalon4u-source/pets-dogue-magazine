<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
  name="description"
  content="Discover verified pet-friendly cafes, restaurants, hotels, parks, beaches, veterinary clinics, pet shops and animal events with PETS & DOGUE."
>

<title>Pet-Friendly | PETS & DOGUE</title>

<script>
(function(){
  "use strict";

  const aliases = {
    ua:"uk",
    cz:"cs",
    gr:"el",
    se:"sv",
    dk:"da"
  };

  const supported = new Set([
    "en",
    "uk",
    "ru",
    "fr",
    "de",
    "es",
    "it",
    "pt",
    "nl",
    "pl",
    "cs",
    "sk",
    "hu",
    "ro",
    "bg",
    "el",
    "sv",
    "da",
    "no",
    "fi",
    "tr",
    "ar",
    "hi"
  ]);

  let language = "";

  try{

    language = String(
      localStorage.getItem(
        "pets_dogue_language"
      ) || ""
    )
      .trim()
      .toLowerCase()
      .replace("_","-")
      .split("-")[0];

    language =
      aliases[language] ||
      language;

  }catch{}

  if(
    !supported.has(
      language
    )
  ){

    language =
      "en";

  }

  document.documentElement.lang =
    language;

  document.documentElement.dir =
    language === "ar"
      ? "rtl"
      : "ltr";

})();
</script>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<style>
:root{
  --black:#070707;
  --black2:#111;
  --cream:#f4efe4;
  --cream2:#ebe4d6;
  --white:#fff;
  --ink:#111;
  --grey:#777269;
  --line:#cfc7b8;
  --green:#54ef0b;
  --green-dark:#24641c;
  --green-soft:#d9f8ca;
  --gold:#c99729;
  --gold-light:#e5c66f;
  --gold-soft:#f5e5ad;
  --shadow:0 18px 45px rgba(0,0,0,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  display:block;
  width:100%;
}

[hidden]{
  display:none!important;
}

/* =========================================================
   PAGE
========================================================= */

.page{
  max-width:1180px;
  margin:0 auto;
  padding:28px 26px 70px;
}

/* =========================================================
   DISCOVERY / SEARCH
========================================================= */

.discovery{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);
  gap:28px;
  align-items:start;
  margin-bottom:30px;
}

.discovery-main{
  min-width:0;
}

.discovery-copy{
  margin-bottom:18px;
}

.discovery-copy h1{
  max-width:680px;
  margin:0 0 10px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(37px,5vw,65px);
  font-weight:400;
  line-height:.94;
  letter-spacing:-2px;
}

.discovery-copy p{
  max-width:630px;
  margin:0;
  color:#3d3b37;
  font-size:17px;
  line-height:1.48;
}

.search-area{
  position:relative;
}

.search-row{
  display:grid;
  grid-template-columns:1fr 62px 62px;
  gap:10px;
  margin-top:20px;
}

.search-field{
  min-width:0;
  height:60px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 17px;
  border:1px solid var(--line);
  border-radius:17px;
  background:#fbf8f1;
  transition:.18s ease;
}

.search-field.selected{
  border-color:var(--gold);
  box-shadow:
    inset 0 0 0 2px rgba(201,151,41,.28),
    0 8px 20px rgba(201,151,41,.10);
}

.search-field svg{
  flex:0 0 auto;
}

.search-field input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#111;
  font-size:17px;
}

.location-confirm{
  display:none;
  align-items:center;
  gap:7px;
  margin-top:8px;
  color:#8b6518;
  font-size:12px;
  font-weight:900;
}

.location-confirm.visible{
  display:flex;
}

.location-suggestions{
  position:absolute;
  z-index:900;
  top:66px;
  left:0;
  right:134px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  box-shadow:0 18px 40px rgba(0,0,0,.16);
  overflow:hidden;
}

.location-suggestion{
  width:100%;
  border:0;
  border-bottom:1px solid #eee9de;
  background:#fff;
  padding:13px 15px;
  display:flex;
  align-items:flex-start;
  gap:11px;
  text-align:left;
}

.location-suggestion:last-child{
  border-bottom:0;
}

.location-suggestion:hover{
  background:#faf6ed;
}

.location-suggestion strong{
  display:block;
  font-size:14px;
  line-height:1.2;
}

.location-suggestion small{
  display:block;
  margin-top:3px;
  color:#777;
  font-size:11px;
  line-height:1.3;
}

.suggestion-pin{
  color:var(--gold);
  font-size:18px;
  line-height:1;
}

.icon-action{
  height:60px;
  border:0;
  border-radius:17px;
  background:var(--green);
  color:#050505;
  display:grid;
  place-items:center;
  font-size:29px;
  font-weight:900;
}

.icon-action.add{
  background:#111;
  color:#fff;
}

.radius-block{
  margin-top:13px;
  padding:13px 6px 10px;
  border-top:1px solid var(--line);
}

.radius-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:8px;
}

.radius-label{
  font-size:12px;
  font-weight:900;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.radius-value{
  font-size:18px;
  font-weight:900;
}

.radius-slider{
  width:100%;
  appearance:none;
  height:4px;
  background:#bdb6aa;
  border-radius:99px;
  outline:none;
}

.radius-slider::-webkit-slider-thumb{
  appearance:none;
  width:23px;
  height:23px;
  border-radius:50%;
  background:var(--green);
  border:0;
  box-shadow:0 3px 12px rgba(84,239,11,.28);
}

.radius-slider::-moz-range-thumb{
  width:23px;
  height:23px;
  border-radius:50%;
  background:var(--green);
  border:0;
}

/* =========================================================
   MAP
========================================================= */

.map-shell{
  position:relative;
  margin-top:14px;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#dfe4dd;
  box-shadow:var(--shadow);
}

#map{
  width:100%;
  height:250px;
}

.map-badge{
  position:absolute;
  z-index:500;
  left:14px;
  bottom:14px;
  min-height:32px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  border-radius:99px;
  background:rgba(0,0,0,.83);
  color:#fff;
  font-weight:900;
  font-size:11px;
  letter-spacing:1px;
}

.map-badge-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
}

.add-map-btn{
  position:absolute;
  z-index:500;
  right:14px;
  top:14px;
  min-height:38px;
  border:0;
  border-radius:99px;
  padding:0 14px;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:900;
  box-shadow:0 7px 20px rgba(0,0,0,.20);
}

/* =========================================================
   CATEGORIES
========================================================= */

.category-panel{
  display:grid;
  gap:8px;
}

.category-button{
  min-height:51px;
  width:100%;
  border:1px solid var(--line);
  border-radius:999px;
  background:transparent;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  font-weight:900;
  color:#111;
  transition:.16s ease;
}

.category-button:hover{
  transform:translateY(-1px);
}

.category-button.active{
  background:#090909;
  color:#fff;
  border-color:#090909;
}

.category-button.saved{
  background:var(--green-soft);
  color:#173b13;
}

.category-button.saved.active{
  background:var(--green);
  color:#071007;
}

.category-icon{
  width:25px;
  text-align:center;
  font-size:20px;
}

/* =========================================================
   RESULTS
========================================================= */

.results-head{
  border-top:1px solid var(--line);
  padding-top:22px;
  margin-top:24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.results-count{
  font-size:18px;
  font-weight:900;
}

.sort-select{
  min-height:42px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#f9f5ec;
  padding:0 14px;
  outline:0;
}

.status-line{
  min-height:28px;
  margin:10px 0 5px;
  color:var(--green-dark);
  font-size:14px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  margin-top:10px;
}

.place-card{
  position:relative;
  min-height:365px;
  border-radius:18px;
  overflow:hidden;
  background:#141414;
  box-shadow:var(--shadow);
  isolation:isolate;
}

.card-photo,
.card-photo-fallback{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.card-photo{
  object-fit:cover;
  z-index:-3;
}

.card-photo-fallback{
  z-index:-4;
  background:
    radial-gradient(
      circle at 25% 20%,
      rgba(84,239,11,.20),
      transparent 35%
    ),
    linear-gradient(
      150deg,
      #101710,
      #181818 54%,
      #080808
    );
}

.place-card:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05) 14%,
      rgba(0,0,0,.18) 42%,
      rgba(0,0,0,.92) 100%
    );
}

.card-heart{
  position:absolute;
  top:13px;
  right:13px;
  z-index:5;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  line-height:1;
  backdrop-filter:blur(8px);
}

.card-heart.saved{
  color:#ff527d;
  background:rgba(0,0,0,.72);
}

.card-content{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:2;
  padding:20px;
  color:#fff;
}

.card-topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.card-category{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:0 11px;
  border-radius:999px;
  background:rgba(201,151,41,.94);
  color:#111;
  font-size:12px;
  font-weight:900;
}

.card-rating{
  font-size:13px;
  font-weight:900;
}

.card-title{
  margin:0 0 7px;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  font-weight:400;
  line-height:1.02;
}

.card-address{
  margin:0;
  color:rgba(255,255,255,.82);
  font-size:13px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-status{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
  font-size:12px;
}

.pet-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:29px;
  padding:0 10px;
  border:0;
  border-radius:99px;
  background:rgba(84,239,11,.94);
  color:#092006;
  font-size:11px;
  font-weight:900;
}

.pet-badge.policy-terrace{
  background:#f3bd24;
  color:#111;
}

.pet-badge.policy-garden{
  background:#b9ef78;
  color:#10220a;
}

.pet-badge.policy-restrictions{
  background:#fff;
  color:#111;
}

.pet-policy-note{
  margin-top:7px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:10px;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:11px;
  line-height:1.3;
  backdrop-filter:blur(8px);
}

.card-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-top:9px;
  color:#fff;
  font-size:12px;
}

.card-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:11px;
}

.card-actions a,
.card-actions button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:0 12px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:999px;
  background:rgba(0,0,0,.48);
  color:#fff;
  font-size:11px;
  font-weight:900;
  backdrop-filter:blur(8px);
}

.card-actions .pet-rules-action{
  border-color:rgba(84,239,11,.86);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  grid-column:1/-1;
  padding:50px 25px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fbf8f2;
  text-align:center;
}

.empty h3{
  margin:0 0 10px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px;
  font-weight:400;
}

.empty p{
  margin:0 auto;
  max-width:520px;
  color:var(--grey);
  line-height:1.45;
}

/* =========================================================
   LOAD MORE
========================================================= */

.load-more-wrap{
  text-align:center;
  margin-top:22px;
}

.load-more{
  min-height:49px;
  min-width:240px;
  border:0;
  border-radius:999px;
  background:#090909;
  color:#fff;
  font-weight:900;
}

/* =========================================================
   MODALS
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:9500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.72);
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  background:var(--cream);
  padding:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.modal-title{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;
  font-weight:400;
}

.modal-close{
  flex:0 0 auto;
  width:43px;
  height:43px;
  border:1px solid #111;
  border-radius:50%;
  background:#fff;
  font-size:24px;
}

.form-field{
  margin-top:14px;
}

.form-field label,
.form-label{
  display:block;
  margin-bottom:7px;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}

.form-field input,
.form-field select,
.form-field textarea{
  width:100%;
  min-height:50px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:12px 13px;
  outline:0;
}

.form-field textarea{
  min-height:90px;
  resize:vertical;
}

.place-summary{
  margin-top:14px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
}

.place-summary strong{
  display:block;
  font-family:Georgia,"Times New Roman",serif;
  font-size:22px;
  line-height:1.1;
}

.place-summary small{
  display:block;
  margin-top:5px;
  color:#6f6b63;
  line-height:1.35;
}

.policy-options{
  display:grid;
  gap:8px;
  margin-top:9px;
}

.policy-option{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  min-height:52px;
  padding:10px 13px;
  border:1.5px solid var(--line);
  border-radius:14px;
  background:#fff;
  cursor:pointer;
}

.policy-option:has(input:checked){
  border-color:#111;
  box-shadow:inset 0 0 0 1px #111;
}

.policy-option input{
  flex:0 0 auto;
  width:19px;
  height:19px;
  accent-color:#111;
}

.policy-option-icon{
  flex:0 0 auto;
  width:28px;
  text-align:center;
  font-size:22px;
}

.policy-option-text{
  min-width:0;
  font-size:14px;
  font-weight:900;
}

.modal-location{
  margin-top:14px;
  width:100%;
  min-height:48px;
  border:0;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-weight:900;
}

.modal-submit{
  margin-top:17px;
  width:100%;
  min-height:54px;
  border:0;
  border-radius:14px;
  background:var(--green);
  color:#080808;
  font-weight:900;
}

.modal-secondary{
  margin-top:9px;
  width:100%;
  min-height:48px;
  border:1px solid #111;
  border-radius:14px;
  background:#fff;
  color:#111;
  font-weight:900;
}

/* =========================================================
   MAP MARKERS
========================================================= */

.pd-marker{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--green);
  border:3px solid #fff;
  box-shadow:0 3px 12px rgba(0,0,0,.28);
  font-size:17px;
}

.pd-user-marker{
  width:23px;
  height:23px;
  border-radius:50%;
  background:#2f82ef;
  border:4px solid #fff;
  box-shadow:0 2px 10px rgba(0,0,0,.30);
}

/* =========================================================
   RTL
========================================================= */

html[dir="rtl"] .category-button,
html[dir="rtl"] .location-suggestion{
  text-align:right;
}

html[dir="rtl"] .card-heart{
  right:auto;
  left:13px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

  .page{
    padding:22px 18px 55px;
  }

  .discovery{
    grid-template-columns:minmax(0,1.45fr) minmax(190px,.8fr);
    gap:15px;
  }

  .discovery-copy h1{
    font-size:37px;
    letter-spacing:-1.5px;
  }

  .discovery-copy p{
    font-size:14px;
  }

  .search-row{
    grid-template-columns:1fr 54px 54px;
  }

  .search-field,
  .icon-action{
    height:54px;
  }

  .location-suggestions{
    top:60px;
    right:118px;
  }

  .category-button{
    min-height:44px;
    padding:0 14px;
    font-size:13px;
  }

  .category-icon{
    width:20px;
    font-size:17px;
  }

  #map{
    height:205px;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .place-card{
    min-height:330px;
  }

  .card-title{
    font-size:24px;
  }

}

@media(max-width:610px){

  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .discovery{
    grid-template-columns:minmax(0,1.45fr) minmax(135px,.72fr);
    gap:10px;
  }

  .discovery-copy h1{
    font-size:31px;
  }

  .discovery-copy p{
    font-size:13px;
  }

  .search-row{
    grid-template-columns:1fr 48px;
  }

  .icon-action{
    height:50px;
    border-radius:14px;
  }

  .icon-action.add{
    display:none;
  }

  .search-field{
    height:50px;
    border-radius:14px;
  }

  .search-field input{
    font-size:14px;
  }

  .location-suggestions{
    top:56px;
    right:58px;
  }

  .radius-top{
    margin-bottom:4px;
  }

  .radius-label{
    font-size:10px;
  }

  .radius-value{
    font-size:15px;
  }

  #map{
    height:175px;
  }

  .map-badge{
    display:none;
  }

  .add-map-btn{
    min-height:32px;
    padding:0 10px;
    font-size:10px;
  }

  .category-panel{
    gap:6px;
  }

  .category-button{
    min-height:39px;
    padding:0 10px;
    gap:7px;
    font-size:11px;
  }

  .category-icon{
    width:16px;
    font-size:14px;
  }

  .results-head{
    padding-top:17px;
  }

  .results-count{
    font-size:14px;
  }

  .sort-select{
    max-width:155px;
    font-size:12px;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .place-card{
    min-height:285px;
    border-radius:14px;
  }

  .card-content{
    padding:13px;
  }

  .card-category{
    min-height:23px;
    padding:0 8px;
    font-size:9px;
  }

  .card-rating{
    font-size:10px;
  }

  .card-title{
    font-size:18px;
    margin-bottom:5px;
  }

  .card-address{
    font-size:10px;
  }

  .card-status{
    margin-top:7px;
  }

  .pet-badge{
    min-height:24px;
    padding:0 7px;
    font-size:9px;
  }

  .pet-policy-note{
    padding:6px 7px;
    font-size:9px;
  }

  .card-meta{
    margin-top:6px;
    font-size:9px;
    gap:5px;
  }

  .card-actions{
    margin-top:7px;
  }

  .card-actions a,
  .card-actions button{
    min-height:29px;
    padding:0 8px;
    font-size:9px;
  }

  .card-heart{
    width:37px;
    height:37px;
    font-size:23px;
    top:9px;
    right:9px;
  }

  .modal{
    padding:18px;
  }

  .modal-title{
    font-size:27px;
  }

}

@media(max-width:430px){

  .discovery{
    grid-template-columns:1fr 126px;
  }

  .discovery-copy h1{
    font-size:28px;
  }

  .category-button{
    padding:0 8px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .place-card{
    min-height:275px;
  }

}

/* =========================================================
   ACCESSIBILITY
========================================================= */

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:3px solid var(--green);
  outline-offset:2px;
}

<body>

<main class="page">

  <section class="discovery">

    <div class="discovery-main">

      <div class="discovery-copy">

        <h1 data-i18n="heroTitle">
          Find places that welcome your pet
        </h1>

        <p data-i18n="heroText">
          Cafes, restaurants, hotels, beaches, parks, veterinary clinics,
          pet shops and animal events near you.
        </p>

      </div>

      <div class="search-area">

        <div class="search-row">

          <label
            class="search-field"
            id="searchField"
          >

            <svg
              width="21"
              height="21"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="11"
                cy="11"
                r="6"
                stroke="currentColor"
                stroke-width="2"
              />

              <path
                d="M16 16L21 21"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>

            <input
              id="locationInput"
              type="search"
              autocomplete="off"
              data-i18n-placeholder="searchPlaceholder"
              placeholder="City, postcode or area"
            >

          </label>

          <button
            class="icon-action"
            id="locationBtn"
            type="button"
            aria-label="Use my location"
            title="Use my location"
          >
            ⊙
          </button>

          <button
            class="icon-action add"
            id="topAddBtn"
            type="button"
            aria-label="Add place"
            title="Add place"
          >
            +
          </button>

        </div>

        <div
          class="location-suggestions"
          id="locationSuggestions"
          hidden
        ></div>

      </div>

      <div
        class="location-confirm"
        id="locationConfirm"
      >
        <span>◆</span>
        <span id="locationConfirmText"></span>
      </div>

      <div class="radius-block">

        <div class="radius-top">

          <span
            class="radius-label"
            data-i18n="radius"
          >
            Search radius
          </span>

          <strong
            class="radius-value"
            id="radiusValue"
          >
            15 km
          </strong>

        </div>

        <input
          class="radius-slider"
          id="radiusSlider"
          type="range"
          min="1"
          max="25"
          value="15"
          step="1"
        >

      </div>

      <div class="map-shell">

        <div id="map"></div>

        <div class="map-badge">

          <span class="map-badge-dot"></span>

          <span data-i18n="verifiedMap">
            Verified places
          </span>

        </div>

        <button
          class="add-map-btn"
          id="mapAddBtn"
          type="button"
        >
          +
          <span data-i18n="addPlaceShort">
            Add place
          </span>
        </button>

      </div>

    </div>

    <aside class="category-panel">

      <button
        class="category-button active"
        type="button"
        data-category="all"
      >
        <span class="category-icon">⌘</span>
        <span data-i18n="catAll">All categories</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="cafe"
      >
        <span class="category-icon">☕</span>
        <span data-i18n="catCafe">Cafes</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="restaurant"
      >
        <span class="category-icon">◉</span>
        <span data-i18n="catRestaurant">Restaurants</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="hotel"
      >
        <span class="category-icon">▱</span>
        <span data-i18n="catHotel">Hotels</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="park"
      >
        <span class="category-icon">♧</span>
        <span data-i18n="catPark">Parks</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="beach"
      >
        <span class="category-icon">≈</span>
        <span data-i18n="catBeach">Beaches</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="veterinary"
      >
        <span class="category-icon">✚</span>
        <span data-i18n="catVet">Veterinary</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="pet-shop"
      >
        <span class="category-icon">▢</span>
        <span data-i18n="catShop">Pet shops</span>
      </button>

      <button
        class="category-button"
        type="button"
        data-category="events"
      >
        <span class="category-icon">★</span>
        <span data-i18n="catEvents">Events & shows</span>
      </button>

      <button
        class="category-button saved"
        type="button"
        data-category="saved"
      >
        <span class="category-icon">♡</span>
        <span data-i18n="catSaved">Saved</span>
      </button>

    </aside>

  </section>

  <section>

    <div class="results-head">

      <div
        class="results-count"
        id="resultsCount"
      >
        Found: 0
      </div>

      <select
        class="sort-select"
        id="sortSelect"
      >

        <option
          value="distance"
          data-i18n="sortNearest"
        >
          Nearest first
        </option>

        <option
          value="rating"
          data-i18n="sortRating"
        >
          Highest rated
        </option>

      </select>

    </div>

    <div
      class="status-line"
      id="statusLine"
    ></div>

    <div
      class="cards"
      id="cards"
    ></div>

    <div
      class="load-more-wrap"
      id="loadMoreWrap"
      hidden
    >

      <button
        class="load-more"
        id="loadMoreBtn"
        type="button"
        data-i18n="loadMore"
      >
        Show more places
      </button>

    </div>

  </section>

</main><!-- =======================================================
     ADD NEW PLACE
======================================================= -->

<div
  class="modal-backdrop"
  id="addModal"
>
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="addPlaceTitle"
  >

    <div class="modal-head">

      <h2
        class="modal-title"
        id="addPlaceTitle"
        data-i18n="addPlaceTitle"
      >
        Add a pet-friendly place
      </h2>

      <button
        class="modal-close"
        id="modalClose"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

    </div>

    <form id="addPlaceForm">

      <div class="form-field">

        <label
          for="addName"
          data-i18n="placeName"
        >
          Place name
        </label>

        <input
          id="addName"
          autocomplete="organization"
          required
        >

      </div>

      <div class="form-field">

        <label
          for="addCategory"
          data-i18n="category"
        >
          Category
        </label>

        <select id="addCategory">

          <option
            value="cafe"
            data-i18n="catCafe"
          >
            Cafes
          </option>

          <option
            value="restaurant"
            data-i18n="catRestaurant"
          >
            Restaurants
          </option>

          <option
            value="hotel"
            data-i18n="catHotel"
          >
            Hotels
          </option>

          <option
            value="park"
            data-i18n="catPark"
          >
            Parks
          </option>

          <option
            value="beach"
            data-i18n="catBeach"
          >
            Beaches
          </option>

          <option
            value="veterinary"
            data-i18n="catVet"
          >
            Veterinary
          </option>

          <option
            value="pet-shop"
            data-i18n="catShop"
          >
            Pet shops
          </option>

          <option
            value="events"
            data-i18n="catEvents"
          >
            Events & shows
          </option>

        </select>

      </div>

      <div class="form-field">

        <label
          for="addAddress"
          data-i18n="address"
        >
          Address
        </label>

        <input
          id="addAddress"
          autocomplete="street-address"
        >

      </div>

      <div class="form-field">

        <span
          class="form-label"
          data-policy-i18n="whereAllowed"
        >
          Where are pets allowed?
        </span>

        <div class="policy-options">

          <label class="policy-option">

            <input
              type="radio"
              name="addPetAccess"
              value="inside_outside"
            >

            <span class="policy-option-icon">
              ✓
            </span>

            <span
              class="policy-option-text"
              data-policy-i18n="insideOutside"
            >
              Inside & outside
            </span>

          </label>

          <label class="policy-option">

            <input
              type="radio"
              name="addPetAccess"
              value="terrace"
            >

            <span class="policy-option-icon">
              ☀
            </span>

            <span
              class="policy-option-text"
              data-policy-i18n="terraceOnly"
            >
              Terrace / outside only
            </span>

          </label>

          <label class="policy-option">

            <input
              type="radio"
              name="addPetAccess"
              value="garden"
            >

            <span class="policy-option-icon">
              🌿
            </span>

            <span
              class="policy-option-text"
              data-policy-i18n="gardenOnly"
            >
              Garden only
            </span>

          </label>

          <label class="policy-option">

            <input
              type="radio"
              name="addPetAccess"
              value="restrictions"
            >

            <span class="policy-option-icon">
              i
            </span>

            <span
              class="policy-option-text"
              data-policy-i18n="restrictions"
            >
              Restrictions / ask venue
            </span>

          </label>

        </div>

      </div>

      <div class="form-field">

        <label
          for="addNote"
          data-policy-i18n="shortNote"
        >
          Short note — optional
        </label>

        <textarea
          id="addNote"
          data-policy-i18n-placeholder="notePlaceholder"
          placeholder="Example: Dogs are allowed on the terrace only."
        ></textarea>

      </div>

      <button
        class="modal-location"
        id="modalLocationBtn"
        type="button"
        data-i18n="useLocation"
      >
        Use my current location
      </button>

      <button
        class="modal-submit"
        type="submit"
        data-i18n="savePlace"
      >
        Save place
      </button>

    </form>

  </div>
</div>

            </span>

              value="terrace"
            >

            </span>

            <span
              class="policy-option-text"

            </span>

          </label>

          <label class="policy-option">

            <input

            >

            </span>

            <span

            >

            </span>

          </label>

          <label class="policy-option">

            <input

              value="restrictions"
            >

            <span class="policy-option-icon">

            </span>

            <span
              class="policy-option-text"
              data-policy-i18n="restrictions"
            >

            </span>

          </label>

        </div>

      </div>

      <div class="form-field">

        <label
          for="policyNote"
          data-policy-i18n="shortNote"
        >
          Short note — optional
        </label>

        <textarea
          id="policyNote"
          data-policy-i18n-placeholder="notePlaceholder"
          placeholder="Example: Dogs are allowed on the terrace only."
        ></textarea>

      </div>

      <button
        class="modal-submit"
        type="submit"
        data-policy-i18n="saveRules"
      >
        Save pet rules
      </button>

      <button
        class="modal-secondary"
        id="removePolicyBtn"
        type="button"
        data-policy-i18n="removeRules"
      >
        Remove custom rules
      </button>

    </form>

  </div>
</div>

/* =========================================================
   HELPERS
========================================================= */

function safeJsonParse(
  value,
  fallback
){

  try{

    const result =
      JSON.parse(
        value
      );

    return result ??
      fallback;

  }catch{

    return fallback;

  }

}

function normalizeLanguage(
  value
){

  let code =
    String(
      value || ""
    )
      .trim()
      .toLowerCase()
      .replace("_","-");

  if(
    code.includes("-")
  ){

    code =
      code.split("-")[0];

  }

  const aliases = {
    ua:"uk",
    cz:"cs",
    gr:"el",
    se:"sv",
    dk:"da"
  };

  code =
    aliases[code] ||
    code;

  return Object.prototype
    .hasOwnProperty.call(
      LANGUAGE_NAMES,
      code
    )
      ? code
      : "";

}

function detectLanguage(){

  let master =
    "";

  try{

    master =
      normalizeLanguage(
        localStorage.getItem(
          MASTER_LANGUAGE_KEY
        )
      );

  }catch{}

  if(
    master
  ){

    return master;

  }

  for(
    const key
    of LANGUAGE_KEYS
  ){

    if(
      key ===
      MASTER_LANGUAGE_KEY
    ){

      continue;

    }

    try{

      const value =
        normalizeLanguage(
          localStorage.getItem(
            key
          )
        );

      if(
        value
      ){

        return value;

      }

    }catch{}

  }

  const cookieMatch =
    document.cookie.match(
      /(?:^|;\s*)i18next=([^;]+)/
    );

  if(
    cookieMatch
  ){

    const cookieLanguage =
      normalizeLanguage(
        decodeURIComponent(
          cookieMatch[1]
        )
      );

    if(
      cookieLanguage
    ){

      return cookieLanguage;

    }

  }

  return (
    normalizeLanguage(
      document.documentElement.lang
    ) ||
    normalizeLanguage(
      navigator.language
    ) ||
    "en"
  );

}

function persistLanguage(
  language
){

  const normalized =
    normalizeLanguage(
      language
    ) ||
    "en";

  try{

    localStorage.setItem(
      MASTER_LANGUAGE_KEY,
      normalized
    );

  }catch{}

  LANGUAGE_KEYS.forEach(
    function(key){

      try{

        localStorage.setItem(
          key,
          normalized
        );

      }catch{}

    }
  );

  document.cookie =
    "i18next=" +
    encodeURIComponent(
      normalized
    ) +
    ";path=/;max-age=31536000;SameSite=Lax";

}

function t(
  key
){

  return (
    TRANSLATIONS[
      currentLanguage
    ]?.[key] ||
    BASE_EN[key] ||
    key
  );

}

function pt(
  key
){

  return (
    POLICY_TEXT[
      currentLanguage
    ]?.[key] ||
    POLICY_TEXT.en[key] ||
    key
  );

}

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function finiteNumber(
  value
){

  const number =
    Number(
      value
    );

  return Number.isFinite(
    number
  )
    ? number
    : null;

}

function haversineKm(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R =
    6371;

  const toRad =
    function(value){

      return (
        value *
        Math.PI /
        180
      );

    };

  const dLat =
    toRad(
      lat2 - lat1
    );

  const dLng =
    toRad(
      lng2 - lng1
    );

  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +
    Math.cos(
      toRad(lat1)
    ) *
    Math.cos(
      toRad(lat2)
    ) *
    Math.sin(
      dLng / 2
    ) ** 2;

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}

/* =========================================================
   LANGUAGE
========================================================= */

function applyLanguage(
  language
){

  currentLanguage =
    normalizeLanguage(
      language
    ) ||
    detectLanguage() ||
    "en";

  persistLanguage(
    currentLanguage
  );

  document.documentElement.lang =
    currentLanguage;

  document.documentElement.dir =
    currentLanguage === "ar"
      ? "rtl"
      : "ltr";

  document
    .querySelectorAll(
      "[data-i18n]"
    )
    .forEach(
      function(element){

        const key =
          element.dataset.i18n;

        element.textContent =
          t(
            key
          );

      }
    );

  document
    .querySelectorAll(
      "[data-i18n-placeholder]"
    )
    .forEach(
      function(element){

        const key =
          element.dataset.i18nPlaceholder;

        element.placeholder =
          t(
            key
          );

      }
    );

  document
    .querySelectorAll(
      "[data-policy-i18n]"
    )
    .forEach(
      function(element){

        const key =
          element.dataset.policyI18n;

        element.textContent =
          pt(
            key
          );

      }
    );

  document
    .querySelectorAll(
      "[data-policy-i18n-placeholder]"
    )
    .forEach(
      function(element){

        const key =
          element.dataset.policyI18nPlaceholder;

        element.placeholder =
          pt(
            key
          );

      }
    );

  updateRadiusLabel();

  updateSelectedLocationUI();

  renderResults();

}

  }

};

function getSavedPlaces(){

  const value =
    safeJsonParse(
      localStorage.getItem(
        SAVED_KEY
      ),
      []
    );

  return Array.isArray(
    value
  )
    ? value
    : [];

}

function setSavedPlaces(
  places
){

  localStorage.setItem(
    SAVED_KEY,
    JSON.stringify(
      places
    )
  );

}

function isSaved(
  place
){

  return getSavedPlaces()
    .some(
      function(saved){

        return (
          String(
            saved.id
          ) ===
          String(
            place.id
          )
        );

      }
    );

}

function toggleSaved(
  place
){

  let saved =
    getSavedPlaces();

  const exists =
    saved.some(
      function(item){

        return (
          String(
            item.id
          ) ===
          String(
            place.id
          )
        );

      }
    );

  if(
    exists
  ){

    saved =
      saved.filter(
        function(item){

          return (
            String(
              item.id
            ) !==
            String(
              place.id
            )
          );

        }
      );

  }else{

    saved.unshift(
      place
    );

  }

  setSavedPlaces(
    saved
  );

  renderResults();

}

/* =========================================================
   PET POLICIES
========================================================= */

function getPolicies(){

  const value =
    safeJsonParse(
      localStorage.getItem(
        POLICY_KEY
      ),
      {}
    );

  return (
    value &&
    typeof value === "object" &&
    !Array.isArray(value)
  )
    ? value
    : {};

}

function savePolicies(
  policies
){

  try{

    localStorage.setItem(
      POLICY_KEY,
      JSON.stringify(
        policies
      )
    );

  }catch{}

}

function getPolicy(
  place
){

  if(
    !place?.id
  ){

    return null;

  }

  const policies =
    getPolicies();

  const policy =
    policies[
      String(
        place.id
      )
    ];

  if(
    !policy ||
    typeof policy !== "object"
  ){

    return null;

  }

  const allowed = [
    "inside_outside",
    "terrace",
    "garden",
    "restrictions"
  ];

  if(
    !allowed.includes(
      policy.access
    )
  ){

    return null;

  }

  return policy;

}

function setPolicy(
  place,
  access,
  note
){

  if(
    !place?.id
  ){

    return;

  }

  const policies =
    getPolicies();

  policies[
    String(
      place.id
    )
  ] = {
    access,
    note:
      String(
        note || ""
      )
        .trim(),
    updatedAt:
      new Date()
        .toISOString()
  };

  savePolicies(
    policies
  );

}

function removePolicy(
  place
){

  if(
    !place?.id
  ){

    return;

  }

  const policies =
    getPolicies();

  delete policies[
    String(
      place.id
    )
  ];

  savePolicies(
    policies
  );

}

function policyPresentation(
  policy
){

  if(
    !policy
  ){

    return {
      label:
        "✓ " +
        t(
          "petFriendly"
        ),
      className:""
    };

  }

  if(
    policy.access ===
    "inside_outside"
  ){

    return {
      label:
        "✓ " +
        pt(
          "insideOutside"
        ),
      className:""
    };

  }

  if(
    policy.access ===
    "terrace"
  ){

    return {
      label:
        "☀ " +
        pt(
          "terraceOnly"
        ),
      className:
        "policy-terrace"
    };

  }

  if(
    policy.access ===
    "garden"
  ){

    return {
      label:
        "🌿 " +
        pt(
          "gardenOnly"
        ),
      className:
        "policy-garden"
    };

  }

  return {
    label:
      "i " +
      pt(
        "restrictions"
      ),
    className:
      "policy-restrictions"
  };

}

    iconAnchor:[11,11]
  });

function clearPlaceMarkers(){

  placeMarkers.forEach(
    function(marker){

      map.removeLayer(
        marker
      );

    }
  );

  placeMarkers =
    [];

}

function updateMapMarkers(
  places
){

  clearPlaceMarkers();

  const bounds =
    [];

  places.forEach(
    function(place){

      const lat =
        finiteNumber(
          place.location?.lat
        );

      const lng =
        finiteNumber(
          place.location?.lng
        );

      if(
        lat === null ||
        lng === null
      ){

        return;

      }

      const policy =
        getPolicy(
          place
        );

      const presentation =
        policyPresentation(
          policy
        );

      let popup =
        "<strong>" +
        escapeHtml(
          place.name
        ) +
        "</strong><br>" +
        escapeHtml(
          categoryLabel(
            place.category
          )
        ) +
        "<br>" +
        escapeHtml(
          presentation.label
        );

      if(
        policy?.note
      ){

        popup +=
          "<br><small>" +
          escapeHtml(
            policy.note
          ) +
          "</small>";

      }

      const marker =
        L.marker(
          [
            lat,
            lng
          ],
          {
            icon:
              createPlaceIcon()
          }
        )
          .addTo(
            map
          )
          .bindPopup(
            popup
          );

      placeMarkers.push(
        marker
      );

      bounds.push([
        lat,
        lng
      ]);

    }
  );

  if(
    currentLocation
  ){

    if(
      userMarker
    ){

      map.removeLayer(
        userMarker
      );

    }

    userMarker =
      L.marker(
        [
          currentLocation.lat,
          currentLocation.lng
        ],
        {
          icon:
            createUserIcon(),
          zIndexOffset:1000
        }
      )
        .addTo(
          map
        );

    bounds.push([
      currentLocation.lat,
      currentLocation.lng
    ]);

  }

  if(
    bounds.length > 1
  ){

    map.fitBounds(
      bounds,
      {
        padding:[25,25],
        maxZoom:14
      }
    );

  }else if(
    bounds.length === 1
  ){

    map.setView(
      bounds[0],
      14
    );

  }

  setTimeout(
    function(){

      map.invalidateSize();

    },
    80
  );

}

/* =========================================================
   GEOCODING
========================================================= */

async function geocodeSuggestions(
  query
){

  if(
    suggestionAbort
  ){

    suggestionAbort.abort();

  }

  suggestionAbort =
    new AbortController();

  const url =
    NOMINATIM_URL +
    "?format=jsonv2&limit=5&addressdetails=1&accept-language=" +
    encodeURIComponent(
      currentLanguage
    ) +
    "&q=" +
    encodeURIComponent(
      query
    );

  const response =
    await fetch(
      url,
      {
        headers:{
          "Accept":"application/json"
        },
        signal:
          suggestionAbort.signal
      }
    );

  if(
    !response.ok
  ){

    return [];

  }

  const data =
    await response.json();

  return Array.isArray(
    data
  )
    ? data
    : [];

}

async function geocode(
  query
){

  const results =
    await geocodeSuggestions(
      query
    );

  if(
    !results.length
  ){

    return null;

  }

  return {
    lat:
      Number(
        results[0].lat
      ),
    lng:
      Number(
        results[0].lon
      ),
    label:
      results[0].display_name ||
      query
  };

}

async function reverseGeocode(
  lat,
  lng
){

  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
        encodeURIComponent(
          lat
        ) +
        "&lon=" +
        encodeURIComponent(
          lng
        ) +
        "&accept-language=" +
        encodeURIComponent(
          currentLanguage
        ),
        {
          headers:{
            "Accept":"application/json"
          }
        }
      );

    if(
      !response.ok
    ){

      return "";

    }

    const data =
      await response.json();

    return (
      data?.display_name ||
      ""
    );

  }catch{

    return "";

  }

}

const locationSuggestions =
  document.getElementById(
    "locationSuggestions"
  );

function closeSuggestions(){

  locationSuggestions.hidden =
    true;

  locationSuggestions.innerHTML =
    "";

}

function shortSuggestionName(
  item
){

  const address =
    item?.address ||
    {};

  return (
    address.city ||
    address.town ||
    address.village ||
    address.municipality ||
    address.county ||
    item?.name ||
    String(
      item?.display_name ||
      ""
    )
      .split(",")[0]
  );

}

function renderSuggestions(
  results
){

  if(
    !results.length
  ){

    closeSuggestions();

    return;

  }

  locationSuggestions.innerHTML =
    results
      .map(
        function(
          item,
          index
        ){

          const main =
            shortSuggestionName(
              item
            );

          const full =
            item.display_name ||
            main;

          return `
            <button
              type="button"
              class="location-suggestion"
              data-suggestion-index="${index}"
            >
              <span class="suggestion-pin">
                ◆
              </span>

              <span>
                <strong>
                  ${escapeHtml(main)}
                </strong>

                <small>
                  ${escapeHtml(full)}
                </small>
              </span>
            </button>
          `;

        }
      )
      .join("");

  locationSuggestions.hidden =
    false;

  locationSuggestions
    .querySelectorAll(
      "[data-suggestion-index]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          async function(){

            const index =
              Number(
                this.dataset.suggestionIndex
              );

            const item =
              results[index];

            if(
              !item
            ){

              return;

            }

            currentLocation = {
              lat:
                Number(
                  item.lat
                ),
              lng:
                Number(
                  item.lon
                ),
              label:
                item.display_name ||
                locationInput.value.trim()
            };

            locationInput.value =
              shortSuggestionName(
                item
              );

            closeSuggestions();

            updateSelectedLocationUI();

            await searchPlaces();

          }
        );

      }
    );

}

async function fetchGooglePlaces(
  category
){

  let apiCategory =
    category;

  if(
    category ===
    "park"
  ){

    apiCategory =
      "dog-park";

  }

  if(
    category === "beach" ||
    category === "events" ||
    category === "saved"
  ){

    return [];

  }

  const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            latitude:
              currentLocation.lat,

            longitude:
              currentLocation.lng,

            radius:
              currentRadiusKm *
              1000,

            category:
              apiCategory,

            maxResults:
              20
          })
      }
    );

  const data =
    await response
      .json()
      .catch(
        function(){

          return {};

        }
      );

  if(
    !response.ok ||
    data?.ok !== true
  ){

    throw new Error(
      data?.error ||
      "Google Places error"
    );

  }

  return Array.isArray(
    data.places
  )
    ? data.places
        .map(
          normalizeApiPlace
        )
        .filter(
          Boolean
        )
    : [];

}

function normalizeApiPlace(
  place
){

  const lat =
    finiteNumber(
      place?.location?.lat ??
      place?.latitude
    );

  const lng =
    finiteNumber(
      place?.location?.lng ??
      place?.longitude
    );

  if(
    lat === null ||
    lng === null
  ){

    return null;

  }

  const id =
    String(
      place.id ||
      place.providerId ||
      (
        "google-" +
        lat +
        "-" +
        lng
      )
    );

  let photo =
    null;

  if(
    place?.photo?.url
  ){

    photo = {
      url:
        place.photo.url
    };

  }else if(
    place?.photo?.name
  ){

    photo = {
      url:
        API_URL +
        "?photo=" +
        encodeURIComponent(
          place.photo.name
        ) +
        "&width=1000"
    };

  }else if(
    place?.photoName
  ){

    photo = {
      url:
        API_URL +
        "?photo=" +
        encodeURIComponent(
          place.photoName
        ) +
        "&width=1000"
    };

  }

  return {
    id,
    source:"google",

    name:
      place.name ||
      "Pet-friendly place",

    category:
      normalizeCategoryName(
        place.category
      ),

    address:
      place.address ||
      "",

    location:{
      lat,
      lng
    },

    rating:
      finiteNumber(
        place.rating
      ),

    ratingCount:
      finiteNumber(
        place.ratingCount
      ) || 0,

    website:
      place.website ||
      "",

    googleMapsUrl:
      place.googleMapsUrl ||
      "",

    phone:
      place.phone ||
      "",

    openingHours:
      place.openingHours ||
      null,

    photo,

    petFriendly:{
      allowed:true,
      verified:true
    }
  };

}

function normalizeCategoryName(
  value
){

  const category =
    String(
      value || ""
    )
      .trim()
      .toLowerCase();

  const map = {
    cafe:"cafe",
    restaurant:"restaurant",
    hotel:"hotel",
    veterinary:"veterinary",
    "pet shop":"pet-shop",
    "pet-shop":"pet-shop",
    "dog-park":"park",
    park:"park",
    beach:"beach",
    events:"events"
  };

  return (
    map[category] ||
    "other"
  );

}

/* =========================================================
   OPENSTREETMAP
========================================================= */

function buildOverpassQuery(
  category
){

  const radius =
    Math.round(
      currentRadiusKm *
      1000
    );

  const lat =
    currentLocation.lat;

  const lng =
    currentLocation.lng;

  const around =
    `(around:${radius},${lat},${lng})`;

  if(
    category ===
    "beach"
  ){

    return `
      [out:json][timeout:18];
      (
        nwr${around}["natural"="beach"]["dog"="yes"];
        nwr${around}["natural"="beach"]["dogs"="yes"];
        nwr${around}["leisure"="beach_resort"]["dog"="yes"];
      );
      out center tags;
    `;

  }

  if(
    category ===
    "park"
  ){

    return `
      [out:json][timeout:18];
      (
        nwr${around}["leisure"="dog_park"];
        nwr${around}["leisure"="park"]["dog"="yes"];
        nwr${around}["leisure"="park"]["dogs"="yes"];
      );
      out center tags;
    `;

  }

  if(
    category ===
    "events"
  ){

    return `
      [out:json][timeout:18];
      (
        nwr${around}["sport"="equestrian"];
        nwr${around}["leisure"="horse_riding"];
        nwr${around}["leisure"="racecourse"];
        nwr${around}["amenity"="events_venue"]["animal"];
      );
      out center tags;
    `;

  }

  if(
    category ===
    "all"
  ){

    return `
      [out:json][timeout:18];
      (
        nwr${around}["leisure"="dog_park"];
        nwr${around}["leisure"="park"]["dog"="yes"];
        nwr${around}["natural"="beach"]["dog"="yes"];
        nwr${around}["natural"="beach"]["dogs"="yes"];
      );
      out center tags;
    `;

  }

  return "";

}

async function fetchOsmPlaces(
  category
){

  const query =
    buildOverpassQuery(
      category
    );

  if(
    !query
  ){

    return [];

  }

  try{

    const response =
      await fetch(
        OVERPASS_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },

          body:
            "data=" +
            encodeURIComponent(
              query
            )
        }
      );

    if(
      !response.ok
    ){

      return [];

    }

    const data =
      await response.json();

    return Array.isArray(
      data?.elements
    )
      ? data.elements
          .map(
            normalizeOsmPlace
          )
          .filter(
            Boolean
          )
      : [];

  }catch{

    return [];

  }

}

function osmImageUrl(
  tags
){

  const direct =
    tags?.image;

  if(
    direct &&
    /^https?:\/\//i.test(
      direct
    )
  ){

    return direct;

  }

  const commons =
    tags?.wikimedia_commons;

  if(
    commons
  ){

    const filename =
      String(
        commons
      )
        .replace(
          /^File:/i,
          ""
        );

    return (
      "https://commons.wikimedia.org/wiki/Special:FilePath/" +
      encodeURIComponent(
        filename
      ) +
      "?width=1000"
    );

  }

  return "";

}

function normalizeOsmPlace(
  element
){

  const tags =
    element?.tags ||
    {};

  const lat =
    finiteNumber(
      element.lat ??
      element.center?.lat
    );

  const lng =
    finiteNumber(
      element.lon ??
      element.center?.lon
    );

  if(
    lat === null ||
    lng === null
  ){

    return null;

  }

  let category =
    "park";

  if(
    tags.natural ===
    "beach" ||
    tags.leisure ===
    "beach_resort"
  ){

    category =
      "beach";

  }else if(
    tags.sport ===
    "equestrian" ||
    tags.leisure ===
    "horse_riding" ||
    tags.leisure ===
    "racecourse" ||
    tags.amenity ===
    "events_venue"
  ){

    category =
      "events";

  }

  const addressParts = [
    tags["addr:housenumber"],
    tags["addr:street"],
    tags["addr:city"]
  ]
    .filter(
      Boolean
    );

  const photoUrl =
    osmImageUrl(
      tags
    );

  return {
    id:
      "osm-" +
      element.type +
      "-" +
      element.id,

    source:"osm",

    name:
      tags.name ||
      tags["name:en"] ||
      (
        category ===
        "beach"
          ? t(
              "catBeach"
            )
          : category ===
            "events"
              ? t(
                  "catEvents"
                )
              : t(
                  "catPark"
                )
      ),

    category,

    address:
      addressParts.join(
        " "
      ),

    location:{
      lat,
      lng
    },

    rating:null,
    ratingCount:0,

    website:
      tags.website ||
      tags["contact:website"] ||
      "",

    googleMapsUrl:
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(
        lat +
        "," +
        lng
      ),

    phone:
      tags.phone ||
      tags["contact:phone"] ||
      "",

    openingHours:null,

    photo:
      photoUrl
        ? {
            url:
              photoUrl
          }
        : null,

    petFriendly:{
      allowed:true,
      verified:true
    }
  };

}

/* =========================================================
   LOCAL ADDED PLACES
========================================================= */

function nearbyAddedPlaces(){

  return getAddedPlaces()
    .map(
      function(place){

        const distance =
          haversineKm(
            currentLocation.lat,
            currentLocation.lng,
            place.location.lat,
            place.location.lng
          );

        return Object.assign(
          {},
          place,
          {
            distance
          }
        );

      }
    )
    .filter(
      function(place){

        if(
          place.distance >
          currentRadiusKm
        ){

          return false;

        }

        if(
          currentCategory ===
          "all"
        ){

          return true;

        }

        return (
          place.category ===
          currentCategory
        );

      }
    );

}

/* =========================================================
   MERGE
========================================================= */

function mergePlaces(
  groups
){

  const merged =
    new Map();

  groups
    .flat()
    .filter(
      Boolean
    )
    .forEach(
      function(place){

        const key =
          place.id ||
          (
            String(
              place.name ||
              ""
            )
              .toLowerCase() +
            "|" +
            Number(
              place.location?.lat
            )
              .toFixed(
                4
              ) +
            "|" +
            Number(
              place.location?.lng
            )
              .toFixed(
                4
              )
          );

        if(
          !merged.has(
            key
          )
        ){

          merged.set(
            key,
            place
          );

        }

      }
    );

  return Array.from(
    merged.values()
  );

}

/* =========================================================
   SEARCH
========================================================= */

async function searchPlaces(){

  if(
    currentCategory ===
    "saved"
  ){

    currentResults =
      getSavedPlaces()
        .map(
          addDistance
        );

    visibleLimit =
      12;

    renderResults();

    updateMapMarkers(
      currentResults
    );

    return;

  }

  setStatus(
    t(
      "searching"
    )
  );

  visibleLimit =
    12;

  const result =
    await Promise.all([
      fetchGooglePlaces(
        currentCategory
      )
        .catch(
          function(error){

            console.warn(
              "Google Places:",
              error
            );

            return [];

          }
        ),

      fetchOsmPlaces(
        currentCategory
      )
  ]);

  const google =
    result[0] ||
    [];

  const osm =
    result[1] ||
    [];

  const added =
    nearbyAddedPlaces();

  currentResults =
    mergePlaces([
      google,
      osm,
      added
    ])
      .map(
        addDistance
      )
      .filter(
        function(place){

          return (
            place.distance === null ||
            place.distance <=
            currentRadiusKm +
            .5
          );

        }
      );

  sortResults();

  persistSearch();

  renderResults();

  updateMapMarkers(
    currentResults
  );

  updateSelectedLocationUI();

  if(
    currentResults.length
  ){

    setStatus(
      t(
        "found"
      ) +
      ": " +
      currentResults.length +
      " " +
      t(
        "places"
      )
    );

  }else{

    setStatus(
      t(
        "noPlaces"
      )
    );

  }

}

function addDistance(
  place
){

  const lat =
    finiteNumber(
      place?.location?.lat
    );

  const lng =
    finiteNumber(
      place?.location?.lng
    );

  let distance =
    null;

  if(
    lat !== null &&
    lng !== null
  ){

    distance =
      haversineKm(
        currentLocation.lat,
        currentLocation.lng,
        lat,
        lng
      );

  }

  return Object.assign(
    {},
    place,
    {
      distance
    }
  );

}

function sortResults(){

  const sortSelect =
    document.getElementById(
      "sortSelect"
    );

  if(
    !sortSelect
  ){

    return;

  }

  const mode =
    sortSelect.value;

  currentResults.sort(
    function(
      a,
      b
    ){

      if(
        mode ===
        "rating"
      ){

        return (
          Number(
            b.rating ||
            0
          ) -
          Number(
            a.rating ||
            0
          )
        );

      }

      return (
        Number(
          a.distance ??
          999999
        ) -
        Number(
          b.distance ??
          999999
        )
      );

    }
  );

}

function renderResults(){

  const cards =
    document.getElementById(
      "cards"
    );

  const count =

    );

  const loadWrap =
    document.getElementById(
      "loadMoreWrap"
    );

  if(
    !cards ||

  ){

  }

  let results =
    currentResults.slice();

  if(
    currentCategory ===
    "saved"
  ){

    results =
      getSavedPlaces()
        .map(
          addDistance
        );

  }

  count.textContent =
    t(
      "found"
    ) +
    ": " +
    results.length +
    " " +
    t(
      "places"
    );

  if(
    !results.length
  ){

    const title =
      currentCategory ===
      "saved"
        ? t(
            "savedEmpty"
          )
        : t(
            "noPlaces"
          );

    const text =
      currentCategory ===
      "saved"
        ? t(
            "savedEmptyText"
          )
        : t(
            "tryAnother"
          );

    cards.innerHTML =
      `
      <div class="empty">
        <h3>
          ${escapeHtml(title)}
        </h3>

        <p>
          ${escapeHtml(text)}
        </p>
      </div>
      `;

    loadWrap.hidden =
      true;

    return;

  }

  const visible =
    results.slice(
      0,
      visibleLimit
    );

  cards.innerHTML =
    visible
      .map(
        renderPlaceCard
      )
      .join("");

    results.length <=
    visibleLimit;

          "click",

              results.find(

                  return (

                      item.id

                      id

                  );

        );

    );

    .querySelectorAll(
      "[data-policy-id]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            const id =
              this.dataset.policyId;

              results.find(
                function(item){

                      item.id

                    String(
                      id
                    )
                  );

                }
              );

            if(
              place

              openPolicyModal(
                place
              );

            }

          }
        );

      }
    );

}

function renderPlaceCard(
  place
){

  const saved =
    isSaved(
      place
    );

  const photo =
    place.photo?.url ||
    "";

  const rating =
    finiteNumber(
      place.rating
    );

  const distance =
    finiteNumber(
      place.distance
    );

  const openNow =
    place.openingHours &&
    typeof place.openingHours.openNow ===
    "boolean"
      ? place.openingHours.openNow
      : null;

  const directions =
    place.googleMapsUrl ||
    (
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(
        place.location.lat +
        "," +
        place.location.lng
      )
    );

  const policy =
    getPolicy(
      place
    );

  const policyView =
    policyPresentation(
      policy
    );

  let photoHtml =
    "";

  if(
    photo
  ){

    photoHtml =
      `
      <img
        class="card-photo"
        src="${escapeHtml(photo)}"
        alt="${escapeHtml(place.name)}"
        loading="lazy"
        onerror="this.style.display='none'"
      >
      `;

  }

  let sourceLabel =
    "";

  if(
    place.source ===
    "google"
  ){

    sourceLabel =
      t(
        "sourceGoogle"
      );

  }else if(
    place.source ===
    "osm"
  ){

    sourceLabel =
      t(
        "sourceOSM"
      );

  }else{

    sourceLabel =
      t(
        "addedByMe"
      );

  }

  const ratingHtml =
    rating !== null
      ? (
          "★ " +
          rating.toFixed(
            1
          )
        )
      : "";

  const meta =
    [];

  if(
    distance !== null
  ){

    meta.push(
      distance.toFixed(
        distance < 10
          ? 1
          : 0
      ) +
      " " +
      t(
        "km"
      )
    );

  }

  if(
    place.ratingCount
  ){

    meta.push(
      "(" +
      place.ratingCount +
      ")"
    );

  }

  meta.push(
    sourceLabel
  );

  return `
    <article class="place-card">

      <div class="card-photo-fallback"></div>

      ${photoHtml}

      <button
        class="card-heart ${saved ? "saved" : ""}"
        type="button"
        data-heart-id="${escapeHtml(place.id)}"
        aria-label="Save"
      >
        ${saved ? "♥" : "♡"}
      </button>

      <div class="card-content">

        <div class="card-topline">

          <span class="card-category">
            ${escapeHtml(
              categoryLabel(
                place.category
              )
            )}
          </span>

          <span class="card-rating">
            ${escapeHtml(
              ratingHtml
            )}
          </span>

        </div>

        <h2 class="card-title">
          ${escapeHtml(
            place.name
          )}
        </h2>

        ${
          place.address
            ? `
              <p class="card-address">
                ${escapeHtml(
                  place.address
                )}
              </p>
            `
            : ""
        }

        <div class="card-status">

          <button
            class="pet-badge ${escapeHtml(policyView.className)}"
            type="button"
            data-policy-id="${escapeHtml(place.id)}"
          >
            ${escapeHtml(
              policyView.label
            )}
          </button>

          ${
            openNow === true
              ? `
                <span>
                  ${escapeHtml(
                    t(
                      "open"
                    )
                  )}
                </span>
              `
              : ""
          }

          ${
            openNow === false
              ? `
                <span>
                  ${escapeHtml(
                    t(
                      "closed"
                    )
                  )}
                </span>
              `
              : ""
          }

        </div>

        ${
          policy?.note
            ? `
              <div class="pet-policy-note">
                ${escapeHtml(
                  policy.note
                )}
              </div>
            `
            : ""
        }

        <div class="card-meta">
          ${escapeHtml(
            meta.join(
              " · "
            )
          )}
        </div>

        <div class="card-actions">

          <button
            class="pet-rules-action"
            type="button"
            data-policy-id="${escapeHtml(place.id)}"
          >
            ${escapeHtml(
              pt(
                "petRules"
              )
            )}
          </button>

          <a
            href="${escapeHtml(directions)}"
            target="_blank"
            rel="noopener"
          >
            ${escapeHtml(
              t(
                "route"
              )
            )}
          </a>

          ${
            place.website
              ? `
                <a
                  href="${escapeHtml(place.website)}"
                  target="_blank"
                  rel="noopener"
                >
                  ${escapeHtml(
                    t(
                      "website"
                    )
                  )}
                </a>
              `
              : ""
          }

          ${
            place.phone
              ? `
                <a
                  href="tel:${escapeHtml(place.phone)}"
                >
                  ${escapeHtml(
                    t(
                      "call"
                    )
                  )}
                </a>
              `
              : ""
          }

        </div>

      </div>

    </article>
  `;

async function searchTypedLocation(){

    locationInput.value.trim();

    !query

    )
  );

        query

        t(

        )

  }catch(
    error
  ){

    console.error(
      error
    );

    setStatus(
      t(
        "geocodeFail"
      )
    );

  }

}

function useDeviceLocation(
  callback
){

  if(
    !navigator.geolocation
  ){

    setStatus(
      t(
        "locationFail"
      )
    );

    return;

  }

  setStatus(
    t(
      "locationSearching"
    )
  );

  navigator.geolocation
    .getCurrentPosition(

      async function(
        position
      ){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        const address =
          await reverseGeocode(
            lat,
            lng
          );

        callback({
          lat,
          lng,
          label:
            address ||
            "Current location"
        });

      },

      function(
        error
      ){

        console.warn(
          "Geolocation:",
          error
        );

        setStatus(
          t(
            "locationFail"
          )
        );

      },

      {
        enableHighAccuracy:true,
        timeout:12000,
        maximumAge:60000
      }

    );

}

function persistSearch(){

  try{

    localStorage.setItem(
      SEARCH_KEY,
      JSON.stringify({
        location:
          currentLocation,

        radius:
          currentRadiusKm,

        query:
          locationInput.value
      })
    );

  }catch{}

}

function restoreSearch(){

  const saved =
    safeJsonParse(
      localStorage.getItem(
        SEARCH_KEY
      ),
      null
    );

  if(
    saved?.location &&
    finiteNumber(
      saved.location.lat
    ) !== null &&
    finiteNumber(
      saved.location.lng
    ) !== null
  ){

    currentLocation = {
      lat:
        Number(
          saved.location.lat
        ),

      lng:
        Number(
          saved.location.lng
        ),

      label:
        saved.location.label ||
        saved.query ||
        ""
    };

  }

  if(
    Number.isFinite(
      Number(
        saved?.radius
      )
    )
  ){

    currentRadiusKm =
      Math.min(
        25,
        Math.max(
          1,
          Number(
            saved.radius
          )
        )
      );

  }

  radiusSlider.value =
    currentRadiusKm;

  locationInput.value =
    saved?.query ||
    currentLocation.label ||
    "";

}

/* =========================================================
   INITIALISE
========================================================= */

async function initialise(){

  currentLanguage =
    detectLanguage();

  persistLanguage(
    currentLanguage
  );

  restoreSearch();

  applyLanguage(
    currentLanguage
  );

  updateRadiusLabel();

  updateSelectedLocationUI();

  map.setView(
    [
      currentLocation.lat,
      currentLocation.lng
    ],
    13
  );

  await searchPlaces();

}

window.addEventListener(
  "load",
  function(){

    initialise();

  }
);

window.addEventListener(
  "storage",
  function(
    event
  ){

    if(
      LANGUAGE_KEYS.includes(
        event.key
      )
    ){

      const language =
        detectLanguage();

      if(
        language !==
        currentLanguage
      ){

        applyLanguage(
          language
        );

      }

    }

  }
);

document.addEventListener(
  "keydown",
  function(
    event
  ){

    if(
      event.key !==
      "Escape"
    ){

      return;

    }

    closeSuggestions();

    if(
      addModal.classList.contains(
        "open"
      )
    ){

      closeAddModal();

    }

    if(
      policyModal.classList.contains(
        "open"
      )
    ){

      closePolicyModal();

    }

  }
);

</script>
