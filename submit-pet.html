<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Your Pet - PETS & DOGUE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f8f7f3;color:#111}
header{background:white;padding:18px;text-align:center;border-bottom:1px solid #ddd}
.logo-small{font-size:22px;color:#b78a2e}
.logo-big{font-size:72px;font-family:Georgia,serif;font-weight:bold;letter-spacing:4px;color:#c89b3c}
.tagline{font-size:13px;letter-spacing:2px;color:#666}
main{max-width:1000px;margin:auto;padding:40px 20px}
.hero{text-align:center;margin-bottom:40px}
.hero h1{font-size:60px;font-family:Georgia,serif}
.hero p{font-size:20px;color:#555;margin-top:15px}
.form-box{background:white;border:2px solid #111;border-radius:35px;padding:35px}
label{display:block;margin-top:18px;margin-bottom:8px;font-weight:bold}
input,textarea,select{
width:100%;
padding:15px;
border:1px solid #ccc;
border-radius:14px;
font-size:16px;
}
textarea{min-height:160px}
button{
margin-top:25px;
background:#111;
color:white;
border:none;
padding:18px 30px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}
footer{
margin-top:60px;
padding:40px;
background:white;
text-align:center;
border-top:1px solid #ddd;
}
</style>
</head>

<body>

<header>
<div class="logo-small">pets &</div>
<div class="logo-big">DOGUE</div>
<div class="tagline">THE INTERNATIONAL LUXURY ANIMAL MAGAZINE</div>
</header>

<main>

<div class="hero">
<h1>Submit Your Pet</h1>
<p>
Give your pet a chance to be featured in PETS & DOGUE.
</p>
</div>

<div class="form-box">

<label>Your Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Pet Name</label>
<input type="text">

<label>Category</label>
<select>
<option>Dog</option>
<option>Cat</option>
<option>Bird</option>
<option>Rabbit</option>
<option>Horse</option>
<option>Exotic Pet</option>
</select>

<label>Pet Story</label>
<textarea></textarea>

<label>Photo Link</label>
<input type="text" placeholder="Paste image URL">

<button>Submit Application</button>

</div>

</main>

<footer>
<h2>PETS & DOGUE</h2>
<p>The International Luxury Animal Magazine</p>
</footer>


<!-- PETS & DOGUE UNIFIED 23-LANGUAGE SYSTEM -->
<script src="translations.js"></script>
</body>
</html>
