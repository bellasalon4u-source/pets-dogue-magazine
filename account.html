<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
name="description"
content="PETS & DOGUE account and Club membership.">

<title>PETS & DOGUE — My Account</title>

<style>
:root{
--black:#070707;
--cream:#f5f0e6;
--white:#fff;
--gold:#bd8b29;
--gold-light:#efd47a;
--green:#59e915;
--green-dark:#176b3b;
--grey:#706b64;
--line:#cbc4b8;
--soft:#f9f7f2;
--red:#b62929;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.locked{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
max-width:100%;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
background:var(--black);
color:#fff;
}

.header-main{
height:106px;
display:grid;
grid-template-columns:48px 1fr 48px;
align-items:center;
padding:0 16px;
border-bottom:1px solid #292929;
}

.menu-button,
.profile-button{
width:46px;
height:46px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.menu-button{
flex-direction:column;
gap:6px;
}

.menu-button span{
width:31px;
height:2px;
background:#fff;
border-radius:30px;
}

.brand{
justify-self:center;
text-align:center;
line-height:.86;
}

.brand-small{
font-family:var(--serif);
font-size:10px;
letter-spacing:2.7px;
color:var(--gold);
margin-bottom:5px;
}

.brand-big{
font-family:var(--serif);
font-size:41px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.profile-icon{
position:relative;
width:29px;
height:29px;
}

.profile-icon:before{
content:"";
position:absolute;
left:8px;
top:1px;
width:10px;
height:10px;
border:2px solid #fff;
border-radius:50%;
}

.profile-icon:after{
content:"";
position:absolute;
left:2px;
bottom:1px;
width:23px;
height:12px;
border:2px solid #fff;
border-bottom:0;
border-radius:16px 16px 0 0;
}

.category-nav{
height:56px;
display:flex;
align-items:center;
gap:28px;
padding:0 18px;
overflow-x:auto;
scrollbar-width:none;
border-bottom:1px solid #292929;
font-size:10px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.category-nav::-webkit-scrollbar{
display:none;
}

.category-nav a{
white-space:nowrap;
}

/* =========================================================
   MENU
========================================================= */

.menu-overlay{
position:fixed;
inset:0;
z-index:8000;
background:rgba(0,0,0,.68);
opacity:0;
visibility:hidden;
transition:.2s;
}

.menu-overlay.show{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
top:0;
bottom:0;
left:0;
z-index:8100;
width:min(355px,88vw);
background:#090909;
color:#fff;
overflow-y:auto;
transform:translateX(-102%);
transition:.24s ease;
}

.side-menu.open{
transform:translateX(0);
}

.menu-head{
height:82px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 19px;
border-bottom:1px solid #292929;
}

.menu-head strong{
font-family:var(--serif);
font-size:20px;
font-weight:400;
color:var(--gold-light);
}

.close-menu{
width:37px;
height:37px;
border-radius:50%;
border:1px solid #555;
background:transparent;
color:#fff;
font-size:21px;
}

.menu-account{
padding:15px;
border-bottom:1px solid #292929;
}

.menu-profile{
display:flex;
align-items:center;
gap:11px;
padding:12px;
background:#151515;
}

.menu-profile-circle{
width:37px;
height:37px;
border:1px solid #777;
border-radius:50%;
position:relative;
flex:0 0 37px;
}

.menu-profile-circle:before{
content:"";
position:absolute;
width:9px;
height:9px;
border:1.5px solid #fff;
border-radius:50%;
top:6px;
left:12px;
}

.menu-profile-circle:after{
content:"";
position:absolute;
width:19px;
height:10px;
border:1.5px solid #fff;
border-bottom:0;
border-radius:15px 15px 0 0;
left:7px;
bottom:5px;
}

.menu-profile strong{
display:block;
font-size:11px;
}

.menu-profile span{
display:block;
font-size:8px;
color:#aaa;
margin-top:3px;
word-break:break-word;
}

.menu-list{
padding:8px 16px 21px;
}

.menu-list a{
min-height:44px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #252525;
font-size:11px;
font-weight:700;
}

.menu-list a:after{
content:"›";
font-family:var(--serif);
font-size:19px;
color:#777;
}

.menu-account-link{
color:var(--gold-light);
}

.language-area{
padding:17px 16px 24px;
border-top:1px solid #292929;
}

.language-area label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:1.8px;
color:#999;
margin-bottom:7px;
}

.language-area select{
width:100%;
height:42px;
padding:0 10px;
border:1px solid #444;
background:#111;
color:#fff;
}

/* =========================================================
   MAIN
========================================================= */

.account-page{
max-width:760px;
margin:0 auto;
}

/* =========================================================
   SIGN IN
========================================================= */

.signin-view{
padding:38px 20px 52px;
text-align:center;
}

.account-logo-small{
font-family:var(--serif);
font-size:13px;
letter-spacing:3px;
color:var(--gold);
}

.account-logo-big{
font-family:var(--serif);
font-size:50px;
line-height:.9;
font-weight:400;
letter-spacing:3px;
color:var(--gold);
margin-top:4px;
}

.signin-view h1{
font-family:var(--serif);
font-size:43px;
font-weight:400;
line-height:1;
margin-top:27px;
}

.signin-intro{
font-size:13px;
line-height:1.5;
color:var(--grey);
margin:13px auto 28px;
max-width:560px;
}

.signin-form{
text-align:left;
}

.form-label{
display:block;
font-size:9px;
font-weight:900;
letter-spacing:1.7px;
margin-bottom:7px;
text-transform:uppercase;
}

.signin-input{
width:100%;
height:55px;
padding:0 15px;
border:1.5px solid #111;
background:#fff;
font-size:17px;
outline:none;
}

.signin-input.error{
border:2px solid var(--red);
background:#fff8f8;
}

.signin-error{
display:none;
color:var(--red);
font-size:9px;
font-weight:700;
margin-top:6px;
}

.signin-error.show{
display:block;
}

.primary-button{
width:100%;
min-height:52px;
border:0;
background:#090909;
color:#fff;
font-size:10px;
font-weight:900;
letter-spacing:1.5px;
margin-top:10px;
}

.primary-button:disabled{
opacity:.55;
cursor:wait;
}

.signin-help{
display:inline-block;
margin-top:16px;
font-size:11px;
text-decoration:underline;
}

.or-row{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:14px;
margin:30px 0 18px;
color:#888;
font-size:8px;
font-weight:900;
letter-spacing:1.7px;
}

.or-row:before,
.or-row:after{
content:"";
height:1px;
background:#c9c2b7;
}

.join-button{
display:flex;
align-items:center;
justify-content:center;
width:100%;
min-height:52px;
background:var(--green);
color:#111;
font-size:10px;
font-weight:900;
letter-spacing:1px;
}

.signin-legal{
font-size:8px;
line-height:1.6;
color:#827c74;
margin-top:20px;
}

.signin-legal a{
text-decoration:underline;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-view{
display:none;
}

.profile-hero{
background:#090909;
color:#fff;
padding:32px 20px 26px;
}

.profile-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.3px;
color:var(--gold-light);
text-transform:uppercase;
}

.profile-hero h1{
font-family:var(--serif);
font-size:35px;
font-weight:400;
line-height:1.05;
margin-top:7px;
}

.profile-email{
font-size:10px;
color:#bbb;
margin-top:7px;
word-break:break-word;
}

.profile-status{
display:inline-flex;
align-items:center;
gap:6px;
margin-top:15px;
padding:6px 10px;
border:1px solid #555;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.status-dot{
width:7px;
height:7px;
border-radius:50%;
background:#aaa;
}

.profile-status.active{
border-color:#3d8d5f;
}

.profile-status.active .status-dot{
background:var(--green);
}

/* =========================================================
   CLUB CARD
========================================================= */

.content-section{
padding:22px 16px;
}

.section-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.2px;
color:var(--gold);
text-transform:uppercase;
margin-bottom:5px;
}

.section-title{
font-family:var(--serif);
font-size:29px;
font-weight:400;
line-height:1.05;
}

.club-card{
margin-top:15px;
border:1px solid #bfb8ad;
background:#fff;
}

.club-card-head{
background:#090909;
color:#fff;
padding:16px;
display:flex;
justify-content:space-between;
gap:15px;
align-items:flex-start;
}

.club-card-label{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.7px;
color:var(--gold-light);
margin-bottom:5px;
}

.club-card-plan{
font-family:var(--serif);
font-size:23px;
font-weight:400;
line-height:1.05;
}

.club-card-price{
font-family:var(--serif);
font-size:20px;
white-space:nowrap;
}

.club-row{
display:flex;
justify-content:space-between;
gap:18px;
padding:12px 14px;
border-bottom:1px solid #ddd7ce;
font-size:10px;
line-height:1.4;
}

.club-row span{
color:#777169;
}

.club-row strong{
text-align:right;
word-break:break-word;
}

.club-row:last-child{
border-bottom:0;
}

.manage-button{
width:100%;
height:48px;
border:0;
background:#111;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.4px;
margin-top:10px;
}

.manage-button:disabled{
opacity:.55;
cursor:wait;
}

.billing-note{
font-size:8px;
line-height:1.5;
color:#777;
text-align:center;
margin-top:9px;
}

.billing-message{
display:none;
padding:10px;
margin-top:10px;
border:1px solid #bfb8ad;
background:#faf8f4;
font-size:9px;
line-height:1.5;
}

.billing-message.show{
display:block;
}

.billing-message.error{
border-color:var(--red);
background:#fff5f5;
color:var(--red);
}

/* =========================================================
   NO CLUB
========================================================= */

.no-club{
margin-top:15px;
padding:21px 17px;
border:1px solid #c9c2b7;
background:#fff;
text-align:center;
}

.no-club h3{
font-family:var(--serif);
font-size:25px;
font-weight:400;
}

.no-club p{
font-size:10px;
line-height:1.5;
color:#716b64;
margin:8px auto 15px;
max-width:460px;
}

.no-club .join-button{
min-height:48px;
}

/* =========================================================
   PET PROFILE
========================================================= */

.pet-panel{
margin-top:15px;
background:#fff;
border:1px solid #c9c2b7;
padding:16px;
}

.pet-empty{
text-align:center;
padding:12px 4px;
font-size:10px;
line-height:1.5;
color:#777;
}

.pet-info{
display:none;
grid-template-columns:1fr 1fr;
gap:1px;
background:#ddd6cc;
border:1px solid #ddd6cc;
}

.pet-info.show{
display:grid;
}

.pet-detail{
background:#fff;
padding:13px;
min-height:67px;
}

.pet-detail span{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.2px;
color:#8a847d;
margin-bottom:5px;
text-transform:uppercase;
}

.pet-detail strong{
display:block;
font-family:var(--serif);
font-size:17px;
font-weight:400;
word-break:break-word;
}

/* =========================================================
   QUICK ACCESS
========================================================= */

.quick-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:15px;
}

.quick-link{
min-height:96px;
background:#fff;
border:1px solid #c8c1b6;
padding:14px;
display:flex;
flex-direction:column;
justify-content:flex-end;
}

.quick-icon{
font-size:20px;
margin-bottom:auto;
}

.quick-link strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
}

.quick-link span{
font-size:8px;
color:#777;
margin-top:4px;
}

/* =========================================================
   ACCOUNT ACTIONS
========================================================= */

.account-actions{
display:grid;
gap:7px;
margin-top:15px;
}

.account-action{
width:100%;
min-height:45px;
border:1px solid #111;
background:#fff;
color:#111;
font-size:9px;
font-weight:900;
letter-spacing:1.2px;
}

.account-action.black{
background:#111;
color:#fff;
}

.account-action.danger{
border-color:#aaa;
color:#777;
}

/* =========================================================
   FOOTER
========================================================= */

.site-footer{
background:#090909;
color:#fff;
text-align:center;
padding:28px 18px;
margin-top:20px;
}

.footer-brand{
font-family:var(--serif);
font-size:26px;
font-weight:400;
letter-spacing:2.6px;
color:var(--gold);
}

.footer-subtitle{
font-size:7px;
letter-spacing:1.3px;
color:#888;
margin-top:6px;
}

.footer-links{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin-top:20px;
font-size:8px;
color:#bbb;
}

/* =========================================================
   RTL
========================================================= */

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .side-menu{
left:auto;
right:0;
transform:translateX(102%);
}

html[dir="rtl"] .side-menu.open{
transform:translateX(0);
}

html[dir="rtl"] .signin-form{
text-align:right;
}

html[dir="rtl"] .club-row strong{
text-align:left;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:760px){

.header-main{
height:116px;
}

.brand-big{
font-size:48px;
}

.signin-view{
padding-top:58px;
}

.signin-view h1{
font-size:52px;
}

.content-section{
padding:28px 20px;
}

.quick-grid{
grid-template-columns:repeat(4,1fr);
}

}
</style>
</head>

/* =========================================================

========================================================= */

function t(){

return LANG[currentLanguage]||
LANG.en;

}

function text(
id,
value
){

const element=$(id);

if(element){

element.textContent=
value===undefined ||
value===null
?""
:String(value);

}

}

function safeJSON(
value,
fallback={}
){

try{

return JSON.parse(
value
);

}catch(error){

return fallback;

}

}

function validEmail(
value
){

return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
.test(
String(value||"").trim()
);

}

function locale(){

const map={
en:"en-GB",
ru:"ru-RU",
uk:"uk-UA",
fr:"fr-FR",
de:"de-DE",
es:"es-ES",
it:"it-IT",
pt:"pt-PT",
nl:"nl-NL",
pl:"pl-PL",
cs:"cs-CZ",
sk:"sk-SK",
hu:"hu-HU",
ro:"ro-RO",
bg:"bg-BG",
el:"el-GR",
sv:"sv-SE",
da:"da-DK",
no:"nb-NO",
fi:"fi-FI",
tr:"tr-TR",
ar:"ar-AE",
hi:"hi-IN"
};

return map[currentLanguage]||
"en-GB";

}

function formatDate(
value
){

if(!value){
return "—";
}

const date=
new Date(
value
);

if(
Number.isNaN(
date.getTime()
)
){

return "—";

}

try{

return new Intl.DateTimeFormat(
locale(),
{
day:"numeric",
month:"long",
year:"numeric"
}
)
.format(
date
);

}catch(error){

return date
.toLocaleDateString();

}

}

function getSavedMembership(){

const data=
safeJSON(
localStorage.getItem(
"petsDogueMembership"
)||
"{}"
);

if(
data &&
data.plan &&
data.status
){

return data;

}

return null;

}

function getAccountEmail(){

const membership=
getSavedMembership();

if(
membership &&
membership.email
){

return membership.email;

}

return localStorage.getItem(
"petsDogueAccountEmail"
)||
"";

}

/* =========================================================
   STRIPE PORTAL
========================================================= */

$("manageMembership")
.addEventListener(
"click",
async()=>{

const x=
t();

const button=
$("manageMembership");

const message=
$("billingMessage");

message
.classList
.remove(
"show",
"error"
);

message.textContent=
"";

const membership=
getSavedMembership();

const sessionId=
membership &&
membership.stripe &&
membership.stripe.checkoutSessionId
?membership.stripe.checkoutSessionId
:"";

if(
!sessionId
){

message.textContent=
x.billingError;

message
.classList
.add(
"show",
"error"
);

return;

}

button.disabled=
true;

button.textContent=
x.billingOpening;

try{

const response=
await fetch(
"/api/create-club-portal",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
sessionId
})

}
);

let data={};

try{

data=
await response.json();

}catch(error){}

if(
!response.ok ||
!data.portalUrl
){

throw new Error(
data.error||
x.billingError
);

}

window.location.assign(
data.portalUrl
);

}catch(error){

console.error(
"PETS & DOGUE billing:",
error
);

message.textContent=
x.billingError;

message
.classList
.add(
"show",
"error"
);

button.disabled=
false;

button.textContent=
x.manage;

}

}
);

   SIGN OUT
========================================================= */

$("signoutButton")
.addEventListener(
"click",
()=>{

localStorage.removeItem(
"petsDogueAccountEmail"
);

/*
  Membership verification is intentionally not deleted here.

  It remains on this browser so the verified Club state
  is not destroyed by a normal sign-out action.

  A proper server-side authentication system can later
  replace this browser session model.
*/

$("signinEmail")
.value=
"";

renderAccount();

}
);

/* =========================================================
   BILLING RETURN
========================================================= */

function processBillingReturn(){

const params=
new URLSearchParams(
window.location.search
);

if(
params.get(
"billing"
)!==
"return"
){

return;

}

const message=
$("billingMessage");

if(
message
){

message.textContent=
currentLanguage==="ru"
?"Вы вернулись из безопасного управления членством."
:currentLanguage==="uk"
?"Ви повернулися з безпечного керування членством."
:"You have returned from secure membership management.";

message
.classList
.add(
"show"
);

}

try{

const url=
new URL(
window.location.href
);

url.searchParams
.delete(
"billing"
);

window.history.replaceState(
{},
document.title,
url.pathname+
url.search+
url.hash
);

}catch(error){}

}

LANG[code] &&
code!==currentLanguage

);

}

}
);

========================================================= */

if(
window.PDI18N &&
typeof window.PDI18N.init===
"function"
){

initialLanguage=
window.PDI18N.init()||
"en";

}

if(
!LANG[initialLanguage]
){

initialLanguage="en";

}

const savedEmail=
getAccountEmail();

if(
savedEmail
){

$("signinEmail")
.value=
savedEmail;

}

renderLanguage(
initialLanguage
);

processBillingReturn();
