<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PETS & DOGUE account">
<title>PETS & DOGUE — Account</title>

<style>
:root{
--black:#070707;
--cream:#f5f0e6;
--gold:#bd8b29;
--green:#58e814;
--grey:#706c66;
--line:#cbc4b8;
--red:#c62b2b;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
min-height:100%;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.locked{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

.site-header{
background:var(--black);
color:#fff;
}

.header-main{
height:106px;
display:grid;
grid-template-columns:48px 1fr 48px;
align-items:center;
padding:0 16px;
border-bottom:1px solid #292929;
}

.menu-button,
.profile-button{
width:46px;
height:46px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.menu-button{
flex-direction:column;
gap:6px;
}

.menu-button span{
width:31px;
height:2px;
background:#fff;
border-radius:20px;
}

.brand{
justify-self:center;
text-align:center;
line-height:.86;
}

.brand-small{
font-family:var(--serif);
font-size:10px;
letter-spacing:2.7px;
color:var(--gold);
margin-bottom:5px;
}

.brand-big{
font-family:var(--serif);
font-size:41px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.profile-icon{
position:relative;
width:29px;
height:29px;
}

.profile-icon:before{
content:"";
position:absolute;
left:8px;
top:1px;
width:10px;
height:10px;
border:2px solid #fff;
border-radius:50%;
}

.profile-icon:after{
content:"";
position:absolute;
left:2px;
bottom:1px;
width:23px;
height:12px;
border:2px solid #fff;
border-bottom:0;
border-radius:16px 16px 0 0;
}

.category-nav{
height:56px;
display:flex;
align-items:center;
gap:28px;
padding:0 18px;
overflow-x:auto;
scrollbar-width:none;
border-bottom:1px solid #292929;
font-size:10px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.category-nav::-webkit-scrollbar{
display:none;
}

.category-nav a{
white-space:nowrap;
}

.account-page{
width:min(560px,calc(100% - 34px));
margin:auto;
padding:29px 0 34px;
}

.account-brand{
text-align:center;
margin-bottom:17px;
}

.account-brand-small{
font-family:var(--serif);
font-size:9px;
font-weight:700;
letter-spacing:2.6px;
color:var(--gold);
}

.account-brand-big{
font-family:var(--serif);
font-size:34px;
font-weight:400;
letter-spacing:2.5px;
color:var(--gold);
}

.account-page h1{
font-family:var(--serif);
font-size:38px;
font-weight:400;
text-align:center;
line-height:1;
}

.intro{
margin:9px auto 21px;
max-width:460px;
font-size:12px;
line-height:1.45;
text-align:center;
color:var(--grey);
}

.field-label{
display:block;
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
text-transform:uppercase;
margin-bottom:6px;
}

.input-wrap input{
width:100%;
height:51px;
padding:0 13px;
border:1.5px solid #111;
background:#fff;
font-size:16px;
outline:none;
}

.input-wrap.error input{
border:2px solid var(--red);
background:#fff8f8;
}

.error-text{
display:none;
font-size:8px;
font-weight:700;
color:var(--red);
margin-top:5px;
}

.input-wrap.error .error-text{
display:block;
}

.continue-button,
.club-button{
width:100%;
height:51px;
border:0;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:900;
letter-spacing:1.5px;
text-transform:uppercase;
}

.continue-button{
margin-top:10px;
background:#080808;
color:#fff;
}

.help-link{
display:inline-block;
font-size:10px;
margin-top:12px;
text-decoration:underline;
text-underline-offset:3px;
}

.divider{
display:flex;
align-items:center;
gap:12px;
margin:23px 0 15px;
font-size:8px;
font-weight:900;
letter-spacing:1.5px;
color:#89837b;
text-transform:uppercase;
}

.divider:before,
.divider:after{
content:"";
height:1px;
background:var(--line);
flex:1;
}

.club-button{
background:var(--green);
color:#071007;
}

.legal{
max-width:470px;
margin:15px auto 0;
font-size:8px;
line-height:1.5;
color:#77716a;
text-align:center;
}

.legal a{
text-decoration:underline;
text-underline-offset:2px;
}

.mini-footer{
background:#070707;
color:#fff;
text-align:center;
padding:18px 14px;
}

.mini-footer strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.mini-footer span{
display:block;
margin-top:4px;
font-size:7px;
letter-spacing:1.2px;
color:#888;
}

.menu-overlay{
position:fixed;
inset:0;
z-index:8000;
background:rgba(0,0,0,.68);
opacity:0;
visibility:hidden;
transition:.2s;
}

.menu-overlay.show{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
top:0;
bottom:0;
left:0;
z-index:8100;
width:min(355px,88vw);
background:#090909;
color:#fff;
overflow-y:auto;
transform:translateX(-102%);
transition:.24s ease;
}

.side-menu.open{
transform:translateX(0);
}

.menu-head{
height:82px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 19px;
border-bottom:1px solid #292929;
}

.menu-head strong{
font-family:var(--serif);
font-size:20px;
font-weight:400;
color:#efd47a;
}

.close-menu{
width:37px;
height:37px;
border-radius:50%;
border:1px solid #555;
background:transparent;
color:#fff;
font-size:21px;
}

.menu-account{
padding:15px;
border-bottom:1px solid #292929;
}

.menu-profile{
display:flex;
align-items:center;
gap:11px;
padding:12px;
background:#151515;
}

.menu-profile-circle{
width:37px;
height:37px;
border:1px solid #777;
border-radius:50%;
position:relative;
}

.menu-profile-circle:before{
content:"";
position:absolute;
width:9px;
height:9px;
border:1.5px solid #fff;
border-radius:50%;
top:6px;
left:12px;
}

.menu-profile-circle:after{
content:"";
position:absolute;
width:19px;
height:10px;
border:1.5px solid #fff;
border-bottom:0;
border-radius:15px 15px 0 0;
left:7px;
bottom:5px;
}

.menu-profile strong{
display:block;
font-size:11px;
}

.menu-profile span{
display:block;
font-size:8px;
color:#aaa;
margin-top:3px;
}

.menu-list{
padding:8px 16px 21px;
}

.menu-list a{
min-height:44px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #252525;
font-size:11px;
font-weight:700;
}

.menu-list a:after{
content:"›";
font-family:var(--serif);
font-size:19px;
color:#777;
}

.menu-club{
color:#efd47a;
}

.language-area{
padding:17px 16px 24px;
border-top:1px solid #292929;
}

.language-area label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:1.8px;
color:#999;
margin-bottom:7px;
}

.language-area select{
width:100%;
height:42px;
padding:0 10px;
border:1px solid #444;
background:#111;
color:#fff;
}

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .side-menu{
left:auto;
right:0;
transform:translateX(102%);
}

html[dir="rtl"] .side-menu.open{
transform:translateX(0);
}

@media(min-width:760px){

.header-main{
height:116px;
}

.brand-big{
font-size:48px;
}

.account-page{
padding-top:38px;
}

}
</style>
</head>

function setText(id,value){
const el=document.getElementById(id);
if(el)el.textContent=value;
}

function applyLanguage(code){

if(!ACCOUNT_TEXT[code]){
code="en";
}

PDI18N.setLanguage(code);

const x=ACCOUNT_TEXT[code];

const navIds=[
"navMagazine","navArticles","navPhotos",
"navStars","navMarketplace","navPlaces"
];

navIds.forEach((id,i)=>setText(id,x[i]));

setText("menuHome",x[6]);
setText("menuIssue",x[7]);
setText("menuArticles",x[1]);
setText("menuPhotos",x[2]);
setText("menuStars",x[3]);
setText("menuMarketplace",x[4]);
setText("menuPlaces",x[5]);
setText("menuClub","PETS & DOGUE Club");

setText("menuAccountTitle",x[8]);
setText("menuAccountText",x[9]);
setText("languageLabel",x[10]);

setText("signInTitle",x[11]);
setText("signInIntro",x[12]);
setText("emailLabel",x[13]);
setText("continueButton",x[14]);
setText("helpLink",x[15]);
setText("dividerText",x[16]);
setText("joinClubButton",x[17]);
setText("legalStart",x[18]);
setText("termsLink",x[19]);
setText("legalAnd",x[20]);
setText("privacyLink",x[21]);
setText("emailError",x[22]);
setText("footerText",x[23]);

document.getElementById("languageSelect").value=code;
}

function validEmail(value){
return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function openMenu(){
sideMenu.classList.add("open");
menuOverlay.classList.add("show");
document.body.classList.add("locked");
}

function closeMenu(){
sideMenu.classList.remove("open");
menuOverlay.classList.remove("show");
document.body.classList.remove("locked");
}

const sideMenu=document.getElementById("sideMenu");
const menuOverlay=document.getElementById("menuOverlay");

document.getElementById("menuOpen").addEventListener("click",openMenu);
document.getElementById("menuClose").addEventListener("click",closeMenu);
menuOverlay.addEventListener("click",closeMenu);

document.getElementById("languageSelect").addEventListener("change",function(){
applyLanguage(this.value);
});

document.getElementById("signInForm").addEventListener("submit",function(event){

event.preventDefault();

const input=document.getElementById("accountEmail");
const wrap=document.getElementById("emailWrap");

if(!validEmail(input.value.trim())){

wrap.classList.add("error");
input.focus();
return;
}

wrap.classList.remove("error");

localStorage.setItem(
"petsDogueAccountEmail",
input.value.trim()
);

location.href="profile.html";
});

document.getElementById("accountEmail").addEventListener("input",function(){

if(validEmail(this.value.trim())){
document.getElementById("emailWrap").classList.remove("error");
}
});

window.addEventListener("petsdogue:languagechange",function(event){

const code=event.detail && event.detail.language;

if(code && ACCOUNT_TEXT[code]){
applyLanguage(code);
}

});

const initial=PDI18N.init();

applyLanguage(initial);

const savedEmail=localStorage.getItem("petsDogueAccountEmail");

if(savedEmail){
document.getElementById("accountEmail").value=savedEmail;
}
</script>
