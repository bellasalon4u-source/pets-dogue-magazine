<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
name="description"
content="PETS & DOGUE account and Club membership.">

<title>PETS & DOGUE — My Account</title>

<style>
:root{
--black:#070707;
--black2:#111;
--cream:#f5f0e6;
--white:#fff;
--gold:#bd8b29;
--gold-light:#efd47a;
--green:#65e51f;
--green-dark:#176b3b;
--grey:#706b64;
--line:#cbc4b8;
--soft:#f9f7f2;
--red:#b62929;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.locked{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
max-width:100%;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
background:var(--black);
color:#fff;
position:sticky;
top:0;
z-index:1800;
border-bottom:1px solid #292929;
}

.header-main{
height:108px;
display:grid;
grid-template-columns:58px minmax(0,1fr) auto;
align-items:center;
gap:7px;
padding:0 10px;
max-width:1550px;
margin:auto;
}

.menu-button,
.profile-button{
width:46px;
height:46px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.menu-button{
position:relative;
flex-direction:column;
gap:6px;
}

.menu-button span.line{
width:29px;
height:2px;
background:#fff;
border-radius:20px;
margin-left:7px;
}

.menu-lang-mark{
position:absolute;
left:0;
top:0;
width:19px;
height:19px;
border:1.3px solid #fff;
border-radius:50%;
background:#070707;
display:flex;
align-items:center;
justify-content:center;
font-family:var(--serif);
font-size:9px;
font-weight:bold;
}

.brand{
justify-self:center;
text-align:center;
line-height:.86;
}

.brand-small{
font-family:var(--serif);
font-size:11px;
letter-spacing:2.4px;
color:var(--gold);
margin-bottom:5px;
}

.brand-big{
font-family:var(--serif);
font-size:42px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.header-actions{
display:flex;
align-items:center;
gap:5px;
}

.subscribe-head{
min-height:40px;
padding:0 12px;
border:0;
background:var(--green);
color:#080808;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:900;
letter-spacing:.8px;
text-transform:uppercase;
white-space:nowrap;
}

.profile-icon{
position:relative;
width:28px;
height:28px;
}

.profile-icon:before{
content:"";
position:absolute;
left:50%;
top:1px;
transform:translateX(-50%);
width:9px;
height:9px;
border:2px solid #fff;
border-radius:50%;
}

.profile-icon:after{
content:"";
position:absolute;
left:50%;
bottom:1px;
transform:translateX(-50%);
width:22px;
height:12px;
border:2px solid #fff;
border-bottom:0;
border-radius:16px 16px 0 0;
}

.category-nav{
height:56px;
display:flex;
align-items:center;
gap:28px;
padding:0 18px;
overflow-x:auto;
scrollbar-width:none;
border-top:1px solid #262626;
border-bottom:1px solid #292929;
font-size:10px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.category-nav::-webkit-scrollbar{
display:none;
}

.category-nav a{
white-space:nowrap;
}

/* =========================================================
   MENU
========================================================= */

.menu-overlay{
position:fixed;
inset:0;
z-index:8000;
background:rgba(0,0,0,.58);
opacity:0;
visibility:hidden;
transition:.22s;
backdrop-filter:blur(2px);
}

.menu-overlay.show{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
top:0;
bottom:0;
left:-500px;
z-index:8100;
width:min(455px,84vw);
background:#fff;
color:#111;
overflow-y:auto;
transition:left .3s ease;
box-shadow:22px 0 55px rgba(0,0,0,.24);
}

.side-menu.open{
left:0;
}

.menu-head{
min-height:84px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 21px;
background:#0a0a0a;
color:#fff;
border-bottom:1px solid #292929;
position:sticky;
top:0;
z-index:4;
}

.menu-head strong{
font-family:var(--serif);
font-size:32px;
font-weight:400;
}

.close-menu{
width:44px;
height:44px;
border-radius:50%;
border:0;
background:#fff;
color:#111;
font-size:24px;
}

.menu-top-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:17px 17px 12px;
background:#f7f4ed;
}

.menu-top-action{
min-height:62px;
border:1.5px solid #111;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
background:#fff;
font-size:12px;
font-weight:900;
letter-spacing:.6px;
text-transform:uppercase;
}

.menu-top-action.subscribe{
background:var(--green);
border-color:var(--green);
}

.mini-profile{
position:relative;
width:22px;
height:22px;
}

.mini-profile:before{
content:"";
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:7px;
height:7px;
border:1.7px solid currentColor;
border-radius:50%;
}

.mini-profile:after{
content:"";
position:absolute;
left:50%;
bottom:0;
transform:translateX(-50%);
width:18px;
height:9px;
border:1.7px solid currentColor;
border-bottom:0;
border-radius:14px 14px 0 0;
}

.language-area{
margin:0 17px 13px;
padding:12px 14px;
border:1.5px solid #111;
background:#fff;
}

.language-area label{
display:block;
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
color:#777;
margin-bottom:7px;
text-transform:uppercase;
}

.language-area select{
width:100%;
height:34px;
border:0;
background:#fff;
color:#111;
font-weight:800;
outline:none;
}

.menu-list{
padding:6px 17px 18px;
border-top:1px solid #ddd;
}

.menu-list a{
min-height:47px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #d8d2c8;
font-size:12px;
font-weight:800;
}

.menu-list a:after{
content:"›";
font-family:var(--serif);
font-size:20px;
color:#777;
}

.menu-account-link{
font-weight:900!important;
}

.menu-contact-wrap{
padding:17px;
background:#f4f0e7;
border-top:1px solid #ddd;
}

.menu-contact{
width:100%;
min-height:56px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
color:#fff;
font-size:12px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.menu-legal{
display:flex;
gap:13px;
flex-wrap:wrap;
margin-top:14px;
}

.menu-legal a{
font-size:10px;
font-weight:700;
color:#777;
}

/* =========================================================
   MAIN
========================================================= */

.account-page{
max-width:800px;
margin:0 auto;
}

/* =========================================================
   SIGN IN
========================================================= */

.signin-view{
padding:40px 20px 56px;
text-align:center;
}

.account-mark{
width:62px;
height:62px;
margin:0 auto 15px;
border:1.5px solid #111;
border-radius:50%;
position:relative;
}

.account-mark:before{
content:"";
position:absolute;
left:50%;
top:11px;
transform:translateX(-50%);
width:15px;
height:15px;
border:2px solid #111;
border-radius:50%;
}

.account-mark:after{
content:"";
position:absolute;
left:50%;
bottom:10px;
transform:translateX(-50%);
width:32px;
height:17px;
border:2px solid #111;
border-bottom:0;
border-radius:23px 23px 0 0;
}

.signin-view h1{
font-family:var(--serif);
font-size:40px;
font-weight:400;
line-height:1;
}

.signin-intro{
font-size:12px;
line-height:1.55;
color:var(--grey);
margin:11px auto 24px;
max-width:520px;
}

.signin-form{
max-width:520px;
margin:auto;
text-align:left;
}

.form-label{
display:block;
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
margin-bottom:7px;
text-transform:uppercase;
}

.signin-input{
width:100%;
height:52px;
padding:0 14px;
border:1.5px solid #111;
background:#fff;
font-size:16px;
outline:none;
}

.signin-input.error{
border:2px solid var(--red);
background:#fff8f8;
}

.signin-error{
display:none;
color:var(--red);
font-size:9px;
font-weight:700;
margin-top:6px;
}

.signin-error.show{
display:block;
}

.primary-button{
width:100%;
min-height:50px;
border:0;
background:#090909;
color:#fff;
font-size:10px;
font-weight:900;
letter-spacing:1.4px;
margin-top:9px;
}

.primary-button:disabled{
opacity:.55;
cursor:wait;
}

.signin-help{
display:inline-block;
margin-top:15px;
font-size:11px;
text-decoration:underline;
}

.join-button{
display:flex;
align-items:center;
justify-content:center;
width:100%;
max-width:520px;
margin:22px auto 0;
min-height:52px;
background:var(--green);
color:#111;
font-size:10px;
font-weight:900;
letter-spacing:1px;
}

.signin-legal{
font-size:8px;
line-height:1.6;
color:#827c74;
margin:17px auto 0;
max-width:500px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-view{
display:none;
}

.profile-hero{
background:#090909;
color:#fff;
padding:30px 20px 25px;
}

.profile-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.3px;
color:var(--gold-light);
text-transform:uppercase;
}

.profile-hero h1{
font-family:var(--serif);
font-size:35px;
font-weight:400;
line-height:1.05;
margin-top:7px;
}

.profile-email{
font-size:10px;
color:#bbb;
margin-top:7px;
word-break:break-word;
}

.profile-status{
display:inline-flex;
align-items:center;
gap:6px;
margin-top:14px;
padding:6px 10px;
border:1px solid #555;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.status-dot{
width:7px;
height:7px;
border-radius:50%;
background:#aaa;
}

.profile-status.active{
border-color:#3d8d5f;
}

.profile-status.active .status-dot{
background:var(--green);
}

/* =========================================================
   CONTENT
========================================================= */

.content-section{
padding:22px 16px;
border-bottom:1px solid #d7d0c5;
}

.section-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.2px;
color:var(--gold);
text-transform:uppercase;
margin-bottom:5px;
}

.section-title{
font-family:var(--serif);
font-size:29px;
font-weight:400;
line-height:1.05;
}

/* =========================================================
   CLUB
========================================================= */

.club-card{
margin-top:15px;
border:1px solid #bfb8ad;
background:#fff;
}

.club-card-head{
background:#090909;
color:#fff;
padding:16px;
display:flex;
justify-content:space-between;
gap:15px;
align-items:flex-start;
}

.club-card-label{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.7px;
color:var(--gold-light);
margin-bottom:5px;
}

.club-card-plan{
font-family:var(--serif);
font-size:23px;
font-weight:400;
line-height:1.05;
}

.club-card-price{
font-family:var(--serif);
font-size:20px;
white-space:nowrap;
}

.club-row{
display:flex;
justify-content:space-between;
gap:18px;
padding:12px 14px;
border-bottom:1px solid #ddd7ce;
font-size:10px;
line-height:1.4;
}

.club-row span{
color:#777169;
}

.club-row strong{
text-align:right;
word-break:break-word;
}

.club-row:last-child{
border-bottom:0;
}

.manage-button{
width:100%;
height:49px;
border:0;
background:#111;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.3px;
margin-top:10px;
}

.manage-button:disabled{
opacity:.55;
cursor:wait;
}

.billing-note{
font-size:8px;
line-height:1.5;
color:#777;
text-align:center;
margin-top:9px;
}

.billing-message{
display:none;
padding:10px;
margin-top:10px;
border:1px solid #bfb8ad;
background:#faf8f4;
font-size:9px;
line-height:1.5;
}

.billing-message.show{
display:block;
}

.billing-message.error{
border-color:var(--red);
background:#fff5f5;
color:var(--red);
}

.no-club{
margin-top:15px;
padding:21px 17px;
border:1px solid #c9c2b7;
background:#fff;
text-align:center;
}

.no-club h3{
font-family:var(--serif);
font-size:25px;
font-weight:400;
}

.no-club p{
font-size:10px;
line-height:1.5;
color:#716b64;
margin:8px auto 15px;
max-width:460px;
}

.no-club .join-button{
margin:0;
max-width:none;
min-height:48px;
}

/* =========================================================
   PET
========================================================= */

.pet-panel{
margin-top:15px;
background:#fff;
border:1px solid #c9c2b7;
padding:16px;
}

.pet-empty{
text-align:center;
padding:12px 4px;
font-size:10px;
line-height:1.5;
color:#777;
}

.pet-info{
display:none;
grid-template-columns:1fr 1fr;
gap:1px;
background:#ddd6cc;
border:1px solid #ddd6cc;
}

.pet-info.show{
display:grid;
}

.pet-detail{
background:#fff;
padding:13px;
min-height:67px;
}

.pet-detail span{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.2px;
color:#8a847d;
margin-bottom:5px;
text-transform:uppercase;
}

.pet-detail strong{
display:block;
font-family:var(--serif);
font-size:17px;
font-weight:400;
word-break:break-word;
}

/* =========================================================
   QUICK ACCESS
========================================================= */

.quick-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:15px;
}

.quick-link{
min-height:96px;
background:#fff;
border:1px solid #c8c1b6;
padding:14px;
display:flex;
flex-direction:column;
justify-content:flex-end;
}

.quick-icon{
font-size:20px;
margin-bottom:auto;
}

.quick-link strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
}

.quick-link span{
font-size:8px;
line-height:1.35;
color:#777;
margin-top:4px;
}

/* =========================================================
   ACCOUNT ACTIONS
========================================================= */

.account-actions{
display:grid;
gap:7px;
margin-top:15px;
}

.account-action{
width:100%;
min-height:46px;
border:1px solid #111;
background:#fff;
color:#111;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:900;
letter-spacing:1.2px;
}

.account-action.black{
background:#111;
color:#fff;
}

.account-action.danger{
border-color:#aaa;
color:#777;
}

/* =========================================================
   FOOTER
========================================================= */

.site-footer{
background:#090909;
color:#fff;
text-align:center;
padding:28px 18px;
}

.footer-brand{
font-family:var(--serif);
font-size:26px;
font-weight:400;
letter-spacing:2.6px;
color:var(--gold);
}

.footer-subtitle{
font-size:7px;
letter-spacing:1.3px;
color:#888;
margin-top:6px;
}

.footer-links{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin-top:20px;
font-size:8px;
color:#bbb;
}

/* =========================================================
   RTL
========================================================= */

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .side-menu{
left:auto;
right:-500px;
transition:right .3s ease;
box-shadow:-22px 0 55px rgba(0,0,0,.24);
}

html[dir="rtl"] .side-menu.open{
right:0;
left:auto;
}

html[dir="rtl"] .signin-form{
text-align:right;
}

html[dir="rtl"] .club-row strong{
text-align:left;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:760px){

.header-main{
height:116px;
}

.brand-big{
font-size:49px;
}

.signin-view{
padding-top:58px;
}

.signin-view h1{
font-size:50px;
}

.content-section{
padding:28px 20px;
}

.quick-grid{
grid-template-columns:repeat(4,1fr);
}

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

.header-main{
height:87px;
grid-template-columns:48px minmax(0,1fr) auto;
padding:0 5px;
gap:3px;
}

.brand-big{
font-size:31px;
letter-spacing:1px;
}

.brand-small{
font-size:9px;
}

.subscribe-head{
min-height:38px;
padding:0 8px;
font-size:9px;
letter-spacing:.35px;
}

.profile-button{
width:36px;
}

.side-menu{
width:84vw;
}

.menu-head strong{
font-size:28px;
}

.menu-top-actions{
padding:14px 14px 10px;
gap:8px;
}

.menu-top-action{
min-height:57px;
font-size:10px;
}

.language-area{
margin:0 14px 12px;
}

.menu-list{
padding:5px 14px 15px;
}

.signin-view{
padding:31px 16px 45px;
}

.signin-view h1{
font-size:36px;
}

}
</style>

const $=id=>document.getElementById(id);

/* =========================================================
   HELPERS
========================================================= */

function t(){
return TRANSLATIONS[currentLanguage]||TRANSLATIONS.en;
}

function text(id,value){

const element=$(id);

if(element){
element.textContent=
value===undefined||
value===null
?""
:String(value);
}

}

function safeJSON(value,fallback={}){

try{
return JSON.parse(value);
}catch(error){
return fallback;
}

}

function validEmail(value){

return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
.test(
String(value||"").trim()
);

}

function formatDate(value){

if(!value){
return "—";
}

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return "—";
}

try{

return new Intl.DateTimeFormat(
LOCALES[currentLanguage]||"en-GB",
{
day:"numeric",
month:"long",
year:"numeric"
}
).format(date);

}catch(error){

return date.toLocaleDateString();

}

}

function getSavedMembership(){

const data=
safeJSON(
localStorage.getItem("petsDogueMembership")||"{}"
);

if(
data &&
data.plan &&
data.status
){
return data;
}

return null;

}

function getAccountEmail(){

const membership=getSavedMembership();

if(
membership &&
membership.email
){
return membership.email;
}

return localStorage.getItem("petsDogueAccountEmail")||"";

}

   SIGN IN
========================================================= */

$("signinForm").addEventListener(
"submit",
event=>{

event.preventDefault();

const email=
$("signinEmail")
.value
.trim();

if(!validEmail(email)){

$("signinEmail").classList.add("error");
$("signinError").classList.add("show");
$("signinEmail").focus();

return;

}

$("signinEmail").classList.remove("error");
$("signinError").classList.remove("show");

localStorage.setItem(
"petsDogueAccountEmail",
email
);

renderAccount();

}
);

$("signinEmail").addEventListener(
"input",
()=>{

$("signinEmail").classList.remove("error");
$("signinError").classList.remove("show");

}
);

/* =========================================================
   ACCOUNT
========================================================= */

function renderAccount(){

const x=t();

const email=getAccountEmail();

currentMembership=getSavedMembership();

if(!email){

$("signinView").style.display="block";
$("profileView").style.display="none";

return;

}

$("signinView").style.display="none";
$("profileView").style.display="block";

text("profileEmail",email);

if(currentMembership){

$("profileStatus").classList.add("active");

text(
"profileStatusText",
currentMembership.status==="trialing"
?x.trial
:x.clubMember
);

$("activeClubBox").style.display="block";
$("noClubBox").style.display="none";

renderMembership(currentMembership);
renderPet(currentMembership);

}else{

$("profileStatus").classList.remove("active");

text(
"profileStatusText",
x.reader
);

$("activeClubBox").style.display="none";
$("noClubBox").style.display="block";

renderPet(null);

}

}

/* =========================================================
   MEMBERSHIP
========================================================= */

function renderMembership(membership){

const x=t();

const plan=
membership.plan||
"monthly";

text(
"clubPlan",
x.plans[plan]||
plan
);

text(
"clubPrice",
x.prices[plan]||
""
);

text(
"clubStatus",
membership.status==="trialing"
?x.trial
:x.active
);

const dates=
membership.dates||
{};

text(
"clubStart",
formatDate(
dates.startedAt||
membership.startedAt
)
);

text(
"clubUntil",
formatDate(
dates.validUntil||
membership.validUntil
)
);

text(
"clubNext",
formatDate(
dates.nextPayment||
membership.nextPayment
)
);

text(
"clubEmail",
membership.email||
getAccountEmail()
);

}

   PET
========================================================= */

function renderPet(membership){

const x=t();

const pet=
membership &&
membership.pet
?membership.pet
:null;

if(
!pet ||
!(
pet.name ||
pet.type ||
pet.breed
)
){

$("petEmpty").style.display="block";
$("petInfo").classList.remove("show");

return;

}

$("petEmpty").style.display="none";
$("petInfo").classList.add("show");

text(
"petNameValue",
pet.name||
x.notAdded
);

text(
"petTypeValue",
pet.type||
x.notAdded
);

text(
"petBreedValue",
pet.breed||
x.notAdded
);

text(
"petProfileValue",
membership.email||
x.notAdded
);

}

/* =========================================================
   STRIPE PORTAL
========================================================= */

$("manageMembership").addEventListener(
"click",
async()=>{

const x=t();

const button=$("manageMembership");
const message=$("billingMessage");

message.classList.remove(
"show",
"error"
);

message.textContent="";

const membership=
getSavedMembership();

const sessionId=
membership &&
membership.stripe &&
membership.stripe.checkoutSessionId
?membership.stripe.checkoutSessionId
:"";

if(!sessionId){

message.textContent=x.billingError;

message.classList.add(
"show",
"error"
);

return;

}

button.disabled=true;
button.textContent=x.billingOpening;

try{

const response=
await fetch(
"/api/create-club-portal",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
sessionId
})
}
);

let data={};

try{
data=await response.json();
}catch(error){}

if(
!response.ok ||
!data.portalUrl
){

throw new Error(
data.error||
x.billingError
);

}

window.location.assign(
data.portalUrl
);

}catch(error){

console.error(
"PETS & DOGUE billing:",
error
);

message.textContent=x.billingError;

message.classList.add(
"show",
"error"
);

button.disabled=false;
button.textContent=x.manage;

}

}
);

/* =========================================================
   SIGN OUT
========================================================= */

$("signoutButton").addEventListener(
"click",
()=>{

localStorage.removeItem(
"petsDogueAccountEmail"
);

$("signinEmail").value="";

renderAccount();

}
);

/* =========================================================
   BILLING RETURN
========================================================= */

function processBillingReturn(){

const params=
new URLSearchParams(
window.location.search
);

if(
params.get("billing")!=="return"
){
return;
}

const message=$("billingMessage");

if(message){

message.textContent=
t().billingReturn;

message.classList.add("show");

}

try{

const url=
new URL(
window.location.href
);

url.searchParams.delete("billing");

window.history.replaceState(
{},
document.title,
url.pathname+
url.search+
url.hash
);

}catch(error){}

}

/* =========================================================
   LANGUAGE
========================================================= */

$("languageSelect").addEventListener(
"change",
function(){

changeLanguage(
this.value
);

}
);

window.addEventListener(
"petsdogue:languagechange",
event=>{

const code=
event.detail &&
event.detail.language;

if(
code &&
SUPPORTED.includes(code) &&
code!==currentLanguage
){

renderLanguage(code);

}

}
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
"keydown",
event=>{

if(event.key==="Escape"){
closeMenu();
}

}
);

/* =========================================================
   START
========================================================= */

let initialLanguage=
localStorage.getItem(
LANGUAGE_KEY
)||
"en";

if(
window.PDI18N &&
typeof window.PDI18N.init==="function"
){

const result=
window.PDI18N.init();

if(
typeof result==="string" &&
SUPPORTED.includes(result)
){

initialLanguage=result;

}

}

if(!SUPPORTED.includes(initialLanguage)){
initialLanguage="en";
}

const savedEmail=
getAccountEmail();

if(savedEmail){
$("signinEmail").value=savedEmail;
}

renderLanguage(initialLanguage);

processBillingReturn();

</script>

</body>
</html>
