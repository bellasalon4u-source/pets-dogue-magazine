<script>
(function () {
"use strict";

const LANGUAGE_KEY="pets_dogue_language";
const LANGUAGE_ALIASES={ua:"uk",cz:"cs",gr:"el",se:"sv",dk:"da"};

let language="en";
let bundle=null;
let speaking=false;
let speechToken=0;
let utterance=null;

function getElement(id){
  return document.getElementById(id);
}

function normaliseLanguage(value){
  const code=String(value||"en").trim().toLowerCase().split(/[-_]/)[0];
  return LANGUAGE_ALIASES[code]||code;
}

function getSelectedLanguage(){
  try{
    return normaliseLanguage(localStorage.getItem(LANGUAGE_KEY)||"en");
  }catch(error){
    return normaliseLanguage(document.documentElement.lang||"en");
  }
}

function stopSpeech(){
  speechToken++;
  speaking=false;
  utterance=null;

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

  const button=getElement("egyptListen");
  const label=getElement("egyptListenLabel");

  if(button)button.setAttribute("aria-pressed","false");
  if(label&&bundle)label.textContent=bundle.ui.listen;
}

function setupGalleries(){
  document.querySelectorAll(".egypt-gallery").forEach(function(gallery){
    const track=gallery.querySelector(".egypt-track");
    if(!track)return;

    const slides=Array.from(track.children);
    const previousButton=gallery.querySelector('button[data-step="-1"]');
    const nextButton=gallery.querySelector('button[data-step="1"]');
    const counter=gallery.querySelector(".egypt-count");

    if(!slides.length)return;

    let currentIndex=0;

    function updateStatus(){
      const firstOffset=slides[0].offsetLeft;
      let nearestIndex=0;
      let nearestDistance=Infinity;

      slides.forEach(function(slide,index){
        const distance=Math.abs(slide.offsetLeft-firstOffset-track.scrollLeft);

        if(distance<nearestDistance){
          nearestDistance=distance;
          nearestIndex=index;
        }
      });

      currentIndex=nearestIndex;

      if(counter){
        counter.textContent=(currentIndex+1)+" / "+slides.length;
      }

      if(previousButton){
        previousButton.disabled=currentIndex===0;
      }

      if(nextButton){
        nextButton.disabled=currentIndex===slides.length-1;
      }
    }

    function moveSlide(step){
      const targetIndex=Math.max(0,Math.min(slides.length-1,currentIndex+step));
      const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      track.scrollTo({
        left:slides[targetIndex].offsetLeft-slides[0].offsetLeft,
        behavior:reduceMotion?"auto":"smooth"
      });
    }

    if(previousButton){
      previousButton.addEventListener("click",function(){moveSlide(-1)});
    }

    if(nextButton){
      nextButton.addEventListener("click",function(){moveSlide(1)});
    }

    track.addEventListener("keydown",function(event){
      if(event.key!=="ArrowRight"&&event.key!=="ArrowLeft")return;
      event.preventDefault();
      moveSlide(event.key==="ArrowRight"?1:-1);
    });

    track.addEventListener("scroll",updateStatus,{passive:true});
    updateStatus();
  });
}

function setMeta(selector,value){
  const element=document.querySelector(selector);
  if(element)element.setAttribute("content",value);
}

function styleEditorialBody(body){
  const children=Array.from(body.children);
  body.replaceChildren();

  let chapter=null;
  let prose=null;
  let headingIndex=-1;
  let paragraphCount=0;
  let groupSize=0;

  const colors={
    2:"note",
    3:"lemon",
    4:"verdict",
    5:"green",
    6:"verdict",
    7:"blue",
    8:"lemon",
    9:"green",
    10:"blue",
    11:"lemon",
    12:"green",
    13:"blue",
    14:"green",
    15:"lemon",
    16:"blue",
    17:"lemon",
    19:"finale"
  };

  const extraPhotos={
    0:["69918","69927"],
    1:["71599","69945"],
    3:["69243","69238","69226"],
    5:["69215","69221"],
    7:["71315"],
    11:["cleomoray-generated"],
    13:["egypt-dolphins-reef","egypt-dolphins-pair","egypt-dolphins-surface"],
    16:["70110","70117"],
    18:["69938","70674"]
  };

  function newChapter(index){
    const section=document.createElement("section");
    section.className="egypt-chapter";
    section.dataset.chapter=String(index);

    if(colors[index]){
      section.classList.add("egypt-"+colors[index]);
    }

    body.appendChild(section);
    prose=null;
    paragraphCount=0;
    groupSize=0;

    return section;
  }

  function addPhotos(){
    const photos=extraPhotos[headingIndex];
    if(!photos)return;

    const row=document.createElement("div");
    row.className="egypt-inline-photos";

    if(photos.length===1){
      row.classList.add("egypt-single-photo");
    }

    photos.forEach(function(name){
      const image=document.createElement("img");
      image.src="/"+name+".jpg";
      image.alt="";
      image.loading="lazy";
      image.decoding="async";
      row.appendChild(image);
    });

    if(headingIndex===13){
      row.classList.add("egypt-dolphin-photos");

      const caption=document.createElement("p");
      caption.className="egypt-generated-label";
      caption.textContent=language==="ru"
        ?"Дельфины · сгенерированные иллюстрации"
        :"Dolphins · AI-generated illustrations";

      row.appendChild(caption);
    }

    chapter.appendChild(row);
    prose=null;
    groupSize=0;
  }

  children.forEach(function(node){
    if(node.matches(".egypt-panel, .egypt-subheading")){
      headingIndex++;
      chapter=newChapter(headingIndex);

      if(node.matches(".egypt-panel")){
        node.classList.add("egypt-split-panel");

        if(headingIndex%2===1){
          node.classList.add("egypt-image-right");
        }

        if(headingIndex===3){
          node.classList.add("egypt-tamara-panel");
          node.querySelector("img").src="/69232.jpg";
        }

        if(headingIndex===16){
          node.classList.add("egypt-crab-panel");
        }
      }

      chapter.appendChild(node);
      return;
    }

    if(!chapter){
      chapter=newChapter(-1);
    }

    if(node.matches(".egypt-paragraph")){
      if(!prose||groupSize>=4){
        prose=document.createElement("div");
        prose.className="egypt-prose";
        chapter.appendChild(prose);
        groupSize=0;
      }

      prose.appendChild(node);
      prose.appendChild(document.createTextNode(" "));

      if(node.textContent.trim().length>180){
        node.classList.add("egypt-long-paragraph");
      }

      groupSize++;
      paragraphCount++;

      if(paragraphCount===4){
        addPhotos();
      }
    }else{
      chapter.appendChild(node);
      prose=null;
      groupSize=0;
    }
  });
}

function setupGalleries(){
  document.querySelectorAll(".egypt-gallery").forEach(function(gallery){
    const track=gallery.querySelector(".egypt-track");
    if(!track)return;
    const slides=Array.from(track.children);
    if(!slides.length)return;
    const previous=gallery.querySelector('button[data-step="-1"]');
    const next=gallery.querySelector('button[data-step="1"]');
    let current=0;

    function position(index){
      return slides[index].offsetLeft
        -track.offsetLeft
        -(track.clientWidth-slides[index].offsetWidth)/2;
    }

    function update(){
      let closest=Infinity;
      slides.forEach(function(slide,index){
        const distance=Math.abs(position(index)-track.scrollLeft);
        if(distance<closest){
          closest=distance;
          current=index;
        }
      });
      slides.forEach(function(slide,index){
        slide.classList.toggle("is-current",index===current);
      });
      if(previous)previous.disabled=current===0;
      if(next)next.disabled=current===slides.length-1;
    }

    function move(step){
      const target=Math.max(0,Math.min(slides.length-1,current+step));
      track.scrollTo({
        left:position(target),
        behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ?"auto":"smooth"
      });
    }

    previous?.addEventListener("click",function(){move(-1)});
    next?.addEventListener("click",function(){move(1)});
    track.addEventListener("scroll",update,{passive:true});
    track.addEventListener("keydown",function(event){
      if(event.key==="ArrowLeft"||event.key==="ArrowRight"){
        event.preventDefault();
        move(event.key==="ArrowRight"?1:-1);
      }
    });
    requestAnimationFrame(update);
    slides.forEach(function(slide){
      slide.querySelector("img")?.addEventListener("load",update,{once:true});
    });
  });
}

function renderArticle(){
  const translations=window.PetsDogueTranslations?.article;
  const article=getElement("egyptArticle");
  const body=getElement("egyptBody");

  if(!translations||!article||!body)return;

  const selectedLanguage=getSelectedLanguage();
  const selectedStory=translations[selectedLanguage]?.stories?.egypt;
  const nextLanguage=selectedStory?selectedLanguage:"en";
  const nextStory=translations[nextLanguage]?.stories?.egypt;

  if(!nextStory||typeof nextStory.body!=="string")return;

  stopSpeech();
  language=nextLanguage;

  const sharedUI=translations[language].ui||{};

  bundle={
    ...nextStory,
    ui:{
      listen:sharedUI.listen||"Listen",
      stop:sharedUI.stop||"Stop",
      back:sharedUI.backToArticles||"Articles",
      unavailable:"Speech is unavailable in this browser.",
      fallback:"This translation is not available yet. The English article is displayed.",
      ...(nextStory.editorialUI||{})
    }
  };

  article.lang=language;
  article.dir=language==="ar"?"rtl":"ltr";

  getElement("egyptTitle").textContent=bundle.title;
  getElement("egyptIntro").textContent=bundle.intro;

  body.innerHTML=bundle.body;
  styleEditorialBody(body);

  const listenButton=getElement("egyptListen");
  const listenLabel=getElement("egyptListenLabel");
  const backLink=getElement("egyptBack");
  const status=getElement("egyptSpeechStatus");
  const notice=getElement("egyptTranslationNotice");

  if(listenLabel)listenLabel.textContent=bundle.ui.listen;
  if(listenButton)listenButton.setAttribute("aria-label",bundle.ui.listen);
  if(backLink)backLink.textContent=bundle.ui.back;
  if(status)status.textContent="";

  if(notice){
    notice.hidden=selectedLanguage===language;
    notice.textContent=bundle.ui.fallback||"";
  }

  document.title=bundle.title.replace(/^🇪🇬\s*/,"")+" | PETS & DOGUE";

  setMeta('meta[name="description"]',bundle.intro);
  setMeta('meta[property="og:title"]',document.title);
  setMeta('meta[property="og:description"]',bundle.intro);
  setMeta('meta[property="og:image"]',location.origin+"/69922.jpg");
  setMeta('meta[name="twitter:title"]',document.title);
  setMeta('meta[name="twitter:description"]',bundle.intro);
  setMeta('meta[name="twitter:image"]',location.origin+"/69922.jpg");

  setupGalleries();
}

function getSpeechLocale(){
  const locales={
    en:"en-GB",uk:"uk-UA",ru:"ru-RU",
    fr:"fr-FR",de:"de-DE",es:"es-ES",
    it:"it-IT",pt:"pt-PT",nl:"nl-NL",
    pl:"pl-PL",cs:"cs-CZ",sk:"sk-SK",
    hu:"hu-HU",ro:"ro-RO",bg:"bg-BG",
    el:"el-GR",sv:"sv-SE",da:"da-DK",
    no:"nb-NO",fi:"fi-FI",tr:"tr-TR",
    ar:"ar-SA",hi:"hi-IN"
  };

  return locales[language]||"en-GB";
}

function toggleSpeech(){
  if(!bundle)return;

  if(speaking){
    stopSpeech();
    return;
  }

  if(!("speechSynthesis" in window)){
    const status=getElement("egyptSpeechStatus");
    if(status)status.textContent=bundle.ui.unavailable;
    return;
  }

  const nodes=[
    getElement("egyptTitle"),
    getElement("egyptIntro"),
    ...getElement("egyptBody").querySelectorAll(".egypt-paragraph, h2")
  ];

  const chunks=nodes.filter(Boolean)
    .map(function(node){return node.innerText.trim()})
    .filter(Boolean);

  if(!chunks.length)return;

  window.speechSynthesis.cancel();
  speaking=true;

  const activeToken=++speechToken;
  const locale=getSpeechLocale();
  let chunkIndex=0;

  getElement("egyptListen").setAttribute("aria-pressed","true");
  getElement("egyptListenLabel").textContent=bundle.ui.stop;

  function speakNextChunk(){
    if(activeToken!==speechToken||!speaking)return;

    if(chunkIndex>=chunks.length){
      stopSpeech();
      return;
    }

    utterance=new SpeechSynthesisUtterance(chunks[chunkIndex++]);
    utterance.lang=locale;
    utterance.rate=.94;

    const voices=window.speechSynthesis.getVoices();
    const voice=voices.find(function(candidate){
      return candidate.lang.toLowerCase()===locale.toLowerCase();
    })||voices.find(function(candidate){
      return candidate.lang.toLowerCase().startsWith(language);
    });

    if(voice)utterance.voice=voice;

    utterance.onend=speakNextChunk;

    utterance.onerror=function(){
      if(activeToken===speechToken)stopSpeech();
    };

    window.speechSynthesis.speak(utterance);
  }

  speakNextChunk();
}

               M60 10 Q52 29 60 48
               M77 15 Q69 29 77 43"
        fill="none" stroke="#fff7df" stroke-width="6"/>
      <path d="M50 30 Q43 45 60 40"
        fill="#ffb126" stroke="#713a19" stroke-width="1.5"/>
      <circle cx="82" cy="24" r="4" fill="#fff"/>
      <circle cx="83" cy="24" r="2.5" fill="#142531"/>
    </svg>`,

    /* Синий хирург с жёлтым хвостом. */
    `<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 100 58">
      <path d="M30 29 L5 10 Q0 29 5 48 Z"
        fill="#ffe04b" stroke="#183668" stroke-width="2"/>
      <path d="M36 15 Q55 0 76 16"
        fill="#286cef"/>
      <ellipse cx="58" cy="29" rx="34" ry="22"
        fill="#247eea" stroke="#183668" stroke-width="2"/>
      <path d="M30 26 Q46 8 69 16
               Q52 23 72 34 Q49 44 30 32 Z"
        fill="#14294c"/>
      <path d="M51 31 Q47 44 63 40"
        fill="#ffe04b"/>
      <circle cx="82" cy="24" r="4" fill="#eaf8ff"/>
      <circle cx="83" cy="24" r="2.5" fill="#142531"/>
    </svg>`
  ];

  const pauses=[3000,2000,5500,8000,4000,6500];
  const activeFish=new Set();

  let fishTimer=0;
  let fishStep=0;
  let leftToRight=true;

  function clearFish(){
    activeFish.forEach(function(animation){
      animation.cancel();
    });
    activeFish.clear();
    fishLayer.replaceChildren();
  }

  function swim(){
    if(document.hidden||motion.matches)return;

    const bounds=scene.getBoundingClientRect();
    const viewportHeight=window.innerHeight;
    const top=Math.max(180,bounds.top);
    const bottom=Math.min(viewportHeight-90,bounds.bottom);

    if(bottom-top<80||activeFish.size>=2)return;

    const width=32+Math.random()*12;
    const y=top+Math.random()*(bottom-top);
    const fish=document.createElement("div");
    const picture=document.createElement("div");

    picture.innerHTML=fishPictures[
      Math.random()<.5?0:1
    ];

    Object.assign(fish.style,{
      position:"absolute",
      top:y+"px",
      left:"0",
      width:width+"px",
      height:(width*.58)+"px",
      opacity:".7",
      willChange:"transform"
    });

    Object.assign(picture.style,{
      width:"100%",
      height:"100%",
      transform:leftToRight?"none":"scaleX(-1)"
    });

        /* Первый элемент каждого SVG — хвост рыбки. */
    const tail=picture.querySelector("svg > path");

    if(tail){
      tail.style.transformBox="view-box";
      tail.style.transformOrigin="28px 29px";

      tail.animate([
        {transform:"scaleX(1) skewY(-7deg)"},
        {transform:"scaleX(.65) skewY(7deg)"},
        {transform:"scaleX(1) skewY(-7deg)"}
      ],{
        duration:380+Math.random()*140,
        iterations:Infinity,
        easing:"ease-in-out"
      });
    }

    fish.appendChild(picture);
    fishLayer.appendChild(fish);

    const from=leftToRight
      ?-60
      :window.innerWidth+60;

    const to=leftToRight
      ?window.innerWidth+60
      :-60;

    leftToRight=!leftToRight;

    const animation=fish.animate([
      {transform:`translate(${from}px,0)`},
      {
        transform:`translate(${(from+to)/2}px,-8px)`
      },
      {transform:`translate(${to}px,3px)`}
    ],{
      duration:6500+Math.random()*2500,
      easing:"linear",
      iterations:1
    });

    activeFish.add(animation);

    animation.onfinish=function(){
      activeFish.delete(animation);
      fish.remove();
    };
  }

  function queueFish(){
    if(document.hidden||motion.matches)return;

    const pause=pauses[fishStep%pauses.length];
    fishStep++;

    fishTimer=window.setTimeout(function(){
      swim();
      queueFish();
    },pause);
  }

  function restartFish(){
    window.clearTimeout(fishTimer);
    clearFish();

    if(!document.hidden&&!motion.matches){
      queueFish();
    }
  }

  document.addEventListener(
    "visibilitychange",
    restartFish
  );

  motion.addEventListener("change",restartFish);

  window.addEventListener("pagehide",function(){
    window.clearTimeout(fishTimer);
    clearFish();
  });

  window.addEventListener("pageshow",restartFish);

  queueFish();

  let frame=0;

  function fitBackground(){
    frame=0;

    const chapters=Array.from(
      body.querySelectorAll(".egypt-chapter")
    );

    /* Последний раздел статьи — отдельное чёрное окончание. */
    let finale=body.querySelector(".egypt-finale");

    if(!finale&&chapters.length){
      finale=chapters[chapters.length-1];
      finale.classList.add("egypt-finale");
    }

    const articleBox=article.getBoundingClientRect();
    const end=finale
      ?finale.getBoundingClientRect().top-articleBox.top
      :articleBox.height;

    const height=Math.max(1,Math.round(end));
    if(scene.style.height!==height+"px"){
      scene.style.height=height+"px";
    }
  }

  function schedule(){
    if(frame)return;
    frame=requestAnimationFrame(fitBackground);
  }

  const changes=new MutationObserver(schedule);
  changes.observe(body,{childList:true,subtree:true});

  if("ResizeObserver" in window){
    const sizes=new ResizeObserver(schedule);
    sizes.observe(article);
    sizes.observe(body);
  }

  article.addEventListener("load",schedule,true);
  window.addEventListener("resize",schedule,{passive:true});

  if(document.fonts){
    document.fonts.ready.then(schedule);
  }

  schedule();
})();
</script>

</body>
</html>
