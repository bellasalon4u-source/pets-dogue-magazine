<style>
  .community-carousel {
    max-width: 930px;
    margin: 0 auto;
    overflow: hidden;
  }

  .community-carousel-track {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .community-cover {
    position: relative;
    isolation: isolate;
    flex: 0 0 min(68vw, 490px);
    height: min(104vw, 735px);
    overflow: hidden;
    color: #fff;
    background-image:
      linear-gradient(0deg, rgba(0,0,0,.88), transparent 70%),
      url("community-category-photos.png");
    background-size: 100% 100%, 500% 200%;
    background-position: center, var(--photo-x) var(--photo-y);
    cursor: pointer;
  }

  .community-cover.is-side {
    flex-basis: 18vw;
    height: min(92vw, 500px);
    opacity: .82;
  }

  .community-cover-content {
    position: absolute;
    right: 14px;
    bottom: 14px;
    left: 14px;
  }

  .community-cover h3 {
    margin: 0 0 10px;
    font: 400 clamp(28px, 7vw, 46px)/.98 Georgia, serif;
  }

  .community-cover-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .community-cover-actions button {
    min-height: 38px;
    padding: 0 11px;
    border: 1px solid #fff;
    border-radius: 24px;
    background: #111;
    color: #fff;
    font-weight: 800;
  }

  .community-cover-actions .red {
    border-color: #c8102e;
    background: #c8102e;
  }

  .community-carousel-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 14px 0;
  }

  .community-carousel-controls button {
    width: 44px;
    height: 44px;
    border: 1px solid #111;
    border-radius: 50%;
    background: transparent;
  }
</style>

<h2 class="community-section-title" id="communityChooseSection">
  Choose a section
</h2>

<section class="community-carousel" aria-label="Community sections">
  <div class="community-carousel-track" id="communityCarouselTrack"></div>

  <div class="community-carousel-controls">
    <button id="communityCarouselPrev" type="button" aria-label="Previous section">←</button>
    <span id="communityCarouselPosition"></span>
    <button id="communityCarouselNext" type="button" aria-label="Next section">→</button>
  </div>
</section>

<script>
  const communitySections = [
    { type: "lost",       photoX: "0%",   photoY: "0%" },
    { type: "seen",       photoX: "25%",  photoY: "0%" },
    { type: "found",      photoX: "50%",  photoY: "0%" },
    { type: "event",      photoX: "75%",  photoY: "0%" },
    { type: "group",      photoX: "100%", photoY: "0%" },
    { type: "help",       photoX: "0%",   photoY: "100%" },
    { type: "volunteers", photoX: "25%",  photoY: "100%" },
    { type: "foster",     photoX: "50%",  photoY: "100%" },
    { type: "adoption",   photoX: "75%",  photoY: "100%" },
    { type: "news",       photoX: "100%", photoY: "100%" }
  ];

  let communitySectionIndex = 3;

  function renderCommunitySections() {
    const t = words();
    const labels = {
      lost: t.lost,
      seen: t.seen,
      found: t.found,
      event: t.events,
      group: t.groups,
      help: t.help,
      volunteers: t.volunteers,
      foster: t.foster,
      adoption: t.adoption,
      news: t.news
    };

    const visible = [
      (communitySectionIndex + communitySections.length - 1) % communitySections.length,
      communitySectionIndex,
      (communitySectionIndex + 1) % communitySections.length
    ];

    document.getElementById("communityChooseSection").textContent = t.community;
    document.getElementById("communityCarouselTrack").innerHTML =
      visible.map((index, position) => {
        const section = communitySections[index];
        const label = labels[section.type];

        return `
          <article class="community-cover${position === 1 ? "" : " is-side"}"
            style="--photo-x:${section.photoX};--photo-y:${section.photoY}"
            data-community-type="${section.type}">
            <div class="community-cover-content">
              <h3>${escapeHTML(label)}</h3>
              <div class="community-cover-actions">
                <button type="button" data-open-community="${section.type}">
                  ${escapeHTML(t.community)}
                </button>
                <button class="red" type="button" data-add-community="${section.type}">
                  + ${escapeHTML(t.add)}
                </button>
                <button type="button" data-map-community="${section.type}">
                  ${escapeHTML(t.showMap)}
                </button>
              </div>
            </div>
          </article>`;
      }).join("");

    document.getElementById("communityCarouselPosition").textContent =
      `${communitySectionIndex + 1} / ${communitySections.length}`;
  }

  document.getElementById("communityCarouselPrev").addEventListener("click", () => {
    communitySectionIndex =
      (communitySectionIndex + communitySections.length - 1) % communitySections.length;
    renderCommunitySections();
  });

  document.getElementById("communityCarouselNext").addEventListener("click", () => {
    communitySectionIndex =
      (communitySectionIndex + 1) % communitySections.length;
    renderCommunitySections();
  });

  document.addEventListener("click", event => {
    const add = event.target.closest("[data-add-community]");
    const open = event.target.closest("[data-open-community]");
    const map = event.target.closest("[data-map-community]");

    if (add) {
      document.querySelector(`[data-add-type="${add.dataset.addCommunity}"]`)?.click();
    } else if (open || map) {
      const type = (open || map).dataset.openCommunity || map.dataset.mapCommunity;
      document.querySelector(`[data-filter="${type}"]`)?.click();
      document.querySelector(".map-shell")?.scrollIntoView({ behavior: "smooth" });
    }
  });

  renderCommunitySections();
</script>
