linear-gradient(

<script>
"use strict";

const LANGUAGE_KEY =
"pets_dogue_language";

const $ =
id =>
document.getElementById(id);

const ARTICLE_DATA = [
{
id:"default",
story:"default",
categoryKey:"lifestyle",
image:"https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"LIFESTYLE",
fallbackTitle:"The Art of Living Beautifully With Pets"
},
{
id:"photoshoot",
story:"photoshoot",
categoryKey:"photoshoot",
image:"https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"PHOTOGRAPHY",
fallbackTitle:"How To Prepare Your Pet for a Magazine Photoshoot"
},
{
id:"travel",
story:"travel",
categoryKey:"travel",
image:"https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"TRAVEL",
fallbackTitle:"The Rise of Luxury Pet-Friendly Travel"
},
{
id:"fashion",
story:"fashion",
categoryKey:"fashion",
image:"https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"FASHION",
fallbackTitle:"Comfort First In Pet Fashion"
},
{
id:"wellness",
story:"wellness",
categoryKey:"wellness",
image:"https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"WELLNESS",
fallbackTitle:"Creating A Calm Daily Routine"
},
{
id:"rescue",
story:"rescue",
categoryKey:"rescue",
image:"https://images.unsplash.com/photo-1601758064224-c3c14e3a8cb8?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"RESCUE",
fallbackTitle:"Why Visibility Can Change an Animal's Life"
},
{
id:"places",
story:"places",
categoryKey:"places",
image:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"PLACES",
fallbackTitle:"How DOGUE Trust Protects Pet-Friendly Recommendations"
},
{
id:"volunteers",
story:"volunteers",
categoryKey:"volunteers",
image:"https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1200&q=85",
fallbackCategory:"COMMUNITY",
fallbackTitle:"The People Helping Animals Behind the Scenes"
}
];

let filteredArticles =
[];

function normaliseLanguageCode(
value
){

if(
!value
){

return "en";

}

let code =
String(
value
)
.trim()
.toLowerCase();

if(
code.includes("-")
){

code =
code.split("-")[0];

}

if(
code.includes("_")
){

code =
code.split("_")[0];

}

const aliases = {
ua:"uk",
cz:"cs",
gr:"el",
se:"sv",
dk:"da"
};

return aliases[code] ||
code ||
"en";

}

function getCurrentLanguage(){

if(
window.PetsDogueLanguage &&
typeof window.PetsDogueLanguage.getCurrentLanguage ===
"function"
){

try{

const value =
window.PetsDogueLanguage.getCurrentLanguage();

if(
typeof value ===
"string"
){

return normaliseLanguageCode(
value
);

}

if(
value &&
typeof value ===
"object"
){

return normaliseLanguageCode(
value.code ||
value.language ||
value.lang ||
"en"
);

}

}catch(
error
){

console.warn(
"Could not read language.",
error
);

}

}

return normaliseLanguageCode(
localStorage.getItem(
LANGUAGE_KEY
) ||
document.documentElement.lang ||
"en"
);

}

function articleRoot(){

return (
window.PetsDogueTranslations &&
window.PetsDogueTranslations.article
) ||
null;

}

function articleBundle(){

const root =
articleRoot();

if(
!root
){

return null;

}

const language =
getCurrentLanguage();

return (
root[language] ||
root.en ||
null
);

}

function getStory(
article
){

const bundle =
articleBundle();

if(
!bundle
){

return null;

}

if(
article.story ===
"default"
){

return bundle.default ||
null;

}

if(
bundle.stories &&
bundle.stories[
article.story
]
){

return bundle.stories[
article.story
];

}

return null;

}

function uiCopy(){

const language =
getCurrentLanguage();

const copy = {
en:{
title:"Articles",
intro:"Stories about animals, travel, fashion, wellbeing, rescue, places and modern pet life.",
search:"Search stories",
listen:"Listen",
read:"Read",
contents:"Articles",
count:"articles",
none:"No articles found."
},
ru:{
title:"Статьи",
intro:"Истории о животных, путешествиях, моде, здоровье, спасении, местах и современной жизни с питомцами.",
search:"Поиск статей",
listen:"Слушать",
read:"Читать",
contents:"Статьи",
count:"статей",
none:"Статьи не найдены."
},
uk:{
title:"Статті",
intro:"Історії про тварин, подорожі, моду, добробут, порятунок, місця та сучасне життя з улюбленцями.",
search:"Пошук статей",
listen:"Слухати",
read:"Читати",
contents:"Статті",
count:"статей",
none:"Статті не знайдено."
}
};

return copy[language] ||
copy.en;

}

function articleHref(
article,
listen = false
){

const params =
new URLSearchParams();

if(
article.story &&
article.story !==
"default"
){

params.set(
"story",
article.story
);

}

if(
listen
){

params.set(
"listen",
"1"
);

}

const query =
params.toString();

return query
? "article.html?" + query
: "article.html";

}

function getArticleView(
article
){

const story =
getStory(
article
);

return {
category:
story?.category ||
article.fallbackCategory,
title:
story?.title ||
article.fallbackTitle,
image:
story?.image ||
article.image
};

}

function escapeHtml(
value
){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}

function renderArticles(
articles
){

const grid =
$("articlesGrid");

const noResults =
$("noResults");

if(
!grid ||
!noResults
){

return;

}

grid.innerHTML =
"";

const copy =
uiCopy();

if(
!articles.length
){

noResults.style.display =
"block";

return;

}

noResults.style.display =
"none";

articles.forEach(
article =>{

const view =
getArticleView(
article
);

const card =
document.createElement(
"article"
);

card.className =
"article-card";

card.dataset.search =
(
view.title +
" " +
view.category
)
.toLowerCase();

card.innerHTML = `
<img
src="${escapeHtml(view.image)}"
alt="${escapeHtml(view.title)}"
loading="lazy"
>

<div class="card-content">

<span class="card-category">
${escapeHtml(view.category)}
</span>

<h2 class="card-title">
${escapeHtml(view.title)}
</h2>

<div class="card-actions">

<a
class="card-action"
href="${escapeHtml(articleHref(article,true))}"
aria-label="${escapeHtml(copy.listen)}"
>
<span>🔊</span>
<span>${escapeHtml(copy.listen)}</span>
</a>

<a
class="card-action primary"
href="${escapeHtml(articleHref(article,false))}"
>
<span>${escapeHtml(copy.read)}</span>
<span>›</span>
</a>

</div>

</div>
`;

grid.appendChild(
card
);

}
);

}

function renderContents(
articles
){

const list =
$("contentsList");

const empty =
$("menuEmpty");

if(
!list ||
!empty
){

return;

}

list.innerHTML =
"";

if(
!articles.length
){

empty.style.display =
"block";

return;

}

empty.style.display =
"none";

articles.forEach(
article =>{

const view =
getArticleView(
article
);

const link =
document.createElement(
"a"
);

link.className =
"contents-item";

link.href =
articleHref(
article,
false
);

link.innerHTML = `
<img
src="${escapeHtml(view.image)}"
alt="${escapeHtml(view.title)}"
loading="lazy"
>

<div>

<div class="contents-category">
${escapeHtml(view.category)}
</div>

<div class="contents-title">
${escapeHtml(view.title)}
</div>

</div>

<div class="contents-arrow">
›
</div>
`;

list.appendChild(
link
);

}
);

}

function updateCount(
count
){

const copy =
uiCopy();

if(
$("articlesCount")
){

$("articlesCount")
.textContent =
count +
" " +
copy.count;

}

}

function applyPageLanguage(){

const language =
getCurrentLanguage();

document.documentElement.lang =
language;

document.documentElement.dir =
language ===
"ar"
? "rtl"
: "ltr";

const copy =
uiCopy();

$("pageTitle").textContent =
copy.title;

$("pageIntro").textContent =
copy.intro;

$("articleNavLabel").textContent =
copy.title;

$("contentsHeading").textContent =
copy.contents;

$("articleSearch").placeholder =
copy.search;

$("menuSearch").placeholder =
copy.search;

$("noResults").textContent =
copy.none;

$("menuEmpty").textContent =
copy.none;

document.title =
copy.title +
" | PETS & DOGUE";

const root =
articleRoot();

const bundle =
articleBundle();

if(
$("pageDescription")
){

$("pageDescription")
.setAttribute(
"content",
bundle?.default?.metaDescription ||
"Explore PETS & DOGUE editorial stories."
);

}

filterArticles();

}

function filterArticles(){

const mainValue =
(
$("articleSearch")?.value ||
""
)
.trim()
.toLowerCase();

filteredArticles =
ARTICLE_DATA.filter(
article =>{

if(
!mainValue
){

return true;

}

const view =
getArticleView(
article
);

return (
view.title +
" " +
view.category
)
.toLowerCase()
.includes(
mainValue
);

}
);

renderArticles(
filteredArticles
);

updateCount(
filteredArticles.length
);

}

function filterMenu(){

const value =
(
$("menuSearch")?.value ||
""
)
.trim()
.toLowerCase();

const filtered =
ARTICLE_DATA.filter(
article =>{

if(
!value
){

return true;

}

const view =
getArticleView(
article
);

return (
view.title +
" " +
view.category
)
.toLowerCase()
.includes(
value
);

}
);

renderContents(
filtered
);

}

function openContents(){

renderContents(
ARTICLE_DATA
);

$("sideMenu")
.classList
.add(
"open"
);

$("menuOverlay")
.classList
.add(
"show"
);

document.body
.classList
.add(
"menu-open"
);

}

function closeContents(){

$("sideMenu")
.classList
.remove(
"open"
);

$("menuOverlay")
.classList
.remove(
"show"
);

document.body
.classList
.remove(
"menu-open"
);

}

$("articleSearch")
?.addEventListener(
"input",
filterArticles
);

$("searchButton")
?.addEventListener(
"click",
filterArticles
);

$("menuSearch")
?.addEventListener(
"input",
filterMenu
);

document.addEventListener(
"keydown",
event =>{

if(
event.key ===
"Escape"
){

closeContents();

}

}
);

window.addEventListener(
"storage",
event =>{

if(
event.key ===
LANGUAGE_KEY
){

applyPageLanguage();

}

}
);

window.addEventListener(
"petsdogue:languagechange",
applyPageLanguage
);

window.addEventListener(
"languagechange",
applyPageLanguage
);

document.addEventListener(
"DOMContentLoaded",
()=>{

applyPageLanguage();

renderContents(
ARTICLE_DATA
);

}
);

</script>

</body>
</html>
