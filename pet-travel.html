<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta
name="robots"
content="noindex,follow"
>

<meta
http-equiv="refresh"
content="0;url=/index.html"
>

<title>
PETS & DOGUE
</title>

<style>

:root{
--black:#070707;
--white:#fff;
--gold:#d8ad45;
--gold-light:#f1d783;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
min-height:100%;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:var(--black);
color:var(--white);
font-family:Arial,Helvetica,sans-serif;
padding:24px;
}

.redirect{
width:min(560px,100%);
text-align:center;
}

.brand-small{
font:14px Georgia,serif;
letter-spacing:2px;
color:var(--gold-light);
}

.brand-big{
margin-top:4px;
font:normal 58px/.9 Georgia,serif;
letter-spacing:4px;
}

.redirect p{
margin:28px auto 0;
max-width:430px;
font-size:14px;
line-height:1.6;
color:#bbb;
}

.redirect a{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:48px;
margin-top:22px;
padding:0 24px;
border-radius:999px;
background:var(--gold);
color:#111;
font-size:12px;
font-weight:800;
text-decoration:none;
text-transform:uppercase;
letter-spacing:.7px;
}

@media(max-width:600px){

.brand-big{
font-size:43px;
}

}

</style>

<script>
"use strict";

/*
PETS & DOGUE

The retired rubric is no longer part of the magazine.
Old saved links are redirected to the PETS & DOGUE home page.
*/

(function(){

const target =
"/index.html";

try{

window.location.replace(
target
);

}catch(
error
){

window.location.href =
target;

}

})();
</script>

</head>

<body>

<main class="redirect">

<div class="brand-small">
PETS &amp;
</div>

<div class="brand-big">
DOGUE
</div>

<p>
This section is no longer available. You are being returned to the PETS &amp; DOGUE home page.
</p>

<a href="/index.html">
Go to PETS &amp; DOGUE
</a>

</main>

</body>
</html>
