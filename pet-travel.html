const IDX=Object.fromEntries(KEYS.map((k,i)=>[k,i]));
let currentLang="en",lastResults=[],lastDestination="Italy",lastCoords=null,searchTimer=null,languageTimer=null;
function detectLanguage(){let v="";for(const k of LANG_KEYS){try{v=localStorage.getItem(k)||"";if(v)break}catch{}}v=v.toLowerCase().replace("_","-").split("-")[0];v=ALIASES[v]||v;return SUPPORTED.includes(v)?v:"en"}
function t(k){const i=IDX[k];return i===undefined?k:(WORDS[currentLang]?.[i]||WORDS.en[i]||k)}
function applyLanguage(){currentLang=detectLanguage();document.documentElement.lang=currentLang;document.documentElement.dir=currentLang==="ar"?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));document.title="PETS & DOGUE · "+t("heroTitle");renderResults(lastResults)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
function photoValue(v){if(typeof v==="string")return v.trim();if(v&&typeof v==="object")return String(v.url||v.photoUrl||v.name||"").trim();return""}
function photoUrl(place){const x=photoValue(place.photo)||photoValue(place.photos?.[0]);if(!x)return"";if(/^https?:\/\//.test(x)||x.startsWith("/"))return x;if(x.startsWith("places/")&&x.includes("/photos/"))return API_URL+"?photo="+encodeURIComponent(x)+"&width=1000";return""}
function mapsUrl(p){if(p.googleMapsUrl)return p.googleMapsUrl;const u=new URL("https://www.google.com/maps/search/");u.searchParams.set("api","1");u.searchParams.set("query",[p.name,p.address].filter(Boolean).join(", ")||`${p.lat},${p.lng}`);return u.toString()}
function bookingUrl(p){const u=new URL("https://www.booking.com/searchresults.html");u.searchParams.set("ss",[p.name,p.address,lastDestination].filter(Boolean).join(", "));if(Number.isFinite(p.lat))u.searchParams.set("latitude",String(p.lat));if(Number.isFinite(p.lng))u.searchParams.set("longitude",String(p.lng));return u.toString()}
function editorialCards(destination){const pet=document.getElementById("petType")?.value||"all";const petLabel={all:t("allPets"),dog:t("dogs"),cat:t("cats"),small:t("smallPets"),exotic:t("exoticPets")}[pet];return[
{kind:"flight",name:t("flights"),badge:t("editorialGuide"),address:`${destination} · ${petLabel}`,image:"https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1200&q=84",note:t("petPolicy"),actions:[{label:t("guide"),url:"articles.html",gold:true}]},
{kind:"road",name:t("roadTrips"),badge:t("editorialGuide"),address:`${destination} · ${petLabel}`,image:"https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1200&q=84",note:t("petPolicy"),actions:[{label:t("places"),url:"pet-friendly-places.html",gold:true}]},
{kind:"documents",name:t("documents"),badge:t("editorialGuide"),address:`${destination} · ${petLabel}`,image:"https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&w=1200&q=84",note:t("petPolicy"),actions:[{label:t("guide"),url:"articles.html",gold:true}]},
{kind:"luxury",name:t("luxury"),badge:t("editorialGuide"),address:`${destination} · ${petLabel}`,image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=84",note:t("petPolicy"),actions:[{label:t("partner"),url:"partners.html",gold:true},{label:t("clubButton"),url:"club.html"}]}
]}
function normalizePlace(raw,kind){const lat=num(raw.location?.lat??raw.location?.latitude??raw.lat),lng=num(raw.location?.lng??raw.location?.longitude??raw.lng);if(lat===null||lng===null)return null;return{kind,name:String(raw.name||raw.displayName?.text||raw.displayName||t(kind==="hotel"?"hotels":"beaches")),badge:t("realPlaces"),address:String(raw.address||raw.formattedAddress||lastDestination),rating:num(raw.rating),website:raw.website||raw.websiteUri||"",googleMapsUrl:raw.googleMapsUrl||raw.googleMapsUri||"",photos:Array.isArray(raw.photos)?raw.photos:[],photo:raw.photo||raw.photoUrl||"",lat,lng,note:t("petPolicy")}}
async function geocode(q){const u=new URL(NOMINATIM);u.searchParams.set("format","jsonv2");u.searchParams.set("q",q);u.searchParams.set("limit","5");u.searchParams.set("addressdetails","1");u.searchParams.set("accept-language",currentLang);const r=await fetch(u,{headers:{Accept:"application/json"}});if(!r.ok)throw Error("geocode");return await r.json()}
async function fetchPlaces(kind,coords){const category=kind==="hotel"?"hotel":"beach";const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({latitude:coords.lat,longitude:coords.lng,radius:50000,category,maxResults:20,language:currentLang})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true)return[];return(d.places||[]).map(x=>normalizePlace(x,kind)).filter(Boolean)}
function renderResults(list){const grid=document.getElementById("travelGrid");if(!grid)return;document.getElementById("resultContext").textContent=lastDestination?`${t("resultsFor")}: ${lastDestination}`:"";if(!list.length){grid.innerHTML=`<div class="empty"><h3>${esc(t("notFound"))}</h3><p>${esc(t("tryAgain"))}</p></div>`;return}grid.innerHTML=list.map(p=>{const img=p.image||photoUrl(p)||"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=82";let actions=p.actions;if(!actions){actions=[];if(p.kind==="hotel")actions.push({label:t("booking"),url:bookingUrl(p),gold:true});actions.push({label:t("maps"),url:mapsUrl(p)});if(p.website)actions.push({label:t("website"),url:p.website});if(p.kind==="beach")actions.push({label:t("places"),url:"pet-friendly-places.html",gold:true})}return`<article class="travel-card"><img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=82'"><div class="travel-card-content"><div class="travel-card-top"><span class="card-badge">${esc(p.badge||t("editorialGuide"))}</span><span class="card-rating">${p.rating?`★ ${Number(p.rating).toFixed(1)}`:""}</span></div><h3>${esc(p.name)}</h3><p class="card-address">${esc(p.address||lastDestination)}</p><div class="card-note">${esc(p.note||t("petPolicy"))}</div><div class="card-actions">${actions.map(a=>`<a class="${a.gold?"gold":""}" href="${esc(a.url)}" target="${/^https?:/.test(a.url)?"_blank":"_self"}" rel="${/^https?:/.test(a.url)?"noopener":""}">${esc(a.label)}</a>`).join("")}</div></div></article>`}).join("")}
async function performSearch({scroll=true}={}){const input=document.getElementById("destinationInput"),type=document.getElementById("travelType").value,q=input.value.trim()||lastDestination||"Italy";lastDestination=q;document.getElementById("travelStatus").textContent=t("searching");let coords=lastCoords;try{if(!coords||coords.label!==q){const g=await geocode(q);if(g[0])coords={lat:+g[0].lat,lng:+g[0].lon,label:q};lastCoords=coords}let out=[];if(type==="all"){const [h,b]=coords?await Promise.all([fetchPlaces("hotel",coords),fetchPlaces("beach",coords)]):[[],[]];out=[...h.slice(0,6),...b.slice(0,4),...editorialCards(q)]}else if(type==="hotel"||type==="beach"){out=coords?await fetchPlaces(type,coords):[]}else{out=editorialCards(q).filter(x=>x.kind===type)}lastResults=out;renderResults(lastResults);document.getElementById("travelStatus").textContent="";if(scroll)document.getElementById("resultsSection").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){console.warn(e);lastResults=editorialCards(q).filter(x=>type==="all"||x.kind===type);renderResults(lastResults);document.getElementById("travelStatus").textContent=""}}
function showSuggestions(items){const box=document.getElementById("destinationSuggestions");if(!items.length){box.hidden=true;return}box.innerHTML=items.map((x,i)=>`<button type="button" data-i="${i}"><strong>${esc(String(x.display_name||"").split(",")[0])}</strong><small>${esc(x.display_name||"")}</small></button>`).join("");box.hidden=false;box.querySelectorAll("button").forEach(b=>b.onclick=()=>{const x=items[+b.dataset.i];document.getElementById("destinationInput").value=x.display_name||"";lastDestination=x.display_name||lastDestination;lastCoords={lat:+x.lat,lng:+x.lon,label:lastDestination};box.hidden=true})}
function bind(){document.getElementById("searchButton").onclick=()=>performSearch();document.getElementById("destinationInput").addEventListener("keydown",e=>{if(e.key==="Enter")performSearch()});document.getElementById("destinationInput").addEventListener("input",e=>{clearTimeout(searchTimer);const q=e.target.value.trim();if(q.length<2){document.getElementById("destinationSuggestions").hidden=true;return}searchTimer=setTimeout(async()=>{try{showSuggestions(await geocode(q))}catch{}},350)});document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("travelType").value=b.dataset.filter;performSearch()});document.getElementById("travelType").onchange=e=>{document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.filter===e.target.value))};window.addEventListener("petsdogue:languagechange",()=>setTimeout(()=>{applyLanguage();performSearch({scroll:false})},0));window.addEventListener("storage",e=>{if(LANG_KEYS.includes(e.key))applyLanguage()});languageTimer=setInterval(()=>{const n=detectLanguage();if(n!==currentLang){applyLanguage();performSearch({scroll:false})}},500)}
async function init(){applyLanguage();bind();await performSearch({scroll:false})}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
</script>
