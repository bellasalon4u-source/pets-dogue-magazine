    transform:none !important;

    padding:22px 18px 25px;

    color:#fff;

    background:
      linear-gradient(
        135deg,
        #263919 0%,
        #4f6c29 100%
      );

  }

  .pd-dinner-copy .pd-kicker{
    margin-bottom:8px;
    color:#d5ff9e;

  }

  .pd-dinner-copy h2{
    margin:0;
    color:var(--pd-gold-bright);
    font-size:35px;
    line-height:.9;
  }

  .pd-dinner-copy p{
    max-width:600px;
    margin-top:12px;
    font-size:14px;
    line-height:1.4;
  }

  /* ---------------------------------------------------
     CLOSE FRIENDS + FLOWERS

     Remove the caption from the photograph entirely.
  --------------------------------------------------- */

  .pd-friend-photo{
    display:flex !important;
    flex-direction:column !important;
    background:#000;
  }

  .pd-friend-photo > img{
    position:relative;
    order:1;

    width:100%;
    height:auto !important;
    max-height:none !important;

    object-fit:contain !important;
    object-position:center center !important;

    background:#000;
  }

  .pd-friend-caption{
    position:relative !important;
    order:2;

    inset:auto !important;
    left:auto !important;
    right:auto !important;
    bottom:auto !important;

    width:100%;

    padding:18px 18px 21px;

    color:#111;

    background:var(--pd-paper);
  }

  .pd-friend-caption strong{

    font-size:28px;

  .pd-friend-caption .pd-red-heart{

  .pd-friend-caption span{

    margin-top:8px;
    color:#222;
    font-size:14px;
    line-height:1.38;
  }

  /* ---------------------------------------------------
     PEACEFUL AFTERNOON

     Caption below image, not over faces.
  --------------------------------------------------- */

  .pd-sunset{
    display:flex !important;
    flex-direction:column !important;
    background:#000;
  }

  .pd-sunset > img{
    position:relative;
    order:1;

    width:100%;
    height:auto !important;
    max-height:none !important;

    object-fit:contain !important;
    object-position:center center !important;

    background:#000;
  }

  .pd-sunset-caption{
    position:relative !important;
    order:2;

    inset:auto !important;
    left:auto !important;
    right:auto !important;
    bottom:auto !important;

    width:100%;

    padding:18px 18px 21px;

    color:#111;

    background:var(--pd-paper);
  }

  .pd-sunset-caption strong{
    color:#111;
    font-size:29px;
    line-height:.97;
  }

  .pd-sunset-caption .pd-red-heart{
    color:var(--pd-red);
  }

  .pd-sunset-caption span{
    max-width:none;
    margin-top:8px;
    color:#222;
    font-size:14px;
    line-height:1.38;
  }

  /* ---------------------------------------------------
     THREE-PHOTO GALLERY

     Never crop the animals on mobile.
  --------------------------------------------------- */

  .pd-photo-grid{
    grid-template-columns:1fr;
  }

  .pd-photo-card{
    background:#111;
  }

  .pd-photo-card img{
    display:block;

    width:100%;
    height:auto !important;
    max-height:none !important;

    aspect-ratio:auto !important;

    object-fit:contain !important;
    object-position:center center !important;

    background:#111;
  }

  /* ---------------------------------------------------
     FINAL PHOTO

     Completely clean.
  --------------------------------------------------- */

  .pd-end-photo{
    background:#000;
  }

  .pd-end-photo img{
    display:block;

    width:100%;
    height:auto !important;
    max-height:none !important;

    object-fit:contain !important;
    object-position:center center !important;
  }

  /* ---------------------------------------------------
     RTL MOBILE

     Text blocks are below photographs, therefore no
     image-side repositioning is required.
  --------------------------------------------------- */

  html[dir="rtl"] .pd-sea-copy,
  html[dir="rtl"] .pd-dinner-copy{
    inset:auto !important;
    left:auto !important;
    right:auto !important;
    text-align:right;
  }

   ACCESSIBILITY
===================================================== */

#pdRichiePiStory a:focus-visible,
#pdRichiePiStory button:focus-visible{
  outline:3px solid var(--pd-gold-bright);
  outline-offset:4px;
}

@media(prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto;
  }

}

/* =====================================================
   PRINT
===================================================== */

@media print{

  body{
    background:#fff;
  }

  #pdRichiePiStory{
    max-width:none;
  }

  .pd-section{
    break-inside:avoid;
  }

}

</style>

<script>
/* =====================================================
   RICHIE & PI — PAGE INITIALISATION

   Global PETS & DOGUE behaviour remains controlled by:
   /pets-dogue-shell.js

   Do NOT duplicate the global header/menu/TTS here.
===================================================== */

(function () {
  "use strict";

  const story =
    document.getElementById("pdRichiePiStory");

  if (!story) {
    return;
  }

  /* Preserve Richie + Pi during translation. */

  story
    .querySelectorAll(".notranslate")
    .forEach(function (node) {

      node.setAttribute(
        "translate",
        "no"
      );

    });

  /*
   * IMPORTANT:
   * Never hide a failed image.
   *
   * If an asset problem ever occurs again,
   * the browser keeps the image element visible
   * instead of silently making an entire photograph
   * disappear.
   */

  story
    .querySelectorAll("img")
    .forEach(function (img) {

      img.addEventListener(
        "error",
        function () {

          img.classList.add(
            "pd-image-load-error"
          );

          console.warn(
            "PETS & DOGUE image failed to load:",
            img.getAttribute("src")
          );

        },
        {
          once:true
        }
      );

    });

})();
</script>
