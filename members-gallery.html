<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vote for the next PETS & DOGUE cover star.">
<title>PETS & DOGUE — Cover Stars</title>

<style>
:root{
--black:#060606;
--black2:#111;
--cream:#f5f0e6;
--white:#fff;
--gold:#c79632;
--gold-light:#efd47b;
--green:#5ee719;
--grey:#beb8af;
--line:#292929;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--cream);
color:#111;
font-family:var(--sans);
overflow-x:hidden;
}

body.modal-open,
body.menu-open{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
width:100%;
}

/* =========================================================
HEADER
========================================================= */

.site-header{
position:sticky;
top:0;
z-index:5000;
background:#050505;
color:#fff;
border-bottom:1px solid #252525;
}

.header-main{
height:116px;
display:grid;
grid-template-columns:75px 1fr 75px;
align-items:center;
padding:0 20px;
}

.menu-button{
width:56px;
height:56px;
border:0;
background:transparent;
display:grid;
align-content:center;
gap:7px;
padding:8px;
}

.menu-button span{
height:3px;
background:#fff;
border-radius:999px;
}

.brand{
justify-self:center;
text-align:center;
font-family:var(--serif);
line-height:.85;
}

.brand small{
display:block;
font-size:12px;
letter-spacing:2px;
color:var(--gold);
}

.brand strong{
display:block;
font-size:52px;
font-weight:400;
letter-spacing:3px;
color:var(--gold);
margin-top:8px;
}

.home-button{
justify-self:end;
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
color:#fff;
}

/* =========================================================
NAVIGATION
========================================================= */

.primary-nav{
height:64px;
display:flex;
align-items:center;
gap:31px;
padding:0 27px;
overflow-x:auto;
scrollbar-width:none;
scroll-behavior:smooth;
border-top:1px solid #252525;
}

.primary-nav::-webkit-scrollbar{
display:none;
}

.primary-nav a{
position:relative;
flex:0 0 auto;
height:64px;
display:flex;
align-items:center;
white-space:nowrap;
font-size:14px;
font-weight:900;
letter-spacing:.7px;
text-transform:uppercase;
}

.primary-nav a.active{
color:var(--gold-light);
}

.primary-nav a.active:after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:3px;
background:linear-gradient(90deg,#8d6012,#f0d47a,#916113);
}

/* =========================================================
SIDE MENU
========================================================= */

.menu-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
z-index:9000;
opacity:0;
visibility:hidden;
transition:.25s;
}

.menu-overlay.show{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
left:0;
top:0;
bottom:0;
z-index:9100;
width:min(550px,88vw);
background:#f8f5ee;
transform:translateX(-103%);
transition:.28s ease;
overflow:auto;
}

.side-menu.open{
transform:translateX(0);
}

.side-menu-head{
position:sticky;
top:0;
z-index:4;
height:115px;
background:#080808;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:20px 25px;
}

.side-menu-head h2{
font-family:var(--serif);
font-size:44px;
font-weight:400;
}

.close-menu{
width:55px;
height:55px;
border:0;
border-radius:50%;
background:#fff;
font-size:36px;
}

.language-box{
margin:16px;
border:2px solid #111;
padding:12px;
}

.language-box label{
display:block;
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
color:#777;
margin-bottom:6px;
}

.language-box select{
width:100%;
height:42px;
border:0;
background:transparent;
font-weight:800;
outline:0;
}

.side-links{
display:grid;
gap:7px;
padding:0 16px 25px;
}

.side-links a{
min-height:55px;
border:2px solid #111;
background:#fff;
display:flex;
align-items:center;
padding:10px 15px;
font-family:var(--serif);
font-size:20px;
}

.side-links a.active{
background:#111;
color:var(--gold-light);
}

/* =========================================================
CURRENT COVER
========================================================= */

.cover-hero{
background:#070707;
color:#fff;
}

.cover-layout{
max-width:1250px;
margin:auto;
display:grid;
grid-template-columns:minmax(0,.9fr) minmax(300px,.65fr);
align-items:stretch;
}

.cover-image{
position:relative;
min-height:690px;
background:#111;
overflow:hidden;
}

.cover-image img{
height:100%;
object-fit:cover;
}

.cover-image:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.62),
transparent 46%
);
}

.cover-current{
position:absolute;
z-index:2;
left:24px;
bottom:22px;
background:#080808;
border-left:4px solid var(--gold);
padding:8px 13px;
font-size:9px;
font-weight:900;
letter-spacing:1.7px;
text-transform:uppercase;
}

.cover-copy{
padding:48px 40px;
display:flex;
flex-direction:column;
justify-content:center;
background:#0c0c0c;
}

.cover-kicker{
font-size:9px;
font-weight:900;
letter-spacing:2.4px;
color:var(--gold-light);
}

.cover-copy h1{
font-family:var(--serif);
font-size:60px;
font-weight:400;
line-height:.93;
margin-top:16px;
}

.cover-copy p{
font-size:14px;
line-height:1.6;
color:#d0d0d0;
margin-top:18px;
}

.cover-winner{
display:flex;
align-items:center;
gap:9px;
margin-top:23px;
font-family:var(--serif);
font-size:31px;
color:var(--gold-light);
}

.cover-winner span{
font-family:var(--sans);
font-size:12px;
color:#ccc;
}

.cover-button{
margin-top:27px;
height:54px;
border:0;
background:var(--green);
font-size:11px;
font-weight:900;
letter-spacing:.8px;
text-transform:uppercase;
}

/* =========================================================
PAST WINNERS
========================================================= */

.past-section{
max-width:1250px;
margin:auto;
padding:34px 18px 40px;
}

.section-head{
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:20px;
margin-bottom:18px;
}

.section-head h2{
font-family:var(--serif);
font-size:45px;
font-weight:400;
line-height:.95;
}

.section-head p{
max-width:480px;
font-size:11px;
line-height:1.5;
color:#6b6760;
text-align:right;
}

.winners-strip{
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:5px;
}

.winner-card{
position:relative;
height:310px;
overflow:hidden;
background:#111;
color:#fff;
}

.winner-card img{
height:100%;
object-fit:cover;
}

.winner-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.82),
transparent 58%
);
}

.winner-copy{
position:absolute;
z-index:2;
left:13px;
right:13px;
bottom:13px;
}

.winner-number{
font-family:var(--serif);
font-size:15px;
color:var(--gold-light);
}

.winner-copy h3{
font-family:var(--serif);
font-size:28px;
font-weight:400;
line-height:1;
margin-top:3px;
}

.winner-copy small{
display:block;
font-size:8px;
color:#ddd;
margin-top:5px;
}

/* =========================================================
HOW IT WORKS
========================================================= */

.how-section{
background:#090909;
color:#fff;
}

.how-inner{
max-width:1250px;
margin:auto;
padding:28px 18px;
display:grid;
grid-template-columns:.8fr 1fr 1fr 1fr;
gap:4px;
}

.how-title{
padding:22px;
display:flex;
flex-direction:column;
justify-content:center;
}

.how-title small{
font-size:8px;
font-weight:900;
letter-spacing:2px;
color:var(--gold-light);
}

.how-title h2{
font-family:var(--serif);
font-size:35px;
font-weight:400;
margin-top:6px;
}

.step{
border:1px solid #343434;
padding:19px;
min-height:125px;
}

.step-number{
font-family:var(--serif);
font-size:30px;
color:var(--gold-light);
}

.step strong{
display:block;
font-size:11px;
margin-top:4px;
}

.step p{
font-size:9px;
line-height:1.45;
color:#aaa;
margin-top:5px;
}

/* =========================================================
NEXT STAR
========================================================= */

.nominees-section{
max-width:1050px;
margin:auto;
padding:42px 18px 65px;
}

.nominees-title{
margin-bottom:23px;
}

.nominees-title small{
font-size:9px;
font-weight:900;
letter-spacing:2.2px;
color:#8f6415;
}

.nominees-title h2{
font-family:var(--serif);
font-size:53px;
font-weight:400;
line-height:.95;
margin-top:7px;
}

.nominees-title p{
font-size:11px;
line-height:1.5;
color:#666;
max-width:630px;
margin-top:10px;
}

/* =========================================================
NOMINEE CARD
========================================================= */

.nominee-list{
display:grid;
gap:8px;
}

.nominee{
position:relative;
min-height:590px;
overflow:hidden;
background:#111;
color:#fff;
}

.nominee img{
position:absolute;
inset:0;
height:100%;
object-fit:cover;
}

.nominee:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.94) 0%,
rgba(0,0,0,.45) 38%,
rgba(0,0,0,.02) 68%
);
}

.vote-button{
position:absolute;
z-index:3;
right:18px;
top:18px;
min-width:68px;
height:50px;
padding:0 15px;
border:0;
border-radius:30px;
background:rgba(0,0,0,.73);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
font-size:11px;
font-weight:900;
backdrop-filter:blur(5px);
}

.vote-button .heart{
font-size:25px;
line-height:1;
transition:.18s;
}

.vote-button.voted{
background:#fff;
color:#111;
}

.vote-button.voted .heart{
color:#ff235d;
transform:scale(1.12);
}

.nominee-copy{
position:absolute;
z-index:2;
left:25px;
right:25px;
bottom:24px;
}

.nominee-type{
display:inline-flex;
background:#080808;
border-left:4px solid var(--gold);
padding:7px 10px;
font-size:8px;
font-weight:900;
letter-spacing:1.4px;
text-transform:uppercase;
}

.nominee-copy h3{
font-family:var(--serif);
font-size:55px;
font-weight:400;
line-height:.9;
margin-top:12px;
}

.pet-meta{
font-size:12px;
font-weight:800;
margin-top:11px;
color:#eee;
}

.pet-preview{
max-width:680px;
font-size:11px;
line-height:1.5;
color:#ddd;
margin-top:9px;
}

.story-button{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:40px;
margin-top:14px;
padding:0 19px;
border:1px solid #fff;
background:rgba(0,0,0,.5);
color:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

/* =========================================================
CLUB CTA
========================================================= */

.club-cta{
max-width:1050px;
margin:0 auto 55px;
background:#0a0a0a;
color:#fff;
display:grid;
grid-template-columns:1fr auto;
gap:24px;
align-items:center;
padding:25px 28px;
}

.club-cta small{
font-size:8px;
font-weight:900;
letter-spacing:2px;
color:var(--gold-light);
}

.club-cta h3{
font-family:var(--serif);
font-size:31px;
font-weight:400;
margin-top:5px;
}

.club-cta p{
font-size:9px;
color:#aaa;
margin-top:5px;
}

.club-cta a{
min-width:180px;
height:48px;
background:var(--green);
color:#111;
display:flex;
align-items:center;
justify-content:center;
padding:0 16px;
font-size:9px;
font-weight:900;
text-transform:uppercase;
}

/* =========================================================
STORY MODAL
========================================================= */

.story-modal{
position:fixed;
inset:0;
z-index:12000;
background:rgba(0,0,0,.86);
display:none;
align-items:flex-end;
justify-content:center;
padding:14px;
}

.story-modal.open{
display:flex;
}

.story-card{
position:relative;
width:min(600px,100%);
max-height:92vh;
overflow:auto;
background:#f7f2e8;
}

.story-image{
height:330px;
}

.story-image img{
height:100%;
object-fit:cover;
}

.story-content{
padding:22px;
}

.story-content small{
font-size:8px;
font-weight:900;
letter-spacing:1.5px;
color:#8b6015;
}

.story-content h2{
font-family:var(--serif);
font-size:40px;
font-weight:400;
margin-top:6px;
}

.story-content .story-meta{
font-size:10px;
font-weight:800;
margin-top:7px;
}

.story-content p{
font-family:var(--serif);
font-size:17px;
line-height:1.55;
margin-top:14px;
}

.story-close{
position:absolute;
right:12px;
top:12px;
z-index:2;
width:44px;
height:44px;
border:0;
border-radius:50%;
background:#fff;
font-size:29px;
}

/* =========================================================
MESSAGE
========================================================= */

.toast{
position:fixed;
z-index:14000;
left:50%;
bottom:22px;
transform:translate(-50%,30px);
opacity:0;
pointer-events:none;
background:#090909;
color:#fff;
padding:12px 18px;
font-size:9px;
font-weight:900;
border:1px solid #444;
transition:.25s;
max-width:90vw;
text-align:center;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

/* =========================================================
RTL
========================================================= */

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .side-menu{
left:auto;
right:0;
transform:translateX(103%);
}

html[dir="rtl"] .side-menu.open{
transform:translateX(0);
}

html[dir="rtl"] .vote-button{
right:auto;
left:18px;
}

html[dir="rtl"] .nominee-type,
html[dir="rtl"] .cover-current{
border-left:0;
border-right:4px solid var(--gold);
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:700px){

.header-main{
height:162px;
grid-template-columns:65px 1fr 65px;
padding:0 12px;
}

.brand small{
font-size:10px;
}

.brand strong{
font-size:44px;
}

.home-button{
font-size:31px;
}

.primary-nav{
height:64px;
gap:30px;
padding:0 26px;
}

.primary-nav a{
height:64px;
font-size:13px;
}

.cover-layout{
grid-template-columns:1fr;
}

.cover-image{
min-height:670px;
}

.cover-copy{
padding:28px 20px 32px;
}

.cover-copy h1{
font-size:46px;
}

.cover-copy p{
font-size:12px;
}

.past-section{
padding-top:28px;
}

.section-head{
display:block;
}

.section-head h2{
font-size:40px;
}

.section-head p{
text-align:left;
margin-top:8px;
}

.winners-strip{
display:flex;
overflow-x:auto;
gap:5px;
scrollbar-width:none;
padding-bottom:4px;
}

.winners-strip::-webkit-scrollbar{
display:none;
}

.winner-card{
flex:0 0 58%;
height:310px;
}

.how-inner{
grid-template-columns:1fr;
gap:5px;
}

.how-title{
padding:5px 3px 12px;
}

.step{
min-height:0;
display:grid;
grid-template-columns:43px 1fr;
column-gap:8px;
padding:13px;
}

.step-number{
grid-row:1 / 3;
}

.step strong{
margin-top:2px;
}

.nominees-section{
padding:32px 0 44px;
}

.nominees-title{
padding:0 18px;
}

.nominees-title h2{
font-size:46px;
}

.nominee-list{
gap:3px;
}

.nominee{
min-height:620px;
}

.nominee-copy{
left:19px;
right:19px;
bottom:20px;
}

.nominee-copy h3{
font-size:50px;
}

.pet-preview{
font-size:10px;
}

.vote-button{
right:14px;
top:14px;
}

.club-cta{
margin:0 0 3px;
grid-template-columns:1fr;
padding:25px 20px;
}

.club-cta a{
width:100%;
}

.story-modal{
padding:0;
}

.story-card{
max-height:94vh;
}

}

@media(max-width:390px){

.brand strong{
font-size:39px;
}

.cover-image{
min-height:600px;
}

.winner-card{
flex-basis:66%;
}

.nominee{
min-height:570px;
}

.nominee-copy h3{
font-size:45px;
}

}
</style>
</head>

}

function escapeHtml(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

/* =========================================================
VOTES
========================================================= */

function loadLocalVotes(){

try{

const parsed=
JSON.parse(
localStorage.getItem(VOTE_KEY)||
"[]"
);

if(Array.isArray(parsed)){

votedIds=
new Set(
parsed.map(String)
);

}

}catch{

votedIds=
new Set();

}

}

function saveLocalVotes(){

localStorage.setItem(
VOTE_KEY,
JSON.stringify(
[...votedIds]
)
);

}

/* =========================================================
STORY
========================================================= */

function openStory(id){

const pet=
nominees.find(
item=>String(item.id)===String(id)
);

if(!pet){
return;
}

document.getElementById("storyImage").src=
pet.image;

document.getElementById("storyImage").alt=
pet.name;

document.getElementById("storyName").textContent=
pet.name;

document.getElementById("storyMeta").textContent=
`${pet.species} · ${pet.breed}`;

document.getElementById("storyBody").textContent=
pet.story;

document.getElementById("storyModal")
.classList.add("open");

document.body.classList.add("modal-open");

}

function closeStory(){

document.getElementById("storyModal")
.classList.remove("open");

document.body.classList.remove("modal-open");

}

/* =========================================================
VOTE
========================================================= */

async function voteForPet(id){

id=String(id);

if(votedIds.has(id)){
return;
}

const pet=
nominees.find(
item=>String(item.id)===id
);

if(!pet){
return;
}

/*
Optimistic UI.
The next backend file will make this global and verified.
*/

votedIds.add(id);
pet.votes=
Number(pet.votes||0)+1;

saveLocalVotes();
renderNominees();

try{

const response=
await fetch(
"/api/vote-cover-star",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Accept:"application/json"
},
body:JSON.stringify({
candidateId:id
})
}
);

if(!response.ok){

throw new Error(
"Vote API unavailable."
);

}

const result=
await response.json();

if(
result?.ok&&
Number.isFinite(
Number(result.votes)
)
){

pet.votes=
Number(result.votes);

renderNominees();

}

showToast(
text().voteSuccess
);

}catch(error){

console.warn(
"PETS & DOGUE Cover Star vote:",
error
);

/*
The interface keeps the local heart for now.
When the server voting endpoint is added next,
the global count becomes the source of truth.
*/

showToast(
text().voteSuccess
);

}

}

/* =========================================================
LOAD LIVE NOMINEES
========================================================= */

async function loadNominees(){

try{

const response=
await fetch(
"/api/cover-stars",
{
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

const result=
await response.json();

if(
!response.ok||
!result?.ok||
!Array.isArray(result.candidates)
){

throw new Error(
"Cover Star API unavailable."
);

}

nominees=
result.candidates.map(
candidate=>({
id:String(candidate.id),
name:String(candidate.name||""),
species:String(candidate.species||""),
breed:String(candidate.breed||""),
image:String(candidate.image||""),
votes:Number(candidate.votes||0),
preview:String(candidate.preview||""),
story:String(candidate.story||"")
})
);

}catch{

nominees=
FALLBACK_NOMINEES.map(
item=>({...item})
);

}

renderNominees();

}

/* =========================================================
TOAST
========================================================= */

let toastTimer=null;

function showToast(message){

const toast=
document.getElementById("toast");

toast.textContent=
message;

toast.classList.add("show");

clearTimeout(
toastTimer
);

toastTimer=
setTimeout(
()=>{
toast.classList.remove("show");
},
2200
);

}

);

closeStory;

document.getElementById("storyModal").onclick=
event=>{

if(
event.target===
document.getElementById("storyModal")
){

closeStory();

}

};

document.addEventListener(
"keydown",
event=>{

if(event.key==="Escape"){

closeMenu();
closeStory();

}

}
);
