<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PETS & DOGUE Club special offers, partner discounts and member benefits.">
<title>PETS & DOGUE — Special Offers</title>

<style>
:root{
--black:#070707;
--cream:#f7f1e6;
--white:#fff;
--gold:#c6922b;
--gold-light:#efd47a;
--gold-dark:#8c6217;
--grey:#746f67;
--line:#d7cdbc;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.modal-open{
overflow:hidden;
}

button,
select{
font:inherit;
}

button{
cursor:pointer;
}

a{
color:inherit;
text-decoration:none;
}

img{
display:block;
width:100%;
}

.hidden{
display:none!important;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
position:sticky;
top:0;
z-index:3000;
height:72px;
background:#070707;
color:#fff;
border-bottom:1px solid #262626;
display:grid;
grid-template-columns:60px 1fr auto;
align-items:center;
padding:0 14px;
}

.menu-button{
width:42px;
height:42px;
border:0;
background:none;
display:flex;
flex-direction:column;
justify-content:center;
gap:5px;
padding:7px;
}

.menu-button span{
display:block;
width:27px;
height:2px;
background:#fff;
}

.brand{
justify-self:center;
text-align:center;
font-family:var(--serif);
color:var(--gold);
line-height:.9;
}

.brand small{
display:block;
font-size:8px;
letter-spacing:3px;
}

.brand strong{
display:block;
font-size:29px;
font-weight:400;
letter-spacing:2px;
margin-top:5px;
}

.header-right{
display:flex;
align-items:center;
gap:7px;
}

.club-link{
display:flex;
align-items:center;
justify-content:center;
height:38px;
padding:0 12px;
background:var(--gold);
color:#111;
font-size:8px;
font-weight:900;
letter-spacing:1px;
}

.lang-select{
height:38px;
min-width:58px;
background:#111;
color:#fff;
border:1px solid #444;
padding:0 6px;
font-size:8px;
font-weight:900;
}

/* =========================================================
   HERO
========================================================= */

.hero{
position:relative;
min-height:445px;
overflow:hidden;
background:#111;
color:#fff;
display:flex;
align-items:flex-end;
}

.hero-bg{
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.92) 0%,
rgba(0,0,0,.52) 38%,
rgba(0,0,0,.10) 72%
),
url("https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1800&q=88")
center 42% / cover no-repeat;
}

.hero-accent{
position:absolute;
right:-80px;
top:-120px;
width:400px;
height:400px;
border-radius:50%;
background:rgba(212,164,60,.27);
}

.hero-copy{
position:relative;
z-index:2;
width:100%;
max-width:1180px;
margin:auto;
padding:45px 24px 34px;
}

.hero-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.6px;
color:#f3d57e;
text-transform:uppercase;
}

.hero-title{
font-family:var(--serif);
font-size:54px;
line-height:.95;
font-weight:400;
margin-top:9px;
max-width:680px;
}

.hero-text{
font-size:12px;
line-height:1.55;
max-width:590px;
margin-top:13px;
color:#f3f0eb;
}

.hero-badge{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:17px;
padding:9px 12px;
border:1px solid rgba(255,255,255,.5);
background:rgba(0,0,0,.48);
font-size:7px;
font-weight:900;
letter-spacing:.9px;
text-transform:uppercase;
}

/* =========================================================
   MAIN
========================================================= */

.offers-shell{
max-width:1180px;
margin:auto;
padding:25px 18px 60px;
}

.section-intro{
text-align:center;
padding:8px 0 17px;
}

.section-intro h1{
font-family:var(--serif);
font-size:35px;
font-weight:400;
line-height:1;
}

.section-intro p{
font-size:10px;
line-height:1.55;
color:#716c64;
margin:9px auto 0;
max-width:650px;
}

/* =========================================================
   LOCATION
========================================================= */

.location-panel{
background:#fff;
border:1px solid var(--line);
margin-bottom:15px;
padding:13px;
}

.location-label{
font-size:7px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
color:#777;
margin-bottom:8px;
}

.location-controls{
display:grid;
grid-template-columns:minmax(0,1fr) auto;
gap:7px;
}

.location-select{
height:45px;
width:100%;
border:1px solid #aaa195;
background:#fff;
padding:0 11px;
font-size:10px;
font-weight:800;
outline:none;
}

.international-button{
height:45px;
padding:0 15px;
border:1px solid #111;
background:#fff;
font-size:7px;
font-weight:900;
letter-spacing:.7px;
white-space:nowrap;
}

.international-button.active{
background:#111;
color:#fff;
}

.location-current{
margin-top:9px;
padding:9px 10px;
background:#f3ecdf;
display:flex;
align-items:center;
gap:7px;
font-size:7px;
font-weight:900;
letter-spacing:.4px;
}

.location-current strong{
font-family:var(--serif);
font-size:15px;
font-weight:400;
letter-spacing:0;
}

/* =========================================================
   FILTERS
========================================================= */

.filters{
display:flex;
gap:7px;
overflow-x:auto;
padding-bottom:15px;
scrollbar-width:none;
}

.filters::-webkit-scrollbar{
display:none;
}

.filter{
white-space:nowrap;
border:1px solid #c9c0b1;
background:#fff;
min-height:35px;
padding:0 13px;
border-radius:30px;
font-size:7px;
font-weight:900;
letter-spacing:.5px;
text-transform:uppercase;
}

.filter.active{
background:#111;
border-color:#111;
color:#fff;
}

/* =========================================================
   LOADING / EMPTY
========================================================= */

.loading,
.no-results{
grid-column:1/-1;
background:#fff;
border:1px solid var(--line);
padding:45px 20px;
text-align:center;
}

.spinner{
width:35px;
height:35px;
border:3px solid #ddd3c2;
border-top-color:#111;
border-radius:50%;
margin:0 auto 13px;
animation:spin .75s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.loading p{
font-size:9px;
font-weight:900;
letter-spacing:.7px;
}

.no-results strong{
display:block;
font-family:var(--serif);
font-size:24px;
font-weight:400;
}

.no-results p{
font-size:9px;
color:#777;
margin-top:7px;
line-height:1.5;
}

/* =========================================================
   CARDS
========================================================= */

.offer-grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:12px;
align-items:stretch;
}

.offer-card{
position:relative;
min-width:0;
background:#fff;
border:1px solid var(--line);
overflow:hidden;
display:flex;
flex-direction:column;
cursor:pointer;
transition:.18s ease;
}

.offer-card:active{
transform:scale(.985);
}

.offer-card-image{
position:relative;
aspect-ratio:1.38/1;
background:linear-gradient(135deg,#d8c39d,#f4ead6);
overflow:hidden;
}

.offer-card-image img{
height:100%;
object-fit:cover;
}

.offer-card-image:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.56),transparent 57%);
pointer-events:none;
}

.category-badge{
position:absolute;
top:7px;
left:7px;
z-index:2;
background:rgba(255,255,255,.94);
padding:5px 7px;
font-size:6px;
font-weight:900;
letter-spacing:.5px;
text-transform:uppercase;
}

.club-badge{
position:absolute;
right:7px;
top:7px;
z-index:2;
background:#080808;
color:#f1d27a;
padding:5px 7px;
font-size:6px;
font-weight:900;
letter-spacing:.7px;
}

.discount-badge{
position:absolute;
left:9px;
bottom:8px;
z-index:2;
font-family:var(--serif);
font-size:30px;
color:#fff;
text-shadow:0 2px 10px rgba(0,0,0,.45);
}

.offer-card-body{
display:flex;
flex-direction:column;
flex:1;
padding:11px;
}

.partner-name{
font-family:var(--serif);
font-size:17px;
line-height:1.08;
}

.offer-title{
font-size:8px;
line-height:1.45;
margin-top:5px;
min-height:24px;
}

.offer-location{
font-size:6.5px;
font-weight:900;
margin-top:7px;
color:var(--gold-dark);
}

.offer-description{
font-size:7px;
line-height:1.45;
color:#777;
margin-top:6px;
}

.offer-meta{
display:flex;
align-items:center;
justify-content:space-between;
gap:4px;
margin-top:auto;
padding-top:9px;
border-top:1px solid #eee7dc;
font-size:6px;
color:#777;
}

.card-action{
margin-top:9px;
min-height:32px;
width:100%;
border:0;
background:#111;
color:#fff;
font-size:6px;
font-weight:900;
letter-spacing:.7px;
text-transform:uppercase;
}

.offer-card.locked .card-action{
background:var(--gold);
color:#111;
}

.member-note{
margin-top:6px;
min-height:24px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:#f5efe3;
font-size:5.5px;
font-weight:900;
letter-spacing:.4px;
color:#5c554b;
padding:4px;
}

/* =========================================================
   SUBSCRIPTION
========================================================= */

.subscription-modal,
.offer-modal{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:flex-end;
justify-content:center;
padding:14px;
background:rgba(0,0,0,.78);
}

.subscription-modal.open,
.offer-modal.open{
display:flex;
}

.subscription-card{
width:min(520px,100%);
background:#faf5ea;
border:1px solid #dfc078;
}

.subscription-head{
background:#080808;
color:#fff;
padding:19px 18px 16px;
position:relative;
}

.subscription-head small{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:2px;
color:var(--gold-light);
}

.subscription-head h2{
font-family:var(--serif);
font-size:28px;
font-weight:400;
margin-top:7px;
padding-right:30px;
}

.subscription-head p{
font-size:8px;
line-height:1.5;
color:#ccc;
margin-top:7px;
}

.modal-close{
position:absolute;
right:10px;
top:8px;
width:36px;
height:36px;
border:0;
background:none;
color:#fff;
font-size:24px;
}

.subscription-body{
padding:14px;
}

.plan{
display:grid;
grid-template-columns:1fr auto;
gap:10px;
align-items:center;
background:#fff;
border:1px solid #cfc3b2;
padding:13px;
margin-bottom:8px;
}

.plan.best{
border:2px solid var(--gold);
}

.plan-title{
font-family:var(--serif);
font-size:19px;
}

.plan-copy{
font-size:7px;
line-height:1.4;
color:#777;
margin-top:3px;
}

.plan-price{
text-align:right;
font-family:var(--serif);
font-size:27px;
color:var(--gold-dark);
}

.plan-price small{
display:block;
font-family:var(--sans);
font-size:6px;
color:#777;
}

.subscribe-button{
width:100%;
height:48px;
border:0;
background:var(--gold);
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
}

.modal-footnote{
text-align:center;
font-size:6px;
line-height:1.5;
color:#777;
margin-top:9px;
}

/* =========================================================
   OFFER MODAL
========================================================= */

.offer-modal{
z-index:9100;
}

.offer-modal-card{
width:min(500px,100%);
background:#fff;
max-height:94vh;
overflow:auto;
}

.offer-modal-image{
height:235px;
background:#e8ddca;
}

.offer-modal-image img{
height:100%;
object-fit:cover;
}

.offer-modal-copy{
padding:18px;
}

.offer-modal-copy h2{
font-family:var(--serif);
font-size:28px;
font-weight:400;
}

.offer-modal-copy p{
font-size:9px;
line-height:1.5;
color:#666;
margin-top:7px;
}

.modal-location{
margin-top:9px;
font-size:8px;
font-weight:900;
color:var(--gold-dark);
}

.offer-modal-discount{
font-family:var(--serif);
font-size:43px;
color:var(--gold-dark);
margin-top:12px;
}

.offer-modal-valid{
display:flex;
justify-content:space-between;
gap:10px;
font-size:7px;
color:#777;
margin-top:10px;
padding-top:10px;
border-top:1px solid #eee6db;
}

.online-help{
background:#f5efe3;
border:1px solid #d8cdbd;
padding:11px;
margin-top:13px;
font-size:7px;
line-height:1.5;
color:#625a50;
}

.use-offer-button{
width:100%;
min-height:50px;
border:0;
background:var(--gold);
font-size:8px;
font-weight:900;
letter-spacing:1px;
margin-top:13px;
}

.voucher-button{
width:100%;
min-height:50px;
border:0;
background:#111;
color:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1px;
margin-top:13px;
}

.offer-modal-close{
width:100%;
height:43px;
border:1px solid #111;
background:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1px;
margin-top:8px;
}

/* =========================================================
   RTL
========================================================= */

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .category-badge{
left:auto;
right:7px;
}

html[dir="rtl"] .club-badge{
right:auto;
left:7px;
}

html[dir="rtl"] .discount-badge{
left:auto;
right:9px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

.site-header{
height:68px;
grid-template-columns:52px 1fr auto;
padding:0 8px;
}

.brand strong{
font-size:25px;
}

.club-link{
display:none;
}

.hero{
min-height:465px;
}

.hero-title{
font-size:39px;
}

.hero-copy{
padding:32px 17px 24px;
}

.hero-text{
font-size:10px;
}

.offers-shell{
padding:17px 7px 45px;
}

.section-intro h1{
font-size:28px;
}

.location-controls{
grid-template-columns:1fr;
}

.international-button{
width:100%;
}

.offer-grid{
gap:5px;
}

.offer-card-body{
padding:6px;
}

.category-badge,
.club-badge{
top:4px;
padding:3px 4px;
font-size:4.5px;
}

.category-badge{
left:4px;
}

.club-badge{
right:4px;
}

.discount-badge{
left:5px;
bottom:5px;
font-size:20px;
}

.partner-name{
font-size:11px;
}

.offer-title{
font-size:5.8px;
line-height:1.3;
min-height:22px;
}

.offer-location{
font-size:5px;
margin-top:4px;
}

.offer-description{
display:none;
}

.offer-meta{
font-size:4.6px;
margin-top:5px;
padding-top:5px;
}

.card-action{
min-height:28px;
font-size:4.8px;
margin-top:6px;
padding:0 3px;
}

.member-note{
font-size:4.4px;
min-height:21px;
margin-top:4px;
}

.filter{
min-height:31px;
padding:0 10px;
font-size:6px;
}

.offer-modal-image{
height:205px;
}

}
</style>
</head>

function escapeHtml(value){

.replaceAll("&","&amp;")

.replaceAll("'","&#039;");

);

}catch{}

}

const map={

function formatDate(value){
if(!value) return "—";

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return "—";
}

return date.toLocaleDateString(
dateLocale(),
{
day:"2-digit",
month:"short",
year:"numeric"
}
);
}

function membershipObject(){
const keys=[
"petsDogueClubMembership",
"pets_dogue_club_membership",
"petsDogueMembership",
"pets_dogue_membership",
"clubMembership"
];

for(const key of keys){

const raw=localStorage.getItem(key);

if(!raw) continue;

try{

const value=JSON.parse(raw);

if(value){
return value;
}

}catch{

if(
raw==="active"||
raw==="paid"||
raw==="true"
){
return {status:"active"};
}

}

}

return null;
}

function hasActiveMembership(){
const membership=membershipObject();

if(!membership){
return false;
}

if(membership===true){
return true;
}

const status=
String(
membership.status||
membership.subscriptionStatus||
membership.membershipStatus||
""
).toLowerCase();

return[
"active",
"trialing",
"trial",
"paid",
"current"
].includes(status);
}

raw.redemptionType==="offline"

raw.image||
FALLBACK_IMAGES[category]||

),

raw.maxRedemptions===null
?null
:Number(raw.maxRedemptions||0),

accessScope:"all_subscribers",

countryCode:
raw.countryCode

async function loadOffers(){
loading=true;
loadFailed=false;

renderOffers();

try{

const response=
await fetch(
"/api/get-active-offers",
{
method:"GET",
headers:{
Accept:"application/json"
},
cache:"no-store"
}
);

const result=
await response.json();

if(
!response.ok||
!result.ok||
!Array.isArray(result.offers)
){
throw new Error(
result.error||
"Unable to load offers."
);
}

offers=
result.offers
.map(normalizeOffer)
.filter(
offer=>
offer.id&&
offer.status==="active"&&
offer.accessScope==="all_subscribers"
);

loading=false;
loadFailed=false;

renderOffers();
restorePendingOffer();

}catch(error){

console.error(
"PETS & DOGUE offers:",
error
);

offers=[];
loading=false;
loadFailed=true;

renderOffers();
}
}

function restorePendingOffer(){
if(!hasActiveMembership()){
return;
}

const params=
new URLSearchParams(
window.location.search
);

const id=
params.get("offer")||
sessionStorage.getItem(
PENDING_OFFER_KEY
);

if(!id){
return;
}

const offer=
offers.find(
item=>
String(item.id)===String(id)
);

if(offer){

if(
offer.locationScope==="international"
){

locationMode="international";

}else if(
offer.countryCode
){

locationMode="country";
selectedCountry=offer.countryCode;

localStorage.setItem(
COUNTRY_KEY,
selectedCountry
);

}

localStorage.setItem(
LOCATION_MODE_KEY,
locationMode
);

fillCountries();
renderLocationState();
renderOffers();

setTimeout(
()=>{
openOffer(offer);
},
180
);

}

sessionStorage.removeItem(
PENDING_OFFER_KEY
);

if(params.has("offer")){

history.replaceState(
{},
document.title,
window.location.pathname
);

}
}
