<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PETS & DOGUE Club special offers, partner discounts and exclusive member benefits.">
<title>PETS & DOGUE — Special Offers</title>

<style>
:root{
--black:#070707;
--black2:#111;
--cream:#f7f1e6;
--cream2:#eee4d2;
--white:#fff;
--gold:#c6922b;
--gold2:#e5bd63;
--gold-dark:#8c6217;
--green:#426f3c;
--grey:#74716b;
--line:#d7cdbc;
--red:#a62828;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.modal-open{
overflow:hidden;
}

button,
select,
input{
font:inherit;
}

button{
cursor:pointer;
}

a{
color:inherit;
text-decoration:none;
}

img{
display:block;
width:100%;
}

.notranslate{
translate:no;
}

.site-header{
position:sticky;
top:0;
z-index:3000;
height:72px;
background:#070707;
color:#fff;
border-bottom:1px solid #262626;
display:grid;
grid-template-columns:60px 1fr auto;
align-items:center;
padding:0 14px;
}

.menu-button{
width:42px;
height:42px;
border:0;
background:none;
display:flex;
flex-direction:column;
justify-content:center;
gap:5px;
padding:7px;
}

.menu-button span{
display:block;
width:27px;
height:2px;
background:#fff;
}

.brand{
justify-self:center;
text-align:center;
font-family:var(--serif);
color:var(--gold);
line-height:.9;
}

.brand small{
display:block;
font-size:8px;
letter-spacing:3px;
}

.brand strong{
display:block;
font-size:29px;
font-weight:400;
letter-spacing:2px;
margin-top:5px;
}

.header-right{
display:flex;
align-items:center;
gap:7px;
}

.club-link{
display:flex;
align-items:center;
justify-content:center;
height:38px;
padding:0 12px;
background:var(--gold);
color:#111;
font-size:8px;
font-weight:900;
letter-spacing:1px;
}

.lang-select{
height:38px;
min-width:58px;
background:#111;
color:#fff;
border:1px solid #444;
padding:0 6px;
font-size:8px;
font-weight:900;
}

.hero{
position:relative;
background:#111;
overflow:hidden;
}

.hero-image{
position:relative;
height:min(76vw,760px);
min-height:420px;
max-height:760px;
overflow:hidden;
}

.hero-image img{
height:100%;
object-fit:cover;
object-position:center 48%;
}

.hero-image:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(to bottom,rgba(0,0,0,.03) 45%,rgba(0,0,0,.7) 100%);
pointer-events:none;
}

.hero-copy{
position:absolute;
left:0;
right:0;
bottom:0;
z-index:2;
max-width:1180px;
margin:auto;
padding:36px 26px 30px;
color:#fff;
}

.hero-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.6px;
color:#f3d57e;
text-transform:uppercase;
}

.hero-title{
font-family:var(--serif);
font-size:47px;
line-height:.98;
font-weight:400;
margin-top:8px;
max-width:650px;
}

.hero-text{
font-size:12px;
line-height:1.5;
max-width:560px;
margin-top:11px;
color:#f1eee8;
}

.hero-badge{
display:inline-flex;
align-items:center;
gap:7px;
margin-top:14px;
padding:8px 11px;
border:1px solid rgba(255,255,255,.55);
background:rgba(0,0,0,.42);
backdrop-filter:blur(6px);
font-size:7px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.hero-badge-icon{
color:var(--gold2);
font-size:14px;
}

.offers-shell{
max-width:1180px;
margin:auto;
padding:22px 18px 55px;
}

.section-intro{
text-align:center;
padding:6px 0 18px;
}

.section-intro h1{
font-family:var(--serif);
font-size:34px;
font-weight:400;
line-height:1;
}

.section-intro p{
font-size:10px;
line-height:1.5;
color:#716c64;
margin:9px auto 0;
max-width:620px;
}

.filters{
display:flex;
gap:7px;
overflow-x:auto;
padding-bottom:14px;
scrollbar-width:none;
}

.filters::-webkit-scrollbar{
display:none;
}

.filter{
white-space:nowrap;
border:1px solid #c9c0b1;
background:#fff;
min-height:35px;
padding:0 13px;
border-radius:30px;
font-size:7px;
font-weight:900;
letter-spacing:.5px;
text-transform:uppercase;
}

.filter.active{
background:#111;
border-color:#111;
color:#fff;
}

.offer-grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:12px;
align-items:stretch;
}

.offer-card{
position:relative;
min-width:0;
background:#fff;
border:1px solid var(--line);
overflow:hidden;
display:flex;
flex-direction:column;
transition:transform .18s ease,box-shadow .18s ease;
cursor:pointer;
}

.offer-card:not(.used):active{
transform:scale(.985);
}

.offer-card-image{
position:relative;
aspect-ratio:1.42/1;
background:
linear-gradient(135deg,#e4d3af,#f7efe1);
overflow:hidden;
}

.offer-card-image img{
height:100%;
object-fit:cover;
}

.offer-card-image:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.45),transparent 55%);
}

.category-badge{
position:absolute;
top:7px;
left:7px;
z-index:2;
background:rgba(255,255,255,.91);
padding:5px 7px;
font-size:6px;
font-weight:900;
letter-spacing:.5px;
text-transform:uppercase;
}

.club-badge{
position:absolute;
right:7px;
top:7px;
z-index:2;
background:#080808;
color:#f1d27a;
padding:5px 7px;
font-size:6px;
font-weight:900;
letter-spacing:.7px;
text-transform:uppercase;
}

.discount-badge{
position:absolute;
left:9px;
bottom:8px;
z-index:2;
font-family:var(--serif);
font-size:29px;
line-height:1;
color:#fff;
text-shadow:0 2px 10px rgba(0,0,0,.45);
}

.offer-card-body{
display:flex;
flex-direction:column;
flex:1;
padding:10px;
}

.partner-name{
font-family:var(--serif);
font-size:16px;
line-height:1.05;
}

.offer-title{
font-size:8px;
line-height:1.4;
margin-top:5px;
min-height:23px;
}

.offer-meta{
display:flex;
align-items:center;
justify-content:space-between;
gap:4px;
margin-top:8px;
padding-top:7px;
border-top:1px solid #eee7dc;
font-size:6px;
color:#777;
}

.offer-meta span:last-child{
white-space:nowrap;
}

.redemption{
margin-top:8px;
border-top:1px solid #ded7cb;
padding-top:8px;
}

.promo-line{
display:flex;
align-items:center;
justify-content:space-between;
gap:5px;
margin-bottom:7px;
}

.promo-label{
font-size:5px;
font-weight:900;
letter-spacing:.6px;
color:#777;
text-transform:uppercase;
}

.promo-code{
font-size:8px;
font-weight:900;
letter-spacing:.8px;
white-space:nowrap;
}

.barcode{
width:100%;
height:40px;
display:flex;
align-items:stretch;
justify-content:center;
overflow:hidden;
background:#fff;
padding:3px 5px;
}

.barcode-bar{
display:block;
height:100%;
background:#111;
flex:0 0 auto;
}

.barcode-space{
display:block;
height:100%;
background:#fff;
flex:0 0 auto;
}

.member-note{
margin-top:7px;
min-height:26px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:#f5efe3;
font-size:6px;
font-weight:900;
letter-spacing:.4px;
color:#5c554b;
text-transform:uppercase;
padding:5px;
}

.offer-card.locked .redemption{
filter:blur(4px);
user-select:none;
pointer-events:none;
}

.offer-card.locked .member-note{
background:#111;
color:#f0cf74;
filter:none;
}

.offer-card.used{
cursor:default;
filter:grayscale(1);
opacity:.63;
}

.offer-card.used .offer-card-image:after{
background:rgba(50,50,50,.25);
}

.offer-card.used .redemption{
opacity:.45;
}

.offer-card.used .member-note{
background:#222;
color:#fff;
font-size:7px;
}

.offer-card.expired{
opacity:.48;
filter:grayscale(1);
cursor:default;
}

.offer-card.expired .member-note{
background:#ddd;
color:#555;
}

.no-results{
grid-column:1/-1;
padding:40px 15px;
text-align:center;
background:#fff;
border:1px solid var(--line);
font-family:var(--serif);
font-size:21px;
}

.subscription-modal{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:flex-end;
justify-content:center;
padding:14px;
background:rgba(0,0,0,.76);
backdrop-filter:blur(5px);
}

.subscription-modal.open{
display:flex;
}

.subscription-card{
width:min(520px,100%);
background:#faf5ea;
border:1px solid #dfc078;
box-shadow:0 20px 70px rgba(0,0,0,.4);
}

.subscription-head{
background:#080808;
color:#fff;
padding:18px 18px 15px;
position:relative;
}

.subscription-head small{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:2px;
color:var(--gold2);
text-transform:uppercase;
}

.subscription-head h2{
font-family:var(--serif);
font-size:27px;
font-weight:400;
line-height:1.05;
margin-top:7px;
}

.subscription-head p{
font-size:8px;
line-height:1.45;
color:#ccc;
margin-top:7px;
max-width:410px;
}

.modal-close{
position:absolute;
right:10px;
top:9px;
width:36px;
height:36px;
border:0;
background:none;
color:#fff;
font-size:24px;
}

.subscription-body{
padding:14px;
}

.plan{
display:grid;
grid-template-columns:1fr auto;
gap:10px;
align-items:center;
background:#fff;
border:1px solid #cfc3b2;
padding:13px;
margin-bottom:8px;
}

.plan.best{
border:2px solid var(--gold);
}

.plan-title{
font-family:var(--serif);
font-size:19px;
}

.plan-copy{
font-size:7px;
line-height:1.4;
color:#777;
margin-top:3px;
}

.plan-price{
text-align:right;
font-family:var(--serif);
font-size:26px;
color:var(--gold-dark);
}

.plan-price small{
display:block;
font-family:var(--sans);
font-size:6px;
color:#777;
}

.subscribe-button{
width:100%;
height:47px;
border:0;
background:var(--gold);
color:#111;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.modal-footnote{
text-align:center;
font-size:6px;
line-height:1.45;
color:#777;
margin-top:9px;
}

.offer-modal{
position:fixed;
inset:0;
z-index:9100;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.78);
padding:14px;
}

.offer-modal.open{
display:flex;
}

.offer-modal-card{
width:min(480px,100%);
background:#fff;
max-height:91vh;
overflow:auto;
}

.offer-modal-image{
height:230px;
background:#e8ddca;
position:relative;
}

.offer-modal-image img{
height:100%;
object-fit:cover;
}

.offer-modal-copy{
padding:17px;
}

.offer-modal-copy h2{
font-family:var(--serif);
font-size:27px;
font-weight:400;
}

.offer-modal-copy p{
font-size:9px;
line-height:1.5;
color:#666;
margin-top:7px;
}

.offer-modal-discount{
font-family:var(--serif);
font-size:39px;
color:var(--gold-dark);
margin-top:11px;
}

.offer-modal-code{
margin-top:14px;
padding:13px;
background:#f7f1e6;
border:1px solid #d2c8b9;
text-align:center;
}

.offer-modal-code small{
font-size:6px;
font-weight:900;
letter-spacing:1px;
color:#777;
}

.offer-modal-code strong{
display:block;
font-size:18px;
letter-spacing:1.5px;
margin-top:5px;
}

.offer-modal .barcode{
height:57px;
margin-top:8px;
}

.offer-modal-valid{
display:flex;
justify-content:space-between;
gap:10px;
font-size:7px;
color:#777;
margin-top:10px;
}

.offer-modal-close{
width:100%;
height:43px;
border:1px solid #111;
background:#111;
color:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1px;
margin-top:14px;
}

@media(max-width:700px){

.site-header{
height:68px;
grid-template-columns:52px 1fr auto;
padding:0 8px;
}

.brand strong{
font-size:25px;
}

.club-link{
display:none;
}

.hero-image{
height:112vw;
min-height:440px;
max-height:620px;
}

.hero-copy{
padding:26px 17px 22px;
}

.hero-title{
font-size:37px;
}

.hero-text{
font-size:10px;
}

.offers-shell{
padding:16px 7px 45px;
}

.section-intro h1{
font-size:28px;
}

.offer-grid{
gap:5px;
}

.offer-card-body{
padding:6px;
}

.category-badge,
.club-badge{
top:4px;
padding:3px 4px;
font-size:4.5px;
}

.category-badge{
left:4px;
}

.club-badge{
right:4px;
}

.discount-badge{
left:5px;
bottom:5px;
font-size:20px;
}

.partner-name{
font-size:11px;
}

.offer-title{
font-size:5.8px;
line-height:1.3;
min-height:23px;
}

.offer-meta{
font-size:4.7px;
margin-top:5px;
padding-top:5px;
}

.redemption{
margin-top:5px;
padding-top:5px;
}

.promo-label{
font-size:4px;
}

.promo-code{
font-size:5.8px;
letter-spacing:.3px;
}

.barcode{
height:30px;
padding:2px;
}

.member-note{
font-size:4.5px;
min-height:23px;
margin-top:5px;
padding:3px;
}

.offer-card.used .member-note{
font-size:5px;
}

.filters{
padding-left:2px;
padding-right:2px;
}

.filter{
min-height:31px;
padding:0 10px;
font-size:6px;
}

}

@media(max-width:380px){

.offer-grid{
gap:4px;
}

.offer-card-body{
padding:5px;
}

.partner-name{
font-size:10px;
}

.discount-badge{
font-size:18px;
}

}
</style>
</head>

function formatDate(value){

if(!value){
return "—";
}

const d=

?new Date(value)
:new Date(`${value}T12:00:00`);

return d.toLocaleDateString(

{

month:"short",
year:"numeric"
}
);

}

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

return fallback;
}

}

function membershipObject(){

const keys=[
"petsDogueClubMembership",
"pets_dogue_club_membership",
"petsDogueMembership",
"pets_dogue_membership",
"clubMembership"
];

for(const key of keys){

const raw=localStorage.getItem(key);

if(!raw){
continue;
}

try{

const parsed=JSON.parse(raw);

if(parsed){
return parsed;
}

}catch{

if(raw==="active"||raw==="paid"||raw==="true"){
return {status:"active"};
}

}

}

return null;
}

function hasActiveMembership(){

const membership=membershipObject();

if(!membership){
return false;
}

if(membership===true){
return true;
}

const status=
String(
membership.status||
membership.subscriptionStatus||
membership.membershipStatus||
""
).toLowerCase();

return [
"active",
"trialing",
"trial",
"paid",
"current"
].includes(status);

}

}

return stored
.filter(item=>item&&["active","paid"].includes(String(item.status||"").toLowerCase()))
.map((item,index)=>{

const categoryIndex=Number(item.category||0);

const categoryMap=[
"vet",
"groom",
"food",
"shop",
"travel",
"cafe",
"training",
"shop",
"insurance",
"shop",
"travel",
"shop"
];

return{
id:String(item.id||`partner_${index}`),
partner:String(item.company||"PETS & DOGUE Partner"),
category:categoryMap[categoryIndex]||"shop",
discount:String(item.discount||item.saving||"SPECIAL"),
customTitle:String(item.title||item.description||"Member offer"),
code:String(item.code||`DOGUE-${String(item.id||Date.now()).slice(-6).toUpperCase()}`),
end:item.end||daysFromNow(30),
image:item.image||DEMO_IMAGES[index%DEMO_IMAGES.length]
};

});

}

function allOffers(){

const demo=
DEMO_OFFERS.map(item=>({
...item,
end:daysFromNow(item.days)
}));

return[
...normalizePartnerOffers(),
...demo
];

}

function isExpired(offer){

if(!offer.end){
return false;
}

const end=new Date(`${offer.end}T23:59:59`);

return Date.now()>end.getTime();

}

function offerTitle(offer){

if(offer.customTitle){
return offer.customTitle;
}

return t()[offer.titleKey]||offer.titleKey||"";
}

function categoryLabel(key){

return t()[key]||key;

}

function renderLanguage(code){

if(!LANGS.includes(code)){
code="en";
}

currentLanguage=code;

localStorage.setItem(LANGUAGE_KEY,code);

document.documentElement.lang=code;
document.documentElement.dir=code==="ar"?"rtl":"ltr";

$("languageSelect").value=code;

const x=t();

$("clubLink").textContent=x.club;
$("heroKicker").textContent=x.heroKicker;
$("heroTitle").textContent=x.heroTitle;
$("heroText").textContent=x.heroText;
$("heroBadge").textContent=x.heroBadge;
$("offersTitle").textContent=x.offersTitle;
$("offersIntro").textContent=x.offersIntro;

$("gateTitle").textContent=x.gateTitle;
$("gateText").textContent=x.gateText;
$("monthlyTitle").textContent=x.monthlyTitle;
$("monthlyText").textContent=x.monthlyText;
$("monthlyPeriod").textContent=x.monthlyPeriod;
$("annualTitle").textContent=x.annualTitle;
$("annualText").textContent=x.annualText;
$("annualPeriod").textContent=x.annualPeriod;
$("subscribeButton").textContent=x.subscribe;
$("gateFootnote").textContent=x.gateFootnote;

$("modalCodeLabel").textContent=x.code;
$("offerModalClose").textContent=x.close;

renderFilters();
renderOffers();

}

function renderFilters(){

$("filters").innerHTML=
CATEGORY_KEYS.map(key=>`
<button
class="filter ${key===activeCategory?"active":""}"
type="button"
data-category="${escapeHtml(key)}"
>
${escapeHtml(categoryLabel(key))}
</button>
`).join("");

document.querySelectorAll(".filter").forEach(button=>{

button.onclick=()=>{

activeCategory=button.dataset.category||"all";

renderFilters();
renderOffers();

};

});

}

function renderBarcode(container,code){

container.innerHTML="";

const clean=
String(code||"")
.toUpperCase()
.replace(/[^0-9A-Z.\- $/+%]/g,"-");

const encoded=
`*${clean}*`;

const narrow=1;
const wide=3;

for(const character of encoded){

const pattern=CODE39[character]||CODE39["-"];

pattern.split("").forEach((widthType,index)=>{

const bar=
document.createElement("span");

const width=
widthType==="w"
?wide
:narrow;

bar.className=
index%2===0
?"barcode-bar"
:"barcode-space";

bar.style.width=`${width}px`;

container.appendChild(bar);

});

const gap=document.createElement("span");
gap.className="barcode-space";
gap.style.width=`${narrow}px`;

container.appendChild(gap);

}

}

function renderOffers(){

const used=usedOfferIds();
const member=hasActiveMembership();

const offers=
allOffers().filter(offer=>
activeCategory==="all"||
offer.category===activeCategory
);

if(!offers.length){

$("offerGrid").innerHTML=`
<div class="no-results">
${escapeHtml(t().noResults)}
</div>
`;

return;
}

$("offerGrid").innerHTML=
offers.map(offer=>{

const expired=isExpired(offer);
const isUsed=used.includes(String(offer.id));
const state=
isUsed
?"used"
:expired
?"expired"
:member
?""
:"locked";

const statusText=
isUsed
?t().used
:expired
?t().expired
:member
?t().members
:t().tapUnlock;

return`
<article
class="offer-card ${state}"
data-offer-id="${escapeHtml(offer.id)}"
>

<div class="offer-card-image">

<img
src="${escapeHtml(offer.image)}"
alt="${escapeHtml(offer.partner)}"
loading="lazy"
>

<span class="category-badge">
${escapeHtml(categoryLabel(offer.category))}
</span>

<span class="club-badge">
CLUB
</span>

<span class="discount-badge">
${escapeHtml(offer.discount)}
</span>

</div>

<div class="offer-card-body">

<div class="partner-name">
${escapeHtml(offer.partner)}
</div>

<div class="offer-title">
${escapeHtml(offerTitle(offer))}
</div>

<div class="offer-meta">

<span>
${escapeHtml(t().valid)}
${escapeHtml(formatDate(offer.end))}
</span>

<span>
${escapeHtml(t().once)}
</span>

</div>

<div class="redemption">

<div class="promo-line">

<span class="promo-label">
${escapeHtml(t().code)}
</span>

<span class="promo-code">
${escapeHtml(offer.code)}
</span>

</div>

<div
class="barcode"
id="barcode_${escapeHtml(offer.id)}"
></div>

</div>

<div class="member-note">
${escapeHtml(statusText)}
</div>

</div>

</article>
`;

}).join("");

offers.forEach(offer=>{

const barcode=
document.getElementById(`barcode_${offer.id}`);

if(barcode){
renderBarcode(barcode,offer.code);
}

});

document.querySelectorAll(".offer-card").forEach(card=>{

card.onclick=()=>{

const offer=
allOffers().find(
item=>String(item.id)===String(card.dataset.offerId)
);

if(!offer){
return;
}

if(
used.includes(String(offer.id))||
isExpired(offer)
){
return;
}

if(!hasActiveMembership()){

sessionStorage.setItem(
PENDING_OFFER_KEY,
String(offer.id)
);

openSubscriptionGate();

return;
}

openOffer(offer);

};

});

}

function openSubscriptionGate(){

$("subscriptionModal").classList.add("open");
document.body.classList.add("modal-open");

}

function closeSubscriptionGate(){

$("subscriptionModal").classList.remove("open");
document.body.classList.remove("modal-open");

}

function openOffer(offer){

selectedOffer=offer;

$("modalOfferImage").src=offer.image;
$("modalPartner").textContent=offer.partner;
$("modalTitle").textContent=offerTitle(offer);
$("modalDiscount").textContent=offer.discount;
$("modalCode").textContent=offer.code;

$("modalValid").textContent=
`${t().valid} ${formatDate(offer.end)}`;

$("modalOnce").textContent=t().once;

renderBarcode(
$("modalBarcode"),
offer.code
);

$("offerModal").classList.add("open");

document.body.classList.add("modal-open");

}

function closeOffer(){

$("offerModal").classList.remove("open");

document.body.classList.remove("modal-open");

selectedOffer=null;

}

$("subscriptionClose").onclick=
closeSubscriptionGate;

$("subscriptionModal").onclick=event=>{

if(event.target===$("subscriptionModal")){
closeSubscriptionGate();
}

};

$("subscribeButton").onclick=()=>{

const offerId=
sessionStorage.getItem(PENDING_OFFER_KEY)||"";

const returnUrl=
encodeURIComponent(
`special-offers.html${offerId?`?offer=${offerId}`:""}`
);

window.location.href=
`club.html?return=${returnUrl}`;

};

$("offerModalClose").onclick=
closeOffer;

$("offerModal").onclick=event=>{

if(event.target===$("offerModal")){
closeOffer();
}

};

$("menuButton").onclick=()=>{
window.location.href="index.html";
};

$("languageSelect").onchange=function(){
renderLanguage(this.value);
};

function restorePendingOffer(){

if(!hasActiveMembership()){
return;
}

const params=
new URLSearchParams(window.location.search);

const id=
params.get("offer")||
sessionStorage.getItem(PENDING_OFFER_KEY);

if(!id){
return;
}

const offer=
allOffers().find(
item=>String(item.id)===String(id)
);

if(
offer&&
!isExpired(offer)&&
!usedOfferIds().includes(String(offer.id))
){

setTimeout(()=>{
openOffer(offer);
},250);

}

sessionStorage.removeItem(PENDING_OFFER_KEY);

if(params.has("offer")){

history.replaceState(
{},
document.title,
window.location.pathname
);

}

}

const savedLanguage=
localStorage.getItem(LANGUAGE_KEY)||"en";

renderLanguage(
LANGS.includes(savedLanguage)
?savedLanguage
:"en"
);

restorePendingOffer();

</script>

</body>
</html>
