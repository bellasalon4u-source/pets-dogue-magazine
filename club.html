<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Join PETS & DOGUE Club. First 30 days free, then £1 per month, or £10 per year.">
<title>PETS & DOGUE Club</title>

<style>
:root{
--black:#070707;
--black2:#111;
--cream:#f5f0e6;
--white:#fff;
--gold:#bd8b29;
--gold-light:#efd47a;
--green:#65e51f;
--green-dark:#176b3b;
--grey:#6d6861;
--line:#cbc4b8;
--red:#c52a2a;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden
}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
img{display:block;width:100%}

/* =====================================================
   HEADER
===================================================== */

.site-header{
background:var(--black);
color:#fff;
position:sticky;
top:0;
z-index:1800;
border-bottom:1px solid #292929
}

.header-main{
height:92px;
display:grid;
grid-template-columns:52px minmax(0,1fr) auto;
align-items:center;
gap:5px;
padding:0 8px;
max-width:1550px;
margin:auto
}

.menu-button,
.profile-button{
width:42px;
height:42px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center
}

.menu-button{
position:relative;
flex-direction:column;
gap:5px
}

.menu-button span.line{
width:27px;
height:2px;
background:#fff;
border-radius:20px;
margin-left:6px
}

.menu-lang-mark{
position:absolute;
left:0;
top:0;
width:18px;
height:18px;
border:1.3px solid #fff;
border-radius:50%;
background:#070707;
display:flex;
align-items:center;
justify-content:center;
font-family:var(--serif);
font-size:8px;
font-weight:bold
}

.brand{
justify-self:center;
text-align:center;
line-height:.86
}

.brand-small{
font-family:var(--serif);
font-size:10px;
letter-spacing:2.3px;
color:var(--gold);
margin-bottom:5px
}

.brand-big{
font-family:var(--serif);
font-size:37px;
font-weight:400;
letter-spacing:1.7px;
color:var(--gold)
}

.header-actions{
display:flex;
align-items:center;
gap:3px
}

.subscribe-head{
min-height:38px;
padding:0 10px;
border:0;
background:var(--green);
color:#080808;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:900;
letter-spacing:.7px;
text-transform:uppercase;
white-space:nowrap
}

.profile-icon{
position:relative;
width:25px;
height:25px
}

.profile-icon:before{
content:"";
position:absolute;
left:50%;
top:1px;
transform:translateX(-50%);
width:8px;
height:8px;
border:2px solid #fff;
border-radius:50%
}

.profile-icon:after{
content:"";
position:absolute;
left:50%;
bottom:1px;
transform:translateX(-50%);
width:20px;
height:11px;
border:2px solid #fff;
border-bottom:0;
border-radius:16px 16px 0 0
}

.category-nav{
height:43px;
display:flex;
align-items:center;
gap:25px;
padding:0 16px;
overflow-x:auto;
scrollbar-width:none;
border-top:1px solid #262626;
border-bottom:1px solid #292929;
font-size:9px;
font-weight:900;
letter-spacing:1.1px;
text-transform:uppercase
}

.category-nav::-webkit-scrollbar{display:none}
.category-nav a{white-space:nowrap}

/* =====================================================
   SIDE MENU
===================================================== */

.menu-overlay{
position:fixed;
inset:0;
z-index:8000;
background:rgba(0,0,0,.58);
opacity:0;
visibility:hidden;
transition:.22s;
backdrop-filter:blur(2px)
}

.menu-overlay.show{
opacity:1;
visibility:visible
}

.side-menu{
position:fixed;
top:0;
bottom:0;
left:-500px;
z-index:8100;
width:min(455px,84vw);
background:#fff;
color:#111;
overflow-y:auto;
transition:left .3s ease;
box-shadow:22px 0 55px rgba(0,0,0,.24)
}

.side-menu.open{left:0}

.menu-head{
min-height:78px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 21px;
background:#0a0a0a;
color:#fff;
border-bottom:1px solid #292929;
position:sticky;
top:0;
z-index:4
}

.menu-head strong{
font-family:var(--serif);
font-size:30px;
font-weight:400
}

.close-menu{
width:42px;
height:42px;
border-radius:50%;
border:0;
background:#fff;
color:#111;
font-size:23px
}

.menu-top-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
padding:15px 17px 11px;
background:#f7f4ed
}

.menu-top-action{
min-height:57px;
border:1.5px solid #111;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
background:#fff;
font-size:11px;
font-weight:900;
letter-spacing:.6px;
text-transform:uppercase
}

.menu-top-action.subscribe{
background:var(--green);
border-color:var(--green)
}

.mini-profile{
position:relative;
width:22px;
height:22px
}

.mini-profile:before{
content:"";
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:7px;
height:7px;
border:1.7px solid currentColor;
border-radius:50%
}

.mini-profile:after{
content:"";
position:absolute;
left:50%;
bottom:0;
transform:translateX(-50%);
width:18px;
height:9px;
border:1.7px solid currentColor;
border-bottom:0;
border-radius:14px 14px 0 0
}

.language-area{
margin:0 17px 12px;
padding:11px 14px;
border:1.5px solid #111;
background:#fff
}

.language-area label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:1.5px;
color:#777;
margin-bottom:6px;
text-transform:uppercase
}

.language-area select{
width:100%;
height:33px;
border:0;
background:#fff;
color:#111;
font-weight:800;
outline:none
}

.menu-list{
padding:5px 17px 17px;
border-top:1px solid #ddd
}

.menu-list a{
min-height:44px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #d8d2c8;
font-size:11px;
font-weight:800
}

.menu-list a:after{
content:"›";
font-family:var(--serif);
font-size:20px;
color:#777
}

.menu-contact-wrap{
padding:17px;
background:#f4f0e7;
border-top:1px solid #ddd
}

.menu-contact{
width:100%;
min-height:53px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
color:#fff;
font-size:11px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase
}

.menu-legal{
display:flex;
gap:13px;
flex-wrap:wrap;
margin-top:13px
}

.menu-legal a{
font-size:9px;
font-weight:700;
color:#777
}

/* =====================================================
   COMPACT CLUB INTRO
===================================================== */

.club-intro{
max-width:720px;
margin:auto;
padding:19px 18px 7px;
text-align:center
}

.kicker{
font-size:7px;
font-weight:900;
letter-spacing:2.6px;
color:var(--gold);
text-transform:uppercase
}

.club-intro h1{
font-family:var(--serif);
font-size:33px;
font-weight:400;
line-height:1;
margin-top:6px
}

.club-intro p{
max-width:565px;
margin:7px auto 0;
font-family:var(--serif);
font-size:12px;
line-height:1.4;
color:#655f58
}

/* =====================================================
   BENEFITS — COMPACT CAROUSEL
===================================================== */

.benefits{
padding:11px 0 14px;
overflow:hidden
}

.section-heading{
text-align:center;
padding:0 18px 6px
}

.section-heading h2{
font-family:var(--serif);
font-size:31px;
font-weight:400;
line-height:1;
margin-top:5px
}

.carousel-track{
display:flex;
align-items:center;
gap:10px;
overflow-x:auto;
scroll-snap-type:x mandatory;
scrollbar-width:none;
padding:6px 19vw 7px;
overscroll-behavior-x:contain;
-webkit-overflow-scrolling:touch
}

.carousel-track::-webkit-scrollbar{display:none}

.club-card{
position:relative;
flex:0 0 62vw;
height:70vw;
max-width:405px;
max-height:465px;
overflow:hidden;
scroll-snap-align:center;
background:#111;
opacity:.40;
transform:scale(.91);
transition:transform .24s ease,opacity .24s ease,box-shadow .24s ease
}

.club-card.active{
opacity:1;
transform:scale(1);
z-index:3;
box-shadow:0 13px 34px rgba(0,0,0,.18)
}

.club-card img{
width:100%;
height:100%;
object-fit:cover;
object-position:center
}

.club-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.31) 40%,rgba(0,0,0,0) 70%);
pointer-events:none
}

.card-content{
position:absolute;
z-index:4;
left:0;
right:0;
bottom:0;
padding:14px;
color:#fff
}

.card-number{
font-size:6px;
font-weight:900;
letter-spacing:1.8px;
color:var(--gold-light);
margin-bottom:4px;
text-transform:uppercase
}

.card-content h3{
font-family:var(--serif);
font-size:23px;
font-weight:400;
line-height:1;
text-shadow:0 2px 10px rgba(0,0,0,.35)
}

.card-content p{
font-size:9px;
line-height:1.38;
margin-top:5px;
color:#f2f2f2;
text-shadow:0 1px 8px rgba(0,0,0,.45)
}

.carousel-controls{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-top:2px
}

.carousel-arrow{
width:33px;
height:33px;
border:1px solid #111;
border-radius:50%;
background:transparent;
font-size:15px
}

.carousel-dots{
display:flex;
align-items:center;
gap:5px
}

.carousel-dot{
width:5px;
height:5px;
border:0;
border-radius:50%;
background:#aaa49b;
padding:0
}

.carousel-dot.active{
width:17px;
border-radius:99px;
background:#111
}

/* =====================================================
   PLANS — DIRECTLY UNDER BENEFITS
===================================================== */

.plans-section{
background:#fff;
border-top:1px solid var(--line);
padding:20px 12px 24px
}

.plans-inner{
max-width:920px;
margin:auto
}

.plans-heading{
text-align:center;
margin-bottom:12px
}

.plans-heading h2{
font-family:var(--serif);
font-size:31px;
font-weight:400;
line-height:1;
margin-top:5px
}

.plans-heading p{
font-family:var(--serif);
font-size:11px;
color:#6b655e;
margin-top:5px
}

.plans-grid{
display:grid;
gap:7px
}

.plan-card{
width:100%;
min-height:94px;
padding:11px 13px;
border:1.5px solid #bbb4a8;
background:#faf8f3;
color:#111;
display:grid;
grid-template-columns:1fr auto;
grid-template-rows:auto auto auto auto;
column-gap:10px;
text-align:left;
transition:transform .12s ease,box-shadow .12s ease
}

.plan-card:hover{
box-shadow:0 7px 20px rgba(0,0,0,.08)
}

.plan-card.trial{
background:#f0f8eb;
border-color:#88a975
}

.plan-card.annual{
background:#090909;
border-color:#090909;
color:#fff
}

.plan-card:active{transform:scale(.987)}

.plan-top{
grid-column:1/3;
min-height:15px
}

.plan-badge{
display:inline-block;
padding:3px 6px;
border-radius:99px;
font-size:6px;
font-weight:900;
letter-spacing:1px
}

.plan-badge.free{
background:var(--green-dark);
color:#fff
}

.plan-badge.best{
background:var(--gold-light);
color:#111
}

.plan-price{
grid-row:2/4;
align-self:center;
font-family:var(--serif);
font-size:31px;
line-height:1
}

.plan-period{
align-self:end;
text-align:right;
font-family:var(--serif);
font-size:14px
}

.plan-note{
text-align:right;
font-size:8px;
color:#6e685f;
line-height:1.3
}

.plan-card.annual .plan-note{
color:#bbb
}

.plan-action{
grid-column:1/3;
padding-top:6px;
font-size:7px;
font-weight:900;
letter-spacing:1px
}

.plans-smallprint{
max-width:720px;
margin:9px auto 0;
font-size:7px;
line-height:1.45;
color:#79736b;
text-align:center
}

/* =====================================================
   FOOTER
===================================================== */

.club-footer{
background:#070707;
color:#fff;
text-align:center;
padding:17px 16px
}

.club-footer strong{
font-family:var(--serif);
font-size:16px;
font-weight:400;
letter-spacing:2px;
color:var(--gold)
}

.club-footer span{
display:block;
margin-top:4px;
font-size:6px;
letter-spacing:1.1px;
color:#888
}

/* =====================================================
   MEMBERSHIP MODAL
===================================================== */

.membership-overlay{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.76);
backdrop-filter:blur(5px)
}

.membership-overlay.open{display:flex}

.membership-shell{
position:relative;
width:100%;
max-width:650px;
max-height:96vh;
overflow-y:auto;
background:#fff;
border-radius:17px 17px 0 0
}

.membership-close{
position:absolute;
right:11px;
top:11px;
z-index:10;
width:36px;
height:36px;
border:1px solid #bbb;
border-radius:50%;
background:#fff;
font-size:20px
}

.membership-step{display:none}
.membership-step.active{display:block}

.step-head{
padding:22px 19px 14px;
background:var(--cream);
border-bottom:1px solid #ddd5c8
}

.step-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.2px;
color:var(--gold)
}

.step-head h2,
.success-wrap h2{
font-family:var(--serif);
font-size:27px;
font-weight:400;
line-height:1.04;
margin-top:6px;
padding-right:38px
}

.step-head p{
font-size:10px;
line-height:1.45;
color:#6b655e;
margin-top:6px
}

.progress{
display:flex;
align-items:center;
max-width:180px;
margin-top:11px
}

.progress-item{
width:24px;
height:24px;
border:1px solid #aaa;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:900;
background:#fff;
color:#777
}

.progress-item.active{
background:#111;
border-color:#111;
color:#fff
}

.progress-item.complete{
background:var(--green-dark);
border-color:var(--green-dark);
color:#fff
}

.progress-line{
height:1px;
background:#c9c1b5;
flex:1
}

.progress-line.complete{background:var(--green-dark)}

.plan-summary{
display:flex;
align-items:center;
justify-content:space-between;
gap:14px;
padding:12px 19px;
background:#0b0b0b;
color:#fff
}

.summary-label{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.6px;
color:var(--gold-light);
margin-bottom:3px
}

.plan-summary strong{
font-family:var(--serif);
font-size:17px;
font-weight:400
}

.summary-price{
font-family:var(--serif);
font-size:20px;
white-space:nowrap
}

.trial-summary{
display:none;
padding:9px 19px;
background:#e8f7df;
border-bottom:1px solid #b4cda5;
font-size:8px;
line-height:1.45;
color:#36542b
}

.trial-summary.show{display:block}

.membership-form{
padding:17px 19px 22px
}

.field{
margin-bottom:11px
}

.field label{
display:flex;
align-items:center;
gap:5px;
margin-bottom:5px;
font-size:9px;
font-weight:800
}

.required-star{color:var(--red)}

.optional-label{
font-size:6px;
font-weight:900;
letter-spacing:1px;
color:#969089;
margin-left:3px
}

.field input,
.field select{
width:100%;
height:40px;
padding:0 11px;
border:1px solid #bdb6ab;
background:#fff;
color:#111;
outline:none;
border-radius:0
}

.field.error input,
.field.error select{
border:2px solid var(--red);
background:#fff8f8
}

.field-error{
display:none;
margin-top:4px;
font-size:8px;
font-weight:700;
color:var(--red)
}

.field.error .field-error{display:block}

.pet-title{
font-family:var(--serif);
font-size:19px;
font-weight:400;
margin:5px 0
}

.pet-note{
font-size:8px;
line-height:1.4;
color:#777168;
margin-bottom:11px
}

/* BREEDS */

.breed-combobox{position:relative}
.breed-input-wrap{position:relative}
.breed-input-wrap input{padding-right:40px}

.breed-toggle{
position:absolute;
right:0;
top:0;
width:40px;
height:40px;
border:0;
background:transparent;
font-size:17px
}

.breed-results{
position:absolute;
left:0;
right:0;
top:44px;
z-index:100;
display:none;
max-height:240px;
overflow:auto;
background:#fff;
border:1px solid #aaa39a;
box-shadow:0 10px 28px rgba(0,0,0,.17)
}

.breed-results.open{display:block}

.breed-option{
width:100%;
border:0;
border-bottom:1px solid #ece8e1;
background:#fff;
padding:10px 12px;
text-align:left;
display:block
}

.breed-option:active{background:#f3eee4}

.breed-option-name{
display:block;
font-size:10px;
font-weight:800
}

.breed-option-secondary{
display:block;
font-size:8px;
color:#888178;
margin-top:2px
}

.breed-empty{
padding:12px;
font-size:9px;
color:#777
}

.breed-disabled{
background:#f3f1ed!important;
color:#aaa!important
}

/* BUTTONS */

.required-note{
font-size:8px;
color:#777;
margin:2px 0 12px
}

.required-note span{color:var(--red)}

.primary-button{
width:100%;
height:46px;
border:0;
background:#090909;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.5px
}

.primary-button:disabled{
opacity:.55;
cursor:wait
}

.secondary-button{
width:100%;
height:40px;
border:1px solid #111;
background:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
margin-top:7px
}

/* CHECKOUT */

.checkout-wrap{
padding:21px 19px 25px
}

.checkout-title{
font-family:var(--serif);
font-size:25px;
font-weight:400;
text-align:center
}

.checkout-copy{
max-width:450px;
margin:7px auto 17px;
text-align:center;
font-size:9px;
line-height:1.5;
color:#6c665e
}

.checkout-trial{
display:none;
padding:11px 13px;
margin-bottom:12px;
background:#eef9e8;
border:1px solid #a8c597;
font-size:8px;
line-height:1.5;
text-align:center
}

.checkout-trial.show{display:block}

.payment-options{
border:1.5px solid #111;
padding:0 14px;
margin-bottom:9px
}

.payment-row{
min-height:59px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
border-bottom:1px solid #ded8cf
}

.payment-row:last-child{border-bottom:0}

.payment-row strong{
font-size:9px;
letter-spacing:.8px
}

.wallet-logos{
display:flex;
align-items:center;
gap:13px;
font-size:11px;
font-weight:900
}

.wallet-google{
font-size:13px;
font-weight:700
}

.wallet-apple{
font-size:14px;
font-weight:700
}

.card-brands{
font-size:8px;
font-weight:900;
letter-spacing:.5px
}

.checkout-security{
display:flex;
align-items:center;
justify-content:center;
gap:6px;
font-size:8px;
color:#777;
margin:13px 0
}

.checkout-error{
display:none;
padding:10px;
margin-bottom:10px;
background:#fff3f3;
border:1px solid var(--red);
color:var(--red);
font-size:9px;
line-height:1.4
}

.checkout-error.show{display:block}

/* VERIFYING */

.verify-wrap{
padding:39px 22px 33px;
text-align:center
}

.verify-spinner{
width:45px;
height:45px;
margin:0 auto 17px;
border:3px solid #e2ddd4;
border-top-color:#111;
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.verify-wrap h2{

return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value||"").trim());

function formatDate(iso){

if(!iso){
return getT().notAvailable;
}

const date=new Date(iso);

if(Number.isNaN(date.getTime())){
return getT().notAvailable;
}

try{
return new Intl.DateTimeFormat(
LOCALE[currentLanguage]||"en-GB",
{day:"numeric",month:"long",year:"numeric"}
).format(date);
}catch(error){
return date.toLocaleDateString();
}

}

/* =====================================================
   CAROUSEL
===================================================== */

const track=$("carouselTrack");
const cards=[...document.querySelectorAll(".club-card")];
const dots=[...document.querySelectorAll(".carousel-dot")];

function updateCarousel(index){

activeSlide=index;

cards.forEach((card,i)=>{
card.classList.toggle("active",i===index);
});

dots.forEach((dot,i)=>{
dot.classList.toggle("active",i===index);
});

}

function centerCard(index,behavior="smooth"){

if(index<0){
index=cards.length-1;
}

if(index>=cards.length){
index=0;
}

const card=cards[index];

const target=
card.offsetLeft-
(track.clientWidth/2)+
(card.clientWidth/2);

track.scrollTo({
left:target,
behavior
});

updateCarousel(index);

}

$("carouselPrev").addEventListener("click",()=>{
centerCard(activeSlide-1);
});

$("carouselNext").addEventListener("click",()=>{
centerCard(activeSlide+1);
});

dots.forEach(dot=>{
dot.addEventListener("click",()=>{
centerCard(Number(dot.dataset.dot));
});
});

let carouselTimer=null;

track.addEventListener("scroll",()=>{

clearTimeout(carouselTimer);

carouselTimer=setTimeout(()=>{

const center=
track.scrollLeft+
track.clientWidth/2;

let closest=0;
let distance=Infinity;

cards.forEach((card,index)=>{

const cardCenter=
card.offsetLeft+
card.clientWidth/2;

const currentDistance=
Math.abs(cardCenter-center);

if(currentDistance<distance){
distance=currentDistance;
closest=index;
}

});

updateCarousel(closest);

},80);

});

===================================================== */

const petType=$("petType");
const petBreed=$("petBreed");
const petBreedId=$("petBreedId");
const breedResults=$("breedResults");
const breedToggle=$("breedToggle");

function hasPetData(){

return Boolean(
window.PETSDOGUE_PET_DATA &&
typeof window.PETSDOGUE_PET_DATA.search==="function"
);

}

function getBreedType(){

return ["dog","cat","bird","horse","small"].includes(petType.value)
?petType.value
:"";

}

function breedLanguage(){

return ["ru","uk"].includes(currentLanguage)
?currentLanguage
:"en";

}

function setBreedEnabled(){

const type=getBreedType();

petBreed.disabled=!type;
breedToggle.disabled=!type;

if(!type){

petBreed.classList.add("breed-disabled");
petBreed.placeholder=getT().breedPlaceholder;

closeBreedResults();

}else{

petBreed.classList.remove("breed-disabled");
petBreed.placeholder=getT().breedSearch;

}

}

function openBreedResults(){

breedResults.classList.add("open");
petBreed.setAttribute("aria-expanded","true");

}

function closeBreedResults(){

breedResults.classList.remove("open");
petBreed.setAttribute("aria-expanded","false");

}

function chooseBreed(item){

if(!item){
return;
}

selectedBreedId=item.id;
petBreedId.value=item.id;

petBreed.value=
window.PETSDOGUE_PET_DATA.getDisplayName(
item,
breedLanguage()
);

closeBreedResults();

}

function renderBreedResults(query=""){

const type=getBreedType();

if(!type||!hasPetData()){
return;
}

currentBreedResults=
window.PETSDOGUE_PET_DATA.search(
type,
query,
{
language:breedLanguage(),
limit:60
}
);

breedResults.innerHTML="";

if(!currentBreedResults.length){

const empty=document.createElement("div");
empty.className="breed-empty";
empty.textContent=getT().breedEmpty;

breedResults.appendChild(empty);
openBreedResults();

return;
}

currentBreedResults.forEach(item=>{

const button=document.createElement("button");
button.type="button";
button.className="breed-option";

const main=document.createElement("span");
main.className="breed-option-name";
main.textContent=item.displayName||item.name;

button.appendChild(main);

if(
breedLanguage()!=="en" &&
item.name &&
item.name!==item.displayName
){

const secondary=document.createElement("span");
secondary.className="breed-option-secondary";
secondary.textContent=item.name;

button.appendChild(secondary);

}

button.addEventListener("click",()=>{
chooseBreed(item);
});

breedResults.appendChild(button);

});

openBreedResults();

}

function refreshBreedLanguage(){

setBreedEnabled();

if(!selectedBreedId||!hasPetData()){
return;
}

const item=
window.PETSDOGUE_PET_DATA.findById(selectedBreedId);

if(item){

petBreed.value=
window.PETSDOGUE_PET_DATA.getDisplayName(
item,
breedLanguage()
);

}

}

petType.addEventListener("change",()=>{

const type=getBreedType();

if(
selectedBreedId &&
hasPetData() &&
!window.PETSDOGUE_PET_DATA.isCompatible(type,selectedBreedId)
){

selectedBreedId="";
petBreedId.value="";
petBreed.value="";

}

if(!type){

selectedBreedId="";
petBreedId.value="";
petBreed.value="";

}

setBreedEnabled();

if(type){
renderBreedResults("");
}

});

petBreed.addEventListener("focus",()=>{

if(getBreedType()){
renderBreedResults(petBreed.value.trim());
}

});

petBreed.addEventListener("input",()=>{

selectedBreedId="";
petBreedId.value="";

if(getBreedType()){
renderBreedResults(petBreed.value.trim());
}

});

breedToggle.addEventListener("click",()=>{

if(!getBreedType()){
return;
}

if(breedResults.classList.contains("open")){
closeBreedResults();
}else{
renderBreedResults("");
}

});

document.addEventListener("click",event=>{

const combo=$("breedCombobox");

if(combo&&!combo.contains(event.target)){
closeBreedResults();
}

});

};

);

async function createCheckout(){

const t=getT();
const button=$("openCheckoutButton");
const errorBox=$("checkoutError");

errorBox.classList.remove("show");
errorBox.textContent="";

const questionnaire=
safeJsonParse(
localStorage.getItem("petsDogueClubQuestionnaire")||"{}"
);

button.disabled=true;
button.textContent=t.openingCheckout;

try{

const response=
await fetch(
"/api/create-club-checkout",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
plan:selectedPlan,
language:currentLanguage,
firstName:questionnaire.firstName||"",
email:questionnaire.email||"",
country:questionnaire.country||"",
petName:questionnaire.petName||"",
petType:questionnaire.petType||"",
breed:questionnaire.breed||"",
breedId:questionnaire.breedId||""
})
}
);

let data={};

try{
data=await response.json();
}catch(error){}

if(!response.ok||!data||!data.checkoutUrl){
throw new Error(data.error||t.checkoutError);
}

localStorage.setItem(
"petsDoguePendingCheckout",
JSON.stringify({
plan:selectedPlan,
sessionId:data.sessionId||"",
createdAt:new Date().toISOString()
})
);

window.location.assign(data.checkoutUrl);

}catch(error){

console.error("PETS & DOGUE Checkout:",error);

errorBox.textContent=
error.message||
t.checkoutError;

errorBox.classList.add("show");

button.disabled=false;
button.textContent=t.continueCheckout;

}

}

$("openCheckoutButton").addEventListener("click",createCheckout);

/* =====================================================
   VERIFY STRIPE CHECKOUT
===================================================== */

async function verifyCheckout(sessionId){

if(verificationBusy){
return;
}

verificationBusy=true;
pendingSessionId=sessionId;

membershipOverlay.classList.add("open");
document.body.classList.add("locked");

showStep("verifyStep");

try{

const response=
await fetch(
"/api/verify-club-checkout",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
sessionId
})
}
);

let data={};

try{
data=await response.json();
}catch(error){}

if(!response.ok){
throw new Error(data.error||"Verification failed.");
}

if(!data.verified||!data.membership){
throw new Error(data.state||"not_verified");
}

const membership=data.membership;

membership.stripe=
membership.stripe&&typeof membership.stripe==="object"
?membership.stripe
:{};

membership.stripe.checkoutSessionId=sessionId;

localStorage.setItem(
"petsDogueMembership",
JSON.stringify(membership)
);

localStorage.removeItem(
"petsDoguePendingCheckout"
);

localStorage.setItem(
"petsDogueAccountEmail",
membership.email||""
);

selectedPlan=
membership.plan||
selectedPlan;

renderVerifiedMembership(
membership,
true
);

cleanCheckoutUrl();

}catch(error){

console.error(
"PETS & DOGUE verification:",
error
);

text(
"verifyDebug",
String(error.message||error)
);

showStep("failureStep");

}finally{

verificationBusy=false;

}

}

function cleanCheckoutUrl(){

try{

const url=
new URL(window.location.href);

url.searchParams.delete("membership");
url.searchParams.delete("plan");
url.searchParams.delete("session_id");

window.history.replaceState(
{},
document.title,
url.pathname+
url.search+
url.hash
);

}catch(error){}

}

/* =====================================================
   CHECKOUT RETURN
===================================================== */

function processCheckoutReturn(){

const params=
new URLSearchParams(window.location.search);

const status=params.get("membership");
const plan=params.get("plan");
const sessionId=params.get("session_id");

if(
plan &&
["free","monthly","annual"].includes(plan)
){

selectedPlan=plan;
updatePlanSummary();

}

if(status==="success"){

if(!sessionId){

membershipOverlay.classList.add("open");
document.body.classList.add("locked");

text(
"verifyDebug",
"Missing Stripe Checkout Session ID."
);

showStep("failureStep");

return;
}

verifyCheckout(sessionId);
return;

}

if(status==="cancelled"){

membershipOverlay.classList.add("open");
document.body.classList.add("locked");

showStep("checkoutStep");

const box=$("checkoutError");

box.textContent=getT().cancelled;
box.classList.add("show");

cleanCheckoutUrl();

}

}

$("retryVerification").addEventListener("click",()=>{

const pending=
safeJsonParse(
localStorage.getItem("petsDoguePendingCheckout")||"{}"

if(pending.sessionId){
verifyCheckout(pending.sessionId);
return;
}

showStep("checkoutStep");

});

function restoreQuestionnaire(){

const saved=
safeJsonParse(
localStorage.getItem("petsDogueClubQuestionnaire")||"{}"
);

if(saved.firstName){
$("firstName").value=saved.firstName;
}

if(saved.email){
$("memberEmail").value=saved.email;
}

if(saved.country){
$("memberCountry").value=saved.country;
}

if(saved.petName){
$("petName").value=saved.petName;
}

if(saved.petType){
$("petType").value=saved.petType;
}

if(saved.birthday){
$("petBirthday").value=saved.birthday;
}

if(saved.social){
$("petSocial").value=saved.social;
}

if(saved.breedId&&hasPetData()){

const item=
window.PETSDOGUE_PET_DATA.findById(saved.breedId);

if(
item &&
window.PETSDOGUE_PET_DATA.isCompatible(
saved.petType,
saved.breedId
)
){

selectedBreedId=saved.breedId;
$("petBreedId").value=saved.breedId;

$("petBreed").value=
window.PETSDOGUE_PET_DATA.getDisplayName(
item,
breedLanguage()
);

}

}else if(saved.breed){

$("petBreed").value=saved.breed;

}

setBreedEnabled();

}

}

requestAnimationFrame(()=>{
