<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Join PETS & DOGUE Club. First 30 days free, then £1 per month, or £10 per year.">
<title>PETS & DOGUE Club</title>

<style>
:root{
--black:#070707;
--cream:#f5f0e6;
--white:#fff;
--gold:#bd8b29;
--gold-light:#efd47a;
--green:#65e51f;
--green-dark:#176b3b;
--line:#cbc4b8;
--red:#c52a2a;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.locked{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
width:100%;
}

/* HEADER */

.site-header{
background:var(--black);
color:#fff;
position:sticky;
top:0;
z-index:1800;
border-bottom:1px solid #292929;
}

.header-main{
height:92px;
display:grid;
grid-template-columns:52px minmax(0,1fr) auto;
align-items:center;
gap:5px;
padding:0 8px;
max-width:1550px;
margin:auto;
}

.menu-button,
.profile-button{
width:42px;
height:42px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.menu-button{
position:relative;
flex-direction:column;
gap:5px;
}

.menu-button span.line{
width:27px;
height:2px;
background:#fff;
border-radius:20px;
margin-left:6px;
}

.menu-lang-mark{
position:absolute;
left:0;
top:0;
width:18px;
height:18px;
border:1.3px solid #fff;
border-radius:50%;
background:#070707;
display:flex;
align-items:center;
justify-content:center;
font-family:var(--serif);
font-size:8px;
font-weight:bold;
}

.brand{
justify-self:center;
text-align:center;
line-height:.86;
}

.brand-small{
font-family:var(--serif);
font-size:10px;
letter-spacing:2.3px;
color:var(--gold);
margin-bottom:5px;
}

.brand-big{
font-family:var(--serif);
font-size:37px;
font-weight:400;
letter-spacing:1.7px;
color:var(--gold);
}

.header-actions{
display:flex;
align-items:center;
gap:3px;
}

.subscribe-head{
min-height:38px;
padding:0 10px;
border:0;
background:var(--green);
color:#080808;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
font-weight:900;
letter-spacing:.7px;
text-transform:uppercase;
white-space:nowrap;
}

.profile-icon{
position:relative;
width:25px;
height:25px;
}

.profile-icon:before{
content:"";
position:absolute;
left:50%;
top:1px;
transform:translateX(-50%);
width:8px;
height:8px;
border:2px solid #fff;
border-radius:50%;
}

.profile-icon:after{
content:"";
position:absolute;
left:50%;
bottom:1px;
transform:translateX(-50%);
width:20px;
height:11px;
border:2px solid #fff;
border-bottom:0;
border-radius:16px 16px 0 0;
}

.category-nav{
height:43px;
display:flex;
align-items:center;
gap:25px;
padding:0 16px;
overflow-x:auto;
scrollbar-width:none;
border-top:1px solid #262626;
border-bottom:1px solid #292929;
font-size:9px;
font-weight:900;
letter-spacing:1.1px;
text-transform:uppercase;
}

.category-nav::-webkit-scrollbar{
display:none;
}

.category-nav a{
white-space:nowrap;
}

/* SIDE MENU */

.menu-overlay{
position:fixed;
inset:0;
z-index:8000;
background:rgba(0,0,0,.58);
opacity:0;
visibility:hidden;
transition:.22s;
backdrop-filter:blur(2px);
}

.menu-overlay.show{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
top:0;
bottom:0;
left:-500px;
z-index:8100;
width:min(455px,84vw);
background:#fff;
color:#111;
overflow-y:auto;
transition:left .3s ease;
box-shadow:22px 0 55px rgba(0,0,0,.24);
}

.side-menu.open{
left:0;
}

.menu-head{
min-height:78px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 21px;
background:#0a0a0a;
color:#fff;
border-bottom:1px solid #292929;
position:sticky;
top:0;
z-index:4;
}

.menu-head strong{
font-family:var(--serif);
font-size:30px;
font-weight:400;
}

.close-menu{
width:42px;
height:42px;
border-radius:50%;
border:0;
background:#fff;
color:#111;
font-size:23px;
}

.menu-top-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
padding:15px 17px 11px;
background:#f7f4ed;
}

.menu-top-action{
min-height:57px;
border:1.5px solid #111;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
background:#fff;
font-size:11px;
font-weight:900;
letter-spacing:.6px;
text-transform:uppercase;
}

.menu-top-action.subscribe{
background:var(--green);
border-color:var(--green);
}

.language-area{
margin:0 17px 12px;
padding:11px 14px;
border:1.5px solid #111;
background:#fff;
}

.language-area label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:1.5px;
color:#777;
margin-bottom:6px;
text-transform:uppercase;
}

.language-area select{
width:100%;
height:33px;
border:0;
background:#fff;
color:#111;
font-weight:800;
outline:none;
}

.menu-list{
padding:5px 17px 17px;
border-top:1px solid #ddd;
}

.menu-list a{
min-height:44px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #d8d2c8;
font-size:11px;
font-weight:800;
}

.menu-list a:after{
content:"›";
font-family:var(--serif);
font-size:20px;
color:#777;
}

.menu-contact-wrap{
padding:17px;
background:#f4f0e7;
border-top:1px solid #ddd;
}

.menu-contact{
width:100%;
min-height:53px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
color:#fff;
font-size:11px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
}

.menu-legal{
display:flex;
gap:13px;
flex-wrap:wrap;
margin-top:13px;
}

.menu-legal a{
font-size:9px;
font-weight:700;
color:#777;
}

/* MAIN */

.club-intro{
max-width:720px;
margin:auto;
padding:19px 18px 7px;
text-align:center;
}

.kicker{
font-size:7px;
font-weight:900;
letter-spacing:2.6px;
color:var(--gold);
text-transform:uppercase;
}

.club-intro h1{
font-family:var(--serif);
font-size:33px;
font-weight:400;
line-height:1;
margin-top:6px;
}

.club-intro p{
max-width:565px;
margin:7px auto 0;
font-family:var(--serif);
font-size:12px;
line-height:1.4;
color:#655f58;
}

.benefits{
padding:11px 0 14px;
overflow:hidden;
}

.section-heading{
text-align:center;
padding:0 18px 6px;
}

.section-heading h2{
font-family:var(--serif);
font-size:31px;
font-weight:400;
line-height:1;
margin-top:5px;
}

.carousel-track{
display:flex;
align-items:center;
gap:10px;
overflow-x:auto;
scroll-snap-type:x mandatory;
scrollbar-width:none;
padding:6px 19vw 7px;
overscroll-behavior-x:contain;
-webkit-overflow-scrolling:touch;
}

.carousel-track::-webkit-scrollbar{
display:none;
}

.club-card{
position:relative;
flex:0 0 62vw;
height:70vw;
max-width:405px;
max-height:465px;
overflow:hidden;
scroll-snap-align:center;
background:#111;
opacity:.32;
transform:scale(.91);
filter:saturate(.76) brightness(.91);
transition:
transform .25s ease,
opacity .25s ease,
filter .25s ease,
box-shadow .25s ease;
}

.club-card.active{
opacity:1;
transform:scale(1);
filter:none;
z-index:3;
box-shadow:0 13px 34px rgba(0,0,0,.18);
}

.club-card img{
height:100%;
object-fit:cover;
}

.club-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.82),
rgba(0,0,0,.28) 42%,
transparent 72%
);
pointer-events:none;
}

.card-content{
position:absolute;
z-index:4;
left:0;
right:0;
bottom:0;
padding:14px;
color:#fff;
}

.card-number{
font-size:6px;
font-weight:900;
letter-spacing:1.8px;
color:var(--gold-light);
margin-bottom:4px;
text-transform:uppercase;
}

.card-content h3{
font-family:var(--serif);
font-size:23px;
font-weight:400;
line-height:1;
}

.card-content p{
font-size:9px;
line-height:1.38;
margin-top:5px;
}

.carousel-controls{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-top:2px;
}

.carousel-arrow{
width:33px;
height:33px;
border:1px solid #111;
border-radius:50%;
background:transparent;
font-size:15px;
}

.carousel-dots{
display:flex;
align-items:center;
gap:5px;
}

.carousel-dot{
width:5px;
height:5px;
border:0;
border-radius:50%;
background:#aaa49b;
padding:0;
}

.carousel-dot.active{
width:17px;
border-radius:99px;
background:#111;
}

/* PLANS */

.plans-section{
background:#fff;
border-top:1px solid var(--line);
padding:20px 12px 24px;
}

.plans-inner{
max-width:920px;
margin:auto;
}

.plans-heading{
text-align:center;
margin-bottom:12px;
}

.plans-heading h2{
font-family:var(--serif);
font-size:31px;
font-weight:400;
line-height:1;
margin-top:5px;
}

.plans-heading p{
font-family:var(--serif);
font-size:11px;
color:#6b655e;
margin-top:5px;
}

.plans-grid{
display:grid;
gap:7px;
}

.plan-card{
width:100%;
min-height:94px;
padding:11px 13px;
border:1.5px solid #bbb4a8;
background:#faf8f3;
color:#111;
display:grid;
grid-template-columns:1fr auto;
grid-template-rows:auto auto auto auto;
column-gap:10px;
text-align:left;
}

.plan-card.trial{
background:#f0f8eb;
border-color:#88a975;
}

.plan-card.annual{
background:#090909;
border-color:#090909;
color:#fff;
}

.plan-top{
grid-column:1/3;
min-height:15px;
}

.plan-badge{
display:inline-block;
padding:3px 6px;
border-radius:99px;
font-size:6px;
font-weight:900;
letter-spacing:1px;
}

.plan-badge.free{
background:var(--green-dark);
color:#fff;
}

.plan-badge.best{
background:var(--gold-light);
color:#111;
}

.plan-price{
grid-row:2/4;
align-self:center;
font-family:var(--serif);
font-size:31px;
line-height:1;
}

.plan-period{
align-self:end;
text-align:right;
font-family:var(--serif);
font-size:14px;
}

.plan-note{
text-align:right;
font-size:8px;
color:#6e685f;
line-height:1.3;
}

.plan-card.annual .plan-note{
color:#bbb;
}

.plan-action{
grid-column:1/3;
padding-top:6px;
font-size:7px;
font-weight:900;
letter-spacing:1px;
}

.plans-smallprint{
max-width:720px;
margin:9px auto 0;
font-size:7px;
line-height:1.45;
color:#79736b;
text-align:center;
}

.club-footer{
background:#070707;
color:#fff;
text-align:center;
padding:17px 16px;
}

.club-footer strong{
font-family:var(--serif);
font-size:16px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.club-footer span{
display:block;
margin-top:4px;
font-size:6px;
letter-spacing:1.1px;
color:#888;
}

/* MODAL */

.membership-overlay{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.76);
backdrop-filter:blur(5px);
}

.membership-overlay.open{
display:flex;
}

.membership-shell{
position:relative;
width:100%;
max-width:650px;
max-height:96vh;
overflow-y:auto;
background:#fff;
border-radius:17px 17px 0 0;
}

.membership-close{
position:absolute;
right:11px;
top:11px;
z-index:30;
width:36px;
height:36px;
border:1px solid #bbb;
border-radius:50%;
background:#fff;
font-size:20px;
}

.membership-step{
display:none;
}

.membership-step.active{
display:block;
}

.step-head{
padding:22px 19px 14px;
background:var(--cream);
border-bottom:1px solid #ddd5c8;
}

.step-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.2px;
color:var(--gold);
}

.step-head h2,
.success-wrap h2{
font-family:var(--serif);
font-size:27px;
font-weight:400;
line-height:1.04;
margin-top:6px;
padding-right:38px;
}

.step-head p{
font-size:10px;
line-height:1.45;
color:#6b655e;
margin-top:6px;
}

.plan-summary{
display:flex;
align-items:center;
justify-content:space-between;
gap:14px;
padding:12px 19px;
background:#0b0b0b;
color:#fff;
}

.summary-label{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.6px;
color:var(--gold-light);
margin-bottom:3px;
}

.plan-summary strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
}

.summary-price{
font-family:var(--serif);
font-size:20px;
white-space:nowrap;
}

.membership-form{
padding:17px 19px 22px;
}

.field{
margin-bottom:11px;
}

.field label{
display:flex;
align-items:center;
gap:5px;
margin-bottom:5px;
font-size:9px;
font-weight:800;
}

.required-star{
color:var(--red);
}

.optional-label{
font-size:6px;
font-weight:900;
letter-spacing:1px;
color:#969089;
margin-left:3px;
}

.field input,
.field select{
width:100%;
height:40px;
padding:0 11px;
border:1px solid #bdb6ab;
background:#fff;
color:#111;
outline:none;
}

.field.error input,
.field.error select{
border:2px solid var(--red);
background:#fff8f8;
}

.field-error{
display:none;
margin-top:4px;
font-size:8px;
font-weight:700;
color:var(--red);
}

.field.error .field-error{
display:block;
}

.pet-title{
font-family:var(--serif);
font-size:19px;
font-weight:400;
margin:5px 0;
}

.pet-note{
font-size:8px;
line-height:1.4;
color:#777168;
margin-bottom:11px;
}

.primary-button{
width:100%;
min-height:46px;
border:0;
background:#090909;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
}

.secondary-button{
width:100%;
min-height:40px;
border:1px solid #111;
background:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
margin-top:7px;
}

/* PAYMENT TOP */

.checkout-step{
background:#f7f7f5;
min-height:100%;
}

.payment-top{
background:#fff;
padding:15px 18px 14px;
border-bottom:1px solid #dedbd4;
}

.payment-topline{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding-right:42px;
}

.payment-back{
border:0;
background:transparent;
font-size:8px;
font-weight:900;
letter-spacing:1.4px;
padding:3px 0;
}

.payment-secure{
font-size:7px;
font-weight:900;
letter-spacing:1.7px;
color:var(--green-dark);
text-transform:uppercase;
}

.payment-brand{
font-family:var(--serif);
font-size:10px;
letter-spacing:2px;
color:var(--gold);
margin-top:10px;
}

.payment-title{
font-family:var(--serif);
font-size:25px;
font-weight:400;
line-height:1;
margin-top:3px;
}

.payment-summary-card{
background:#090909;
color:#fff;
padding:15px 18px 16px;
}

.payment-plan-line{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.payment-plan-copy span{
display:block;
font-size:6px;
font-weight:900;
letter-spacing:1.7px;
color:var(--gold-light);
margin-bottom:4px;
}

.payment-plan-copy strong{
display:block;
font-family:var(--serif);
font-size:19px;
font-weight:400;
}

.payment-plan-price{
font-family:var(--serif);
font-size:28px;
white-space:nowrap;
}

.payment-due{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-top:12px;
padding-top:11px;
border-top:1px solid #333;
font-size:10px;
}

.payment-due span{
color:#bbb;
}

.payment-due strong{
font-size:14px;
}

.payment-renewal{
font-size:8px;
line-height:1.45;
color:#aaa;
margin-top:6px;
}

/* PAYMENT TWO ROWS */

.payment-choice-wrap{
padding:18px 16px 24px;
background:#f7f7f5;
}

.payment-loading{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
min-height:180px;
text-align:center;
}

.payment-loading.hidden{
display:none;
}

.payment-loader{
width:35px;
height:35px;
border:3px solid #ddd;
border-top-color:#111;
border-radius:50%;
animation:spin .8s linear infinite;
margin-bottom:12px;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.embedded-payment-content{
display:none;
}

.embedded-payment-content.ready{
display:block;
}

.payment-choice{
border:2px solid #111;
background:#fff;
overflow:hidden;
}

.payment-choice-header{
width:100%;
min-height:64px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:0 14px;
border:0;
background:#fff;
color:#111;
}

.payment-choice-label{
font-size:10px;
font-weight:900;
letter-spacing:1.2px;
white-space:nowrap;
}

.payment-choice-brands{
display:flex;
align-items:center;
justify-content:flex-end;
gap:9px;
flex:1;
font-size:12px;
font-weight:800;
white-space:nowrap;
}

/* FIRST PAYMENT ROW — VISUALLY STRONGER */

#walletChoice .payment-choice-header{
min-height:72px;
padding:0 15px 0 17px;
}

#walletChoice .payment-choice-label{
font-size:12px;
font-weight:900;
letter-spacing:1.35px;
}

#walletChoice .payment-choice-brands{
gap:12px;
font-size:14px;
font-weight:900;
}

#walletChoice .brand-paypal{
font-size:15px;
}

.brand-paypal{
font-style:italic;
color:#0a6db7;
font-weight:900;
}

.brand-mastercard{
position:relative;
display:inline-flex;
width:30px;
height:17px;
margin-right:2px;
}

.brand-mastercard:before,
.brand-mastercard:after{
content:"";
position:absolute;
top:1px;
width:16px;
height:16px;
border-radius:50%;
}

.brand-mastercard:before{
left:0;
background:#e51b24;
}

.brand-mastercard:after{
right:0;
background:#f3a11a;
opacity:.9;
}

.payment-choice-arrow{
font-size:21px;
line-height:1;
width:20px;
transition:.2s;
}

.payment-choice.open .payment-choice-arrow{
transform:rotate(180deg);
}

.payment-choice-body{
display:none;
border-top:1px solid #ddd8d0;
padding:14px;
}

.payment-choice.open .payment-choice-body{
display:block;
}

.payment-divider{
display:flex;
align-items:center;
gap:12px;
margin:15px 0;
font-family:var(--serif);
font-size:14px;
color:#777;
}

.payment-divider:before,
.payment-divider:after{
content:"";
height:1px;
background:#c8c8c2;
flex:1;
}

.renewal-box{
background:#f8edc7;
border:1px solid #d8c46a;
padding:13px;
margin-bottom:14px;
}

.renewal-box strong{
display:block;
font-family:var(--serif);

/* CAROUSEL */

const track=$("carouselTrack");

const cards=[
...document.querySelectorAll(".club-card")
];

const dots=[
...document.querySelectorAll(".carousel-dot")
];

function setActiveSlide(index){

if(index<0){
index=cards.length-1;
}

if(index>=cards.length){
index=0;
}

activeSlide=index;

cards.forEach((card,i)=>{
card.classList.toggle(
"active",
i===index
);
});

dots.forEach((dot,i)=>{
dot.classList.toggle(
"active",
i===index
);
});
}

function centerCard(index){

if(index<0){
index=cards.length-1;
}

if(index>=cards.length){
index=0;
}

const card=cards[index];

track.scrollTo({
left:
card.offsetLeft-
track.clientWidth/2+
card.clientWidth/2,
behavior:"smooth"
});

setActiveSlide(index);
}

function detectCenteredCard(){

if(!cards.length){
return;
}

const viewportCenter=
track.scrollLeft+
track.clientWidth/2;

let nearestIndex=0;
let nearestDistance=Infinity;

cards.forEach((card,index)=>{

const cardCenter=
card.offsetLeft+
card.offsetWidth/2;

const distance=
Math.abs(
cardCenter-
viewportCenter
);

if(distance<nearestDistance){

nearestDistance=distance;
nearestIndex=index;
}
});

setActiveSlide(
nearestIndex
);
}

let carouselFrame=null;

track.addEventListener(
"scroll",
()=>{

if(carouselFrame){
cancelAnimationFrame(
carouselFrame
);
}

carouselFrame=
requestAnimationFrame(
detectCenteredCard
);
},
{
passive:true
}
);

track.addEventListener(
"touchend",
()=>{

setTimeout(
detectCenteredCard,
80
);
},
{
passive:true
}
);

track.addEventListener(
"pointerup",
()=>{

setTimeout(
detectCenteredCard,
80
);
}
);

$("carouselPrev").onclick=()=>{
centerCard(
activeSlide-1
);
};

$("carouselNext").onclick=()=>{
centerCard(
activeSlide+1
);
};

dots.forEach(dot=>{

dot.onclick=()=>{

centerCard(
Number(
dot.dataset.dot
)
);
};
});

function destroyPayment(){

}

}catch(error){}

expressElement.destroy();
}

}catch(error){}

stripe=null;
elements=null;

$("expressCheckoutElement").innerHTML="";

function stripeLocale(){

"en",
"fr",
"de",
"es",
"it",
"pt",
"nl",
"pl",
"cs",
"sv",
"da",
"no",
"fi",
"tr",
"ru"
];

currentLanguage
)
?currentLanguage
:"auto";
}

async function preparePayment(){

destroyPayment();

updatePlanSummary();

const member=
JSON.parse(
localStorage.getItem(
"petsDogueClubQuestionnaire"
)||"{}"
);

try{

const response=
await fetch(
"/api/create-club-payment",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
plan:
selectedPlan,

language:
currentLanguage,

firstName:
member.firstName||"",

email:
member.email||"",

country:
member.country||"",

petName:
member.petName||"",

petType:
member.petType||"",

breed:
member.breed||"",

breedId:
member.breedId||""
})
}
);

const result=
await response.json();

if(!response.ok){

throw new Error(
result.error||
t().pay.generic
);
}

paymentContext=
result;

stripe=
Stripe(
result.publishableKey
);

elements=
stripe.elements({
clientSecret:
result.clientSecret,

appearance:
stripeAppearance(),

locale:
stripeLocale()
});

paymentElement=
elements.create(
"payment",
{
layout:{
type:"accordion",
defaultCollapsed:false,
radios:true
}
}
);

paymentElement.mount(
"#paymentElement"
);

try{

expressElement=
elements.create(
"expressCheckout",
{
buttonHeight:56
}
);

expressElement.on(
"ready",
event=>{

const methods=
event.availablePaymentMethods||
{};

const available=
Object
.values(methods)
.some(Boolean);

$("walletFallback")
.style.display=
available
?"none"
:"block";
}
);

expressElement.on(
"confirm",
async()=>{

if(
!$("walletConsent").checked
){

showPaymentError(
t().pay.agree
);

return;
}

await confirmPayment();
}
);

expressElement.mount(
"#expressCheckoutElement"
);

}catch(error){

$("walletFallback")
.style.display=
"block";
}

$("paymentLoading")
.classList.add(
"hidden"
);

$("embeddedPaymentContent")
.classList.add(
"ready"
);

$("paymentSubmit").disabled=
!$("cardConsent").checked;

}catch(error){

$("paymentLoading")
.classList.add(
"hidden"
);

$("embeddedPaymentContent")
.classList.add(
"ready"
);

showPaymentError(
error.message
);
}
}

$("paymentSubmit").onclick=
async()=>{

if(
!$("cardConsent").checked
){

showPaymentError(
t().pay.agree
);

return;
}

await confirmPayment();
};

async function confirmPayment(){

if(
paymentBusy||
!stripe||
!elements||
!paymentContext
){
return;
}

paymentBusy=true;

$("paymentSubmit").disabled=true;

txt(
"paymentSubmit",
t().pay.processing
);

$("paymentError")
.classList.remove("show");

try{

const submitted=
await elements.submit();

if(submitted.error){

throw new Error(
submitted.error.message
);
}

const returnUrl=
`${window.location.origin}${window.location.pathname}?club_return=1&plan=${encodeURIComponent(selectedPlan)}`;

sessionStorage.setItem(
"petsDogueEmbeddedPayment",
JSON.stringify({
plan:
selectedPlan,

flow:
paymentContext.flow,

clientSecret:
paymentContext.clientSecret,

publishableKey:
paymentContext.publishableKey,

subscriptionId:
paymentContext.subscriptionId||
""
})
);

if(
paymentContext.flow===
"setup"
){

const result=
await stripe.confirmSetup({
elements,

clientSecret:
paymentContext.clientSecret,

redirect:
"if_required",

confirmParams:{
return_url:
returnUrl
}
});

if(result.error){

throw new Error(
result.error.message
);
}

if(
result.setupIntent&&
result.setupIntent.status===
"succeeded"
){

await completeFreeTrial(
result.setupIntent.id
);

return;
}
}

const result=
await stripe.confirmPayment({
elements,

clientSecret:
paymentContext.clientSecret,

redirect:
"if_required",

confirmParams:{
return_url:
returnUrl
}
});

if(result.error){

throw new Error(
result.error.message
);
}

if(
result.paymentIntent&&
[
"succeeded",
"processing"
].includes(
result.paymentIntent.status
)
){

completePaidMembership(
result.paymentIntent
);

return;
}

throw new Error(
t().pay.generic
);

}catch(error){

paymentBusy=false;

$("paymentSubmit").disabled=
!$("cardConsent").checked;

updatePlanSummary();

showPaymentError(
error.message
);
}
}

async function completeFreeTrial(
setupIntentId
){

showStep(
"verifyStep"
);

try{

const response=
await fetch(
"/api/complete-club-trial",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
setupIntentId
})
}
);

const result=
await response.json();

if(
!response.ok||
!result.membership
){

throw new Error(
result.error||
t().pay.generic
);
}

saveMembership(
result.membership
);

}catch(error){

txt(
"failureText",
error.message
);

showStep(
"failureStep"
);
}
}

function completePaidMembership(
paymentIntent
){

showStep(
"verifyStep"
);

const member=
JSON.parse(
localStorage.getItem(
"petsDogueClubQuestionnaire"
)||"{}"
);

const start=
new Date();

const end=
new Date(start);

if(
selectedPlan===
"annual"
){

end.setFullYear(
end.getFullYear()+1
);

}else{

end.setMonth(
end.getMonth()+1
);
}

saveMembership({
active:true,

plan:
selectedPlan,

email:
member.email||"",

dates:{
startedAt:
start.toISOString(),

validUntil:
end.toISOString(),

nextPayment:
end.toISOString()
},

stripe:{
paymentIntentId:
paymentIntent.id,

subscriptionId:
paymentContext.subscriptionId||
null,

customerId:
paymentContext.customerId||
null
}
});
}

function formatDate(value){

if(!value){
return "—";
}

return new Date(value)
.toLocaleDateString(
undefined,
{
day:"numeric",
month:"long",
year:"numeric"
}
);
}

function saveMembership(
membership
){

localStorage.setItem(
"petsDogueMembership",
JSON.stringify(
membership
)
);

const oldPlan=
selectedPlan;

if(
membership.plan&&
[
"free",
"monthly",
"annual"
].includes(
membership.plan
)
){

selectedPlan=
membership.plan;
}

const p=
planData();

txt(
"membershipCardPlan",
p.name
);

txt(
"membershipPaid",
selectedPlan==="free"
?"£0"
:selectedPlan==="monthly"
?"£1"
:"£10"
);

txt(
"membershipStart",
formatDate(
membership.dates&&
membership.dates.startedAt
)
);

txt(
"membershipUntil",
formatDate(
membership.dates&&
membership.dates.validUntil
)
);

txt(
"membershipNext",
formatDate(
membership.dates&&
membership.dates.nextPayment
)
);

txt(
"membershipEmail",
membership.email||
"—"
);

showStep(
"successStep"
);

selectedPlan=
oldPlan;
}

/* RETURN AFTER REDIRECT METHOD */

async function processReturn(){

const params=
new URLSearchParams(
window.location.search
);

if(
params.get("club_return")!=="1"
){
return;
}

const saved=
JSON.parse(
sessionStorage.getItem(
"petsDogueEmbeddedPayment"
)||"{}"
);

if(
!saved.publishableKey
){
return;
}

selectedPlan=
[
"free",
"monthly",
"annual"
].includes(
params.get("plan")
)
?params.get("plan")
:(saved.plan||"free");

$("membershipOverlay")
.classList.add("open");

document.body
.classList.add("locked");

showStep(
"verifyStep"
);

try{

const returnStripe=
Stripe(
saved.publishableKey
);

if(
saved.flow===
"setup"
){

const secret=
params.get(
"setup_intent_client_secret"
)||
saved.clientSecret;

const result=
await returnStripe
.retrieveSetupIntent(
secret
);

if(
!result.setupIntent||
result.setupIntent.status!==
"succeeded"
){

throw new Error(
result.error
?result.error.message
:t().pay.generic
);
}

await completeFreeTrial(
result.setupIntent.id
);

}else{

const secret=
params.get(
"payment_intent_client_secret"
)||
saved.clientSecret;

const result=
await returnStripe
.retrievePaymentIntent(
secret
);

if(
!result.paymentIntent||
![
"succeeded",
"processing"
].includes(
result.paymentIntent.status
)
){

throw new Error(
result.error
?result.error.message
:t().pay.generic
);
}

paymentContext={
subscriptionId:
saved.subscriptionId||
""
};

completePaidMembership(
result.paymentIntent
);
}

sessionStorage.removeItem(
"petsDogueEmbeddedPayment"
);

history.replaceState(
{},
document.title,
window.location.pathname
);

}catch(error){

txt(
"failureText",
error.message
);

showStep(
"failureStep"
);
}
}

$("failureRetry").onclick=
async()=>{

showStep(
"checkoutStep"
);

await preparePayment();
};

/* LANGUAGE */

$("languageSelect").onchange=
function(){

renderLanguage(
this.value
);

if(
window.PDI18N&&
typeof PDI18N.setLanguage===
"function"
){

PDI18N.setLanguage(
this.value
);
}
};

let initialLanguage=
localStorage.getItem(
LANGUAGE_KEY
)||
"en";

if(
!LANGS.includes(
initialLanguage
)
){
initialLanguage="en";
}

renderLanguage(
initialLanguage
);

const savedForm=
JSON.parse(
localStorage.getItem(
"petsDogueClubQuestionnaire"
)||"{}"
);

if(savedForm.firstName){
$("firstName").value=
savedForm.firstName;
}

if(savedForm.email){
$("memberEmail").value=
savedForm.email;
}

if(savedForm.country){
$("memberCountry").value=
savedForm.country;
}

if(savedForm.petName){
$("petName").value=
savedForm.petName;
}

if(savedForm.petType){
$("petType").value=
savedForm.petType;
}

if(savedForm.breed){
$("petBreed").value=
savedForm.breed;
}

requestAnimationFrame(
()=>{

centerCard(0);

setTimeout(
detectCenteredCard,
120
);
}
);

processReturn();

</script>
