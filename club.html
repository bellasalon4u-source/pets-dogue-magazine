<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Join PETS & DOGUE Club.">
<title>PETS & DOGUE Club</title>

<style>
:root{
--black:#070707;
--cream:#f5f0e6;
--white:#fff;
--gold:#bd8b29;
--gold-light:#efd47a;
--green:#58e814;
--green-dark:#176b3b;
--grey:#6d6861;
--line:#cbc4b8;
--red:#c52a2a;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.locked{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
width:100%;
}

.site-header{
background:var(--black);
color:#fff;
}

.header-main{
height:106px;
display:grid;
grid-template-columns:48px 1fr 48px;
align-items:center;
padding:0 16px;
border-bottom:1px solid #292929;
}

.menu-button,
.profile-button{
width:46px;
height:46px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.menu-button{
flex-direction:column;
gap:6px;
}

.menu-button span{
width:31px;
height:2px;
background:#fff;
border-radius:30px;
}

.brand{
justify-self:center;
text-align:center;
line-height:.86;
}

.brand-small{
font-family:var(--serif);
font-size:10px;
letter-spacing:2.7px;
color:var(--gold);
margin-bottom:5px;
}

.brand-big{
font-family:var(--serif);
font-size:41px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.profile-icon{
position:relative;
width:29px;
height:29px;
}

.profile-icon:before{
content:"";
position:absolute;
left:8px;
top:1px;
width:10px;
height:10px;
border:2px solid #fff;
border-radius:50%;
}

.profile-icon:after{
content:"";
position:absolute;
left:2px;
bottom:1px;
width:23px;
height:12px;
border:2px solid #fff;
border-bottom:0;
border-radius:16px 16px 0 0;
}

.category-nav{
height:56px;
display:flex;
align-items:center;
gap:28px;
padding:0 18px;
overflow-x:auto;
scrollbar-width:none;
border-bottom:1px solid #292929;
font-size:10px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.category-nav::-webkit-scrollbar{
display:none;
}

.category-nav a{
white-space:nowrap;
}

.menu-overlay{
position:fixed;
inset:0;
z-index:8000;
background:rgba(0,0,0,.68);
opacity:0;
visibility:hidden;
transition:.2s;
}

.menu-overlay.show{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
top:0;
bottom:0;
left:0;
z-index:8100;
width:min(355px,88vw);
background:#090909;
color:#fff;
overflow-y:auto;
transform:translateX(-102%);
transition:.24s ease;
}

.side-menu.open{
transform:translateX(0);
}

.menu-head{
height:82px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 19px;
border-bottom:1px solid #292929;
}

.menu-head strong{
font-family:var(--serif);
font-size:20px;
font-weight:400;
color:var(--gold-light);
}

.close-menu{
width:37px;
height:37px;
border-radius:50%;
border:1px solid #555;
background:transparent;
color:#fff;
font-size:21px;
}

.menu-account{
padding:15px;
border-bottom:1px solid #292929;
}

.menu-profile{
display:flex;
align-items:center;
gap:11px;
padding:12px;
background:#151515;
}

.menu-profile-circle{
width:37px;
height:37px;
border:1px solid #777;
border-radius:50%;
position:relative;
}

.menu-profile-circle:before{
content:"";
position:absolute;
width:9px;
height:9px;
border:1.5px solid #fff;
border-radius:50%;
top:6px;
left:12px;
}

.menu-profile-circle:after{
content:"";
position:absolute;
width:19px;
height:10px;
border:1.5px solid #fff;
border-bottom:0;
border-radius:15px 15px 0 0;
left:7px;
bottom:5px;
}

.menu-profile strong{
display:block;
font-size:11px;
}

.menu-profile span{
display:block;
font-size:8px;
color:#aaa;
margin-top:3px;
}

.menu-list{
padding:8px 16px 21px;
}

.menu-list a{
min-height:44px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #252525;
font-size:11px;
font-weight:700;
}

.menu-list a:after{
content:"›";
font-family:var(--serif);
font-size:19px;
color:#777;
}

.menu-club{
color:var(--gold-light);
}

.language-area{
padding:17px 16px 24px;
border-top:1px solid #292929;
}

.language-area label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:1.8px;
color:#999;
margin-bottom:7px;
}

.language-area select{
width:100%;
height:42px;
padding:0 10px;
border:1px solid #444;
background:#111;
color:#fff;
}

.club-intro{
max-width:720px;
margin:auto;
padding:24px 20px 10px;
text-align:center;
}

.kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.8px;
color:var(--gold);
text-transform:uppercase;
}

.club-intro h1{
font-family:var(--serif);
font-size:37px;
font-weight:400;
line-height:1.02;
margin-top:7px;
}

.club-intro p{
max-width:570px;
margin:8px auto 0;
font-family:var(--serif);
font-size:14px;
line-height:1.38;
color:#655f58;
}

.benefits{
padding:14px 0 24px;
overflow:hidden;
}

.section-heading{
text-align:center;
padding:0 18px 9px;
}

.section-heading h2{
font-family:var(--serif);
font-size:38px;
font-weight:400;
line-height:1;
margin-top:6px;
}

.carousel-track{
display:flex;
align-items:center;
gap:12px;
overflow-x:auto;
scroll-snap-type:x mandatory;
scrollbar-width:none;
padding:8px 16vw 12px;
overscroll-behavior-x:contain;
-webkit-overflow-scrolling:touch;
}

.carousel-track::-webkit-scrollbar{
display:none;
}

.club-card{
position:relative;
flex:0 0 68vw;
height:78vw;
max-width:470px;
max-height:540px;
overflow:hidden;
scroll-snap-align:center;
background:#111;
opacity:.46;
transform:scale(.90);
transition:transform .24s ease,opacity .24s ease,box-shadow .24s ease;
}

.club-card.active{
opacity:1;
transform:scale(1);
z-index:3;
box-shadow:0 18px 44px rgba(0,0,0,.19);
}

.club-card img{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
}

.club-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.89) 0%,rgba(0,0,0,.38) 38%,rgba(0,0,0,.05) 68%,rgba(0,0,0,.01) 100%);
pointer-events:none;
}

.magazine-card:after{
background:linear-gradient(to top,rgba(0,0,0,.68) 0%,rgba(0,0,0,.18) 40%,rgba(0,0,0,0) 68%);
}

.card-content{
position:absolute;
z-index:4;
left:0;
right:0;
bottom:0;
padding:17px;
color:#fff;
}

.card-number{
font-size:7px;
font-weight:900;
letter-spacing:2px;
color:var(--gold-light);
margin-bottom:5px;
text-transform:uppercase;
}

.card-content h3{
font-family:var(--serif);
font-size:27px;
font-weight:400;
line-height:1.02;
text-shadow:0 2px 10px rgba(0,0,0,.35);
}

.card-content p{
font-size:11px;
line-height:1.4;
margin-top:6px;
color:#f2f2f2;
text-shadow:0 1px 8px rgba(0,0,0,.45);
}

.carousel-controls{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-top:3px;
}

.carousel-arrow{
width:38px;
height:38px;
border:1px solid #111;
border-radius:50%;
background:transparent;
font-size:17px;
}

.carousel-dots{
display:flex;
align-items:center;
gap:6px;
}

.carousel-dot{
width:6px;
height:6px;
border:0;
border-radius:50%;
background:#aaa49b;
padding:0;
}

.carousel-dot.active{
width:19px;
border-radius:99px;
background:#111;
}

.plans-section{
background:#fff;
border-top:1px solid var(--line);
padding:30px 14px 36px;
}

.plans-inner{
max-width:900px;
margin:auto;
}

.plans-heading{
text-align:center;
margin-bottom:16px;
}

.plans-heading h2{
font-family:var(--serif);
font-size:36px;
font-weight:400;
line-height:1;
margin-top:6px;
}

.plans-heading p{
font-family:var(--serif);
font-size:13px;
color:#6b655e;
margin-top:7px;
}

.plans-grid{
display:grid;
gap:7px;
}

.plan-card{
width:100%;
min-height:104px;
padding:12px 15px;
border:1.5px solid #bbb4a8;
background:#faf8f3;
color:#111;
display:grid;
grid-template-columns:1fr auto;
grid-template-rows:auto auto auto;
column-gap:12px;
text-align:left;
transition:transform .12s ease;
}

.plan-card.free{
background:#f3f7ef;
border-color:#a8b89e;
}

.plan-card.annual{
background:#090909;
border-color:#090909;
color:#fff;
}

.plan-card:active{
transform:scale(.987);
}

.plan-top{
grid-column:1/3;
min-height:17px;
}

.plan-badge{
display:inline-block;
padding:4px 7px;
border-radius:99px;
font-size:7px;
font-weight:900;
letter-spacing:1.3px;
}

.plan-badge.free{
background:var(--green-dark);
color:#fff;
}

.plan-badge.best{
background:var(--gold-light);
color:#111;
}

.plan-price{
grid-row:2/4;
align-self:center;
font-family:var(--serif);
font-size:36px;
line-height:1;
}

.plan-period{
align-self:end;
text-align:right;
font-family:var(--serif);
font-size:16px;
}

.plan-note{
text-align:right;
font-size:9px;
color:#777;
}

.plan-card.annual .plan-note{
color:#bbb;
}

.plan-action{
grid-column:1/3;
padding-top:6px;
font-size:7px;
font-weight:900;
letter-spacing:1.3px;
}

.plans-smallprint{
max-width:670px;
margin:12px auto 0;
font-size:8px;
line-height:1.45;
color:#79736b;
text-align:center;
}

.club-footer{
background:#070707;
color:#fff;
text-align:center;
padding:18px 16px;
}

.club-footer strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.club-footer span{
display:block;
margin-top:4px;
font-size:7px;
letter-spacing:1.1px;
color:#888;
}

.membership-overlay{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.76);
backdrop-filter:blur(5px);
}

.membership-overlay.open{
display:flex;
}

.membership-shell{
position:relative;
width:100%;
max-width:650px;
max-height:96vh;
overflow-y:auto;
background:#fff;
border-radius:17px 17px 0 0;
}

.membership-close{
position:absolute;
right:11px;
top:11px;
z-index:10;
width:36px;
height:36px;
border:1px solid #bbb;
border-radius:50%;
background:#fff;
font-size:20px;
}

.membership-step{
display:none;
}

.membership-step.active{
display:block;
}

.step-head{
padding:24px 19px 16px;
background:var(--cream);
border-bottom:1px solid #ddd5c8;
}

.step-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.2px;
color:var(--gold);
}

.step-head h2,
.success-wrap h2,
.terms-modal h2{
font-family:var(--serif);
font-size:28px;
font-weight:400;
line-height:1.04;
margin-top:6px;
padding-right:38px;
}

.step-head p{
font-size:11px;
line-height:1.4;
color:#6b655e;
margin-top:7px;
}

.progress{
display:flex;
align-items:center;
max-width:190px;
margin-top:12px;
}

.progress-item{
width:25px;
height:25px;
border:1px solid #aaa;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:900;
background:#fff;
color:#777;
}

.progress-item.active{
background:#111;
border-color:#111;
color:#fff;
}

.progress-item.complete{
background:var(--green-dark);
border-color:var(--green-dark);
color:#fff;
}

.progress-line{
height:1px;
background:#c9c1b5;
flex:1;
}

.progress-line.complete{
background:var(--green-dark);
}

.plan-summary{
display:flex;
align-items:center;
justify-content:space-between;
gap:14px;
padding:13px 19px;
background:#0b0b0b;
color:#fff;
}

.summary-label{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.6px;
color:var(--gold-light);
margin-bottom:3px;
}

.plan-summary strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
}

.summary-price{
font-family:var(--serif);
font-size:20px;
white-space:nowrap;
}

.payment-description{
font-size:8px;
color:#bbb;
margin-top:3px;
}

.membership-form,
.payment-form{
padding:18px 19px 23px;
}

.field{
margin-bottom:12px;
}

.field label{
display:flex;
align-items:center;
gap:5px;
margin-bottom:5px;
font-size:9px;
font-weight:800;
}

.required-star{
color:var(--red);
}

.optional-label{
font-size:6px;
font-weight:900;
letter-spacing:1px;
color:#969089;
margin-left:3px;
}

.field input,
.field select{
width:100%;
height:41px;
padding:0 11px;
border:1px solid #bdb6ab;
background:#fff;
color:#111;
outline:none;
border-radius:0;
}

.field.error input,
.field.error select{
border:2px solid var(--red);
background:#fff8f8;
}

.field-error{
display:none;
margin-top:4px;
font-size:8px;
font-weight:700;
color:var(--red);
}

.field.error .field-error{
display:block;
}

.pet-title{
font-family:var(--serif);
font-size:20px;
font-weight:400;
margin:4px 0;
}

.pet-note{
font-size:9px;
line-height:1.4;
color:#777168;
margin-bottom:12px;
}

.breed-combobox{
position:relative;
}

.breed-input-wrap{
position:relative;
}

.breed-input-wrap input{
padding-right:40px;
}

.breed-toggle{
position:absolute;
right:0;
top:0;
width:41px;
height:41px;
border:0;
background:transparent;
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
color:#444;
}

.breed-results{
position:absolute;
left:0;
right:0;
top:45px;
z-index:30;
display:none;
max-height:240px;
overflow-y:auto;
background:#fff;
border:1px solid #aaa39a;
box-shadow:0 10px 28px rgba(0,0,0,.17);
}

.breed-results.open{
display:block;
}

.breed-option{
width:100%;
border:0;
border-bottom:1px solid #ece8e1;
background:#fff;
padding:10px 12px;
text-align:left;
display:block;
}

.breed-option:last-child{
border-bottom:0;
}

.breed-option:active,
.breed-option.active{
background:#f3eee4;
}

.breed-option-name{
display:block;
font-size:10px;
font-weight:800;
color:#111;
}

.breed-option-secondary{
display:block;
font-size:8px;
color:#888178;
margin-top:2px;
}

.breed-empty{
padding:12px;
font-size:9px;
color:#777;
}

.breed-disabled{
background:#f3f1ed !important;
color:#aaa !important;
cursor:not-allowed;
}

.required-note{
font-size:8px;
color:#777;
margin:2px 0 12px;
}

.required-note span{
color:var(--red);
}

.primary-button{
width:100%;
height:47px;
border:0;
background:#090909;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
}

.secondary-button{
width:100%;
height:40px;
margin-top:7px;
border:1px solid #111;
background:#fff;
color:#111;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
}

.card-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.terms-check{
display:flex;
align-items:flex-start;
gap:7px;
font-size:9px;
line-height:1.35;
margin-top:2px;
}

.terms-check input{
width:15px;
height:15px;
margin-top:1px;
accent-color:#111;
}

.inline-link{
border:0;
background:transparent;
padding:0;
font-weight:900;
text-decoration:underline;
}

.terms-error{
display:none;
margin-top:5px;
font-size:8px;
font-weight:700;
color:var(--red);
}

.terms-error.show{
display:block;
}

.prototype-note{
font-size:8px;
line-height:1.4;
color:#777;
text-align:center;
margin-top:8px;
}

.success-wrap{
padding:33px 19px 24px;
text-align:center;
}

.success-mark{
width:56px;
height:56px;
border-radius:50%;
background:var(--green);
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 15px;
font-size:26px;
font-weight:900;
}

.success-intro{
font-size:11px;
color:#69645d;
margin-top:7px;
}

.receipt{
margin:19px 0 16px;
border-top:1px solid #d8d1c6;
}

.receipt-row{
display:flex;
justify-content:space-between;
gap:15px;
padding:9px 0;
border-bottom:1px solid #d8d1c6;
font-size:9px;
text-align:left;
}

.receipt-row span{
color:#777168;
}

.receipt-row strong{
text-align:right;
}

.action-button{
width:100%;
min-height:44px;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
}

.action-button.black{
border:0;
background:#111;
color:#fff;
}

.action-button.white{
border:1px solid #111;
background:#fff;
margin-top:6px;
}

.action-button.gold{
background:var(--gold-light);
margin-top:6px;
}

.receipt-status{
min-height:13px;
margin-top:8px;
font-size:8px;
font-weight:700;
color:var(--green-dark);
}

.terms-overlay{
position:fixed;
inset:0;
z-index:10000;
display:none;
align-items:center;
justify-content:center;
padding:14px;
background:rgba(0,0,0,.82);
}

.terms-overlay.open{
display:flex;
}

.terms-modal{
position:relative;
width:min(580px,100%);
max-height:90vh;
overflow-y:auto;
padding:27px 19px 21px;
background:#fff;
border-radius:13px;
}

.terms-close{
position:absolute;
right:11px;
top:11px;
width:35px;
height:35px;
border:1px solid #bbb;
border-radius:50%;
background:#fff;
font-size:19px;
}

.terms-copy{
margin:17px 0 19px;
font-size:10px;
line-height:1.55;
color:#5d5852;
}

.terms-copy p+p{
margin-top:9px;
}

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .side-menu{
left:auto;
right:0;
transform:translateX(102%);
}

html[dir="rtl"] .side-menu.open{
transform:translateX(0);
}

html[dir="rtl"] .membership-close,
html[dir="rtl"] .terms-close{
right:auto;
left:11px;
}

html[dir="rtl"] .optional-label{
margin-left:0;
margin-right:3px;
}

html[dir="rtl"] .breed-toggle{
right:auto;
left:0;
}

html[dir="rtl"] .breed-input-wrap input{
padding-right:11px;
padding-left:40px;
}

html[dir="rtl"] .breed-option{
text-align:right;
}

const sideMenu=document.getElementById("sideMenu");

function openMenu(){
sideMenu.classList.add("open");
menuOverlay.classList.add("show");
document.body.classList.add("locked");
}

function closeMenu(){
sideMenu.classList.remove("open");
menuOverlay.classList.remove("show");

if(!document.getElementById("membershipOverlay").classList.contains("open")){
document.body.classList.remove("locked");
}
}

document.getElementById("menuOpen").addEventListener("click",openMenu);
document.getElementById("menuClose").addEventListener("click",closeMenu);
menuOverlay.addEventListener("click",closeMenu);

const track=document.getElementById("carouselTrack");
const cards=[...document.querySelectorAll(".club-card")];
const dots=[...document.querySelectorAll(".carousel-dot")];

function updateCarousel(index){

activeSlide=index;

cards.forEach((card,i)=>{
card.classList.toggle("active",i===index);
});

dots.forEach((dot,i)=>{
dot.classList.toggle("active",i===index);
});

}

function centerCard(index,behavior="smooth"){

if(index<0){
index=cards.length-1;
}

if(index>=cards.length){
index=0;
}

const card=cards[index];

const target=
card.offsetLeft-
(track.clientWidth/2)+
(card.clientWidth/2);

track.scrollTo({
left:target,
behavior
});

updateCarousel(index);

}

document.getElementById("carouselPrev").addEventListener("click",()=>{
centerCard(activeSlide-1);
});

document.getElementById("carouselNext").addEventListener("click",()=>{
centerCard(activeSlide+1);
});

dots.forEach(dot=>{
dot.addEventListener("click",()=>{
centerCard(Number(dot.dataset.dot));
});
});

let scrollTimer=null;

track.addEventListener("scroll",()=>{

clearTimeout(scrollTimer);

scrollTimer=setTimeout(()=>{

const viewportCenter=
track.scrollLeft+
track.clientWidth/2;

let nearest=0;
let nearestDistance=Infinity;

cards.forEach((card,index)=>{

const cardCenter=
card.offsetLeft+
card.clientWidth/2;

const distance=
Math.abs(cardCenter-viewportCenter);

if(distance<nearestDistance){
nearestDistance=distance;
nearest=index;
}

});

updateCarousel(nearest);

},90);

});

const petType=document.getElementById("petType");
const petBreed=document.getElementById("petBreed");
const petBreedId=document.getElementById("petBreedId");
const breedResults=document.getElementById("breedResults");
const breedToggle=document.getElementById("breedToggle");

function hasPetData(){

return Boolean(
window.PETSDOGUE_PET_DATA &&
typeof window.PETSDOGUE_PET_DATA.search==="function"
);

}

function getBreedType(){

const type=petType.value;

if(["dog","cat","bird","horse","small"].includes(type)){
return type;
}

return "";

}

function getBreedDisplayLanguage(){

if(["ru","uk"].includes(currentLanguage)){
return currentLanguage;
}

return "en";

}

function setBreedEnabled(){

const type=getBreedType();

if(!type){

petBreed.disabled=true;
petBreed.classList.add("breed-disabled");
petBreed.placeholder=getT().breedPlaceholder;
breedToggle.disabled=true;
breedToggle.style.opacity=".35";
closeBreedResults();
return;

}

petBreed.disabled=false;
petBreed.classList.remove("breed-disabled");
petBreed.placeholder=getT().breedSearch;
breedToggle.disabled=false;
breedToggle.style.opacity="1";

}

function getSecondaryBreedName(item){

const language=getBreedDisplayLanguage();

if(language==="en"){
return "";
}

if(!item || !item.name){
return "";
}

if(item.displayName===item.name){
return "";
}

return item.name;

}

function renderBreedResults(query=""){

const type=getBreedType();

if(!type || !hasPetData()){
closeBreedResults();
return;
}

currentBreedResults=
window.PETSDOGUE_PET_DATA.search(
type,
query,
{
language:getBreedDisplayLanguage(),
limit:60
}
);

breedResults.innerHTML="";
breedKeyboardIndex=-1;

if(!currentBreedResults.length){

const empty=document.createElement("div");
empty.className="breed-empty";
empty.textContent=getT().breedEmpty;
breedResults.appendChild(empty);
openBreedResults();
return;

}

currentBreedResults.forEach((item,index)=>{

const button=document.createElement("button");

button.type="button";
button.className="breed-option";
button.setAttribute("role","option");
button.dataset.index=String(index);
button.dataset.id=item.id;

const main=document.createElement("span");
main.className="breed-option-name";
main.textContent=item.displayName||item.name;

button.appendChild(main);

const secondaryName=getSecondaryBreedName(item);

if(secondaryName){

const secondary=document.createElement("span");
secondary.className="breed-option-secondary";
secondary.textContent=secondaryName;
button.appendChild(secondary);

}

button.addEventListener("mousedown",event=>{
event.preventDefault();
});

button.addEventListener("click",()=>{
chooseBreed(item);
});

breedResults.appendChild(button);

});

openBreedResults();

}

function openBreedResults(){

breedResults.classList.add("open");
petBreed.setAttribute("aria-expanded","true");

}

function closeBreedResults(){

breedResults.classList.remove("open");
petBreed.setAttribute("aria-expanded","false");
breedKeyboardIndex=-1;

}

function chooseBreed(item){

if(!item){
return;
}

selectedBreedId=item.id;
petBreedId.value=item.id;

petBreed.value=
window.PETSDOGUE_PET_DATA.getDisplayName(
item,
getBreedDisplayLanguage()
);

closeBreedResults();

}

function clearBreed(){

selectedBreedId="";
petBreedId.value="";
petBreed.value="";
closeBreedResults();

}

function refreshBreedLanguage(){

setBreedEnabled();

if(!selectedBreedId || !hasPetData()){
return;
}

const item=
window.PETSDOGUE_PET_DATA.findById(
selectedBreedId
);

if(item){

petBreed.value=
window.PETSDOGUE_PET_DATA.getDisplayName(
item,
getBreedDisplayLanguage()
);

}

}

function updateKeyboardOption(){

const options=[
...breedResults.querySelectorAll(".breed-option")
];

options.forEach((option,index)=>{
option.classList.toggle(
"active",
index===breedKeyboardIndex
);
});

if(
breedKeyboardIndex>=0 &&
options[breedKeyboardIndex]
){

options[breedKeyboardIndex].scrollIntoView({
block:"nearest"
});

}

}

petType.addEventListener("change",()=>{

const type=getBreedType();

if(
selectedBreedId &&
hasPetData() &&
!window.PETSDOGUE_PET_DATA.isCompatible(
type,
selectedBreedId
)
){
clearBreed();
}

if(!type){
clearBreed();
}

setBreedEnabled();

if(type){
renderBreedResults("");
}

});

petBreed.addEventListener("focus",()=>{

if(getBreedType()){
renderBreedResults(petBreed.value.trim());
}

});

petBreed.addEventListener("input",()=>{

selectedBreedId="";
petBreedId.value="";

if(getBreedType()){
renderBreedResults(petBreed.value.trim());
}

});

petBreed.addEventListener("keydown",event=>{

if(!breedResults.classList.contains("open")){
return;
}

const options=[
...breedResults.querySelectorAll(".breed-option")
];

if(event.key==="ArrowDown"){

event.preventDefault();

if(!options.length){
return;
}

breedKeyboardIndex=
Math.min(
breedKeyboardIndex+1,
options.length-1
);

updateKeyboardOption();

}

if(event.key==="ArrowUp"){

event.preventDefault();

if(!options.length){
return;
}

breedKeyboardIndex=
Math.max(
breedKeyboardIndex-1,
0
);

updateKeyboardOption();

}

if(event.key==="Enter"){

if(
breedKeyboardIndex>=0 &&
currentBreedResults[breedKeyboardIndex]
){

event.preventDefault();

chooseBreed(
currentBreedResults[breedKeyboardIndex]
);

}

}

if(event.key==="Escape"){
closeBreedResults();
}

});

breedToggle.addEventListener("click",()=>{

if(!getBreedType()){
return;
}

if(breedResults.classList.contains("open")){
closeBreedResults();
}else{
renderBreedResults("");
petBreed.focus();
}

});

document.addEventListener("click",event=>{

const combo=
document.getElementById("breedCombobox");

if(
combo &&
!combo.contains(event.target)
){
closeBreedResults();
}

});

function validEmail(value){
return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function markError(id,state){
document.getElementById(id).classList.toggle("error",state);
}

document.getElementById("questionForm").addEventListener("submit",event=>{

event.preventDefault();

const firstName=document.getElementById("firstName");
const email=document.getElementById("memberEmail");
const country=document.getElementById("memberCountry");

const checks=[
["firstNameBlock",firstName,!firstName.value.trim()],
["memberEmailBlock",email,!validEmail(email.value.trim())],
["countryBlock",country,!country.value]
];

checks.forEach(([block,input,invalid])=>{
markError(block,invalid);
});

const firstInvalid=checks.find(item=>item[2]);

if(firstInvalid){

firstInvalid[1]
.closest(".field")
.scrollIntoView({
behavior:"smooth",
block:"center"
});

setTimeout(()=>{
firstInvalid[1].focus();
},180);

return;

}

const data={
firstName:firstName.value.trim(),
email:email.value.trim(),
country:country.value,

petName:
document
.getElementById("petName")
.value
.trim(),

petType:
document
.getElementById("petType")
.value,

breed:
document
.getElementById("petBreed")
.value
.trim(),

breedId:
document
.getElementById("petBreedId")
.value,

birthday:
document
.getElementById("petBirthday")
.value,

social:
document
.getElementById("petSocial")
.value
.trim()
};

localStorage.setItem(
"petsDogueClubQuestionnaire",
JSON.stringify(data)
);

showStep("paymentStep");

});

document.getElementById("firstName").addEventListener("input",function(){
if(this.value.trim()){
markError("firstNameBlock",false);
}
});

document.getElementById("memberEmail").addEventListener("input",function(){
if(validEmail(this.value.trim())){
markError("memberEmailBlock",false);
}
});

document.getElementById("memberCountry").addEventListener("change",function(){
if(this.value){
markError("countryBlock",false);
}
});

document.getElementById("cardNumber").addEventListener("input",function(){

const digits=
this.value
.replace(/\D/g,"")
.slice(0,16);

this.value=
digits
.replace(/(.{4})/g,"$1 ")
.trim();

});

document.getElementById("cardExpiry").addEventListener("input",function(){

let digits=
this.value
.replace(/\D/g,"")
.slice(0,4);

if(digits.length>2){
digits=
digits.slice(0,2)+
"/"+
digits.slice(2);
}

this.value=digits;

});

document.getElementById("cardCvc").addEventListener("input",function(){

this.value=
this.value
.replace(/\D/g,"")
.slice(0,4);

});

function validExpiry(value){

if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(value)){
return false;
}

const [month,year]=
value
.split("/")
.map(Number);

const now=new Date();
const currentYear=now.getFullYear()%100;
const currentMonth=now.getMonth()+1;

if(year<currentYear){
return false;
}

if(
year===currentYear &&
month<currentMonth
){
return false;
}

return true;

}

document.getElementById("paymentForm").addEventListener("submit",event=>{

event.preventDefault();

const cardName=document.getElementById("cardName");
const cardNumber=document.getElementById("cardNumber");
const expiry=document.getElementById("cardExpiry");
const cvc=document.getElementById("cardCvc");
const terms=document.getElementById("termsAgree");

const cleanCard=
cardNumber.value
.replace(/\D/g,"");

const checks=[
["cardNameBlock",cardName,!cardName.value.trim()],
["cardNumberBlock",cardNumber,cleanCard.length!==16],
["expiryBlock",expiry,!validExpiry(expiry.value)],
["cvcBlock",cvc,cvc.value.length<3]
];

checks.forEach(([block,input,invalid])=>{
markError(block,invalid);
});

document
.getElementById("termsError")
.classList.toggle(
"show",
!terms.checked
);

const firstInvalid=
checks.find(item=>item[2]);

if(firstInvalid){

firstInvalid[1]
.closest(".field")
.scrollIntoView({
behavior:"smooth",
block:"center"
});

return;
}

if(!terms.checked){

terms.scrollIntoView({
behavior:"smooth",
block:"center"
});

return;
}

completeMembership();

});

document.getElementById("paymentBack").addEventListener("click",()=>{
showStep("questionStep");
});

function addMonths(date,months){

const result=new Date(date);
const day=result.getDate();

result.setDate(1);
result.setMonth(result.getMonth()+months);

const last=
new Date(
result.getFullYear(),
result.getMonth()+1,
0
).getDate();

result.setDate(
Math.min(
day,
last
)
);

return result;

}

function addYears(date,years){

const result=new Date(date);

result.setFullYear(
result.getFullYear()+years
);

return result;

}

function getMembershipDates(){

const start=new Date();

let next;

if(selectedPlan==="annual"){
next=addYears(start,1);
}else{
next=addMonths(start,1);
}

const end=new Date(next);
end.setDate(end.getDate()-1);

return{
start,
end,
next
};

}

function formatDate(date){

return new Intl.DateTimeFormat(
LOCALE[currentLanguage]||"en-GB",
{
day:"numeric",
month:"long",
year:"numeric"
}
).format(date);

}

function completeMembership(){

const t=getT();
const plan=t.plans[selectedPlan];
const dates=getMembershipDates();

const questionnaire=
JSON.parse(
localStorage.getItem(
"petsDogueClubQuestionnaire"
)||
"{}"
);

const membership={
plan:selectedPlan,
status:"active",
memberName:questionnaire.firstName||"",
email:questionnaire.email||"",
petName:questionnaire.petName||"",
petType:questionnaire.petType||"",
breed:questionnaire.breed||"",
breedId:questionnaire.breedId||"",
startedAt:dates.start.toISOString(),
validUntil:dates.end.toISOString(),
nextPayment:dates.next.toISOString()
};

localStorage.setItem(
"petsDogueMembership",
JSON.stringify(membership)
);

text("receiptPlan",plan[0]);
text("receiptPaid",plan[3]);
text("receiptStart",formatDate(dates.start));
text("receiptEnd",formatDate(dates.end));
text("receiptNext",formatDate(dates.next));

showStep("successStep");

}

:"en";

requestAnimationFrame(()=>{

requestAnimationFrame(()=>{
centerCard(0,"auto");

const accountEmail=
localStorage.getItem(
"petsDogueAccountEmail"
);

if(accountEmail){
document
.getElementById("memberEmail")
.value=
accountEmail;
}

setBreedEnabled();

const savedQuestionnaireRaw=

if(savedQuestionnaireRaw){

if(saved.breedId && hasPetData()){

saved.breedId
);

if(
item &&
window.PETSDOGUE_PET_DATA.isCompatible(
saved.petType,
saved.breedId
)
){

selectedBreedId=saved.breedId;
petBreedId.value=saved.breedId;

petBreed.value=
window.PETSDOGUE_PET_DATA.getDisplayName(
item,
getBreedDisplayLanguage()
);

}

}else if(saved.breed){

petBreed.value=saved.breed;

}

setBreedEnabled();

}catch(error){}

}
