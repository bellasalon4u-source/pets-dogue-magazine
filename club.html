<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Join PETS & DOGUE Club.">
<title>PETS & DOGUE Club</title>

<style>
:root{
--black:#070707;
--cream:#f5f0e6;
--white:#fff;
--gold:#bd8b29;
--gold-light:#efd47a;
--green:#58e814;
--green-dark:#176b3b;
--grey:#6d6861;
--line:#cbc4b8;
--red:#c52a2a;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:var(--sans);
background:var(--cream);
color:#111;
overflow-x:hidden;
}

body.locked{
overflow:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
width:100%;
}

/* =====================================================
   HEADER
===================================================== */

.site-header{
background:var(--black);
color:#fff;
}

.header-main{
height:106px;
display:grid;
grid-template-columns:48px 1fr 48px;
align-items:center;
padding:0 16px;
border-bottom:1px solid #292929;
}

.menu-button,
.profile-button{
width:46px;
height:46px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.menu-button{
flex-direction:column;
gap:6px;
}

.menu-button span{
width:31px;
height:2px;
background:#fff;
border-radius:30px;
}

.brand{
justify-self:center;
text-align:center;
line-height:.86;
}

.brand-small{
font-family:var(--serif);
font-size:10px;
letter-spacing:2.7px;
color:var(--gold);
margin-bottom:5px;
}

.brand-big{
font-family:var(--serif);
font-size:41px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.profile-icon{
position:relative;
width:29px;
height:29px;
}

.profile-icon:before{
content:"";
position:absolute;
left:8px;
top:1px;
width:10px;
height:10px;
border:2px solid #fff;
border-radius:50%;
}

.profile-icon:after{
content:"";
position:absolute;
left:2px;
bottom:1px;
width:23px;
height:12px;
border:2px solid #fff;
border-bottom:0;
border-radius:16px 16px 0 0;
}

.category-nav{
height:56px;
display:flex;
align-items:center;
gap:28px;
padding:0 18px;
overflow-x:auto;
scrollbar-width:none;
border-bottom:1px solid #292929;
font-size:10px;
font-weight:900;
letter-spacing:1.2px;
text-transform:uppercase;
}

.category-nav::-webkit-scrollbar{
display:none;
}

.category-nav a{
white-space:nowrap;
}

/* =====================================================
   SIDE MENU
===================================================== */

.menu-overlay{
position:fixed;
inset:0;
z-index:8000;
background:rgba(0,0,0,.68);
opacity:0;
visibility:hidden;
transition:.2s;
}

.menu-overlay.show{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
top:0;
bottom:0;
left:0;
z-index:8100;
width:min(355px,88vw);
background:#090909;
color:#fff;
overflow-y:auto;
transform:translateX(-102%);
transition:.24s ease;
}

.side-menu.open{
transform:translateX(0);
}

.menu-head{
height:82px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 19px;
border-bottom:1px solid #292929;
}

.menu-head strong{
font-family:var(--serif);
font-size:20px;
font-weight:400;
color:var(--gold-light);
}

.close-menu{
width:37px;
height:37px;
border-radius:50%;
border:1px solid #555;
background:transparent;
color:#fff;
font-size:21px;
}

.menu-account{
padding:15px;
border-bottom:1px solid #292929;
}

.menu-profile{
display:flex;
align-items:center;
gap:11px;
padding:12px;
background:#151515;
}

.menu-profile-circle{
width:37px;
height:37px;
border:1px solid #777;
border-radius:50%;
position:relative;
}

.menu-profile-circle:before{
content:"";
position:absolute;
width:9px;
height:9px;
border:1.5px solid #fff;
border-radius:50%;
top:6px;
left:12px;
}

.menu-profile-circle:after{
content:"";
position:absolute;
width:19px;
height:10px;
border:1.5px solid #fff;
border-bottom:0;
border-radius:15px 15px 0 0;
left:7px;
bottom:5px;
}

.menu-profile strong{
display:block;
font-size:11px;
}

.menu-profile span{
display:block;
font-size:8px;
color:#aaa;
margin-top:3px;
}

.menu-list{
padding:8px 16px 21px;
}

.menu-list a{
min-height:44px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #252525;
font-size:11px;
font-weight:700;
}

.menu-list a:after{
content:"›";
font-family:var(--serif);
font-size:19px;
color:#777;
}

.menu-club{
color:var(--gold-light);
}

.language-area{
padding:17px 16px 24px;
border-top:1px solid #292929;
}

.language-area label{
display:block;
font-size:8px;
font-weight:900;
letter-spacing:1.8px;
color:#999;
margin-bottom:7px;
}

.language-area select{
width:100%;
height:42px;
padding:0 10px;
border:1px solid #444;
background:#111;
color:#fff;
}

/* =====================================================
   CLUB INTRO
===================================================== */

.club-intro{
max-width:720px;
margin:auto;
padding:24px 20px 10px;
text-align:center;
}

.kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.8px;
color:var(--gold);
text-transform:uppercase;
}

.club-intro h1{
font-family:var(--serif);
font-size:37px;
font-weight:400;
line-height:1.02;
margin-top:7px;
}

.club-intro p{
max-width:570px;
margin:8px auto 0;
font-family:var(--serif);
font-size:14px;
line-height:1.38;
color:#655f58;
}

/* =====================================================
   BENEFITS
===================================================== */

.benefits{
padding:14px 0 24px;
overflow:hidden;
}

.section-heading{
text-align:center;
padding:0 18px 9px;
}

.section-heading h2{
font-family:var(--serif);
font-size:38px;
font-weight:400;
line-height:1;
margin-top:6px;
}

.carousel-track{
display:flex;
align-items:center;
gap:12px;
overflow-x:auto;
scroll-snap-type:x mandatory;
scrollbar-width:none;
padding:8px 16vw 12px;
overscroll-behavior-x:contain;
-webkit-overflow-scrolling:touch;
}

.carousel-track::-webkit-scrollbar{
display:none;
}

.club-card{
position:relative;
flex:0 0 68vw;
height:78vw;
max-width:470px;
max-height:540px;
overflow:hidden;
scroll-snap-align:center;
background:#111;
opacity:.46;
transform:scale(.90);
transition:
transform .24s ease,
opacity .24s ease,
box-shadow .24s ease;
}

.club-card.active{
opacity:1;
transform:scale(1);
z-index:3;
box-shadow:0 18px 44px rgba(0,0,0,.19);
}

.club-card img{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
}

.club-card:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.74) 0%,
rgba(0,0,0,.30) 40%,
rgba(0,0,0,0) 72%
);
pointer-events:none;
}

.card-content{
position:absolute;
z-index:4;
left:0;
right:0;
bottom:0;
padding:17px;
color:#fff;
}

.card-number{
font-size:7px;
font-weight:900;
letter-spacing:2px;
color:var(--gold-light);
margin-bottom:5px;
text-transform:uppercase;
}

.card-content h3{
font-family:var(--serif);
font-size:27px;
font-weight:400;
line-height:1.02;
text-shadow:0 2px 10px rgba(0,0,0,.35);
}

.card-content p{
font-size:11px;
line-height:1.4;
margin-top:6px;
color:#f2f2f2;
text-shadow:0 1px 8px rgba(0,0,0,.45);
}

.carousel-controls{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-top:3px;
}

.carousel-arrow{
width:38px;
height:38px;
border:1px solid #111;
border-radius:50%;
background:transparent;
font-size:17px;
}

.carousel-dots{
display:flex;
align-items:center;
gap:6px;
}

.carousel-dot{
width:6px;
height:6px;
border:0;
border-radius:50%;
background:#aaa49b;
padding:0;
}

.carousel-dot.active{
width:19px;
border-radius:99px;
background:#111;
}

/* =====================================================
   PLANS
===================================================== */

.plans-section{
background:#fff;
border-top:1px solid var(--line);
padding:30px 14px 36px;
}

.plans-inner{
max-width:900px;
margin:auto;
}

.plans-heading{
text-align:center;
margin-bottom:16px;
}

.plans-heading h2{
font-family:var(--serif);
font-size:36px;
font-weight:400;
line-height:1;
margin-top:6px;
}

.plans-heading p{
font-family:var(--serif);
font-size:13px;
color:#6b655e;
margin-top:7px;
}

.plans-grid{
display:grid;
gap:7px;
}

.plan-card{
width:100%;
min-height:104px;
padding:12px 15px;
border:1.5px solid #bbb4a8;
background:#faf8f3;
color:#111;
display:grid;
grid-template-columns:1fr auto;
grid-template-rows:auto auto auto;
column-gap:12px;
text-align:left;
transition:transform .12s ease;
}

.plan-card.free{
background:#f3f7ef;
border-color:#a8b89e;
}

.plan-card.annual{
background:#090909;
border-color:#090909;
color:#fff;
}

.plan-card:active{
transform:scale(.987);
}

.plan-top{
grid-column:1/3;
min-height:17px;
}

.plan-badge{
display:inline-block;
padding:4px 7px;
border-radius:99px;
font-size:7px;
font-weight:900;
letter-spacing:1.3px;
}

.plan-badge.free{
background:var(--green-dark);
color:#fff;
}

.plan-badge.best{
background:var(--gold-light);
color:#111;
}

.plan-price{
grid-row:2/4;
align-self:center;
font-family:var(--serif);
font-size:36px;
line-height:1;
}

.plan-period{
align-self:end;
text-align:right;
font-family:var(--serif);
font-size:16px;
}

.plan-note{
text-align:right;
font-size:9px;
color:#777;
}

.plan-card.annual .plan-note{
color:#bbb;
}

.plan-action{
grid-column:1/3;
padding-top:6px;
font-size:7px;
font-weight:900;
letter-spacing:1.3px;
}

.plans-smallprint{
max-width:670px;
margin:12px auto 0;
font-size:8px;
line-height:1.45;
color:#79736b;
text-align:center;
}

/* =====================================================
   FOOTER
===================================================== */

.club-footer{
background:#070707;
color:#fff;
text-align:center;
padding:18px 16px;
}

.club-footer strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
letter-spacing:2px;
color:var(--gold);
}

.club-footer span{
display:block;
margin-top:4px;
font-size:7px;
letter-spacing:1.1px;
color:#888;
}

/* =====================================================
   MEMBERSHIP
===================================================== */

.membership-overlay{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.76);
backdrop-filter:blur(5px);
}

.membership-overlay.open{
display:flex;
}

.membership-shell{
position:relative;
width:100%;
max-width:650px;
max-height:96vh;
overflow-y:auto;
background:#fff;
border-radius:17px 17px 0 0;
}

.membership-close{
position:absolute;
right:11px;
top:11px;
z-index:10;
width:36px;
height:36px;
border:1px solid #bbb;
border-radius:50%;
background:#fff;
font-size:20px;
}

.membership-step{
display:none;
}

.membership-step.active{
display:block;
}

.step-head{
padding:24px 19px 16px;
background:var(--cream);
border-bottom:1px solid #ddd5c8;
}

.step-kicker{
font-size:8px;
font-weight:900;
letter-spacing:2.2px;
color:var(--gold);
}

.step-head h2,
.success-wrap h2{
font-family:var(--serif);
font-size:28px;
font-weight:400;
line-height:1.04;
margin-top:6px;
padding-right:38px;
}

.step-head p{
font-size:11px;
line-height:1.4;
color:#6b655e;
margin-top:7px;
}

.progress{
display:flex;
align-items:center;
max-width:190px;
margin-top:12px;
}

.progress-item{
width:25px;
height:25px;
border:1px solid #aaa;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:8px;
font-weight:900;
background:#fff;
color:#777;
}

.progress-item.active{
background:#111;
border-color:#111;
color:#fff;
}

.progress-item.complete{
background:var(--green-dark);
border-color:var(--green-dark);
color:#fff;
}

.progress-line{
height:1px;
background:#c9c1b5;
flex:1;
}

.progress-line.complete{
background:var(--green-dark);
}

.plan-summary{
display:flex;
align-items:center;
justify-content:space-between;
gap:14px;
padding:13px 19px;
background:#0b0b0b;
color:#fff;
}

.summary-label{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.6px;
color:var(--gold-light);
margin-bottom:3px;
}

.plan-summary strong{
font-family:var(--serif);
font-size:17px;
font-weight:400;
}

.summary-price{
font-family:var(--serif);
font-size:20px;
white-space:nowrap;
}

.membership-form{
padding:18px 19px 23px;
}

.field{
margin-bottom:12px;
}

.field label{
display:flex;
align-items:center;
gap:5px;
margin-bottom:5px;
font-size:9px;
font-weight:800;
}

.required-star{
color:var(--red);
}

.optional-label{
font-size:6px;
font-weight:900;
letter-spacing:1px;
color:#969089;
margin-left:3px;
}

.field input,
.field select{
width:100%;
height:41px;
padding:0 11px;
border:1px solid #bdb6ab;
background:#fff;
color:#111;
outline:none;
border-radius:0;
}

.field.error input,
.field.error select{
border:2px solid var(--red);
background:#fff8f8;
}

.field-error{
display:none;
margin-top:4px;
font-size:8px;
font-weight:700;
color:var(--red);
}

.field.error .field-error{
display:block;
}

.pet-title{
font-family:var(--serif);
font-size:20px;
font-weight:400;
margin:4px 0;
}

.pet-note{
font-size:9px;
line-height:1.4;
color:#777168;
margin-bottom:12px;
}

/* =====================================================
   BREEDS
===================================================== */

.breed-combobox{
position:relative;
}

.breed-input-wrap{
position:relative;
}

.breed-input-wrap input{
padding-right:40px;
}

.breed-toggle{
position:absolute;
right:0;
top:0;
width:41px;
height:41px;
border:0;
background:transparent;
font-size:17px;
}

.breed-results{
position:absolute;
left:0;
right:0;
top:45px;
z-index:100;
display:none;
max-height:240px;
overflow:auto;
background:#fff;
border:1px solid #aaa39a;
box-shadow:0 10px 28px rgba(0,0,0,.17);
}

.breed-results.open{
display:block;
}

.breed-option{
width:100%;
border:0;
border-bottom:1px solid #ece8e1;
background:#fff;
padding:10px 12px;
text-align:left;
display:block;
}

.breed-option.active,
.breed-option:active{
background:#f3eee4;
}

.breed-option-name{
display:block;
font-size:10px;
font-weight:800;
}

.breed-option-secondary{
display:block;
font-size:8px;
color:#888178;
margin-top:2px;
}

.breed-empty{
padding:12px;
font-size:9px;
color:#777;
}

.breed-disabled{
background:#f3f1ed!important;
color:#aaa!important;
}

/* =====================================================
   BUTTONS
===================================================== */

.required-note{
font-size:8px;
color:#777;
margin:2px 0 12px;
}

.required-note span{
color:var(--red);
}

.primary-button{
width:100%;
height:47px;
border:0;
background:#090909;
color:#fff;
font-size:9px;
font-weight:900;
letter-spacing:1.5px;
}

.primary-button:disabled{
opacity:.55;
cursor:wait;
}

.secondary-button{
width:100%;
height:41px;
border:1px solid #111;
background:#fff;
font-size:8px;
font-weight:900;
letter-spacing:1.2px;
margin-top:7px;
}

/* =====================================================
   CHECKOUT
===================================================== */

.checkout-wrap{
padding:23px 19px 27px;
}

.checkout-title{
font-family:var(--serif);
font-size:26px;
font-weight:400;
text-align:center;
}

.checkout-copy{
max-width:430px;
margin:7px auto 20px;
text-align:center;
font-size:10px;
line-height:1.5;
color:#6c665e;
}

.payment-options{
border:1.5px solid #111;
padding:0 14px;
margin-bottom:9px;
}

.payment-row{
min-height:62px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
border-bottom:1px solid #ded8cf;
}

.payment-row:last-child{
border-bottom:0;
}

.payment-row strong{
font-size:10px;
letter-spacing:.8px;
}

.wallet-logos{
display:flex;
align-items:center;
gap:13px;
font-size:11px;
font-weight:900;
}

.wallet-google{
font-size:13px;
font-weight:700;
}

.wallet-apple{
font-size:14px;
font-weight:700;
}

.card-brands{
font-size:9px;
font-weight:900;
letter-spacing:.5px;
}

.checkout-security{
display:flex;
align-items:center;
justify-content:center;
gap:6px;
font-size:8px;
color:#777;
margin:14px 0;
}

.checkout-security span:first-child{
font-size:13px;
}

.checkout-error{
display:none;
padding:10px;
margin-bottom:10px;
background:#fff3f3;
border:1px solid var(--red);
color:var(--red);
font-size:9px;
line-height:1.4;
}

.checkout-error.show{
display:block;
}

/* =====================================================
   VERIFYING
===================================================== */

.verify-wrap{
padding:40px 22px 34px;
text-align:center;
}

.verify-spinner{
width:46px;
height:46px;
margin:0 auto 18px;
border:3px solid #e2ddd4;
border-top-color:#111;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.verify-wrap h2{
font-family:var(--serif);
font-size:28px;
font-weight:400;
line-height:1.05;
}

.verify-wrap p{
max-width:430px;
margin:9px auto 0;
font-size:10px;
line-height:1.5;
color:#6d675f;
}

/* =====================================================
   SUCCESS
===================================================== */

.success-wrap{
padding:35px 19px 26px;
text-align:center;
}

.success-mark{
width:60px;
height:60px;
margin:0 auto 14px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:var(--green);
font-size:28px;
font-weight:900;
}

.success-intro{
font-size:11px;
line-height:1.5;
color:#6a655e;
margin-top:8px;
}

.membership-card{
margin:20px 0 16px;
border:1px solid #cbc4b8;
background:#faf8f3;
text-align:left;
}

.membership-card-top{
padding:14px 15px;
background:#090909;
color:#fff;
}

.membership-card-top span{
display:block;
font-size:7px;
font-weight:900;
letter-spacing:1.7px;
color:var(--gold-light);
}

.membership-card-top strong{
display:block;
margin-top:4px;
font-family:var(--serif);
font-size:20px;
font-weight:400;
}

.membership-row{
display:flex;
justify-content:space-between;
gap:18px;
padding:11px 14px;
border-bottom:1px solid #ded7cc;
font-size:9px;
line-height:1.35;
}

.membership-row:last-child{
border-bottom:0;
}

.membership-row span{
color:#777169;
text-align:left;
}

.membership-row strong{

month:"long",
year:"numeric"
}
).format(date);

}catch(error){

const track=

const cards=[

".club-card"

const dots=[

)

function updateCarousel(
index
){

activeSlide=
index;

cards.forEach(
(card,i)=>{

card
.classList
.toggle(
"active",
i===index
);

}
);

dots.forEach(
(dot,i)=>{

dot
.classList
.toggle(
"active",
i===index
);

}
);

}

function centerCard(
index,
behavior="smooth"
){

if(index<0){
index=
cards.length-1;
}

if(
index>=cards.length
){
index=0;
}

const card=
cards[index];

const target=
card.offsetLeft-
(track.clientWidth/2)+
(card.clientWidth/2);

track.scrollTo({
left:target,
behavior
});

updateCarousel(
index
);

}

$("carouselPrev")
.addEventListener(
"click",
()=>{
centerCard(
activeSlide-1
);
}
);

$("carouselNext")
.addEventListener(
"click",
()=>{
centerCard(
activeSlide+1
);
}
);

dots.forEach(
dot=>{

dot.addEventListener(
"click",
()=>{

centerCard(
Number(
dot.dataset.dot
)
);

}
);

}
);

let carouselTimer=null;

track.addEventListener(
"scroll",
()=>{

clearTimeout(
carouselTimer
);

carouselTimer=
setTimeout(
()=>{

const center=
track.scrollLeft+
track.clientWidth/2;

let closest=0;

let distance=
Infinity;

cards.forEach(
(card,index)=>{

const cardCenter=
card.offsetLeft+
card.clientWidth/2;

const currentDistance=
Math.abs(
cardCenter-center
);

if(
currentDistance<
distance
){

distance=
currentDistance;

closest=
index;

}

}
);

updateCarousel(
closest
);

},
80
);

}
);

membership.dates &&
membership.dates.nextPayment
?membership.dates.nextPayment
:membership.nextPayment
)
);

text(
"membershipEmail",
membership.email||
getT().notAvailable
);

if(showModal){

membershipOverlay
.classList
.add(
"open"
);

document.body
.classList
.add(
"locked"
);

showStep(
"successStep"
);

}

}

/* =====================================================
   VERIFY STRIPE CHECKOUT
===================================================== */

async function verifyCheckout(
sessionId
){

if(
verificationBusy
){
return;
}

verificationBusy=
true;

pendingSessionId=
sessionId;

membershipOverlay
.classList
.add(
"open"
);

document.body
.classList
.add(
"locked"
);

showStep(
"verifyStep"
);

try{

const response=
await fetch(
"/api/verify-club-checkout",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

sessionId:
sessionId

})

}
);

let data={};

try{

data=
await response.json();

}catch(error){}

if(
!response.ok
){

throw new Error(
data.error||
"Verification failed."
);

}

if(
!data.verified ||
!data.membership
){

const state=
data.state||
"not_verified";

throw new Error(
state
);

}

const membership=
data.membership;

localStorage
.setItem(
"petsDogueMembership",
JSON.stringify(
membership
)
);

localStorage
.removeItem(
"petsDoguePendingCheckout"
);

localStorage
.setItem(
"petsDogueAccountEmail",
membership.email||
""
);

selectedPlan=
membership.plan||
selectedPlan;

renderVerifiedMembership(
membership,
true
);

cleanCheckoutUrl();

}catch(error){

console.error(
"PETS & DOGUE verification:",
error
);

text(
"verifyDebug",
String(
error.message||
error
)
);

showStep(
"failureStep"
);

}finally{

verificationBusy=
false;

}

}

function cleanCheckoutUrl(){

try{

const url=
new URL(
window.location.href
);

url.searchParams
.delete(
"membership"
);

url.searchParams
.delete(
"plan"
);

url.searchParams
.delete(
"session_id"
);

window.history
.replaceState(
{},
document.title,
url.pathname+
url.search+
url.hash
);

}catch(error){}

}

/* =====================================================
   CHECKOUT RETURN
===================================================== */

function processCheckoutReturn(){

const params=
new URLSearchParams(
window.location.search
);

const status=
params.get(
"membership"
);

const plan=
params.get(
"plan"
);

const sessionId=
params.get(
"session_id"
);

if(

plan &&

[
"free",
"monthly",
"annual"
]
.includes(
plan
)

){

selectedPlan=
plan;

updatePlanSummary();

}

if(
status===
"success"
){

if(!sessionId){

membershipOverlay
.classList
.add(
"open"
);

document.body
.classList
.add(
"locked"
);

text(
"verifyDebug",
"Missing Stripe Checkout Session ID."
);

showStep(
"failureStep"
);

return;

}

verifyCheckout(
sessionId
);

return;

}

if(
status===
"cancelled"
){

membershipOverlay
.classList
.add(
"open"
);

document.body
.classList
.add(
"locked"
);

showStep(
"checkoutStep"
);

const box=
$("checkoutError");

if(
currentLanguage==="ru"
){

box.textContent=
"Оплата была отменена. Вы можете попробовать снова.";

}else if(
currentLanguage==="uk"
){

box.textContent=
"Оплату було скасовано. Ви можете спробувати ще раз.";

}else{

box.textContent=
"Payment was cancelled. You can try again.";

}

box
.classList
.add(
"show"
);

cleanCheckoutUrl();

}

}

/* =====================================================
   RETRY / FAILURE
===================================================== */

$("retryVerification")
.addEventListener(
"click",
()=>{

if(
pendingSessionId
){

verifyCheckout(
pendingSessionId
);

return;

}

const pending=
safeJsonParse(
localStorage.getItem(
"petsDoguePendingCheckout"
)||
"{}"
);

if(
pending.sessionId
){

verifyCheckout(
pending.sessionId
);

return;

}

showStep(
"checkoutStep"
);

}
);

$("failureClose")
.addEventListener(
"click",
closeMembership
);

/* =====================================================
   LANGUAGE EVENTS
===================================================== */

$("languageSelect")
.addEventListener(
"change",
function(){

changeLanguage(
this.value
);

}
);

window.addEventListener(
"petsdogue:languagechange",
event=>{

const code=
event.detail &&
event.detail.language;

if(

code &&

L[code] &&

code!==
currentLanguage

){

renderLanguage(
code
);

}

}
);

/* =====================================================
   ESCAPE
===================================================== */

document
.addEventListener(
"keydown",
event=>{

if(
event.key===
"Escape"
){

closeBreedResults();
closeMenu();

}

}
);

/* =====================================================
   RESTORE SAVED QUESTIONNAIRE
===================================================== */

function restoreQuestionnaire(){

const saved=
safeJsonParse(
localStorage.getItem(
"petsDogueClubQuestionnaire"
)||
"{}"
);

if(
saved.firstName
){

$("firstName")
.value=
saved.firstName;

}

if(
saved.email
){

$("memberEmail")
.value=
saved.email;

}

if(
saved.country
){

$("memberCountry")
.value=
saved.country;

}

if(
saved.petName
){

$("petName")
.value=
saved.petName;

}

if(
saved.petType
){

$("petType")
.value=
saved.petType;

}

if(
saved.birthday
){

$("petBirthday")
.value=
saved.birthday;

}

if(
saved.social
){

$("petSocial")
.value=
saved.social;

}

if(
saved.breedId &&
hasPetData()
){

const item=
window
.PETSDOGUE_PET_DATA
.findById(
saved.breedId
);

if(

item &&

window
.PETSDOGUE_PET_DATA
.isCompatible(
saved.petType,
saved.breedId
)

){

selectedBreedId=
saved.breedId;

$("petBreedId")
.value=
saved.breedId;

$("petBreed")
.value=
window
.PETSDOGUE_PET_DATA
.getDisplayName(
item,
breedLanguage()
);

}

}else if(
saved.breed
){

$("petBreed")
.value=
saved.breed;

}

setBreedEnabled();

}

/* =====================================================
   START
===================================================== */

const initialLanguage=

window.PDI18N &&

typeof PDI18N.init===
"function"

?PDI18N.init()

:"en";

renderLanguage(

L[initialLanguage]
?initialLanguage
:"en"

);

setBreedEnabled();

restoreQuestionnaire();

const accountEmail=
localStorage.getItem(
"petsDogueAccountEmail"
);

if(

accountEmail &&

!$("memberEmail")
.value

){

$("memberEmail")
.value=
accountEmail;

}

requestAnimationFrame(
()=>{

requestAnimationFrame(
()=>{

centerCard(
0,
"auto"
);

}
);

}
);

processCheckoutReturn();

</script>
