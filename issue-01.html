*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--black:#050505;
--white:#fff;
--paper:#f8f7f3;
--gold:#c89b3c;
--gold-dark:#b78a2e;
--grey:#555;
--line:#ddd;
--serif:Georgia,"Times New Roman",serif;
--sans:Arial,Helvetica,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--paper);
color:#111;
font-family:var(--sans);
overflow-x:hidden;
}

a{
text-decoration:none;
color:inherit;
}

img{
display:block;
max-width:100%;
}

/* =========================================================
ISSUE PAGE HEADER
========================================================= */

.issue-page-header{
background:#fff;
border-bottom:1px solid var(--line);
position:relative;
z-index:5;
}

.issue-top{
height:66px;
display:flex;
align-items:center;
justify-content:space-between;
max-width:1400px;
margin:auto;
padding:0 18px;
gap:14px;
}

.issue-logo{
text-align:center;
line-height:.9;
}

.logo-small{
font-size:15px;
color:var(--gold-dark);
}

.logo-big{
font-size:42px;
font-family:var(--serif);
font-weight:bold;
color:var(--gold);
letter-spacing:3px;
}

.back{
background:#111;
color:#fff;
padding:12px 18px;
border-radius:999px;
font-weight:bold;
font-size:14px;
white-space:nowrap;
}

.issue-label{
font-size:13px;
font-weight:bold;
color:#555;
}

/* =========================================================
HERO
========================================================= */

.hero{
max-width:1500px;
margin:auto;
padding:24px 18px;
}

.cover{
position:relative;
border-radius:40px;
overflow:hidden;
box-shadow:0 25px 75px rgba(0,0,0,.22);
}

.cover img{
width:100%;
display:block;
}

.cover-text{
position:absolute;
left:40px;
right:40px;
bottom:40px;
color:#fff;
text-shadow:0 4px 20px rgba(0,0,0,.7);
}

.cover-text span{
display:inline-block;
background:var(--gold);
padding:8px 14px;
border-radius:999px;
font-size:12px;
font-weight:bold;
margin-bottom:15px;
}

.cover-text h1{
font-family:var(--serif);
font-size:72px;
margin-bottom:12px;
}

.cover-text p{
font-size:22px;
line-height:1.6;
max-width:850px;
}

/* =========================================================
INTRO
========================================================= */

.issue-intro{
max-width:1000px;
margin:70px auto;
text-align:center;
padding:0 22px;
}

.kicker{
letter-spacing:3px;
color:var(--gold-dark);
font-size:13px;
font-weight:bold;
margin-bottom:18px;
}

.issue-intro h2{
font-family:var(--serif);
font-size:58px;
margin-bottom:20px;
}

.issue-intro p{
font-size:21px;
line-height:1.8;
color:#555;
}

/* =========================================================
TABLE OF CONTENTS
========================================================= */

.toc{
max-width:1200px;
margin:70px auto;
padding:0 20px;
}

.toc h2{
font-family:var(--serif);
font-size:46px;
text-align:center;
margin-bottom:35px;
}

.toc-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:18px;
}

.toc-card{
background:#fff;
border:2px solid #111;
border-radius:28px;
padding:22px;
text-align:center;
}

.toc-card span{
color:var(--gold);
font-weight:bold;
font-size:13px;
}

.toc-card h3{
font-family:var(--serif);
font-size:28px;
margin-top:8px;
}

/* =========================================================
EDITORIAL SECTIONS
========================================================= */

.page{
max-width:1200px;
margin:90px auto;
padding:0 20px;
}

.editorial{
display:grid;
grid-template-columns:1fr 1fr;
gap:35px;
align-items:center;
background:#fff;
border:2px solid #111;
border-radius:42px;
overflow:hidden;
box-shadow:0 16px 45px rgba(0,0,0,.08);
}

.editorial.reverse{
direction:rtl;
}

.editorial.reverse .text{
direction:ltr;
}

.editorial img{
width:100%;
height:620px;
object-fit:cover;
}

.text{
padding:38px;
}

.badge{
display:inline-block;
background:var(--gold);
color:#fff;
padding:8px 14px;
border-radius:999px;
font-size:12px;
font-weight:bold;
margin-bottom:16px;
}

.text h2{
font-family:var(--serif);
font-size:50px;
margin-bottom:18px;
}

.text p{
font-size:18px;
line-height:1.9;
color:#444;
margin-bottom:16px;
}

.quote{
font-family:var(--serif);
font-size:28px;
color:var(--gold-dark);
margin:24px 0;
line-height:1.5;
}

/* =========================================================
FULL COVER STORY
========================================================= */

.full-page{
max-width:1400px;
margin:90px auto;
padding:0 20px;
}

.full-card{
position:relative;
border-radius:44px;
overflow:hidden;
min-height:650px;
display:flex;
align-items:flex-end;
box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.full-card img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.full-card:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.9),
rgba(0,0,0,.05)
);
}

.full-content{
position:relative;
z-index:2;
color:#fff;
padding:45px;
max-width:850px;
}

.full-content h2{
font-family:var(--serif);
font-size:64px;
margin-bottom:18px;
}

.full-content p{
font-size:21px;
line-height:1.8;
color:#eee;
}

/* =========================================================
BUTTONS
========================================================= */

.buttons{
display:flex;
gap:14px;
flex-wrap:wrap;
margin-top:24px;
}

.btn{
display:inline-block;
background:#111;
color:#fff;
padding:15px 22px;
border-radius:999px;
font-weight:bold;
}

.btn.gold{
background:var(--gold);
}

/* =========================================================
SHOP
========================================================= */

.shop-strip{
max-width:1200px;
margin:90px auto;
padding:0 20px;
}

.shop-box{
background:#111;
color:#fff;
border-radius:42px;
padding:50px 30px;
text-align:center;
}

.shop-box h2{
font-family:var(--serif);
font-size:50px;
color:#d6aa45;
margin-bottom:18px;
}

.shop-box p{
font-size:20px;
line-height:1.8;
max-width:850px;
margin:auto;
}

.shop-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-top:35px;
}

.shop-item{
background:#fff;
color:#111;
border-radius:25px;
padding:22px;
font-weight:bold;
}

/* =========================================================
FINAL
========================================================= */

.final{
max-width:1000px;
margin:90px auto;
text-align:center;
padding:0 22px;
}

.final h2{
font-family:var(--serif);
font-size:56px;
margin-bottom:18px;
}

.final p{
font-size:21px;
line-height:1.8;
color:#555;
margin-bottom:25px;
}

/* =========================================================
FOOTER
========================================================= */

.issue-footer{
margin-top:70px;
padding:55px 20px;
background:#050505;
color:#fff;
text-align:center;
}

.issue-footer h2{
font-family:var(--serif);
font-size:46px;
margin-bottom:10px;
}

.issue-footer p{
color:#ddd;
}

.footer-links{
display:flex;
justify-content:center;
gap:16px;
flex-wrap:wrap;
margin-top:22px;
}

.footer-links a{
color:#ccc;
font-size:14px;
}

.admin-small{
display:block;
margin-top:25px;
color:#777;
font-size:11px;
letter-spacing:2px;
text-transform:uppercase;
}

/* =========================================================
RTL
========================================================= */

html[dir="rtl"] body{
direction:rtl;
}

html[dir="rtl"] .editorial{
direction:rtl;
}

html[dir="rtl"] .editorial .text,
html[dir="rtl"] .editorial.reverse .text{
direction:rtl;
text-align:right;
}

html[dir="rtl"] .buttons{
justify-content:flex-start;
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:850px){

.logo-big{
font-size:34px;
}

.back{
font-size:12px;
padding:10px 14px;
}

.issue-label{
display:none;
}

.cover-text{
position:static;
background:#111;
padding:28px;
text-shadow:none;
}

.cover-text h1{
font-size:44px;
}

.cover-text p{
font-size:18px;
}

.issue-intro h2{
font-size:40px;
}

.editorial,
.editorial.reverse{
grid-template-columns:1fr;
direction:ltr;
}

html[dir="rtl"] .editorial,
html[dir="rtl"] .editorial.reverse{
direction:rtl;
}

.editorial img{
height:420px;
}

.text h2{
font-size:38px;
}

.full-card{
min-height:520px;
}

.full-content{
padding:30px;
}

.full-content h2{
font-size:42px;
}

}

</style>

/*
For languages where a dedicated editorial translation is not yet different
from the English copy, we still keep the selected language active.
The global shell remains translated and the page falls back safely.
*/
["sv","da","no","fi","tr","ar","hi","bg","el","hu","ro","sk","cs","pl","nl","pt","it","es","de","fr","ru","uk","en"]
.forEach(
code=>{
if(!ISSUE_COPY[code]){
ISSUE_COPY[code]=ISSUE_COPY.en;
}
}
);

function normalizeLanguage(value){

let code=
String(value||"")
.trim()
.toLowerCase()
.replace("_","-")
.split("-")[0];

code=
LANGUAGE_ALIASES[code]||
code;

return SUPPORTED.includes(code)
?code
:"en";

}

function detectLanguage(){

try{

const saved=
normalizeLanguage(
localStorage.getItem(
LANGUAGE_KEY
)
);

if(saved){
return saved;
}

}catch{}

return normalizeLanguage(
document.documentElement.lang||
navigator.language||
"en"
);

}

function renderIssue(language){

const lang=
normalizeLanguage(language);

const copy=
ISSUE_COPY[lang]||
ISSUE_COPY.en;

document.documentElement.lang=
lang;

document.documentElement.dir=
lang==="ar"
?"rtl"
:"ltr";

document.title=
copy.title;

document
.getElementById(
"pageDescription"
)
?.setAttribute(
"content",
copy.description
);

document.getElementById(
"backHome"
).textContent=
copy.home;

document.getElementById(
"issueLabel"
).textContent=
copy.label;

document.getElementById(
"coverText"
).innerHTML=
copy.cover;

document.getElementById(
"issueIntro"
).innerHTML=
copy.intro;

document.getElementById(
"tocBlock"
).innerHTML=
copy.toc;

document.getElementById(
"editorText"
).innerHTML=
copy.editor;

document.getElementById(
"coverStoryContent"
).innerHTML=
copy.coverStory;

document.getElementById(
"fashionText"
).innerHTML=
copy.fashion;

document.getElementById(
"travelText"
).innerHTML=
copy.travel;

document.getElementById(
"helpText"
).innerHTML=
copy.help;

document.getElementById(
"shopBox"
).innerHTML=
copy.shop;

document.getElementById(
"finalBlock"
).innerHTML=
copy.final;

document.getElementById(
"issueFooter"
).innerHTML=
copy.footer;

}

function setIssueLanguage(language){

const lang=
normalizeLanguage(language);

try{

localStorage.setItem(
LANGUAGE_KEY,
lang
);

}catch{}

renderIssue(
lang
);

}

window.addEventListener(
"petsdogue:languagechange",
event=>{

const language=
event?.detail?.language;

if(language){

renderIssue(
language
);

}

}
);

window.addEventListener(
"storage",
event=>{

if(
event.key===
LANGUAGE_KEY
){

renderIssue(
event.newValue||
"en"
);

}

}
);

window.addEventListener(
"pageshow",
()=>{

renderIssue(
detectLanguage()
);

}
);

document.addEventListener(
"DOMContentLoaded",
()=>{

renderIssue(
detectLanguage()
);

}
);

</script>
