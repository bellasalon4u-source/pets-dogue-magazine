<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta
id="pageDescription"
name="description"
content="Read and listen to PETS & DOGUE editorial stories."
>

<title>Article | PETS & DOGUE</title>

<style>
:root{
--black:#070707;
--white:#fff;
--cream:#f6f2e9;
--gold:#c89b3c;
--gold-light:#efd38c;
--green:#65e51f;
--border:#d8d3c8;
--grey:#777;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--cream);
color:#111;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button{
font:inherit;
cursor:pointer;
}

img{
display:block;
width:100%;
max-width:100%;
}

/* =========================================================
HEADER
========================================================= */

.article-header{
background:var(--black);
color:#fff;
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid #292929;
}

.article-header-inner{
height:122px;
max-width:1100px;
margin:auto;
padding:0 18px;
display:grid;
grid-template-columns:72px minmax(0,1fr) 72px;
align-items:center;
}

.header-round{
width:58px;
height:58px;
border:1px solid #4c4c4c;
border-radius:50%;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:31px;
font-weight:300;
}

.header-round.home{
font-size:29px;
margin-left:auto;
}

.brand{
text-align:center;
line-height:.9;
}

.brand-small{
font:15px Georgia,serif;
color:var(--gold-light);
letter-spacing:1px;
}

.brand-big{
font:normal 59px Georgia,serif;
letter-spacing:4px;
}

/* =========================================================
HERO
========================================================= */

.article-hero{
background:#111;
color:#fff;
}

.hero-media{
position:relative;
height:650px;
max-width:1200px;
margin:auto;
overflow:hidden;
background:#222;
}

.hero-media img{
width:100%;
height:100%;
object-fit:cover;
}

.hero-media:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.98) 0%,
rgba(0,0,0,.78) 35%,
rgba(0,0,0,.22) 75%,
rgba(0,0,0,.08) 100%
);
}

.hero-copy{
position:absolute;
z-index:2;
left:50%;
bottom:38px;
transform:translateX(-50%);
width:min(1040px,91%);
}

.article-category{
display:block;
margin-bottom:15px;
font-size:11px;
font-weight:800;
letter-spacing:2px;
color:var(--gold-light);
text-transform:uppercase;
}

.hero-copy h1{
max-width:900px;
font:normal 64px/1.02 Georgia,serif;
overflow-wrap:anywhere;
}

.article-intro{
max-width:860px;
margin-top:18px;
font:22px/1.45 Georgia,serif;
color:#eee;
}

.article-meta{
display:flex;
flex-wrap:wrap;
gap:9px 23px;
margin-top:22px;
font-size:13px;
color:#ddd;
}

/* =========================================================
AUDIO
========================================================= */

.audio-section{
background:#fff;
border-bottom:1px solid var(--border);
}

.audio-inner{
max-width:930px;
margin:auto;
padding:16px 18px;
display:flex;
align-items:center;
gap:15px;
}

.listen-button{
min-height:58px;
padding:0 25px;
border:0;
border-radius:999px;
background:#111;
color:#fff;
font-weight:800;
font-size:16px;
display:flex;
align-items:center;
gap:10px;
}

.listen-button.active{
background:var(--green);
color:#111;
}

.audio-status{
font-size:12px;
color:#777;
}

/* =========================================================
ARTICLE CONTENT
========================================================= */

.article-shell{
max-width:930px;
margin:auto;
padding:38px 18px 75px;
}

.article-card{
background:#fff;
border:2px solid #111;
padding:50px;
}

.article-body p{
font:21px/1.82 Georgia,serif;
color:#292929;
margin-bottom:29px;
}

.article-body h2{
font:normal 43px/1.08 Georgia,serif;
margin:48px 0 21px;
}

.article-body blockquote{
font:28px/1.46 Georgia,serif;
background:#f7f1e3;
border-left:6px solid var(--gold);
padding:25px 28px;
margin:39px 0;
}

.article-photo{
width:100%;
max-height:590px;
object-fit:cover;
margin:35px 0;
}

.article-caption{
display:block;
margin-top:-23px;
margin-bottom:35px;
text-align:center;
font-size:12px;
color:#777;
}

.speech-block{
scroll-margin-top:150px;
border-radius:4px;
}

.speech-block.speaking-now{
background:#fff5c8;
box-shadow:0 0 0 8px #fff5c8;
}

/* =========================================================
ACTIONS
========================================================= */

.article-actions{
margin-top:42px;
padding-top:28px;
border-top:3px solid #111;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.action-button{
min-height:58px;
border:2px solid #111;
border-radius:999px;
background:#fff;
font-weight:800;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
}

.action-button.gold{
background:var(--gold);
border-color:var(--gold);
}

/* =========================================================
RTL
========================================================= */

html[dir="rtl"] .hero-copy{
text-align:right;
}

html[dir="rtl"] .article-body blockquote{
border-left:0;
border-right:6px solid var(--gold);
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:760px){

.article-header-inner{
height:105px;
grid-template-columns:62px minmax(0,1fr) 62px;
padding:0 14px;
}

.header-round{
width:52px;
height:52px;
font-size:29px;
}

.header-round.home{
font-size:26px;
}

.brand-small{
font-size:12px;
}

.brand-big{
font-size:46px;
letter-spacing:2px;
}

.hero-media{
height:575px;
}

.hero-copy{
bottom:29px;
}

.hero-copy h1{
font-size:44px;
line-height:1.03;
}

.article-intro{
font-size:18px;
}

.article-meta{
font-size:12px;
gap:8px 15px;
}

.audio-inner{
padding:14px 16px;
}

.listen-button{
min-height:55px;
padding:0 22px;
font-size:15px;
}

.article-shell{
padding:24px 10px 55px;
}

.article-card{
padding:29px 20px;
}

.article-body p{
font-size:19px;
line-height:1.75;
}

.article-body h2{
font-size:35px;
margin-top:41px;
}

.article-body blockquote{
font-size:23px;
padding:20px;
}

.article-actions{
grid-template-columns:1fr;
}

}

@media(max-width:430px){

.article-header-inner{
height:96px;
}

.brand-big{
font-size:40px;
}

.hero-media{
height:545px;
}

.hero-copy h1{
font-size:39px;
}

.article-intro{
font-size:17px;
}

.article-card{
padding:25px 17px;
}

}

@media(prefers-reduced-motion:reduce){

html{
scroll-behavior:auto;
}

}
</style>
</head>

<script>
"use strict";

/* =========================================================
CONFIG
========================================================= */

const LANGUAGE_KEY =
"pets_dogue_language";

const STORY_IMAGES = {

default:
"https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1800&q=85",

photoshoot:
"https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=1800&q=85",

travel:
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=85",

fashion:
"https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=1800&q=85",

wellness:
"https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?auto=format&fit=crop&w=1800&q=85",

rescue:
"https://images.unsplash.com/photo-1601758064224-c3c14e3a8cb8?auto=format&fit=crop&w=1800&q=85",

places:
"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=85",

volunteers:
"https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1800&q=85",

community:
"https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=1800&q=85"

};

const SUPPORTED_LANGUAGES = [
"en",
"uk",
"ru",
"fr",
"de",
"es",
"it",
"pt",
"nl",
"pl",
"cs",
"sk",
"hu",
"ro",
"bg",
"el",
"sv",
"da",
"no",
"fi",
"tr",
"ar",
"hi"
];

let speechActive =
false;

let speechQueue =
[];

let speechIndex =
0;

let currentSpeechElement =
null;

let currentStoryKey =
"default";

let refreshTimer =
null;

const $ =
id =>
document.getElementById(id);

/* =========================================================
LANGUAGE
========================================================= */

function normaliseLanguage(
value
){

if(
!value
){

return "en";

}

let code =
String(
value
)
.trim()
.toLowerCase()
.replace(
"_",
"-"
)
.split(
"-"
)[0];

const aliases = {
ua:"uk",
cz:"cs",
gr:"el",
se:"sv",
dk:"da"
};

code =
aliases[code] ||
code;

return SUPPORTED_LANGUAGES.includes(
code
)
? code
: "en";

}

function getCurrentLanguage(){

try{

if(
window.PetsDogueLanguage &&
typeof window.PetsDogueLanguage.getCurrentLanguage ===
"function"
){

const result =
window.PetsDogueLanguage.getCurrentLanguage();

if(
typeof result ===
"string"
){

return normaliseLanguage(
result
);

}

if(
result &&
typeof result ===
"object"
){

return normaliseLanguage(
result.code ||
result.language ||
result.lang ||
"en"
);

}

}

}catch(
error
){

console.warn(
"Could not read language from PETS & DOGUE engine.",
error
);

}

return normaliseLanguage(
localStorage.getItem(
LANGUAGE_KEY
) ||
document.documentElement.lang ||
"en"
);

}

function getArticleRoot(){

return (
window.PetsDogueTranslations &&
window.PetsDogueTranslations.article
) ||
null;

}

function getLanguageBundle(){

const root =
getArticleRoot();

if(
!root
){

return null;

}

const language =
getCurrentLanguage();

return (
root[language] ||
root.en ||
null
);

}

function articleText(
path,
fallback
){

let value =
getLanguageBundle();

if(
!value
){

return fallback;

}

path
.split(
"."
)
.forEach(
key =>{

if(
value &&
Object.prototype.hasOwnProperty.call(
value,
key
)
){

value =
value[key];

}else{

value =
undefined;

}

}
);

return typeof value ===
"string"
? value
: fallback;

}

/* =========================================================
STORY
========================================================= */

function getStoryKey(){

const params =
new URLSearchParams(
window.location.search
);

const requested =
params.get(
"story"
);

const validStories = [
"photoshoot",
"travel",
"fashion",
"wellness",
"rescue",
"places",
"volunteers",
"community"
];

return validStories.includes(
requested
)
? requested
: "default";

}

function getCurrentStory(){

const bundle =
getLanguageBundle();

if(
!bundle
){

return null;

}

if(
currentStoryKey ===
"default"
){

return bundle.default ||
null;

}

if(
bundle.stories &&
bundle.stories[
currentStoryKey
]
){

return bundle.stories[
currentStoryKey
];

}

const english =
getArticleRoot()?.en;

if(
english &&
english.stories &&
english.stories[
currentStoryKey
]
){

return english.stories[
currentStoryKey
];

}

return bundle.default ||
english?.default ||
null;

}

/* =========================================================
DOM HELPERS
========================================================= */

function setText(
id,
value
){

const element =
$(id);

if(
!element
){

return;

}

element.textContent =
typeof value ===
"string"
? value
: "";

}

function setMeta(
value
){

const meta =
$("pageDescription");

if(
meta &&
value
){

meta.setAttribute(
"content",
value
);

}

}

function createParagraph(
text
){

const element =
document.createElement(
"p"
);

element.textContent =
text ||
"";

return element;

}

function createHeading(
text
){

const element =
document.createElement(
"h2"
);

element.textContent =
text ||
"";

return element;

}

function createQuote(
text
){

const element =
document.createElement(
"blockquote"
);

element.textContent =
text ||
"";

return element;

}

function createPhoto(
src,
alt
){

const image =
document.createElement(
"img"
);

image.className =
"article-photo";

image.src =
src;

image.alt =
alt ||
"";

return image;

}

function createCaption(
text
){

const caption =
document.createElement(
"span"
);

caption.className =
"article-caption";

caption.textContent =
text ||
"";

return caption;

}

/* =========================================================
RENDER BODY
========================================================= */

function renderBody(
body
){

const target =
$("articleBody");

if(
!target
){

return;

}

target.innerHTML =
"";

if(
!body
){

return;

}

if(
Array.isArray(
body
)
){

body.forEach(
block =>{

if(
!block
){

return;

}

if(
typeof block ===
"string"
){

target.appendChild(
createParagraph(
block
)
);

return;

}

if(
block.type ===
"heading"
){

target.appendChild(
createHeading(
block.text
)
);

return;

}

if(
block.type ===
"quote"
){

target.appendChild(
createQuote(
block.text
)
);

return;

}

if(
block.type ===
"image" &&
block.src
){

target.appendChild(
createPhoto(
block.src,
block.alt ||
""
)
);

if(
block.caption
){

target.appendChild(
createCaption(
block.caption
)
);

}

return;

}

if(
block.text
){

target.appendChild(
createParagraph(
block.text
)
);

}

}
);

return;

}

if(
typeof body ===
"object"
){

const sequence = [
["p1","p"],
["p2","p"],
["h2a","h2"],
["p3","p"],
["p4","p"],
["quote","quote"],
["h2b","h2"],
["p5","p"],
["p6","p"],
["h2c","h2"],
["p7","p"],
["p8","p"],
["h2d","h2"],
["p9","p"],
["p10","p"],
["p11","p"]
];

sequence.forEach(
item =>{

const key =
item[0];

const type =
item[1];

if(
!body[key]
){

return;

}

if(
type ===
"h2"
){

target.appendChild(
createHeading(
body[key]
)
);

return;

}

if(
type ===
"quote"
){

target.appendChild(
createQuote(
body[key]
)
);

return;

}

target.appendChild(
createParagraph(
body[key]
)
);

}
);

}

}

/* =========================================================
ARTICLE IMAGE INSIDE CONTENT
========================================================= */

function addEditorialImage(){

const target =
$("articleBody");

if(
!target
){

return;

}

const paragraphs =
target.querySelectorAll(
"p"
);

if(
paragraphs.length <
2
){

return;

}

const image =
createPhoto(
STORY_IMAGES[
currentStoryKey
] ||
STORY_IMAGES.default,
$("articleTitle")
?.textContent ||
"PETS & DOGUE"
);

const anchor =
paragraphs[
Math.min(
1,
paragraphs.length -
1
)
];

anchor.insertAdjacentElement(
"afterend",
image
);

}

/* =========================================================
RENDER ARTICLE
========================================================= */

function renderArticle(){

stopSpeech();

const language =
getCurrentLanguage();

document.documentElement.lang =
language;

document.documentElement.dir =
language ===
"ar"
? "rtl"
: "ltr";

const story =
getCurrentStory();

if(
!story
){

return;

}

setText(
"articleCategory",
story.category ||
""
);

setText(
"articleTitle",
story.title ||
""
);

setText(
"articleIntro",
story.intro ||
""
);

setText(
"articleAuthor",
story.author ||
""
);

setText(
"articleDate",
story.date ||
""
);

setText(
"readingTime",
story.readingTime ||
""
);

const hero =
$("articleHeroImage");

if(
hero
){

hero.src =
story.image ||
STORY_IMAGES[
currentStoryKey
] ||
STORY_IMAGES.default;

hero.alt =
story.title ||
"PETS & DOGUE article";

}

renderBody(
story.body
);

addEditorialImage();

setText(
"listenButtonText",
articleText(
"ui.listen",
"Listen"
)
);

setText(
"shareButton",
articleText(
"ui.share",
"Share"
)
);

setText(
"backButton",
"← " +
articleText(
"ui.backToArticles",
"Articles"
)
);

document.title =
(
story.title ||
"Article"
) +
" | PETS & DOGUE";

setMeta(
story.metaDescription ||
story.intro ||
"Read and listen to PETS & DOGUE editorial stories."
);

prepareSpeechBlocks();

}

/* =========================================================
NAVIGATION
========================================================= */

function goToArticles(){

stopSpeech();

window.location.href =
"articles.html";

}

/* =========================================================
SHARE
========================================================= */

function shareArticle(){

const title =
$("articleTitle")
?.textContent
.trim() ||
"PETS & DOGUE";

const text =
$("articleIntro")
?.textContent
.trim() ||
"";

if(
navigator.share
){

navigator
.share({
title,
text,
url:window.location.href
})
.catch(
()=>{}
);

return;

}

copyLink();

}

function copyLink(){

if(
navigator.clipboard &&
typeof navigator.clipboard.writeText ===
"function"
){

navigator.clipboard
.writeText(
window.location.href
)
.then(
()=>{

alert(
articleText(
"messages.linkCopied",
"Article link copied."
)
);

}
)
.catch(
fallbackCopy
);

return;

}

fallbackCopy();

}

function fallbackCopy(){

alert(
articleText(
"messages.copyFallback",
"Copy this link:"
) +
" " +
window.location.href
);

}

/* =========================================================
SPEECH
========================================================= */

function getSpeechLanguage(){

const languages = {
en:"en-GB",
uk:"uk-UA",
ru:"ru-RU",
fr:"fr-FR",
de:"de-DE",
es:"es-ES",
it:"it-IT",
pt:"pt-PT",
nl:"nl-NL",
pl:"pl-PL",
cs:"cs-CZ",
sk:"sk-SK",
hu:"hu-HU",
ro:"ro-RO",
bg:"bg-BG",
el:"el-GR",
sv:"sv-SE",
da:"da-DK",
no:"nb-NO",
fi:"fi-FI",
tr:"tr-TR",
ar:"ar-SA",
hi:"hi-IN"
};

return (
languages[
getCurrentLanguage()
] ||
"en-GB"
);

}

function prepareSpeechBlocks(){

document
.querySelectorAll(
".speech-block"
)
.forEach(
element =>{

element.classList.remove(
"speech-block",
"speaking-now"
);

}
);

const blocks =
[];

[
$("articleTitle"),
$("articleIntro")
]
.forEach(
element =>{

if(
element &&
element.textContent.trim()
){

element.classList.add(
"speech-block"
);

blocks.push(
element
);

}

}
);

document
.querySelectorAll(
"#articleBody p,#articleBody h2,#articleBody blockquote"
)
.forEach(
element =>{

if(
element.textContent.trim()
){

element.classList.add(
"speech-block"
);

blocks.push(
element
);

}

}
);

speechQueue =
blocks;

}

function clearSpeechHighlight(){

document
.querySelectorAll(
".speaking-now"
)
.forEach(
element =>
element.classList.remove(
"speaking-now"
)
);

currentSpeechElement =
null;

}

function updateSpeechButton(){

const button =
$("listenButton");

if(
button
){

button.classList.toggle(
"active",
speechActive
);

}

setText(
"listenIcon",
speechActive
? "■"
: "🔊"
);

setText(
"listenButtonText",
speechActive
? articleText(
"ui.stop",
"Stop"
)
: articleText(
"ui.listen",
"Listen"
)
);

}

function setAudioStatus(
value
){

setText(
"audioStatus",
value ||
""
);

}

function getVoice(){

if(
!("speechSynthesis" in window)
){

return null;

}

const voices =
window.speechSynthesis.getVoices();

const wanted =
getSpeechLanguage()
.toLowerCase();

const short =
wanted.split(
"-"
)[0];

return (
voices.find(
voice =>
String(
voice.lang ||
""
)
.toLowerCase() ===
wanted
) ||
voices.find(
voice =>
String(
voice.lang ||
""
)
.toLowerCase()
.startsWith(
short
)
) ||
null
);

}

function speakNext(){

if(
!speechActive
){

return;

}

if(
speechIndex >=
speechQueue.length
){

stopSpeech();

return;

}

const element =
speechQueue[
speechIndex
];

const text =
element
.textContent
.trim();

if(
!text
){

speechIndex++;

speakNext();

return;

}

clearSpeechHighlight();

currentSpeechElement =
element;

element.classList.add(
"speaking-now"
);

element.scrollIntoView({
behavior:"smooth",
block:"center"
});

setAudioStatus(
(
speechIndex +
1
) +
" / " +
speechQueue.length
);

const utterance =
new SpeechSynthesisUtterance(
text
);

utterance.lang =
getSpeechLanguage();

utterance.rate =
.94;

utterance.pitch =
1;

utterance.volume =
1;

const voice =
getVoice();

if(
voice
){

utterance.voice =
voice;

}

utterance.onend =
function(){

if(
!speechActive
){

return;

}

speechIndex++;

setTimeout(
speakNext,
90
);

};

utterance.onerror =
function(){

if(
!speechActive
){

return;

}

speechIndex++;

setTimeout(
speakNext,
90
);

};

window.speechSynthesis.speak(
utterance
);

}

function startSpeech(){

if(
!("speechSynthesis" in window)
){

alert(
articleText(
"messages.narrationUnsupported",
"Audio reading is not supported in this browser."
)
);

return;

}

stopSpeech();

prepareSpeechBlocks();

if(
!speechQueue.length
){

return;

}

speechActive =
true;

speechIndex =
0;

updateSpeechButton();

window.speechSynthesis.cancel();

setTimeout(
speakNext,
120
);

}

function stopSpeech(){

if(
"speechSynthesis" in window
){

window.speechSynthesis.cancel();

}

speechActive =
false;

speechIndex =
0;

clearSpeechHighlight();

setAudioStatus(
""
);

updateSpeechButton();

}

function toggleSpeech(){

if(
speechActive
){

stopSpeech();

return;

}

startSpeech();

}

/* =========================================================
LANGUAGE REFRESH
========================================================= */

function scheduleRefresh(){

clearTimeout(
refreshTimer
);

refreshTimer =
setTimeout(
renderArticle,
80
);

}

/* =========================================================
EVENTS
========================================================= */

window.addEventListener(
"storage",
event =>{

if(
event.key ===
LANGUAGE_KEY
){

scheduleRefresh();

}

}
);

window.addEventListener(
"petsdogue:languagechange",
scheduleRefresh
);

window.addEventListener(
"languagechange",
scheduleRefresh
);

window.addEventListener(
"beforeunload",
stopSpeech
);

window.addEventListener(
"pagehide",
stopSpeech
);

document.addEventListener(
"keydown",
event =>{

if(
event.key ===
"Escape"
){

goToArticles();

}

}
);

/* =========================================================
INIT
========================================================= */

document.addEventListener(
"DOMContentLoaded",
()=>{

currentStoryKey =
getStoryKey();

renderArticle();

const observer =
new MutationObserver(
mutations =>{

const changed =
mutations.some(
mutation =>
mutation.type ===
"attributes" &&
(
mutation.attributeName ===
"lang" ||
mutation.attributeName ===
"dir"
)
);

if(
changed
){

scheduleRefresh();

}

}
);

observer.observe(
document.documentElement,
{
attributes:true,
attributeFilter:[
"lang",
"dir"
]
}
);

}
);

</script>

</body>
</html>
