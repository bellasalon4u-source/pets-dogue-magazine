:root{
--black:#070707;
--white:#fff;
--cream:#f6f2e9;

--pink:#ff65b3;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--cream);
color:#111;
font-family:Arial,Helvetica,sans-serif;

}

body.menu-open{

}

a{
text-decoration:none;

}

button,
input,

font:inherit;
}

button{
cursor:pointer;
}

/* TOP BAR */

.account-bar{
height:52px;
background:var(--black);
color:white;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
border-bottom:1px solid #333;
}

.account-side{
display:flex;
align-items:center;
padding:0 18px;
}

.account-side.right{
justify-content:flex-end;
}

.account-link{
background:white;
color:#111;
padding:10px 22px;
font-size:14px;
font-weight:bold;
letter-spacing:.6px;
}

.account-link.club{
background:var(--green);
box-shadow:0 0 18px rgba(101,229,31,.35);
}

.account-center{
font-family:Georgia,serif;
font-size:13px;
letter-spacing:2px;
color:#ccc;
}

/* HEADER */

.site-header{
background:var(--black);
color:white;
position:sticky;
top:0;
z-index:1700;
border-bottom:1px solid #333;
}

.header-main{
height:108px;
max-width:1550px;
margin:auto;
padding:0 18px;
display:grid;
grid-template-columns:80px 1fr 80px;
align-items:center;
}

.icon-button{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
border:none;
background:transparent;
color:white;
font-size:30px;
border-radius:50%;
}

.menu-lines{
width:30px;
display:grid;
gap:6px;
}

.menu-lines span{
display:block;
height:2px;
background:white;
border-radius:999px;
}

.brand{
text-align:center;
line-height:.88;
}

.brand-small{
font-family:Georgia,serif;
font-size:14px;
color:var(--gold-light);
}

.brand-big{
font-family:Georgia,serif;
font-size:58px;
font-weight:normal;
letter-spacing:4px;
}

.category-nav{
display:flex;
gap:30px;
overflow-x:auto;
padding:16px 24px;
border-top:1px solid #292929;
scrollbar-width:none;
}

.category-nav::-webkit-scrollbar{
display:none;
}

.category-nav a{
white-space:nowrap;
font-size:14px;
font-weight:bold;
letter-spacing:.7px;
}

/* SIDE MENU */

.menu-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
z-index:2500;
}

.menu-overlay.show{
display:block;
}

.side-menu{
position:fixed;
top:0;
left:-100%;
width:min(430px,94%);
height:100vh;
background:white;
z-index:2600;
overflow-y:auto;
transition:.35s;
border-right:2px solid #111;
}

.side-menu.open{
left:0;
}

.side-menu-header{
background:#111;
color:white;
padding:24px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:3;
}

.side-menu-header h2{
font-family:Georgia,serif;
font-size:32px;
font-weight:normal;
}

.side-menu-header button{
width:43px;
height:43px;
border:none;
background:white;
border-radius:50%;
font-size:24px;
}

.menu-list{
padding:18px;
display:grid;
gap:12px;
}

.menu-item{
display:grid;
grid-template-columns:82px 1fr;
align-items:center;
gap:14px;
border:2px solid #111;
background:#faf8f3;
border-radius:21px;
overflow:hidden;
}

.menu-item img{
width:82px;
height:82px;
object-fit:cover;
}

.menu-item h3{
font-family:Georgia,serif;
font-size:21px;
margin-bottom:4px;
}

.menu-item p{
font-size:12px;
line-height:1.45;
color:#666;
padding-right:9px;
}
