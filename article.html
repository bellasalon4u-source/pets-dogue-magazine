<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

id="pageDescription"
name="description"
content="Read and listen to PETS & DOGUE editorial stories."
>

<title>Article | PETS & DOGUE</title>

<style>
:root{
--black:#070707;
--white:#fff;
--cream:#f6f2e9;
--gold:#c89b3c;
--gold-light:#efd38c;
--green:#65e51f;
--border:#d8d3c8;
--grey:#747474;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--cream);
color:#111;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

button{
font:inherit;
cursor:pointer;
}

img{
display:block;
width:100%;
max-width:100%;
}

/* =========================================================
HEADER
========================================================= */

.site-header{
height:88px;
background:var(--black);
color:#fff;
position:sticky;
top:0;
z-index:2000;
border-bottom:1px solid #292929;
}

.header-inner{
height:100%;
max-width:1200px;
margin:auto;
padding:0 14px;
display:grid;
grid-template-columns:52px minmax(0,1fr) 52px;
align-items:center;
}

.close-button,
.home-button{
width:46px;
height:46px;
border:1px solid #4d4d4d;
border-radius:50%;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.close-button{
font-size:27px;
line-height:1;
}

.home-button svg{
width:27px;
height:27px;
stroke:currentColor;
stroke-width:2;
fill:none;
}

.brand{
text-align:center;
line-height:.88;
}

.brand-small{
font:11px Georgia,serif;
letter-spacing:1px;
color:var(--gold-light);
}

.brand-big{
font:normal 38px Georgia,serif;
letter-spacing:2px;
}

/* =========================================================
HERO
========================================================= */

.article-hero{
background:#111;
color:#fff;
}

.hero-image{
height:610px;
position:relative;
overflow:hidden;
max-width:1500px;
margin:auto;
background:#222;
}

.hero-image img{
position:absolute;
inset:0;
height:100%;
object-fit:cover;
}

.hero-image:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.96) 0%,
rgba(0,0,0,.69) 38%,
rgba(0,0,0,.1) 78%
);
}

.hero-copy{
position:absolute;
left:50%;
bottom:38px;
transform:translateX(-50%);
width:min(1050px,91%);
z-index:2;
}

.article-category{
display:inline-block;
font-size:10px;
font-weight:bold;
letter-spacing:2px;
color:var(--gold-light);
text-transform:uppercase;
margin-bottom:12px;
}

.hero-copy h1{
font:normal 61px/1.01 Georgia,serif;
max-width:960px;
overflow-wrap:anywhere;
}

.article-intro{
max-width:820px;
font:20px/1.45 Georgia,serif;
margin-top:15px;
color:#eee;
}

.article-meta{
display:flex;
gap:8px 20px;
flex-wrap:wrap;
margin-top:19px;
font-size:12px;
color:#ddd;
}

/* =========================================================
AUDIO
========================================================= */

.audio-shell{
background:#fff;
border-bottom:1px solid var(--border);
position:sticky;
top:88px;
z-index:1500;
}

.audio-inner{
max-width:920px;
margin:auto;
padding:10px 16px;
display:flex;
align-items:center;
gap:12px;
}

.listen-button{
min-height:48px;
padding:0 20px;
border:1.5px solid #111;
border-radius:999px;
background:#111;
color:#fff;
font-size:13px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.listen-button.active{
background:var(--green);
border-color:var(--green);
color:#111;
}

.audio-status{
font-size:12px;
color:#777;
}

/* =========================================================
ARTICLE
========================================================= */

.article-shell{
max-width:920px;
margin:auto;
padding:28px 16px 80px;
}

.article-content{
background:#fff;
border:2px solid #111;
padding:48px;
}

.article-body p{
font:20px/1.82 Georgia,serif;
color:#292929;
margin-bottom:27px;
}

.article-body h2{
font:normal 42px/1.08 Georgia,serif;
margin:50px 0 20px;
}

.article-body blockquote{
border-left:6px solid var(--gold);
background:#f8f3e7;
padding:23px 26px;
margin:38px 0;
font:27px/1.45 Georgia,serif;
}

.article-photo{
width:100%;
max-height:600px;
object-fit:cover;
margin:30px 0;
}

.image-caption{
display:block;
font-size:12px;
line-height:1.45;
color:#777;
text-align:center;
margin:-17px 0 32px;
}

.speech-block{
scroll-margin-top:170px;
border-radius:5px;
}

.speech-block.speaking-now{
background:#fff3bb;
box-shadow:0 0 0 8px #fff3bb;
}

.article-tags{
display:flex;
gap:8px;
flex-wrap:wrap;
border-top:2px solid #111;
padding-top:22px;
margin-top:44px;
}

.article-tag{
background:#111;
color:#fff;
font-size:10px;
font-weight:bold;
letter-spacing:.7px;
padding:8px 12px;
}

/* =========================================================
BOTTOM
========================================================= */

.article-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:27px;
}

.action-button{
min-height:50px;
border:2px solid #111;
border-radius:999px;
background:#fff;
color:#111;
font-weight:bold;
font-size:13px;
display:flex;
align-items:center;
justify-content:center;
}

.action-button.gold{
background:var(--gold);
border-color:var(--gold);
}

.back-to-articles{
max-width:920px;
margin:0 auto 70px;
padding:0 16px;
}

.back-to-articles a{
width:100%;
min-height:58px;
border:2px solid #111;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
border-radius:999px;
font-size:14px;
font-weight:bold;
}

/* =========================================================
RTL
========================================================= */

html[dir="rtl"] .hero-copy{
text-align:right;
}

html[dir="rtl"] .article-body blockquote{
border-left:0;
border-right:6px solid var(--gold);
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:760px){

.site-header{
height:82px;
}

.header-inner{
grid-template-columns:48px minmax(0,1fr) 48px;
padding:0 8px;
}

.close-button,
.home-button{
width:43px;
height:43px;
}

.brand-big{
font-size:34px;
}

.brand-small{
font-size:10px;
}

.hero-image{
height:560px;
}

.hero-copy{
bottom:27px;
}

.hero-copy h1{
font-size:39px;
}

.article-intro{
font-size:17px;
}

.article-meta{
font-size:11px;
gap:7px 13px;
}

.audio-shell{
top:82px;
}

.audio-inner{
padding:9px 12px;
}

.listen-button{
min-height:45px;
padding:0 17px;
}

.article-shell{
padding:20px 9px 45px;
}

.article-content{
padding:27px 19px;
}

.article-body p{
font-size:18px;
line-height:1.76;
margin-bottom:24px;
}

.article-body h2{
font-size:34px;
margin:41px 0 18px;
}

.article-body blockquote{
font-size:22px;
padding:18px;
margin:31px 0;
}

.speech-block{
scroll-margin-top:155px;
}

.back-to-articles{
padding:0 9px;
margin-bottom:50px;
}

}

@media(max-width:430px){

.hero-image{
height:530px;
}

.hero-copy h1{
font-size:35px;
}

.article-content{
padding:24px 17px;
}

.article-actions{
grid-template-columns:1fr;
}

.audio-status{
max-width:120px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

}

@media(prefers-reduced-motion:reduce){

html{
scroll-behavior:auto;
}

}
</style>
</head>

<script>
"use strict";

const LANGUAGE_KEY =
"pets_dogue_language";

const $ =
id =>
document.getElementById(id);

const DEFAULT_HERO =
"https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1800&q=85";

const DEFAULT_BODY_IMAGE =
"https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=1400&q=85";

const STORY_IMAGES = {
default:
"https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1800&q=85",

photoshoot:
"https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=1800&q=85",

travel:
"https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1800&q=85",

fashion:
"https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=1800&q=85",

wellness:
"https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=1800&q=85",

rescue:
"https://images.unsplash.com/photo-1601758064224-c3c14e3a8cb8?auto=format&fit=crop&w=1800&q=85",

places:
"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=85",

volunteers:
"https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1800&q=85"
};

const STORY_BODY_IMAGES = {
default:
DEFAULT_BODY_IMAGE,

photoshoot:
"https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=1400&q=85",

travel:
"https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1400&q=85",

fashion:
"https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=1400&q=85",

wellness:
"https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?auto=format&fit=crop&w=1400&q=85",

rescue:
"https://images.unsplash.com/photo-1601758064224-c3c14e3a8cb8?auto=format&fit=crop&w=1400&q=85",

places:
"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=85",

volunteers:
"https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1400&q=85"
};

let currentStoryKey =
"default";

let currentStoredArticle =
null;

let speechActive =
false;

let speechQueue =
[];

let speechIndex =
0;

let currentUtterance =
null;

let currentSpeechElement =
null;

let autoListenRequested =
false;

let autoListenStarted =
false;

/* =========================================================
LANGUAGE
========================================================= */

function normaliseLanguageCode(
value
){

if(
!value
){

return "en";

}

let code =
String(
value
)
.trim()
.toLowerCase();

if(
code.includes("-")
){

code =
code.split("-")[0];

}

if(
code.includes("_")
){

code =
code.split("_")[0];

}

const aliases = {
ua:"uk",
cz:"cs",
gr:"el",
se:"sv",
dk:"da"
};

return aliases[code] ||
code ||
"en";

}

function getCurrentLanguage(){

if(
window.PetsDogueLanguage &&
typeof window.PetsDogueLanguage.getCurrentLanguage ===
"function"
){

try{

const value =
window.PetsDogueLanguage.getCurrentLanguage();

if(
typeof value ===
"string"
){

return normaliseLanguageCode(
value
);

}

if(
value &&
typeof value ===
"object"
){

return normaliseLanguageCode(
value.code ||
value.language ||
value.lang ||
"en"
);

}

}catch(
error
){

console.warn(
"Could not read language.",
error
);

}

}

return normaliseLanguageCode(
localStorage.getItem(
LANGUAGE_KEY
) ||
document.documentElement.lang ||
"en"
);

}

function articleRoot(){

return (
window.PetsDogueTranslations &&
window.PetsDogueTranslations.article
) ||
null;

}

function articleBundle(){

const root =
articleRoot();

if(
!root
){

return null;

}

const language =
getCurrentLanguage();

return (
root[language] ||
root.en ||
null
);

}

function articleT(
path,
fallback
){

let value =
articleBundle();

if(
!value
){

return fallback;

}

path
.split(".")
.forEach(
key =>{

value =
value &&
Object.prototype.hasOwnProperty.call(
value,
key
)
? value[key]
: undefined;

}
);

return typeof value ===
"string"
? value
: fallback;

}

/* =========================================================
ARTICLE
========================================================= */

function getStoryTranslation(){

const bundle =
articleBundle();

if(
!bundle
){

return null;

}

if(
currentStoryKey ===
"default"
){

return bundle.default ||
null;

}

return (
bundle.stories &&
bundle.stories[
currentStoryKey
]
) ||
null;

}

function setText(
id,
value
){

const element =
$(id);

if(
element &&
typeof value ===
"string" &&
value.trim()
){

element.textContent =
value;

}

}

function setMetaDescription(
value
){

if(
$("pageDescription") &&
typeof value ===
"string" &&
value.trim()
){

$("pageDescription")
.setAttribute(
"content",
value
);

}

}

/* =========================================================
CONTENT ELEMENTS
========================================================= */

function createParagraph(
text
){

const element =
document.createElement("p");

element.textContent =
text ||
"";

return element;

}

function createHeading(
text
){

const element =
document.createElement("h2");

element.textContent =
text ||
"";

return element;

}

function createQuote(
text
){

const element =
document.createElement("blockquote");

element.textContent =
text ||
"";

return element;

}

function createImage(
src,
alt
){

const element =
document.createElement("img");

element.className =
"article-photo";

element.src =
src;

element.alt =
alt ||
"";

element.loading =
"lazy";

return element;

}

function createCaption(
text
){

const element =
document.createElement("span");

element.className =
"image-caption";

element.textContent =
text ||
"";

return element;

}

/* =========================================================
DEFAULT BODY
========================================================= */

function renderDefaultBody(
body
){

const target =
$("articleBody");

if(
!target ||
!body
){

return;

}

target.innerHTML =
"";

[
["p",body.p1],
["p",body.p2],
["h2",body.h2a],
["p",body.p3],
["p",body.p4]
]
.forEach(
item =>{

if(
!item[1]
){

return;

}

target.appendChild(
item[0] ===
"h2"
? createHeading(item[1])
: createParagraph(item[1])
);

}
);

target.appendChild(
createImage(
STORY_BODY_IMAGES.default,
"Pet lifestyle"
)
);

if(
body.caption
){

target.appendChild(
createCaption(
body.caption
)
);

}

if(
body.quote
){

target.appendChild(
createQuote(
body.quote
)
);

}

[
["h2",body.h2b],
["p",body.p5],
["p",body.p6],
["h2",body.h2c],
["p",body.p7],
["p",body.p8],
["h2",body.h2d],
["p",body.p9],
["p",body.p10],
["p",body.p11]
]
.forEach(
item =>{

if(
!item[1]
){

return;

}

target.appendChild(
item[0] ===
"h2"
? createHeading(item[1])
: createParagraph(item[1])
);

}
);

}

/* =========================================================
RICH BODY
========================================================= */

function renderRichBody(
body
){

const target =
$("articleBody");

if(
!target
){

return;

}

target.innerHTML =
"";

if(
!body
){

return;

}

if(
Array.isArray(body)
){

body.forEach(
block =>{

if(
!block
){

return;

}

if(
typeof block ===
"string"
){

target.appendChild(
createParagraph(
block
)
);

return;

}

if(
block.type ===
"heading"
){

target.appendChild(
createHeading(
block.text
)
);

return;

}

if(
block.type ===
"quote"
){

target.appendChild(
createQuote(
block.text
)
);

return;

}

if(
block.type ===
"image" &&
block.src
){

target.appendChild(
createImage(
block.src,
block.alt
)
);

if(
block.caption
){

target.appendChild(
createCaption(
block.caption
)
);

}

return;

}

target.appendChild(
createParagraph(
block.text
)
);

}
);

return;

}

if(
typeof body ===
"string"
){

body
.split(/\n\s*\n/)
.forEach(
text =>{

if(
text.trim()
){

target.appendChild(
createParagraph(
text.trim()
)
);

}

}
);

}

}

/* =========================================================
TAGS
========================================================= */

function renderTags(
tags
){

const target =
$("articleTags");

if(
!target
){

return;

}

target.innerHTML =
"";

if(
!tags
){

return;

}

const values =
Array.isArray(tags)
? tags
: Object.values(tags);

values.forEach(
value =>{

if(
typeof value !==
"string" ||
!value.trim()
){

return;

}

const tag =
document.createElement("span");

tag.className =
"article-tag";

tag.textContent =
value;

target.appendChild(
tag
);

}
);

}

/* =========================================================
STORED ARTICLES
========================================================= */

function getStoredTranslation(
article
){

if(
!article
){

return null;

}

const language =
getCurrentLanguage();

return (
article.translations &&
article.translations[language]
) ||
(
article.i18n &&
article.i18n[language]
) ||
null;

}

function loadStoredArticle(){

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");

if(
!id
){

return false;

}

let articles =
[];

try{

articles =
JSON.parse(
localStorage.getItem(
"pd_articles"
) ||
"[]"
);

}catch(
error
){

console.error(
"Could not parse stored articles.",
error
);

return false;

}

if(
!Array.isArray(articles)
){

return false;

}

const article =
articles.find(
item =>
String(item.id) ===
String(id)
);

if(
!article
){

return false;

}

currentStoredArticle =
article;

return true;

}

/* =========================================================
RENDER STORED
========================================================= */

function renderStoredArticle(){

if(
!currentStoredArticle
){

return;

}

const translated =
getStoredTranslation(
currentStoredArticle
) ||
{};

const article =
currentStoredArticle;

const title =
translated.title ||
article.title ||
"Article";

const intro =
translated.description ||
translated.intro ||
article.description ||
article.intro ||
"";

const category =
translated.category ||
article.category ||
"ARTICLE";

const author =
translated.author ||
article.author ||
"";

const date =
translated.date ||
article.date ||
"";

const readingTime =
translated.readingTime ||
article.readingTime ||
"";

const image =
translated.image ||
article.image ||
DEFAULT_HERO;

const body =
translated.content ||
translated.body ||
article.content ||
article.body ||
"";

const tags =
translated.tags ||
article.tags ||
[];

setText(
"articleCategory",
category
);

setText(
"articleTitle",
title
);

setText(
"articleIntro",
intro
);

setText(
"articleAuthor",
author
);

setText(
"articleDate",
date
);

setText(
"readingTime",
readingTime
);

$("articleHeroImage").src =
image;

renderRichBody(
body
);

renderTags(
tags
);

document.title =
title +
" | PETS & DOGUE";

setMetaDescription(
translated.metaDescription ||
article.metaDescription ||
intro ||
"Read and listen to PETS & DOGUE editorial stories."
);

}

/* =========================================================
RENDER TRANSLATED STORY
========================================================= */

function renderTranslatedStory(){

const story =
getStoryTranslation();

if(
!story
){

const english =
articleRoot()?.en;

const fallback =
currentStoryKey ===
"default"
? english?.default
: english?.stories?.[
currentStoryKey
];

if(
fallback
){

renderStoryObject(
fallback
);

}

return;

}

renderStoryObject(
story
);

}

function renderStoryObject(
story
){

if(
!story
){

return;

}

setText(
"articleCategory",
story.category ||
"ARTICLE"
);

setText(
"articleTitle",
story.title ||
"Article"
);

setText(
"articleIntro",
story.intro ||
""
);

setText(
"articleAuthor",
story.author ||
""
);

setText(
"articleDate",
story.date ||
""
);

setText(
"readingTime",
story.readingTime ||
""
);

$("articleHeroImage").src =
story.image ||
STORY_IMAGES[
currentStoryKey
] ||
DEFAULT_HERO;

if(
currentStoryKey ===
"default" &&
story.body &&
!Array.isArray(story.body)
){

renderDefaultBody(
story.body
);

}else{

renderRichBody(
story.body
);

if(
$("articleBody") &&
$("articleBody").children.length
){

const hasImage =
$("articleBody")
.querySelector(
".article-photo"
);

if(
!hasImage
){

const image =
createImage(
STORY_BODY_IMAGES[
currentStoryKey
] ||
DEFAULT_BODY_IMAGE,
story.title ||
"Article image"
);

const children =
Array.from(
$("articleBody").children
);

const insertAfter =
Math.min(
2,
children.length
);

if(
insertAfter > 0
){

children[
insertAfter - 1
]
.after(
image
);

}else{

$("articleBody")
.appendChild(
image
);

}

}

}

}

if(
story.tags
){

renderTags(
story.tags
);

}else{

const defaultTags =
articleBundle()?.default?.tags;

renderTags(
defaultTags ||
[]
);

}

document.title =
(
story.metaTitle ||
story.title ||
"Article"
) +
" | PETS & DOGUE";

setMetaDescription(
story.metaDescription ||
story.intro ||
"Read and listen to PETS & DOGUE editorial stories."
);

}

/* =========================================================
CLOSE
========================================================= */

function closeArticle(){

stopSpeech();

window.location.href =
"articles.html";

}

/* =========================================================
SHARE
========================================================= */

function shareArticle(){

const title =
$("articleTitle")
?.textContent
.trim() ||
"PETS & DOGUE";

const text =
$("articleIntro")
?.textContent
.trim() ||
"";

if(
navigator.share
){

navigator.share({
title,
text,
url:window.location.href
})
.catch(
()=>{}
);

return;

}

if(
navigator.clipboard &&
navigator.clipboard.writeText
){

navigator.clipboard
.writeText(
window.location.href
)
.then(
()=>{

alert(
articleT(
"messages.linkCopied",
"Article link copied."
)
);

}
)
.catch(
()=>{

alert(
articleT(
"messages.copyFallback",
"Copy this link:"
) +
" " +
window.location.href
);

}
);

return;

}

alert(
articleT(
"messages.copyFallback",
"Copy this link:"
) +
" " +
window.location.href
);

}

/* =========================================================
SPEECH
========================================================= */

function getNarrationLanguage(){

const map = {
en:"en-GB",
uk:"uk-UA",
ru:"ru-RU",
fr:"fr-FR",
de:"de-DE",
es:"es-ES",
it:"it-IT",
pt:"pt-PT",
nl:"nl-NL",
pl:"pl-PL",
cs:"cs-CZ",
sk:"sk-SK",
hu:"hu-HU",
ro:"ro-RO",
bg:"bg-BG",
el:"el-GR",
sv:"sv-SE",
da:"da-DK",
no:"nb-NO",
fi:"fi-FI",
tr:"tr-TR",
ar:"ar-SA",
hi:"hi-IN"
};

return map[
getCurrentLanguage()
] ||
"en-GB";

}

function prepareSpeechBlocks(){

document
.querySelectorAll(
".speech-block,.speaking-now"
)
.forEach(
element =>{

element.classList.remove(
"speech-block",
"speaking-now"
);

}
);

speechQueue =
[];

[
$("articleTitle"),
$("articleIntro")
]
.forEach(
element =>{

if(
element &&
element.textContent.trim()
){

element.classList.add(
"speech-block"
);

speechQueue.push(
element
);

}

}
);

document
.querySelectorAll(
"#articleBody h2,#articleBody p,#articleBody blockquote"
)
.forEach(
element =>{

if(
element.textContent.trim()
){

element.classList.add(
"speech-block"
);

speechQueue.push(
element
);

}

}
);

}

function clearSpeechHighlight(){

if(
currentSpeechElement
){

currentSpeechElement
.classList
.remove(
"speaking-now"
);

}

currentSpeechElement =
null;

}

function setListenButton(
active
){

$("listenButton")
?.classList.toggle(
"active",
active
);

setText(
"listenButtonText",
active
? articleT(
"ui.stop",
"Stop"
)
: articleT(
"ui.listen",
"Listen"
)
);

setText(
"listenIcon",
active
? "■"
: "🔊"
);

}

function setAudioStatus(
value
){

if(
$("audioStatus")
){

$("audioStatus").textContent =
value ||
"";

}

}

function chooseVoice(){

if(
!("speechSynthesis" in window)
){

return null;

}

const voices =
window.speechSynthesis.getVoices();

const language =
getNarrationLanguage()
.toLowerCase();

const short =
language.split("-")[0];

return (
voices.find(
voice =>
String(
voice.lang ||
""
)
.toLowerCase() ===
language
) ||
voices.find(
voice =>
String(
voice.lang ||
""
)
.toLowerCase()
.startsWith(
short
)
) ||
voices[0] ||
null
);

}

function speakNext(){

if(
!speechActive
){

return;

}

if(
speechIndex >=
speechQueue.length
){

finishSpeech();

return;

}

const element =
speechQueue[
speechIndex
];

const text =
element.textContent.trim();

if(
!text
){

speechIndex++;

speakNext();

return;

}

clearSpeechHighlight();

currentSpeechElement =
element;

element.classList.add(
"speaking-now"
);

element.scrollIntoView({
behavior:"smooth",
block:"center"
});

setAudioStatus(
(
speechIndex +
1
) +
" / " +
speechQueue.length
);

const utterance =
new SpeechSynthesisUtterance(
text
);

currentUtterance =
utterance;

utterance.lang =
getNarrationLanguage();

utterance.rate =
.94;

utterance.pitch =
1;

const voice =
chooseVoice();

if(
voice
){

utterance.voice =
voice;

}

utterance.onend =
()=>{

if(
!speechActive
){

return;

}

speechIndex++;

setTimeout(
speakNext,
100
);

};

utterance.onerror =
()=>{

if(
!speechActive
){

return;

}

speechIndex++;

setTimeout(
speakNext,
100
);

};

window.speechSynthesis.speak(
utterance
);

}

function startSpeech(){

if(
!("speechSynthesis" in window)
){

alert(
articleT(
"messages.narrationUnsupported",
"Audio reading is not supported in this browser."
)
);

return;

}

stopSpeech();

prepareSpeechBlocks();

if(
!speechQueue.length
){

return;

}

speechIndex =
0;

speechActive =
true;

setListenButton(
true
);

window.speechSynthesis.cancel();

setTimeout(
speakNext,
120
);

}

function stopSpeech(){

if(
"speechSynthesis" in window
){

window.speechSynthesis.cancel();

}

speechActive =
false;

speechIndex =
0;

currentUtterance =
null;

clearSpeechHighlight();

setListenButton(
false
);

setAudioStatus(
""
);

}

function finishSpeech(){

speechActive =
false;

speechIndex =
0;

currentUtterance =
null;

clearSpeechHighlight();

setListenButton(
false
);

setAudioStatus(
""
);

}

function toggleSpeech(){

if(
speechActive
){

stopSpeech();

return;

}

startSpeech();

}

/* =========================================================
REFRESH
========================================================= */

function refreshArticle(){

const wasSpeaking =
speechActive;

stopSpeech();

applyUiLanguage();

if(
currentStoredArticle
){

renderStoredArticle();

}else{

renderTranslatedStory();

}

prepareSpeechBlocks();

if(
wasSpeaking
){

setTimeout(
startSpeech,
250
);

}

}

/* =========================================================
INITIALISE
========================================================= */

function initialiseArticle(){

const params =
new URLSearchParams(
window.location.search
);

currentStoryKey =
params.get(
"story"
) ||
"default";

autoListenRequested =
params.get(
"listen"
) ===
"1";

applyUiLanguage();

if(
loadStoredArticle()
){

renderStoredArticle();

}else{

renderTranslatedStory();

}

prepareSpeechBlocks();

setListenButton(
false
);

if(
autoListenRequested &&
!autoListenStarted
){

autoListenStarted =
true;

setTimeout(
startSpeech,
650
);

}

}

/* =========================================================
EVENTS
========================================================= */

document.addEventListener(
"keydown",
event =>{

if(
event.key ===
"Escape"
){

closeArticle();

}

}
);

window.addEventListener(
"storage",
event =>{

if(
event.key ===
LANGUAGE_KEY
){

refreshArticle();

}

}
);

window.addEventListener(
"petsdogue:languagechange",
refreshArticle
);

window.addEventListener(
"languagechange",
refreshArticle
);

window.addEventListener(
"beforeunload",
stopSpeech
);

window.addEventListener(
"pagehide",
stopSpeech
);

document.addEventListener(
"DOMContentLoaded",
initialiseArticle
);

if(
"speechSynthesis" in window
){

window.speechSynthesis.onvoiceschanged =
function(){};

}
</script>
